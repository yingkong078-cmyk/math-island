    </div>
    <div class="control-row">
      <button class="btn btn-sm btn-soft" id="isoShow">✦ 显示三线</button>
      <button class="btn btn-sm btn-ghost" id="isoReset">↺ 复位</button>
      <span class="small muted">也可以拖动顶点 A</span>
    </div>
    <div class="lab-note"><b>三线合一：</b>顶角平分线、底边中线、底边高其实是同一条线。等腰三角形是轴对称图形。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'isoAB', label: '腰 AB = AC' },
    { id: 'isoB', label: '底角 ∠B' },
    { id: 'isoC', label: '底角 ∠C' },
    { id: 'isoTop', label: '顶角 ∠A', accent: true }
  ]);

  let h = 220;
  let showLines = true;
  const B = { x: 165, y: 365 }, C = { x: 515, y: 365 };
  let A = { x: 340, y: B.y - h };

  function draw() {
    clearNode(svg);
    const defs = svgEl('defs', {}, svg);
    const pat = svgEl('pattern', { id: 'isoGrid', width: 28, height: 28, patternUnits: 'userSpaceOnUse' }, defs);
    svgEl('path', { d: 'M 28 0 L 0 0 0 28', fill: 'none', stroke: '#E8DFCE', 'stroke-width': 1 }, pat);
    svgEl('rect', { width: 680, height: 460, fill: 'url(#isoGrid)', opacity: 0.5 }, svg);

    const M = { x: (B.x + C.x) / 2, y: B.y };
    svgEl('polygon', { points: `${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`, fill: '#FBF3EE', stroke: '#8A5A44', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, svg);
    svgEl('line', { x1: A.x, y1: A.y, x2: M.x, y2: M.y, stroke: '#8A5A44', 'stroke-width': 1.4, 'stroke-dasharray': '6 5', opacity: 0.6 }, svg);

    if (showLines) {
      const demo = svgEl('g', {}, svg);
      svgEl('line', { x1: A.x, y1: A.y, x2: M.x, y2: M.y, stroke: '#178F80', 'stroke-width': 5, opacity: 0.28, 'stroke-linecap': 'round' }, demo);
      svgEl('line', { x1: A.x, y1: A.y, x2: M.x, y2: M.y, stroke: '#E39A1C', 'stroke-width': 2, opacity: 0.8 }, demo);
      svgEl('line', { x1: A.x, y1: A.y, x2: M.x, y2: M.y, stroke: '#8B63D9', 'stroke-width': 1.2 }, demo);
      svgText(svg, A.x + 10, A.y + 48, '角平分线', 'svg-small', { 'text-anchor': 'start', fill: '#8B63D9' });
      svgText(svg, A.x + 10, A.y + 66, '中线', 'svg-small', { 'text-anchor': 'start', fill: '#E39A1C' });
      svgText(svg, A.x + 10, A.y + 84, '高', 'svg-small', { 'text-anchor': 'start', fill: '#178F80' });
    }

    // 直角符号
    svgEl('path', { d: `M ${M.x - 12} ${M.y} L ${M.x - 12} ${M.y - 12} L ${M.x} ${M.y - 12}`, fill: 'none', stroke: '#8A5A44', 'stroke-width': 1.4 }, svg);

    svgEl('circle', { cx: A.x, cy: A.y, r: 12, class: 'draggable', fill: '#8A5A44', stroke: '#FFFDF8', 'stroke-width': 4 }, svg);
    svgText(svg, A.x, A.y + 4, 'A', 'svg-label', { fill: '#fff', 'font-size': 10, 'pointer-events': 'none' }, svg);
    svgEl('circle', { cx: B.x, cy: B.y, r: 6, fill: '#8A5A44', stroke: '#FFFDF8', 'stroke-width': 3 }, svg);
    svgEl('circle', { cx: C.x, cy: C.y, r: 6, fill: '#8A5A44', stroke: '#FFFDF8', 'stroke-width': 3 }, svg);
    svgText(svg, B.x - 4, B.y + 22, 'B', 'svg-label', { fill: '#8A5A44' });
    svgText(svg, C.x + 4, C.y + 22, 'C', 'svg-label', { fill: '#8A5A44' });
    svgText(svg, M.x, M.y + 22, 'D', 'svg-label', { fill: '#8A5A44' });

    // 等长标记
    const mAB = mid(A, B), mAC = mid(A, C);
    svgText(svg, mAB.x - 16, mAB.y, '|', 'svg-label', { fill: '#178F80', 'font-size': 15 });
    svgText(svg, mAC.x + 16, mAC.y, '|', 'svg-label', { fill: '#178F80', 'font-size': 15 });

    const ab = dist(A, B), ac = dist(A, C);
    const angB = Math.acos(((B.x - A.x) * (C.x - A.x) + (B.y - A.y) * (C.y - A.y)) / (ab * ac)) / D2R;
    const angB2 = Math.acos(((A.x - B.x) * (C.x - B.x) + (A.y - B.y) * (C.y - B.y)) / (dist(B, A) * dist(B, C))) / D2R;
    const angC2 = Math.acos(((A.x - C.x) * (B.x - C.x) + (A.y - C.y) * (B.y - C.y)) / (dist(C, A) * dist(C, B))) / D2R;
    setRO('isoAB', `${fmt(ab / 28, 1)} / ${fmt(ac / 28, 1)}`);
    setRO('isoB', `${fmt(angB2, 1)}°`);
    setRO('isoC', `${fmt(angC2, 1)}°`);
    setRO('isoTop', `${fmt(angB, 1)}°`);
  }

  function setHeight(newH) {
    h = clamp(newH, 120, 300);
    A = { x: 340, y: B.y - h };
    controls.querySelector('#isoH').value = h;
    controls.querySelector('#isoHOut').textContent = Math.round(h);
    draw();
  }

  controls.querySelector('#isoH').addEventListener('input', e => setHeight(Number(e.target.value)), { signal: ac.signal });
  controls.querySelector('#isoShow').addEventListener('click', e => {
    showLines = !showLines;
    e.currentTarget.textContent = showLines ? '✦ 隐藏三线' : '✦ 显示三线';
    draw();
  }, { signal: ac.signal });
  controls.querySelector('#isoReset').addEventListener('click', () => { showLines = true; setHeight(220); }, { signal: ac.signal });

  let dragging = false;
  svg.addEventListener('pointerdown', e => {
    if (e.target.closest('.draggable')) { dragging = true; svg.setPointerCapture?.(e.pointerId); }
  }, { signal: ac.signal });
  svg.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = toSvgPoint(svg, e);
    setHeight(B.y - p.y);
  }, { signal: ac.signal });
  svg.addEventListener('pointerup', () => { dragging = false; }, { signal: ac.signal });

  draw();
  return () => ac.abort();
}

/* ============================================================
   5. 勾股定理面积秀
   ============================================================ */
function mountPythagoras(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 520', role: 'img', 'aria-label': '勾股定理面积演示' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">直角边 a</span>
      <div class="range-wrap"><input type="range" id="pythA" min="2" max="5" value="3" step="0.5"><output id="pythAOut">3</output></div>
      <span class="control-label">直角边 b</span>
      <div class="range-wrap"><input type="range" id="pythB" min="2" max="5" value="4" step="0.5"><output id="pythBOut">4</output></div>
    </div>
    <div class="area-bars">
      <div class="area-bar"><span>a²</span><div class="track"><i id="pythBarA"></i></div><b id="pythBarAText">9</b></div>
      <div class="area-bar"><span>b²</span><div class="track"><i id="pythBarB" class="teal"></i></div><b id="pythBarBText">16</b></div>
      <div class="area-bar"><span>c²</span><div class="track"><i id="pythBarC" class="gold"></i></div><b id="pythBarCText">25</b></div>
    </div>
    <div class="lab-note"><b>面积法：</b>两个小正方形的面积之和，恰好等于斜边上的大正方形面积。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'pyA2', label: 'a²' },
    { id: 'pyB2', label: 'b²' },
    { id: 'pySum', label: 'a² + b²' },
    { id: 'pyC2', label: 'c²', accent: true }
  ]);

  let a = 3, b = 4;
  const s = 29, C = { x: 250, y: 345 };

  function draw() {
    clearNode(svg);
    const defs = svgEl('defs', {}, svg);
    const pat = svgEl('pattern', { id: 'pyGrid', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
    svgEl('path', { d: 'M 26 0 L 0 0 0 26', fill: 'none', stroke: '#E8DFCE', 'stroke-width': 1 }, pat);
    svgEl('rect', { width: 680, height: 520, fill: 'url(#pyGrid)', opacity: 0.55 }, svg);

    const B = { x: C.x + a * s, y: C.y };
    const A = { x: C.x, y: C.y - b * s };
    const c = Math.hypot(a, b);
    const off = { x: b * s, y: -a * s };

    const sqA = [C, B, { x: B.x, y: B.y + a * s }, { x: C.x, y: C.y + a * s }];
    const sqB = [C, A, { x: A.x - b * s, y: A.y }, { x: C.x - b * s, y: C.y }];
    const sqC = [A, B, { x: B.x + off.x, y: B.y + off.y }, { x: A.x + off.x, y: A.y + off.y }];

    svgEl('polygon', { points: sqC.map(p => `${p.x},${p.y}`).join(' '), fill: '#E8A31A', 'fill-opacity': 0.22, stroke: '#D28C08', 'stroke-width': 2 }, svg);
    svgEl('polygon', { points: sqA.map(p => `${p.x},${p.y}`).join(' '), fill: '#EF654F', 'fill-opacity': 0.2, stroke: '#E85D4A', 'stroke-width': 2 }, svg);
    svgEl('polygon', { points: sqB.map(p => `${p.x},${p.y}`).join(' '), fill: '#178F80', 'fill-opacity': 0.2, stroke: '#178F80', 'stroke-width': 2 }, svg);
    svgEl('polygon', { points: `${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`, fill: '#FFFDF8', stroke: '#22211D', 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, svg);

    svgEl('path', { d: `M ${C.x + 14} ${C.y} L ${C.x + 14} ${C.y - 14} L ${C.x} ${C.y - 14}`, fill: 'none', stroke: '#22211D', 'stroke-width': 1.5 }, svg);

    const hm = mid(A, B);
    svgText(svg, (C.x + B.x) / 2, C.y - 10, 'a', 'svg-label', { fill: '#B23B28', 'font-size': 13 });
    svgText(svg, C.x + 11, (C.y + A.y) / 2, 'b', 'svg-label', { fill: '#0D6A5D', 'font-size': 13 });
    svgText(svg, hm.x - 13, hm.y + 5, 'c', 'svg-label', { fill: '#8A5E07', 'font-size': 13 });

    const cA = { x: (sqA[0].x + sqA[2].x) / 2, y: (sqA[0].y + sqA[2].y) / 2 };
    const cB = { x: (sqB[0].x + sqB[2].x) / 2, y: (sqB[0].y + sqB[2].y) / 2 };
    const cC = { x: (sqC[0].x + sqC[2].x) / 2, y: (sqC[0].y + sqC[2].y) / 2 };
    svgText(svg, cA.x, cA.y + 5, `a² = ${fmt(a * a, 1)}`, 'svg-math', { fill: '#B23B28', 'font-size': 15 });
    svgText(svg, cB.x, cB.y + 5, `b² = ${fmt(b * b, 1)}`, 'svg-math', { fill: '#0D6A5D', 'font-size': 15 });
    svgText(svg, cC.x, cC.y + 5, `c² = ${fmt(c * c, 1)}`, 'svg-math', { fill: '#8A5E07', 'font-size': 15 });

    svgText(svg, 60, 40, 'a² + b² = c²', 'svg-math', { 'text-anchor': 'start', 'font-size': 20, fill: '#22211D' });
    svgText(svg, 60, 60, '拖动滑杆，面积关系始终成立', 'svg-small', { 'text-anchor': 'start', fill: '#8B8274' });

    setRO('pyA2', fmt(a * a, 1));
    setRO('pyB2', fmt(b * b, 1));
    setRO('pySum', fmt(a * a + b * b, 1));
    setRO('pyC2', fmt(c * c, 1));

    const total = a * a + b * b;
    controls.querySelector('#pythBarA').style.width = `${(a * a / total) * 100}%`;
    controls.querySelector('#pythBarB').style.width = `${(b * b / total) * 100}%`;
    controls.querySelector('#pythBarC').style.width = '100%';
    controls.querySelector('#pythBarAText').textContent = fmt(a * a, 1);
    controls.querySelector('#pythBarBText').textContent = fmt(b * b, 1);
    controls.querySelector('#pythBarCText').textContent = fmt(total, 1);
    controls.querySelector('#pythAOut').textContent = fmt(a, 1);
    controls.querySelector('#pythBOut').textContent = fmt(b, 1);
  }

  controls.querySelector('#pythA').addEventListener('input', e => { a = Number(e.target.value); draw(); }, { signal: ac.signal });
  controls.querySelector('#pythB').addEventListener('input', e => { b = Number(e.target.value); draw(); }, { signal: ac.signal });
  draw();
  return () => ac.abort();
}

/* ============================================================
   6. √2 与数轴
   ============================================================ */
function mountIrrational(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 340', role: 'img', 'aria-label': '单位正方形对角线旋转到数轴' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <button class="btn btn-sm btn-coral" id="irrGo">↻ 旋转对角线</button>
      <button class="btn btn-sm btn-ghost" id="irrReset">↺ 复位</button>
      <span class="small muted">把单位正方形的对角线“转”到数轴上</span>
    </div>
    <div class="lab-note"><b>关键：</b>旋转不改变长度，所以数轴上这段长度就是 √2。1² + 1² = 2，所以对角线 = √2。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'irrSide', label: '正方形边长', value: '1' },
    { id: 'irrDiag', label: '对角线²', value: '2' },
    { id: 'irrValue', label: '对角线 ≈', value: '1.414', accent: true },
    { id: 'irrWhere', label: '落在数轴', value: '1 与 2 之间' }
  ]);

  const ox = 90, oy = 275, u = 160;
  const top = { x: ox, y: oy - u };
  const right = { x: ox + u, y: oy };
  const end = { x: ox + u * Math.SQRT2, y: oy };
  let raf = 0;

  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'irrDots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
  svgEl('circle', { cx: 1, cy: 1, r: 1, fill: '#E6DACA' }, pat);
  svgEl('rect', { width: 680, height: 340, fill: 'url(#irrDots)', opacity: 0.55 }, svg);

  svgEl('line', { x1: 52, y1: oy, x2: 640, y2: oy, class: 'axis-line' }, svg);
  svgEl('path', { d: `M 640 ${oy} l -10 -4 l 0 8 Z`, fill: '#22211D' }, svg);
  for (let k = 0; k <= 3.5; k += 0.5) {
    const x = ox + k * u;
    if (x > 636) continue;
    const major = Math.abs(k - Math.round(k)) < 0.01;
    svgEl('line', { x1: x, y1: oy - (major ? 7 : 4), x2: x, y2: oy + (major ? 7 : 4), stroke: '#22211D', 'stroke-width': major ? 1.4 : 1 }, svg);
    if (major) svgText(svg, x, oy + 24, String(k), 'svg-small', { fill: '#6E6556' });
  }
  svgText(svg, 636, oy + 40, '数轴', 'svg-small', { fill: '#8B8274', 'text-anchor': 'end' });
  svgEl('line', { x1: ox, y1: oy, x2: ox, y2: oy - u, stroke: '#4C7DFF', 'stroke-width': 2 }, svg);
  svgEl('line', { x1: ox, y1: oy - u, x2: ox + u, y2: oy - u, stroke: '#4C7DFF', 'stroke-width': 2 }, svg);
  svgEl('line', { x1: ox + u, y1: oy - u, x2: ox + u, y2: oy, stroke: '#4C7DFF', 'stroke-width': 2 }, svg);
  svgEl('rect', { x: ox + 10, y: oy - 24, width: 14, height: 14, fill: 'none', stroke: '#4C7DFF', 'stroke-width': 1.2 }, svg);
  svgText(svg, ox + u / 2, oy + 24, '1', 'svg-label', { fill: '#4C7DFF' });
  svgText(svg, ox - 14, oy - u / 2, '1', 'svg-label', { fill: '#4C7DFF' });


  const arc = svgEl('path', { d: `M ${right.x} ${top.y} A ${u * Math.SQRT2} ${u * Math.SQRT2} 0 0 1 ${end.x} ${end.y}`, fill: 'none', stroke: '#E8A31A', 'stroke-width': 2, 'stroke-dasharray': '6 5' }, svg);
  const diag = svgEl('line', { x1: ox, y1: oy, x2: right.x, y2: top.y, stroke: '#EF654F', 'stroke-width': 3, 'stroke-linecap': 'round' }, svg);
  const dot = svgEl('circle', { cx: right.x, cy: top.y, r: 6, fill: '#EF654F', stroke: '#FFFDF8', 'stroke-width': 2 }, svg);
  const marker = svgEl('circle', { cx: end.x, cy: end.y, r: 7, fill: '#FFFDF8', stroke: '#E8A31A', 'stroke-width': 2.5, opacity: 0 }, svg);
  const sqrtLabel = svgText(svg, end.x, oy - 22, '√2', 'svg-math', { fill: '#8A5E07', opacity: 0 });
  const diagLabel = svgText(svg, 0, 0, '对角线 √2', 'svg-label', { fill: '#B23B28', opacity: 1 });
  svgText(svg, 500, 72, '1² + 1² = 2', 'svg-math', { 'font-size': 20, 'text-anchor': 'start', fill: '#22211D' });
  svgText(svg, 500, 92, '对角线 = √2', 'svg-small', { 'text-anchor': 'start', fill: '#8B8274' });

  function render(p) {
    const angle = (-45 + 45 * p) * D2R;
    const r = u * Math.SQRT2;
    const x = ox + r * Math.cos(angle);
    const y = oy + r * Math.sin(angle);
    diag.setAttribute('x2', x);
    diag.setAttribute('y2', y);
    dot.setAttribute('cx', x);
    dot.setAttribute('cy', y);
    const lx = ox + (x - ox) * 0.58;
    const ly = oy + (y - oy) * 0.58;
    diagLabel.setAttribute('x', lx + 28);
    diagLabel.setAttribute('y', ly - 10);
    marker.setAttribute('opacity', p > 0.98 ? 1 : 0);
    sqrtLabel.setAttribute('opacity', p > 0.98 ? 1 : 0);
    dot.setAttribute('fill', p > 0.98 ? '#E8A31A' : '#EF654F');
  }

  function run() {
    cancelAnimationFrame(raf);
    const t0 = performance.now();
    function step(now) {
      const t = clamp((now - t0) / 1000, 0, 1);
      render(t);
      if (t < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  controls.querySelector('#irrGo').addEventListener('click', run, { signal: ac.signal });
  controls.querySelector('#irrReset').addEventListener('click', () => {
    cancelAnimationFrame(raf);
    render(0);
    marker.setAttribute('opacity', 0);
    sqrtLabel.setAttribute('opacity', 0);
  }, { signal: ac.signal });
  render(0);
  return () => { ac.abort(); cancelAnimationFrame(raf); };
}

/* ============================================================
   7. 平面直角坐标系
   ============================================================ */
function mountCoordinate(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 560 560', role: 'img', 'aria-label': '可点击的平面直角坐标系' });
  svg.style.touchAction = 'none';
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">对称变换</span>
      <button class="btn btn-sm btn-soft" data-r="x">关于 x 轴</button>
      <button class="btn btn-sm btn-soft" data-r="y">关于 y 轴</button>
      <button class="btn btn-sm btn-soft" data-r="o">关于原点</button>
      <button class="btn btn-sm btn-ghost" data-r="reset">↺ 复位</button>
    </div>
    <div class="lab-note"><b>操作：</b>点击网格或拖动圆点，观察坐标、象限和到坐标轴的距离怎样变化。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'coPoint', label: '点 P 坐标', value: '(2, 3)', accent: true },
    { id: 'coQuad', label: '所在位置', value: '第一象限' },
    { id: 'coDX', label: '到 x 轴距离', value: '3' },
    { id: 'coDY', label: '到 y 轴距离', value: '2' }
  ]);

  const O = 280, step = 44;
  const X = x => O + x * step;
  const Y = y => O - y * step;
  let state = { x: 2, y: 3 };
  let cur = { ...state };
  let raf = 0;

  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'coGrid', width: step, height: step, patternUnits: 'userSpaceOnUse', x: O, y: O }, defs);
  svgEl('path', { d: `M ${step} 0 L 0 0 0 ${step}`, fill: 'none', stroke: '#E3D8C7', 'stroke-width': 1 }, pat);
  svgEl('rect', { x: 0, y: 0, width: 560, height: 560, fill: 'url(#coGrid)' }, svg);

  for (let i = -5; i <= 5; i++) {
    if (i === 0) continue;
    svgEl('line', { x1: X(i), y1: 18, x2: X(i), y2: 542, stroke: '#E8DFCE', 'stroke-width': 1 }, svg);
    svgEl('line', { x1: 18, y1: Y(i), x2: 542, y2: Y(i), stroke: '#E8DFCE', 'stroke-width': 1 }, svg);
    svgText(svg, X(i), O + 17, String(i), 'svg-small', { fill: '#9A8F7F' });
    svgText(svg, O - 12, Y(i) + 3, String(i), 'svg-small', { fill: '#9A8F7F', 'text-anchor': 'end' });
  }
  svgEl('line', { x1: 22, y1: O, x2: 538, y2: O, class: 'axis-line' }, svg);
  svgEl('line', { x1: O, y1: 22, x2: O, y2: 538, class: 'axis-line' }, svg);
  svgEl('path', { d: `M 538 ${O} l -9 -4 l 0 8 Z`, fill: '#22211D' }, svg);
  svgEl('path', { d: `M ${O} 22 l -4 9 l 8 0 Z`, fill: '#22211D' }, svg);
  svgText(svg, 532, O - 10, 'x', 'svg-label', { 'text-anchor': 'end' });
  svgText(svg, O + 10, 34, 'y', 'svg-label', { 'text-anchor': 'start' });
  svgText(svg, O - 14, O + 18, 'O', 'svg-small', { 'text-anchor': 'end' });
  svgText(svg, 485, 70, 'Ⅰ', 'svg-math', { fill: '#DCCDB6', 'font-size': 26 });
  svgText(svg, 65, 70, 'Ⅱ', 'svg-math', { fill: '#DCCDB6', 'font-size': 26 });
  svgText(svg, 65, 500, 'Ⅲ', 'svg-math', { fill: '#DCCDB6', 'font-size': 26 });
  svgText(svg, 485, 500, 'Ⅳ', 'svg-math', { fill: '#DCCDB6', 'font-size': 26 });

  const dyn = svgEl('g', {}, svg);

  function quadrant(x, y) {
    if (x === 0 && y === 0) return '原点';
    if (x === 0) return 'y 轴上';
    if (y === 0) return 'x 轴上';
    if (x > 0 && y > 0) return '第一象限';
    if (x < 0 && y > 0) return '第二象限';
    if (x < 0 && y < 0) return '第三象限';
    return '第四象限';
  }

  function render() {
    clearNode(dyn);
    const px = X(cur.x), py = Y(cur.y);
    svgEl('line', { x1: px, y1: O, x2: px, y2: py, stroke: '#EF654F', 'stroke-width': 1.4, 'stroke-dasharray': '5 4' }, dyn);
    svgEl('line', { x1: O, y1: py, x2: px, y2: py, stroke: '#EF654F', 'stroke-width': 1.4, 'stroke-dasharray': '5 4' }, dyn);
    svgEl('circle', { cx: px, cy: py, r: 9, fill: '#EF654F', stroke: '#FFFDF8', 'stroke-width': 4 }, dyn);
    svgEl('circle', { cx: px, cy: py, r: 18, fill: 'none', stroke: '#EF654F', opacity: 0.22 }, dyn);
    const label = `(${fmt(cur.x, 1)}, ${fmt(cur.y, 1)})`;
    const lx = clamp(px + 18, 45, 500), ly = clamp(py - 18, 32, 535);
    const w = label.length * 8.5 + 18;
    svgEl('rect', { x: lx - 4, y: ly - 15, width: w, height: 24, rx: 7, fill: '#FFFDF8', stroke: '#E7DDCC' }, dyn);
    svgText(dyn, lx + 5, ly + 2, label, 'svg-label', { 'text-anchor': 'start', 'font-size': 11.5, fill: '#B23B28' });
    setRO('coPoint', label);
    setRO('coQuad', quadrant(cur.x, cur.y));
    setRO('coDX', String(Math.abs(cur.y)));
    setRO('coDY', String(Math.abs(cur.x)));
  }

  function snap(p) {
    return { x: clamp(Math.round((p.x - O) / step), -5, 5), y: clamp(Math.round((O - p.y) / step), -5, 5) };
  }
  function animateTo(target) {
    cancelAnimationFrame(raf);
    const from = { ...cur };
    const t0 = performance.now();
    function step(now) {
      const t = clamp((now - t0) / 420, 0, 1);
      const e = 1 - Math.pow(1 - t, 3);
      cur = { x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e };
      render();
      if (t < 1) raf = requestAnimationFrame(step);
      else cur = { ...target };
    }
    raf = requestAnimationFrame(step);
  }

  let drag = false;
  svg.addEventListener('pointerdown', e => {
    drag = true;
    const p = snap(toSvgPoint(svg, e));
    state = p;
    animateTo(p);
    svg.setPointerCapture?.(e.pointerId);
  }, { signal: ac.signal });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = snap(toSvgPoint(svg, e));
    if (p.x !== state.x || p.y !== state.y) { state = p; animateTo(p); }
  }, { signal: ac.signal });
  svg.addEventListener('pointerup', () => { drag = false; }, { signal: ac.signal });

  controls.addEventListener('click', e => {
    const b = e.target.closest('[data-r]');
    if (!b) return;
    const r = b.dataset.r;
    if (r === 'reset') { state = { x: 2, y: 3 }; animateTo(state); return; }
    if (r === 'x') state = { x: state.x, y: -state.y };
    if (r === 'y') state = { x: -state.x, y: state.y };
    if (r === 'o') state = { x: -state.x, y: -state.y };
    animateTo(state);
  }, { signal: ac.signal });

  render();
  return () => { ac.abort(); cancelAnimationFrame(raf); };
}

/* ============================================================
   8. 一次函数
   ============================================================ */
function mountLinear(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 600 520', role: 'img', 'aria-label': '一次函数图象与斜率截距演示' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">斜率 k</span>
      <div class="range-wrap"><input type="range" id="linK" min="-3" max="3" value="1.5" step="0.5"><output id="linKOut">1.5</output></div>
      <span class="control-label">截距 b</span>
      <div class="range-wrap"><input type="range" id="linB" min="-4" max="4" value="1" step="0.5"><output id="linBOut">1</output></div>
    </div>
    <div class="control-row">
      <button class="btn btn-sm btn-soft" id="linBall">● 让小球跑起来</button>
      <span class="small muted">k 控制倾斜，b 控制与 y 轴的交点</span>
    </div>
    <div class="lab-note"><b>口诀：</b>k 正上坡，k 负下坡；|k| 越大越陡；b 是直线与 y 轴交点的纵坐标。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'linEq', label: '函数表达式', value: 'y = 1.5x + 1', accent: true },
    { id: 'linDir', label: '增减性', value: 'y 随 x 增大而增大' },
    { id: 'linYint', label: '与 y 轴交点', value: '(0, 1)' },
    { id: 'linXint', label: '与 x 轴交点', value: '(−0.67, 0)' }
  ]);

  const O = 300, step = 48;
  const X = x => O + x * step;
  const Y = y => O - y * step;
  let k = 1.5, b = 1;
  let raf = 0, ballOn = false, ballT = 0;

  const defs = svgEl('defs', {}, svg);
  const clip = svgEl('clipPath', { id: 'linClip' }, defs);
  svgEl('rect', { x: 24, y: 24, width: 552, height: 472 }, clip);
  const pat = svgEl('pattern', { id: 'linGrid', width: step, height: step, patternUnits: 'userSpaceOnUse', x: O, y: O }, defs);
  svgEl('path', { d: `M ${step} 0 L 0 0 0 ${step}`, fill: 'none', stroke: '#E3D8C7', 'stroke-width': 1 }, pat);
  svgEl('rect', { width: 600, height: 520, fill: 'url(#linGrid)' }, svg);
  for (let i = -5; i <= 5; i++) {
    if (i === 0) continue;
    svgText(svg, X(i), O + 17, String(i), 'svg-small', { fill: '#9A8F7F' });
    svgText(svg, O - 11, Y(i) + 3, String(i), 'svg-small', { fill: '#9A8F7F', 'text-anchor': 'end' });
  }
  svgEl('line', { x1: 24, y1: O, x2: 576, y2: O, class: 'axis-line' }, svg);
  svgEl('line', { x1: O, y1: 24, x2: O, y2: 496, class: 'axis-line' }, svg);
  svgText(svg, 570, O - 10, 'x', 'svg-label', { 'text-anchor': 'end' });
  svgText(svg, O + 10, 36, 'y', 'svg-label');
  svgText(svg, O - 13, O + 18, 'O', 'svg-small', { 'text-anchor': 'end' });

  const dyn = svgEl('g', { 'clip-path': 'url(#linClip)' }, svg);
  const line = svgEl('line', { stroke: '#4C7DFF', 'stroke-width': 3, 'stroke-linecap': 'round' }, dyn);
  const ghostLine = svgEl('line', { stroke: '#4C7DFF', 'stroke-width': 1, opacity: 0.18 }, dyn);
  const ball = svgEl('circle', { r: 8, fill: '#EF654F', stroke: '#FFFDF8', 'stroke-width': 3, opacity: 0 }, svg);
  const ballLabel = svgText(svg, 0, 0, '', 'svg-small', { fill: '#B23B28', opacity: 0 });
  const eqLabel = svgText(svg, 48, 52, '', 'svg-math', { 'text-anchor': 'start', 'font-size': 18 });

  function render() {
    const x1 = -5.6, x2 = 5.6;
    line.setAttribute('x1', X(x1)); line.setAttribute('y1', Y(k * x1 + b));
    line.setAttribute('x2', X(x2)); line.setAttribute('y2', Y(k * x2 + b));
    ghostLine.setAttribute('x1', X(x1)); ghostLine.setAttribute('y1', Y(0));
    ghostLine.setAttribute('x2', X(x2)); ghostLine.setAttribute('y2', Y(0));
    eqLabel.textContent = k === 0 ? `y = ${b}` : `y = ${k === 1 ? '' : k === -1 ? '−' : k}x ${b >= 0 ? '+' : '−'} ${Math.abs(b)}`;

    while (dyn.childNodes.length > 2) dyn.removeChild(dyn.lastChild);

    if (Math.abs(b) <= 5) {
      svgEl('circle', { cx: X(0), cy: Y(b), r: 6, fill: '#4C7DFF', stroke: '#FFFDF8', 'stroke-width': 2.5 }, dyn);
      tagLabel(dyn, X(0) + 12, Y(b) - 12, `(0, ${fmt(b, 1)})`, '#2A51B8', 'start');
    }
    if (k !== 0) {
      const xint = -b / k;
      if (Math.abs(xint) <= 5) {
        svgEl('circle', { cx: X(xint), cy: Y(0), r: 6, fill: '#E8A31A', stroke: '#FFFDF8', 'stroke-width': 2.5 }, dyn);
        tagLabel(dyn, X(xint) - 8, Y(0) + 28, `(${fmt(xint, 2)}, 0)`, '#8A5E07', 'end');
      }
      const p0 = { x: X(0), y: Y(b) };
      const p1 = { x: X(1), y: Y(b + k) };
      if (Math.abs(b) <= 5 && Math.abs(b + k) <= 5) {
        svgEl('line', { x1: p0.x, y1: p0.y, x2: p1.x, y2: p0.y, stroke: '#E8A31A', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }, dyn);
        svgEl('line', { x1: p1.x, y1: p0.y, x2: p1.x, y2: p1.y, stroke: '#178F80', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }, dyn);
        svgText(dyn, (p0.x + p1.x) / 2, p0.y + (k > 0 ? 15 : -8), '1', 'svg-small', { fill: '#8A5E07' });
        svgText(dyn, p1.x + 6, (p0.y + p1.y) / 2, `k=${fmt(k, 1)}`, 'svg-small', { 'text-anchor': 'start', fill: '#0D6A5D' });
      }
    }

    setRO('linEq', k === 0 ? `y = ${fmt(b, 1)}` : `y = ${fmt(k, 1)}x ${b >= 0 ? '+' : '−'} ${fmt(Math.abs(b), 1)}`);
    setRO('linDir', k > 0 ? 'y 随 x 增大而增大' : k < 0 ? 'y 随 x 增大而减小' : 'y 不随 x 变化');
    setRO('linYint', `(0, ${fmt(b, 1)})`);
    setRO('linXint', k === 0 ? (b === 0 ? '与 x 轴重合' : '无交点（平行）') : `(${fmt(-b / k, 2)}, 0)`);
    controls.querySelector('#linKOut').textContent = fmt(k, 1);
    controls.querySelector('#linBOut').textContent = fmt(b, 1);
  }

  function animateBall() {
    if (!ballOn) return;
    ballT += 0.012;
    if (ballT > 1) ballT = 0;
    const x = -5 + 10 * ballT;
    const y = k * x + b;
    if (Math.abs(y) <= 5) {
      ball.setAttribute('cx', X(x));
      ball.setAttribute('cy', Y(y));
      ball.setAttribute('opacity', 1);
      ballLabel.setAttribute('x', X(x) + 10);
      ballLabel.setAttribute('y', Y(y) - 10);
      ballLabel.textContent = `x=${fmt(x, 1)}, y=${fmt(y, 1)}`;
      ballLabel.setAttribute('opacity', 1);
    } else {
      ball.setAttribute('opacity', 0);
      ballLabel.setAttribute('opacity', 0);
    }
    raf = requestAnimationFrame(animateBall);
  }

  controls.querySelector('#linK').addEventListener('input', e => { k = Number(e.target.value); render(); }, { signal: ac.signal });
  controls.querySelector('#linB').addEventListener('input', e => { b = Number(e.target.value); render(); }, { signal: ac.signal });
  controls.querySelector('#linBall').addEventListener('click', e => {
    ballOn = !ballOn;
    e.currentTarget.classList.toggle('btn-coral', ballOn);
    e.currentTarget.classList.toggle('btn-soft', !ballOn);
    if (ballOn) { ballT = 0; animateBall(); }
    else {
      cancelAnimationFrame(raf);
      ball.setAttribute('opacity', 0);
      ballLabel.setAttribute('opacity', 0);
    }
  }, { signal: ac.signal });

  render();
  return () => { ac.abort(); cancelAnimationFrame(raf); };
}

/* ============================================================
   9. 二元一次方程组与交点

function mountSystem(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 600 540', role: 'img', 'aria-label': '两条直线交点与方程组解' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">

      <button class="btn btn-sm btn-soft" data-p="0">第 1 组</button>
      <button class="btn btn-sm btn-soft" data-p="1">第 2 组</button>
      <button class="btn btn-sm btn-soft" data-p="2">第 3 组</button>
      <button class="btn btn-sm btn-soft" data-p="3">第 4 组</button>
    </div>
    <div class="lab-note"><b>核心：</b>方程组的解，就是两条直线交点的坐标。交点同时“站”在两条直线上。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'sysPoint', label: '交点坐标', accent: true },
    { id: 'sysEq1', label: '直线 ①' },
    { id: 'sysEq2', label: '直线 ②' },
    { id: 'sysCheck', label: '代入检验', value: '成立' }
  ]);

  const O = 300, step = 48;
  const X = x => O + x * step;
  const Y = y => O - y * step;
  const presets = [
    { k1: 2, b1: 1, k2: -1, b2: 4, e1: 'y = 2x + 1', e2: 'y = −x + 4' },
    { k1: 1, b1: -2, k2: -2, b2: 4, e1: 'y = x − 2', e2: 'y = −2x + 4' },
    { k1: -1, b1: 5, k2: 1, b2: 1, e1: 'y = −x + 5', e2: 'y = x + 1' },
    { k1: 0.5, b1: 1, k2: -1, b2: 4, e1: 'y = 0.5x + 1', e2: 'y = −x + 4' }
  ];
  let idx = 0;

  const defs = svgEl('defs', {}, svg);
  const clip = svgEl('clipPath', { id: 'sysClip' }, defs);
  svgEl('rect', { x: 24, y: 24, width: 552, height: 492 }, clip);
  const pat = svgEl('pattern', { id: 'sysGrid', width: step, height: step, patternUnits: 'userSpaceOnUse', x: O, y: O }, defs);
  svgEl('path', { d: `M ${step} 0 L 0 0 0 ${step}`, fill: 'none', stroke: '#E3D8C7', 'stroke-width': 1 }, pat);
  svgEl('rect', { width: 600, height: 540, fill: 'url(#sysGrid)' }, svg);
  for (let i = -5; i <= 5; i++) {
    if (i === 0) continue;
    svgText(svg, X(i), O + 17, String(i), 'svg-small', { fill: '#9A8F7F' });
    svgText(svg, O - 11, Y(i) + 3, String(i), 'svg-small', { fill: '#9A8F7F', 'text-anchor': 'end' });
  }
  svgEl('line', { x1: 24, y1: O, x2: 576, y2: O, class: 'axis-line' }, svg);
  svgEl('line', { x1: O, y1: 24, x2: O, y2: 516, class: 'axis-line' }, svg);
  svgText(svg, 570, O - 10, 'x', 'svg-label', { 'text-anchor': 'end' });
  svgText(svg, O + 10, 36, 'y', 'svg-label');
  svgText(svg, O - 13, O + 18, 'O', 'svg-small', { 'text-anchor': 'end' });

  const dyn = svgEl('g', { 'clip-path': 'url(#sysClip)' }, svg);
  const line1 = svgEl('line', { stroke: '#7C5CE0', 'stroke-width': 2.8, 'stroke-linecap': 'round' }, dyn);
  const line2 = svgEl('line', { stroke: '#178F80', 'stroke-width': 2.8, 'stroke-linecap': 'round' }, dyn);
  const point = svgEl('circle', { r: 9, fill: '#EF654F', stroke: '#FFFDF8', 'stroke-width': 3.5 }, svg);
  const pulse = svgEl('circle', { r: 18, fill: 'none', stroke: '#EF654F', 'stroke-width': 1.5, opacity: 0.5 }, svg);
  const pointBox = svgEl('rect', { rx: 7, height: 20, fill: '#FFFDF8', stroke: '#E7DDCC', 'stroke-width': 0.8 }, svg);
  const pointLabel = svgText(svg, 0, 0, '', 'svg-label', { fill: '#B23B28', 'font-size': 12 });
  const eq1Label = svgText(svg, 52, 56, '', 'svg-label', { 'text-anchor': 'start', fill: '#5B35A8' });
  const eq2Label = svgText(svg, 52, 78, '', 'svg-label', { 'text-anchor': 'start', fill: '#0D6A5D' });

  function render() {
    const p = presets[idx];
    const x = (p.b2 - p.b1) / (p.k1 - p.k2);
    const y = p.k1 * x + p.b1;
    line1.setAttribute('x1', X(-5.6)); line1.setAttribute('y1', Y(p.k1 * -5.6 + p.b1));
    line1.setAttribute('x2', X(5.6)); line1.setAttribute('y2', Y(p.k1 * 5.6 + p.b1));
    line2.setAttribute('x1', X(-5.6)); line2.setAttribute('y1', Y(p.k2 * -5.6 + p.b2));
    line2.setAttribute('x2', X(5.6)); line2.setAttribute('y2', Y(p.k2 * 5.6 + p.b2));
    point.setAttribute('cx', X(x)); point.setAttribute('cy', Y(y));
    pulse.setAttribute('cx', X(x)); pulse.setAttribute('cy', Y(y));
    const pText = `(${fmt(x, 2)}, ${fmt(y, 2)})`;
    const pBoxW = pText.length * 7.2 + 12;
    pointBox.setAttribute('x', X(x) + 12);
    pointBox.setAttribute('y', Y(y) - 32);
    pointBox.setAttribute('width', pBoxW);
    pointLabel.setAttribute('x', X(x) + 18);
    pointLabel.setAttribute('y', Y(y) - 18);
    pointLabel.textContent = pText;
    eq1Label.textContent = `① ${p.e1}`;
    eq2Label.textContent = `② ${p.e2}`;
    setRO('sysPoint', `(${fmt(x, 2)}, ${fmt(y, 2)})`);
    setRO('sysEq1', p.e1);
    setRO('sysEq2', p.e2);
    setRO('sysCheck', `${fmt(p.k1 * x + p.b1, 2)} = ${fmt(p.k2 * x + p.b2, 2)}`);
    controls.querySelectorAll('[data-p]').forEach((el, i) => el.classList.toggle('active', i === idx));
    while (dyn.childNodes.length > 2) dyn.removeChild(dyn.lastChild);
    svgEl('line', { x1: X(x), y1: O, x2: X(x), y2: Y(y), stroke: '#EF654F', 'stroke-width': 1.3, 'stroke-dasharray': '4 4', opacity: 0.7 }, dyn);
    svgEl('line', { x1: O, y1: Y(y), x2: X(x), y2: Y(y), stroke: '#EF654F', 'stroke-width': 1.3, 'stroke-dasharray': '4 4', opacity: 0.7 }, dyn);
  }

  controls.addEventListener('click', e => {
    const b = e.target.closest('[data-p]');
    if (!b) return;
    idx = Number(b.dataset.p);
    render();
  }, { signal: ac.signal });

  render();
  return () => ac.abort();
}

/* ============================================================
   10. 三线八角
   ============================================================ */
function mountParallel(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 480', role: 'img', 'aria-label': '平行线三线八角演示' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">截线倾斜角</span>
      <div class="range-wrap"><input type="range" id="parPhi" min="25" max="65" value="45" step="1"><output id="parPhiOut">45°</output></div>
    </div>
    <div class="control-row">
      <span class="control-label">找角的关系</span>
      <button class="btn btn-sm btn-soft active" data-pair="corr">同位角</button>
      <button class="btn btn-sm btn-soft" data-pair="alt">内错角</button>
      <button class="btn btn-sm btn-soft" data-pair="cons">同旁内角</button>
    </div>
    <div class="lab-note" id="parNote"><b>同位角：</b>∠1 与 ∠5、∠2 与 ∠6、∠3 与 ∠7、∠4 与 ∠8 分别相等。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'par1', label: '∠1' },
    { id: 'par2', label: '∠2' },
    { id: 'par5', label: '∠5' },
    { id: 'par6', label: '∠6', accent: true }
  ]);

  let phi = 45;
  let pairType = 'corr';
  const yT = 170, yB = 310, cx = 340, cy = 240;
  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'parDots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
  svgEl('circle', { cx: 1, cy: 1, r: 1, fill: '#E6DACA' }, pat);
  svgEl('rect', { width: 680, height: 480, fill: 'url(#parDots)', opacity: 0.5 }, svg);

  const lineA = svgEl('line', { x1: 40, y1: yT, x2: 640, y2: yT, stroke: '#2F7D6D', 'stroke-width': 3, 'stroke-linecap': 'round' }, svg);
  const lineB = svgEl('line', { x1: 40, y1: yB, x2: 640, y2: yB, stroke: '#2F7D6D', 'stroke-width': 3, 'stroke-linecap': 'round' }, svg);
  const trans = svgEl('line', { stroke: '#E85D4A', 'stroke-width': 2.4, 'stroke-linecap': 'round' }, svg);
  svgText(svg, 625, yT - 12, 'a', 'svg-math', { fill: '#2F7D6D', 'text-anchor': 'end' });
  svgText(svg, 625, yB - 12, 'b', 'svg-math', { fill: '#2F7D6D', 'text-anchor': 'end' });
  svgText(svg, 646, 418, 'c', 'svg-math', { fill: '#E85D4A', 'text-anchor': 'end' });

  const T = svgEl('circle', { r: 5, fill: '#E85D4A', stroke: '#FFFDF8', 'stroke-width': 2 }, svg);
  const B = svgEl('circle', { r: 5, fill: '#E85D4A', stroke: '#FFFDF8', 'stroke-width': 2 }, svg);
  const tags = [];
  for (let i = 1; i <= 8; i++) {
    const g = svgEl('g', {}, svg);
    const rect = svgEl('rect', { width: 62, height: 25, rx: 8, fill: '#FFFDF8', stroke: '#D9CCB7', 'stroke-width': 1.2 }, g);
    const t = svgEl('text', { x: 31, y: 17, 'text-anchor': 'middle', class: 'svg-small', 'font-size': 10.5, fill: '#45423A' }, g);
    tags.push({ g, rect, t });
  }
  const pairSets = {
    corr: [[1, 5], [2, 6], [3, 7], [4, 8]],
    alt: [[3, 6], [4, 5]],
    cons: [[3, 5], [4, 6]]
  };
  const notes = {
    corr: '<b>同位角：</b>∠1=∠5，∠2=∠6，∠3=∠7，∠4=∠8。两直线平行，同位角相等。',
    alt: '<b>内错角：</b>∠3=∠6，∠4=∠5。两直线平行，内错角相等。',
    cons: '<b>同旁内角：</b>∠3+∠5=180°，∠4+∠6=180°。两直线平行，同旁内角互补。'
  };

  function draw() {
    const rad = phi * D2R;
    const cot = Math.cos(rad) / Math.sin(rad);
    const xT = cx - 70 * cot;
    const xB = cx + 70 * cot;
    const topY = 55, botY = 425;
    const xTop = cx + (topY - cy) / Math.sin(rad) * Math.cos(rad);
    const xBot = cx + (botY - cy) / Math.sin(rad) * Math.cos(rad);
    trans.setAttribute('x1', xTop); trans.setAttribute('y1', topY);
    trans.setAttribute('x2', xBot); trans.setAttribute('y2', botY);
    T.setAttribute('cx', xT); T.setAttribute('cy', yT);
    B.setAttribute('cx', xB); B.setAttribute('cy', yB);

    const vals = { 1: phi, 2: 180 - phi, 3: 180 - phi, 4: phi, 5: phi, 6: 180 - phi, 7: 180 - phi, 8: phi };
    const positions = {
      1: [xT - 42, yT - 28], 2: [xT + 42, yT - 28], 3: [xT - 42, yT + 28], 4: [xT + 42, yT + 28],
      5: [xB - 42, yB - 28], 6: [xB + 42, yB - 28], 7: [xB - 42, yB + 28], 8: [xB + 42, yB + 28]
    };
    const selected = new Set();
    pairSets[pairType].forEach(p => p.forEach(n => selected.add(n)));
    tags.forEach((tag, i) => {
      const n = i + 1;
      const [x, y] = positions[n];
      tag.g.setAttribute('transform', `translate(${x - 31} ${y - 12})`);
      tag.t.textContent = `${n}  ${fmt(vals[n])}°`;
      const isSel = selected.has(n);
      tag.rect.setAttribute('fill', isSel ? '#FFF3D5' : '#FFFDF8');
      tag.rect.setAttribute('stroke', isSel ? '#E8A31A' : '#D9CCB7');
      tag.rect.setAttribute('stroke-width', isSel ? 2.2 : 1.2);
      tag.t.setAttribute('fill', isSel ? '#7A5509' : '#45423A');
      tag.t.setAttribute('font-weight', isSel ? '700' : '500');
    });
    setRO('par1', `${fmt(vals[1])}°`);
    setRO('par2', `${fmt(vals[2])}°`);
    setRO('par5', `${fmt(vals[5])}°`);
    setRO('par6', `${fmt(vals[6])}°`);
    controls.querySelector('#parPhiOut').textContent = `${phi}°`;
    controls.querySelector('#parNote').innerHTML = notes[pairType];
  }

  controls.querySelector('#parPhi').addEventListener('input', e => { phi = Number(e.target.value); draw(); }, { signal: ac.signal });
  controls.addEventListener('click', e => {
    const b = e.target.closest('[data-pair]');
    if (!b) return;
    pairType = b.dataset.pair;
    controls.querySelectorAll('[data-pair]').forEach(x => x.classList.toggle('active', x === b));
    draw();
  }, { signal: ac.signal });

  draw();
  return () => ac.abort();
}

/* ============================================================
   11. 抛硬币
   ============================================================ */
function mountProbability(canvas, controls, readouts) {
  const ac = new AbortController();
  canvas.innerHTML = `
    <div class="prob-layout">
      <div class="coin-zone">
        <div class="coin" id="coin">正</div>
        <div class="coin-caption" id="coinCaption">点击“抛 1 次”开始实验</div>
      </div>
      <div class="prob-bars">
        <div class="prob-bar">
          <div class="prob-bar-head"><span>正面朝上</span><b id="headCount">0 次</b></div>
          <div class="bar-track"><div class="bar-fill" id="headBar"></div></div>
        </div>
        <div class="prob-bar">
          <div class="prob-bar-head"><span>反面朝上</span><b id="tailCount">0 次</b></div>
          <div class="bar-track"><div class="bar-fill tail" id="tailBar"></div></div>
        </div>
        <div class="prob-bar">
          <div class="prob-bar-head"><span>理论概率</span><b>0.5</b></div>
          <div class="bar-track"><div class="bar-fill" style="width:50%;background:#C9BBA4"></div></div>
        </div>
      </div>
    </div>
    <div class="prob-summary">
      <div class="readout"><small>总次数</small><b id="probTotal">0</b></div>
      <div class="readout"><small>正面频率</small><b id="probFreq">—</b></div>
      <div class="readout accent"><small>反面频率</small><b id="probFreqT">—</b></div>
    </div>`;
  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">抛硬币</span>
      <button class="btn btn-sm btn-coral" id="p1">抛 1 次</button>
      <button class="btn btn-sm btn-soft" id="p10">抛 10 次</button>
      <button class="btn btn-sm btn-soft" id="p100">抛 100 次</button>
      <button class="btn btn-sm btn-soft" id="p1000">抛 1000 次</button>
      <button class="btn btn-sm btn-ghost" id="pReset">↺ 重置</button>
    </div>
    <div class="lab-note"><b>想一想：</b>抛 10 次，正面不一定是 5 次；但抛 1000 次，正面频率会稳定在 0.5 附近。这就是频率的稳定性。</div>`;
  readouts.innerHTML = '';

  let total = 0, heads = 0, timers = [];
  const coin = canvas.querySelector('#coin');
  const headBar = canvas.querySelector('#headBar');
  const tailBar = canvas.querySelector('#tailBar');
  const headCount = canvas.querySelector('#headCount');
  const tailCount = canvas.querySelector('#tailCount');

  function update(last) {
    const tails = total - heads;
    const p = total ? heads / total : 0;
    headBar.style.width = `${p * 100}%`;
    tailBar.style.width = `${total ? (1 - p) * 100 : 0}%`;
    headCount.textContent = `${heads} 次`;
    tailCount.textContent = `${tails} 次`;
    setRO('probTotal', String(total));
    setRO('probFreq', total ? p.toFixed(3) : '—');
    setRO('probFreqT', total ? (1 - p).toFixed(3) : '—');
    if (last) {
      coin.textContent = last;
      coin.classList.remove('flipping');
      void coin.offsetWidth;
      coin.classList.add('flipping');
      canvas.querySelector('#coinCaption').textContent = `最近一次：${last === '正' ? '正面朝上' : '反面朝上'}`;
    }
  }
  function flip(n) {
    for (let i = 0; i < n; i++) {
      total++;
      if (Math.random() < 0.5) heads++;
    }
    update(n <= 10 ? (Math.random() < 0.5 ? '正' : '反') : null);
  }
  function clearTimers() { timers.forEach(t => clearTimeout(t)); timers = []; }

  canvas.querySelector('#coin').addEventListener('click', () => flip(1), { signal: ac.signal });
  controls.querySelector('#p1').addEventListener('click', () => flip(1), { signal: ac.signal });
  controls.querySelector('#p10').addEventListener('click', () => flip(10), { signal: ac.signal });
  controls.querySelector('#p100').addEventListener('click', () => flip(100), { signal: ac.signal });
  controls.querySelector('#p1000').addEventListener('click', () => flip(1000), { signal: ac.signal });
  controls.querySelector('#pReset').addEventListener('click', () => {
    clearTimers();
    total = 0; heads = 0;
    update(null);
    coin.textContent = '正';
    canvas.querySelector('#coinCaption').textContent = '点击“抛 1 次”开始实验';
  }, { signal: ac.signal });

  update(null);
  return () => { ac.abort(); clearTimers(); };
}

  ]);

  let a = 1;
  let type = 'gt';
  const O = 340, step = 70;
  const X = x => O + x * step;
  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'ineqDots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
  svgEl('circle', { cx: 1, cy: 1, r: 1, fill: '#E6DACA' }, pat);
  svgEl('rect', { width: 680, height: 290, fill: 'url(#ineqDots)', opacity: 0.5 }, svg);

  svgEl('line', { x1: 55, y1: lineY, x2: 625, y2: lineY, class: 'axis-line' }, svg);

  for (let i = -4; i <= 4; i++) {
    svgEl('line', { x1: X(i), y1: lineY - 6, x2: X(i), y2: lineY + 6, stroke: '#22211D', 'stroke-width': 1.2 }, svg);
    svgText(svg, X(i), lineY + 25, String(i), 'svg-small', { fill: '#6E6556' });
  }
  svgText(svg, 610, lineY + 45, 'x', 'svg-label', { 'text-anchor': 'end' });
  const ray = svgEl('line', { y1: lineY, y2: lineY, stroke: '#D9772B', 'stroke-width': 9, 'stroke-linecap': 'round', opacity: 0.45 }, svg);
  const dot = svgEl('circle', { cy: lineY, r: 9, fill: '#FFFDF8', stroke: '#D9772B', 'stroke-width': 3 }, svg);
  const arrow = svgEl('path', { fill: '#D9772B' }, svg);
  const eq = svgText(svg, 340, 62, '', 'svg-math', { 'font-size': 24, fill: '#22211D' });
  const hint = svgText(svg, 340, 88, '', 'svg-small', { fill: '#8B8274' });

  function render() {
    const left = type === 'lt' || type === 'le';
    const solid = type === 'ge' || type === 'le';
    const op = { gt: '>', ge: '≥', lt: '<', le: '≤' }[type];
    dot.setAttribute('cx', X(a));
    dot.setAttribute('fill', solid ? '#D9772B' : '#FFFDF8');
    ray.setAttribute('x1', X(a));
    ray.setAttribute('y1', lineY);
    ray.setAttribute('x2', left ? 62 : 618);
    ray.setAttribute('y2', lineY);
    arrow.setAttribute('d', left
      ? `M 62 ${lineY} l 12 -8 l 0 16 Z`
      : `M 618 ${lineY} l -12 -8 l 0 16 Z`);
    eq.textContent = `x ${op} ${a}`;
    hint.textContent = solid ? '实心点：包含边界' : '空心圈：不包含边界';
    setRO('ineqSet', `x ${op} ${a}`);
    setRO('ineqBoundary', String(a));
    setRO('ineqDot', solid ? '包含（实心）' : '不包含（空心）');
    setRO('ineqDir', left ? '向左' : '向右');
    controls.querySelector('#ineqAOut').textContent = String(a);
  }

  controls.querySelector('#ineqA').addEventListener('input', e => { a = Number(e.target.value); render(); }, { signal: ac.signal });
  controls.addEventListener('click', e => {
    const b = e.target.closest('[data-ineq]');
    if (b) {
      type = b.dataset.ineq;
      controls.querySelectorAll('[data-ineq]').forEach(x => x.classList.toggle('active', x === b));
      render();
      return;
    }
    const m = e.target.closest('[data-m]');
    if (m) {
      const k = Number(m.dataset.m);
      const left = 2 * k, right = 3 * k;
      const op = k < 0 ? '>' : '<';
      controls.querySelector('#magicEq').textContent = `2 × ${k < 0 ? `(${k})` : k} ${op} 3 × ${k < 0 ? `(${k})` : k}`;
      controls.querySelector('#magicNote').textContent = k < 0
        ? `${left} > ${right}：乘负数后，不等号反向！`
        : `${left} < ${right}：乘正数，方向不变。`;
    }
  }, { signal: ac.signal });

  render();
  return () => ac.abort();
}

/* ============================================================
   13. 垂直平分线
   ============================================================ */
function mountPerpendicular(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 430', role: 'img', 'aria-label': '垂直平分线上的点到两端距离相等' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <button class="btn btn-sm btn-soft" id="perpPlay">▶ 让 P 动起来</button>
      <button class="btn btn-sm btn-ghost" id="perpArc">◌ 显示作图弧</button>
      <button class="btn btn-sm btn-ghost" id="perpReset">↺ 复位</button>
      <span class="small muted">也可以上下拖动 P</span>
    </div>
    <div class="lab-note"><b>性质：</b>垂直平分线上的点到线段两端距离相等。反过来，到两端距离相等的点也在这条线上。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'perpPA', label: 'PA' },
    { id: 'perpPB', label: 'PB' },
    { id: 'perpEq', label: 'PA 与 PB', value: '相等', accent: true },
    { id: 'perpPos', label: 'P 的位置', value: '在线上' }
  ]);

  const A = { x: 180, y: 290 }, B = { x: 500, y: 290 }, M = { x: 340, y: 290 };
  let py = 140;
  let playing = false, showArcs = false, raf = 0, dir = 1;
  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'perpDots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
  svgEl('circle', { cx: 1, cy: 1, r: 1, fill: '#E6DACA' }, pat);
  svgEl('rect', { width: 680, height: 430, fill: 'url(#perpDots)', opacity: 0.5 }, svg);

  const arcs = svgEl('g', { opacity: 0 }, svg);
  svgEl('circle', { cx: A.x, cy: A.y, r: 220, fill: 'none', stroke: '#8B63D9', 'stroke-width': 1.2, 'stroke-dasharray': '5 5', opacity: 0.55 }, arcs);
  svgEl('circle', { cx: B.x, cy: B.y, r: 220, fill: 'none', stroke: '#8B63D9', 'stroke-width': 1.2, 'stroke-dasharray': '5 5', opacity: 0.55 }, arcs);

  svgEl('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, stroke: '#22211D', 'stroke-width': 3, 'stroke-linecap': 'round' }, svg);
  svgEl('line', { x1: M.x, y1: 45, x2: M.x, y2: 385, stroke: '#178F80', 'stroke-width': 2.4, 'stroke-dasharray': '7 5' }, svg);
  svgEl('path', { d: `M ${M.x - 12} ${M.y} L ${M.x - 12} ${M.y - 12} L ${M.x} ${M.y - 12}`, fill: 'none', stroke: '#178F80', 'stroke-width': 1.5 }, svg);
  svgText(svg, A.x, A.y + 24, 'A', 'svg-label');
  svgText(svg, B.x, B.y + 24, 'B', 'svg-label');
  svgText(svg, M.x + 14, M.y + 20, 'M', 'svg-small');
  svgText(svg, M.x + 12, 58, '垂直平分线', 'svg-small', { 'text-anchor': 'start', fill: '#0D6A5D' });

  const paLine = svgEl('line', { stroke: '#E8A31A', 'stroke-width': 2, 'stroke-dasharray': '5 4' }, svg);
  const pbLine = svgEl('line', { stroke: '#E8A31A', 'stroke-width': 2, 'stroke-dasharray': '5 4' }, svg);
  const pDot = svgEl('circle', { r: 9, fill: '#EF654F', stroke: '#FFFDF8', 'stroke-width': 3.5, class: 'draggable' }, svg);
  const pLabel = svgText(svg, 0, 0, 'P', 'svg-label', { fill: '#B23B28' });
  const paLabel = svgText(svg, 0, 0, '', 'svg-small', { fill: '#8A5E07' });
  const pbLabel = svgText(svg, 0, 0, '', 'svg-small', { fill: '#8A5E07' });

  function render() {
    const P = { x: M.x, y: py };
    pDot.setAttribute('cx', P.x); pDot.setAttribute('cy', P.y);
    pLabel.setAttribute('x', P.x + 16); pLabel.setAttribute('y', P.y - 10);
    paLine.setAttribute('x1', P.x); paLine.setAttribute('y1', P.y);
    paLine.setAttribute('x2', A.x); paLine.setAttribute('y2', A.y);
    pbLine.setAttribute('x1', P.x); pbLine.setAttribute('y1', P.y);
    pbLine.setAttribute('x2', B.x); pbLine.setAttribute('y2', B.y);
    const pa = Math.hypot(P.x - A.x, P.y - A.y) / 28;
    const pb = Math.hypot(P.x - B.x, P.y - B.y) / 28;
    paLabel.setAttribute('x', (P.x + A.x) / 2 - 20);
    paLabel.setAttribute('y', (P.y + A.y) / 2);
    paLabel.textContent = `PA=${fmt(pa, 1)}`;
    pbLabel.setAttribute('x', (P.x + B.x) / 2 + 12);
    pbLabel.setAttribute('y', (P.y + B.y) / 2);
    pbLabel.textContent = `PB=${fmt(pb, 1)}`;
    setRO('perpPA', fmt(pa, 2));
    setRO('perpPB', fmt(pb, 2));
    setRO('perpEq', Math.abs(pa - pb) < 0.05 ? '相等 ✓' : '不相等');
    setRO('perpPos', '在线上');
    arcs.setAttribute('opacity', showArcs ? 1 : 0);
  }

  function loop() {
    if (!playing) return;
    py += dir * 1.1;
    if (py > 350) { py = 350; dir = -1; }
    if (py < 90) { py = 90; dir = 1; }
    render();
    raf = requestAnimationFrame(loop);
  }

  controls.querySelector('#perpPlay').addEventListener('click', e => {
    playing = !playing;
    e.currentTarget.textContent = playing ? '❚❚ 暂停' : '▶ 让 P 动起来';
    if (playing) loop(); else cancelAnimationFrame(raf);
  }, { signal: ac.signal });
  controls.querySelector('#perpArc').addEventListener('click', () => { showArcs = !showArcs; render(); }, { signal: ac.signal });
  controls.querySelector('#perpReset').addEventListener('click', () => {
    playing = false;
    cancelAnimationFrame(raf);
    py = 140;
    controls.querySelector('#perpPlay').textContent = '▶ 让 P 动起来';
    render();
  }, { signal: ac.signal });

  let dragging = false;
  svg.addEventListener('pointerdown', e => {
    if (e.target === pDot) { dragging = true; playing = false; cancelAnimationFrame(raf); svg.setPointerCapture?.(e.pointerId); }
  }, { signal: ac.signal });
  svg.addEventListener('pointermove', e => {
    if (!dragging) return;
    py = clamp(toSvgPoint(svg, e).y, 70, 370);
    render();
  }, { signal: ac.signal });
  svg.addEventListener('pointerup', () => { dragging = false; }, { signal: ac.signal });

  render();
  return () => { ac.abort(); cancelAnimationFrame(raf); };
}

/* ============================================================
   14. 角平分线
   ============================================================ */
function mountAngleBisector(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 430', role: 'img', 'aria-label': '角平分线上的点到角两边距离相等' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">角的大小</span>
      <div class="range-wrap"><input type="range" id="bisTheta" min="30" max="75" value="52" step="1"><output id="bisThetaOut">52°</output></div>
      <span class="control-label">P 的位置</span>
      <div class="range-wrap"><input type="range" id="bisD" min="130" max="320" value="280" step="1"><output id="bisDOut">280</output></div>
    </div>
    <div class="control-row">
      <button class="btn btn-sm btn-ghost" id="bisReset">↺ 复位</button>
      <span class="small muted">也可以拖动 P</span>
    </div>
    <div class="lab-note"><b>关键：</b>距离必须是“垂线段”。图中 PF⊥OA，PG⊥OB，所以 PF = PG。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'bisAOP', label: '∠AOP' },
    { id: 'bisPOB', label: '∠POB' },
    { id: 'bisPF', label: 'P 到 OA 距离' },
    { id: 'bisPG', label: 'P 到 OB 距离', accent: true }
  ]);

  let theta = 52, d = 280;
  const O = { x: 95, y: 355 };
  const LA = 540;
  const L = 340;
  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'bisDots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
  svgEl('circle', { cx: 1, cy: 1, r: 1, fill: '#E6DACA' }, pat);
  svgEl('rect', { width: 680, height: 430, fill: 'url(#bisDots)', opacity: 0.5 }, svg);

  const rayA = svgEl('line', { x1: O.x, y1: O.y, x2: O.x + LA, y2: O.y, stroke: '#22211D', 'stroke-width': 2.5 }, svg);
  const rayB = svgEl('line', { x1: O.x, y1: O.y, x2: 0, y2: 0, stroke: '#22211D', 'stroke-width': 2.5 }, svg);
  const bis = svgEl('line', { x1: O.x, y1: O.y, x2: 0, y2: 0, stroke: '#8A5A44', 'stroke-width': 1.6, 'stroke-dasharray': '6 5' }, svg);
  const arc1 = svgEl('path', { fill: 'none', stroke: '#E8A31A', 'stroke-width': 2 }, svg);
  const arc2 = svgEl('path', { fill: 'none', stroke: '#E8A31A', 'stroke-width': 2 }, svg);
  svgText(svg, O.x - 16, O.y + 24, 'O', 'svg-label');
  svgText(svg, O.x + LA - 10, O.y + 24, 'A', 'svg-label');
  const bLabel = svgText(svg, 0, 0, 'B', 'svg-label');

  const pfLine = svgEl('line', { stroke: '#178F80', 'stroke-width': 2.2, 'stroke-dasharray': '5 4' }, svg);
  const pgLine = svgEl('line', { stroke: '#178F80', 'stroke-width': 2.2, 'stroke-dasharray': '5 4' }, svg);
  const pDot = svgEl('circle', { r: 9, fill: '#EF654F', stroke: '#FFFDF8', 'stroke-width': 3.5, class: 'draggable' }, svg);
  const pLabel = svgText(svg, 0, 0, 'P', 'svg-label', { fill: '#B23B28' });
  const fLabel = svgText(svg, 0, 0, 'F', 'svg-small');
  const gLabel = svgText(svg, 0, 0, 'G', 'svg-small');
  const pfText = svgText(svg, 0, 0, '', 'svg-small', { fill: '#0D6A5D' });
  const pgText = svgText(svg, 0, 0, '', 'svg-small', { fill: '#0D6A5D' });
  const markGroup = svgEl('g', {}, svg);

  function render() {
    clearNode(markGroup);
    const th = theta * D2R;
    const uB = { x: Math.cos(th), y: -Math.sin(th) };
    const uP = { x: Math.cos(th / 2), y: -Math.sin(th / 2) };
    const B = { x: O.x + L * uB.x, y: O.y + L * uB.y };
    const P = { x: O.x + d * uP.x, y: O.y + d * uP.y };
    rayB.setAttribute('x2', B.x);
    rayB.setAttribute('y2', B.y);
    bis.setAttribute('x2', O.x + 360 * uP.x);
    bis.setAttribute('y2', O.y + 360 * uP.y);
    bLabel.setAttribute('x', B.x + 12);
    bLabel.setAttribute('y', B.y - 4);
    pDot.setAttribute('cx', P.x); pDot.setAttribute('cy', P.y);
    pLabel.setAttribute('x', P.x + 16); pLabel.setAttribute('y', P.y - 10);

    const F = { x: P.x, y: O.y };
    const t = (P.x - O.x) * uB.x + (P.y - O.y) * uB.y;
    const G = { x: O.x + t * uB.x, y: O.y + t * uB.y };
    pfLine.setAttribute('x1', P.x); pfLine.setAttribute('y1', P.y);
    pfLine.setAttribute('x2', F.x); pfLine.setAttribute('y2', F.y);
    pgLine.setAttribute('x1', P.x); pgLine.setAttribute('y1', P.y);
    pgLine.setAttribute('x2', G.x); pgLine.setAttribute('y2', G.y);
    fLabel.setAttribute('x', F.x); fLabel.setAttribute('y', F.y + 18);
    gLabel.setAttribute('x', G.x + 12); gLabel.setAttribute('y', G.y - 4);
    pfText.setAttribute('x', (P.x + F.x) / 2 + 14);
    pfText.setAttribute('y', (P.y + F.y) / 2);
    pfText.textContent = `PF=${fmt(O.y - P.y, 1)}`;
    pgText.setAttribute('x', (P.x + G.x) / 2 + 8);
    pgText.setAttribute('y', (P.y + G.y) / 2 - 8);
    pgText.textContent = `PG=${fmt(Math.hypot(P.x - G.x, P.y - G.y), 1)}`;

    // 直角标记
    svgEl('path', { d: `M ${F.x - 12} ${F.y} L ${F.x - 12} ${F.y - 12} L ${F.x} ${F.y - 12}`, fill: 'none', stroke: '#178F80', 'stroke-width': 1.3 }, markGroup);
    const dx = uB.y, dy = -uB.x;
    svgEl('path', { d: `M ${G.x + dx * 12} ${G.y + dy * 12} L ${G.x + dx * 12 - uB.x * 12} ${G.y + dy * 12 - uB.y * 12} L ${G.x - uB.x * 12} ${G.y - uB.y * 12}`, fill: 'none', stroke: '#178F80', 'stroke-width': 1.3 }, markGroup);

    const r = 58;
    const a1s = O.x + r, a1e = O.y;
    const a2s = O.x + r * uP.x, a2e = O.y + r * uP.y;
    const a3s = O.x + r * uB.x, a3e = O.y + r * uB.y;
    arc1.setAttribute('d', `M ${a1s} ${a1e} A ${r} ${r} 0 0 0 ${a2s} ${a2e}`);
    arc2.setAttribute('d', `M ${a2s} ${a2e} A ${r} ${r} 0 0 0 ${a3s} ${a3e}`);

    setRO('bisAOP', `${fmt(theta / 2, 1)}°`);
    setRO('bisPOB', `${fmt(theta / 2, 1)}°`);
    setRO('bisPF', fmt(O.y - P.y, 2));
    setRO('bisPG', fmt(Math.hypot(P.x - G.x, P.y - G.y), 2));
    controls.querySelector('#bisThetaOut').textContent = `${theta}°`;
    controls.querySelector('#bisDOut').textContent = String(Math.round(d));
  }

  controls.querySelector('#bisTheta').addEventListener('input', e => { theta = Number(e.target.value); d = clamp(d, 130, 320); render(); }, { signal: ac.signal });
  controls.querySelector('#bisD').addEventListener('input', e => { d = Number(e.target.value); render(); }, { signal: ac.signal });
  controls.querySelector('#bisReset').addEventListener('click', () => {
    theta = 52; d = 280;
    controls.querySelector('#bisTheta').value = 52;
    controls.querySelector('#bisD').value = 280;
    render();
  }, { signal: ac.signal });

  let dragging = false;
  svg.addEventListener('pointerdown', e => {
    if (e.target === pDot) { dragging = true; svg.setPointerCapture?.(e.pointerId); }
  }, { signal: ac.signal });
  svg.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = toSvgPoint(svg, e);
    const th = theta * D2R;
    const uP = { x: Math.cos(th / 2), y: -Math.sin(th / 2) };
    d = clamp((p.x - O.x) * uP.x + (p.y - O.y) * uP.y, 130, 320);
    controls.querySelector('#bisD').value = Math.round(d);
    render();
  }, { signal: ac.signal });
  svg.addEventListener('pointerup', () => { dragging = false; }, { signal: ac.signal });

  render();
  return () => ac.abort();
}

/* ============================================================
   调度器
   ============================================================ */
const LAB_MOUNTS = {
  triangle: mountTriangle,
  congruence: mountCongruence,
  symmetry: mountSymmetry,
  isosceles: mountIsosceles,
  pythagoras: mountPythagoras,
  irrational: mountIrrational,
  coordinate: mountCoordinate,
  linear: mountLinear,
  system: mountSystem,
  parallel: mountParallel,
  probability: mountProbability,
  inequality: mountInequality,
  perpendicular: mountPerpendicular,
  anglebisector: mountAngleBisector
};

let __labCleanup = null;
function mountLab(id, canvas, controls, readouts) {
  if (__labCleanup) { try { __labCleanup(); } catch (e) { /* noop */ } }
  __labCleanup = null;
  canvas.innerHTML = '';
  controls.innerHTML = '';
  readouts.innerHTML = '';
  const fn = LAB_MOUNTS[id];
  if (!fn) {
    canvas.innerHTML = '<div style="padding:60px;text-align:center;color:#777267">这个实验正在准备中…</div>';
    return;
  }
  __labCleanup = fn(canvas, controls, readouts) || null;
}

window.mountLab = mountLab;
window.LAB_MOUNTS = LAB_MOUNTS;
window.cleanupLab = () => {
  if (__labCleanup) {
    try { __labCleanup(); } catch (e) { /* noop */ }
    __labCleanup = null;
  }
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const yesterdayKey = () => todayKey(new Date(Date.now() - 86400000));
const qs = (key) => new URLSearchParams(location.hash.split('?')[1] || '').get(key);

const chapterQuestions = (id) => QUESTIONS.filter(q => q.ch === id);
const chapterAnims = (id) => ANIMATIONS.filter(a => a.chapter === id);

function levelInfo(xp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].min) idx = i;
  const cur = LEVELS[idx];
  const next = LEVELS[idx + 1] || null;
  const span = next ? next.min - cur.min : 1;
  const done = next ? xp - cur.min : 1;
  return { idx, cur, next, progress: next ? clamp((done / span) * 100, 0, 100) : 100, remain: next ? next.min - xp : 0 };
}

function fmtDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff <= 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff < 7) return `${diff} 天前`;
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
}

function normalizeAnswer(raw) {
  return String(raw)
    .trim()
    .toLowerCase()
    .replace(/\s+/g, '')
    .replace(/[，,]/g, '')
    .replace(/[（]/g, '(')
    .replace(/[）]/g, ')')
    .replace(/[−–—]/g, '-')
    .replace(/[°度]/g, '')
    .replace(/(cm|厘米|米|m|px)/g, '')
    .replace(/[。.]$/, '');
}

function answerText(q) {
  if (q.type === 'fill') return q.answers[0];
  if (q.type === 'judge') return q.options[q.answer];
  return q.options[q.answer];
}

function isCorrectAnswer(q, value) {
  if (q.type === 'fill') {
    const v = normalizeAnswer(value);
    if (!v) return false;
    if (q.answers.some(a => normalizeAnswer(a) === v)) return true;
    const nv = Number(v);
    return Number.isFinite(nv) && q.answers.some(a => Number(normalizeAnswer(a)) === nv);
  }
  return Number(value) === Number(q.answer);
}

const CHAPTER_METHODS = {
  c1: '先标出相等的边和角，再找公共边、对顶角或中点；用全等判定时，角必须是两边的夹角。',
  c2: '先找对称轴，利用“对应点连线被对称轴垂直平分”或等腰三角形“三线合一”来转化。',
  c3: '先确认直角三角形和斜边，再选勾股定理或逆定理；实际问题先画图构造直角。',
  c4: '先判断是平方根还是立方根，注意正负和符号；比较大小可以平方后比较。',
  c5: '先看横、纵坐标的符号定象限，再看距离用绝对值；对称变化记“关于谁对称谁不变”。',
  c6: '先找 k、b 的实际意义，再用待定系数法或图象交点解题；注意一次函数中 k≠0。',
  c7: '先找两个独立的等量关系，设两个未知数；解方程组优先消元，最后代回检验。',
  c8: '先认角（同位角/内错角/同旁内角），再判断是由角推线还是由线推角，写清依据。',
  c9: '先确认结果是否等可能，再数总结果和目标结果；频率会稳定在概率附近。',
  c10: '先解每个不等式，注意乘除负数要变号，最后在数轴上取公共部分。',
  c11: '先找全等或等腰的基本图形，作顶角平分线、底边高或垂线，再用性质或判定规范书写。'
};

function knowledgeForQuestion(q) {
  const ch = chById(q.ch);
  if (!ch) return null;
  const norm = s => String(s).replace(/\s+/g, '').replace(/[（）()]/g, '');
  const point = norm(q.point);
  const section = norm(q.section || '');
  const tokens = [];
  for (let i = 0; i < point.length - 1; i++) {
    const t = point.slice(i, i + 2);
    if (!tokens.includes(t)) tokens.push(t);
  }
  const cards = ch.knowledge;
  let best = cards[0], bestScore = -1;
  cards.forEach(k => {
    const title = norm(k.title);
    const core = norm(k.core);
    const points = norm(k.points.join(''));
    const formulaText = norm(k.formulas.map(f => f.label + f.expr).join(''));
    let score = 0;
    if (title.includes(point)) score += 120;
    if (point.includes(title)) score += 80;
    tokens.forEach(t => {
      if (title.includes(t)) score += 18;
      if (core.includes(t)) score += 5;
      if (points.includes(t)) score += 5;
    });
    if (formulaText.includes(point)) score += 8;
    if (section && norm(k.eyebrow).startsWith(section)) score += 15;
    if (point.includes('性质') && title.includes('性质')) score += 25;
    if (point.includes('判定') && title.includes('判定')) score += 25;
    if (score > bestScore) { best = k; bestScore = score; }
  });
  return best;
}

function solutionPathHTML(q) {
  const k = knowledgeForQuestion(q);
  const method = k ? k.tip : (CHAPTER_METHODS[q.ch] || '先读懂题意，再找知识点，最后按步骤作答并检验。');
  return `<div class="solution-path">
    <div class="sp-head">🧭 解题路径</div>
    <div class="sp-step"><i>1</i><div><b>切入点</b><span>${q.hint}</span></div></div>
    <div class="sp-step"><i>2</i><div><b>完整解答</b><span>${q.explanation}</span></div></div>
    <div class="sp-step"><i>3</i><div><b>方法提炼</b><span>${method}</span></div></div>
  </div>`;
}

    <div class="kr-notes">

}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------------- 状态 ---------------- */
function defaultState() {
  return {
    version: 1,
    xp: 0,
    streak: 0,
    lastActiveDate: '',
    daily: { date: '', xp: 0, correct: 0, learned: 0, reviewed: 0, goal: 30, qid: '', qChecked: false, qChosen: null },
    learned: [],
    explored: [],
    examplesRead: [],
    answered: {},
    wrong: [],
    wrongCreated: 0,
    masteredCount: 0,
    bestCombo: 0,
    badges: [],
    campaign: {},
    activity: [],
    notes: { feynman: '', checklist: [false, false, false, false, false] },
    profile: { nickname: '小帅哥', avatar: '' },
    settings: { sound: true },
    quizHistory: [],
    lastChapter: ''
  };
}

function loadState() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { raw = null; }
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;
  const s = {
    ...base, ...raw,
    daily: { ...base.daily, ...(raw.daily || {}) },
    notes: { ...base.notes, ...(raw.notes || {}) },
    profile: { ...base.profile, ...(raw.profile || {}) },
    settings: { ...base.settings, ...(raw.settings || {}) }
  };
  ['learned', 'explored', 'examplesRead', 'wrong', 'badges', 'activity', 'quizHistory'].forEach(k => { if (!Array.isArray(s[k])) s[k] = base[k]; });
  if (!s.answered || typeof s.answered !== 'object') s.answered = {};
  if (!s.campaign || typeof s.campaign !== 'object') s.campaign = {};
  Object.keys(s.campaign).forEach(k => {
    if (!chById(k)) { delete s.campaign[k]; return; }
    const r = s.campaign[k] || {};
    s.campaign[k] = {
      bestAccuracy: Math.max(0, Math.min(100, Number(r.bestAccuracy || 0))),
      stars: Math.max(0, Math.min(3, Number(r.stars || 0))),
      attempts: Math.max(0, Number(r.attempts || 0)),
      lastAt: Number(r.lastAt || 0)
    };
  });
  if (!Array.isArray(s.notes.checklist)) s.notes.checklist = [false, false, false, false, false];
  s.profile.nickname = String(s.profile.nickname || '小帅哥').trim().slice(0, 8) || '小帅哥';
  s.profile.avatar = typeof s.profile.avatar === 'string' ? s.profile.avatar : '';
  s.wrong = s.wrong.filter(w => qById(w.qid)).map(w => ({
    ...w,
    status: w.status || 'new',
    correctStreak: Number(w.correctStreak || 0),
    attempts: Number(w.attempts || 1)
  }));
  return s;
}

let state = loadState();

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* 本地存储不可用时仍可正常浏览 */ }
}

function addActivity(text, xp = 0) {
  state.activity.unshift({ text, xp, ts: Date.now() });
  state.activity = state.activity.slice(0, 30);
}

function pickDailyQid(dateStr) {
  const pool = QUESTIONS.filter(q => q.type !== 'fill');
  let hash = 0;
  for (const ch of dateStr) hash = (hash * 31 + ch.charCodeAt(0)) % 100000;
  return pool[hash % pool.length].id;
}

function ensureDay() {
  const today = todayKey();
  if (state.daily.date !== today) {
    state.daily = {
      date: today, xp: 0, correct: 0, learned: 0, reviewed: 0, goal: 30,
      qid: pickDailyQid(today), qChecked: false, qChosen: null
    };
  }
  if (!state.daily.qid || !qById(state.daily.qid)) {
    state.daily.qid = pickDailyQid(today);
    state.daily.qChecked = false;
    state.daily.qChosen = null;
  }
  if (state.lastActiveDate !== today) {

/* ---------------- 音效 ---------------- */
let audioCtx = null;
function ensureAudio() {
  if (!state.settings.sound) return null;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
function tone(freq, dur = 0.12, type = 'sine', delay = 0, vol = 0.07) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  const t = ctx.currentTime + delay;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}
function playSound(kind) {
  if (!state.settings.sound) return;
  if (kind === 'correct') { tone(660, 0.1, 'sine', 0); tone(880, 0.14, 'sine', 0.09); }
  else if (kind === 'wrong') { tone(220, 0.18, 'triangle', 0, 0.05); tone(170, 0.22, 'triangle', 0.12, 0.04); }
  else if (kind === 'badge') { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'sine', i * 0.08, 0.055)); }
  else if (kind === 'click') { tone(500, 0.05, 'sine', 0, 0.03); }
  else if (kind === 'level') { [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'triangle', i * 0.1, 0.055)); }
  else if (kind === 'alert') {
    tone(220, 0.09, 'square', 0, 0.025);
    tone(330, 0.11, 'square', 0.12, 0.025);
  } else if (kind === 'mission') {
    tone(98, 0.24, 'triangle', 0, 0.04);
    [196, 262, 330, 392].forEach((f, i) => tone(f, 0.18, 'sawtooth', 0.05 + i * 0.11, 0.035));
    tone(523, 0.3, 'triangle', 0.5, 0.04);
  } else if (kind === 'victory') {
    tone(82, 0.3, 'triangle', 0, 0.05);
    [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'sawtooth', i * 0.1, 0.04));
    tone(1318, 0.36, 'sine', 0.52, 0.04);
    tone(196, 0.32, 'triangle', 0.52, 0.035);
  } else if (kind === 'medal') {
    [1318, 1568, 2093].forEach((f, i) => tone(f, 0.22, 'sine', i * 0.08, 0.045));
  }
}

/* ---------------- 彩纸 ---------------- */
const confettiCanvas = document.getElementById('confettiCanvas');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiParticles = [];
let confettiRaf = 0;
function sizeConfetti() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  confettiCanvas.width = innerWidth * dpr;
  confettiCanvas.height = innerHeight * dpr;
  confettiCanvas.style.width = innerWidth + 'px';
  confettiCanvas.style.height = innerHeight + 'px';
  confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeConfetti();
window.addEventListener('resize', sizeConfetti);

function burstConfetti(n = 70, ox = innerWidth / 2, oy = innerHeight * 0.34) {
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#EF654F', '#E8A31A', '#178F80', '#4C7DFF', '#C86DD7', '#FFD36B'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 3 + Math.random() * 8;
    confettiParticles.push({
      x: ox, y: oy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 3,
      g: 0.18 + Math.random() * 0.12,
      w: 5 + Math.random() * 7,
      h: 3 + Math.random() * 5,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1
    });
  }
  if (!confettiRaf) animateConfetti();
}
function animateConfetti() {
  confettiCtx.clearRect(0, 0, innerWidth, innerHeight);
  confettiParticles.forEach(p => {
    p.vy += p.g;
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.995;
    p.rot += p.vr;
    p.life -= 0.008;
    confettiCtx.save();
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate(p.rot);
    confettiCtx.globalAlpha = Math.max(0, p.life);
    confettiCtx.fillStyle = p.color;
    confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    confettiCtx.restore();
  });
  confettiParticles = confettiParticles.filter(p => p.life > 0 && p.y < innerHeight + 40);
  if (confettiParticles.length) {
    confettiRaf = requestAnimationFrame(animateConfetti);
  } else {
    confettiRaf = 0;
    confettiCtx.clearRect(0, 0, innerWidth, innerHeight);
  }
}

let modalAbort = null;

  document.body.classList.add('is-locked');
  const close = () => {
    root.innerHTML = '';
    document.body.classList.remove('is-locked');
    modalAbort?.abort();

  };
  root.querySelector('[data-ok]').addEventListener('click', () => { close(); onConfirm?.(); }, { signal: modalAbort.signal });

}

/* ---------------- 章节统计 ---------------- */
function chapterStats(ch) {
  const qsAll = chapterQuestions(ch.id);
  const learned = ch.knowledge.filter(k => state.learned.includes(k.id)).length;
  let correctUnique = 0, attempts = 0, correct = 0;
  qsAll.forEach(q => {
    const rec = state.answered[q.id];
    if (rec) {
      attempts += rec.attempts || 0;
      correct += rec.correct || 0;
      if (rec.correct > 0) correctUnique++;
    }
  });
  const totalUnits = ch.knowledge.length + qsAll.length;
  const doneUnits = learned + correctUnique;
  return {
    learned, totalK: ch.knowledge.length, correctUnique, totalQ: qsAll.length,
    attempts, correct,
    progress: totalUnits ? Math.round((doneUnits / totalUnits) * 100) : 0,
    accuracy: attempts ? Math.round((correct / attempts) * 100) : null,
    explored: ch.anims.filter(id => state.explored.includes(id)).length,
    exampleRead: state.examplesRead.includes(ch.id)
  };
}

function overallStats() {
  let attempts = 0, correct = 0, answered = 0;
  Object.values(state.answered).forEach(r => {
    answered++;
    attempts += r.attempts || 0;
    correct += r.correct || 0;
  });
  return {
    answered, attempts, correct,
    accuracy: attempts ? Math.round((correct / attempts) * 100) : null,
    wrong: state.wrong.length,
    mastered: state.wrong.filter(w => w.status === 'mastered').length,
    learned: state.learned.length,
    explored: state.explored.length
  };
}

function applyAnswerResult(q, correct, chosenText, opts = {}) {
  const rec = state.answered[q.id] || { attempts: 0, correct: 0 };
  rec.attempts = (rec.attempts || 0) + 1;
  if (correct) rec.correct = (rec.correct || 0) + 1;
  rec.lastAt = Date.now();
  state.answered[q.id] = rec;

  const existing = state.wrong.find(w => w.qid === q.id);
  let gain = 0;
  if (correct) {
    state.daily.correct++;
    gain = [10, 15, 20][Math.min(2, levelInfo(state.xp).idx)] || 10;
    if ((rec.correct || 0) === 1) gain += 5;
    if (existing) {
      state.daily.reviewed++;
      existing.correctStreak = (existing.correctStreak || 0) + 1;
      existing.lastAt = Date.now();
      existing.lastChosen = chosenText;
      if (existing.correctStreak >= 2 && existing.status !== 'mastered') {
        existing.status = 'mastered';
        state.masteredCount++;
        gain += 10;
        setTimeout(() => toast('这张错题卡已掌握，太棒了！', '🎉', 3600), 350);
      } else {
        existing.status = 'review';
      }
    }
    addXP(gain, opts.reason || `答对「${q.point}」`);
  } else if (existing) {
    state.daily.reviewed++;
    existing.attempts = (existing.attempts || 0) + 1;
    existing.correctStreak = 0;
    existing.status = 'new';
    existing.lastAt = Date.now();
    existing.lastChosen = chosenText;
  } else {
    state.wrong.push({ qid: q.id, createdAt: Date.now(), lastAt: Date.now(), attempts: 1, correctStreak: 0, status: 'new', lastChosen: chosenText });
    state.wrongCreated++;
  }
  checkBadges();
  saveState();
  return gain;
}

function handleDailyAnswer(idx) {
  if (state.daily.qChecked) return;
  const q = qById(state.daily.qid);
  if (!q) return;
  const correct = isCorrectAnswer(q, idx);
  state.daily.qChecked = true;
  state.daily.qChosen = idx;
  applyAnswerResult(q, correct, q.options[idx], { reason: `每日一题 · ${q.point}` });
  if (correct) {
    playSound('correct');
    burstConfetti(45);
    toast('每日一题答对！继续保持这个手感。', '🌟');
  } else {
    playSound('wrong');
    toast('已收进错题本，晚点回来复习一下就懂了。', '🧩');
  }
  renderHome();
  updateTopStats();
}

function filterCourseRows() {
  let count = 0;
  $$('.course-row').forEach(row => {

function bindKnowledgeTab(ch) {
  const openSet = openCardSets[ch.id];
  $$('[data-khead]', app).forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.khead;
      if (openSet.has(id)) openSet.delete(id); else openSet.add(id);
      const card = btn.closest('.k-card');
      card.classList.toggle('open', openSet.has(id));
      btn.setAttribute('aria-expanded', openSet.has(id));
      if (openSet.has(id) && state.daily.learned < 1) {
        state.daily.learned = 1;
        addActivity('打开知识卡开始学习', 0);
        saveState();
      }
    });
  });
  $$('[data-learn]', app).forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.learn;
      const learned = state.learned.includes(id);
      if (learned) {
        state.learned = state.learned.filter(x => x !== id);
        saveState();
        toast('已取消“读懂”标记，可以再复习一次。', '↩️');
      } else {
        state.learned.push(id);
        state.daily.learned++;
        addXP(5, '读懂一张知识卡');
        playSound('correct');
        toast('读懂一张知识卡，+5 XP。继续！', '📖');
        checkBadges();
      }
      const y = scrollY;
      renderChapter(ch.id, 'knowledge');
      scrollTo(0, y);
      updateTopStats();
    });
  });
  const toggleAll = $('#kToggleAll');
  if (toggleAll) {
    const allOpen = ch.knowledge.every(k => openSet.has(k.id));
    toggleAll.textContent = allOpen ? '收起全部' : '展开全部';
    toggleAll.addEventListener('click', () => {
      if (allOpen) openSet.clear(); else ch.knowledge.forEach(k => openSet.add(k.id));
      const y = scrollY;
      renderChapter(ch.id, 'knowledge');
      scrollTo(0, y);
    });
  }
}

function bindExampleTab(ch) {
  const btn = $('#exampleDone');
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (!state.examplesRead.includes(ch.id)) {
      state.examplesRead.push(ch.id);
      addXP(8, '读完一道例题');
      playSound('correct');
      toast('例题读完，+8 XP。现在去闯关检验一下！', '✏️');
      checkBadges();
      saveState();
    }
    startQuiz({ mode: 'chapter', chapterId: ch.id, count: Math.min(8, chapterQuestions(ch.id).length), title: `第 ${ch.num} 章 · ${ch.title}` });
  });
}

/* ============================================================

let quiz = null;

let practiceChapter = state.lastChapter || 'c1';
let quizKeyAbort = null;

function startQuiz(opts) {
  let qids = opts.qids ? opts.qids.slice() : [];
  if (!qids.length) {
    if (opts.mode === 'chapter') qids = shuffle(chapterQuestions(opts.chapterId).map(q => q.id)).slice(0, opts.count || 8);
    else if (opts.mode === 'wrong') {
      qids = state.wrong.filter(w => w.status !== 'mastered').map(w => w.qid);
      if (!qids.length) {
        toast('暂时没有待复习的错题。先去闯关，错题会自己找上门。', '🪹');
        return;
      }
      qids = shuffle([...new Set(qids)]);
    } else qids = shuffle(QUESTIONS.map(q => q.id)).slice(0, opts.count || 10);
  }
  qids = [...new Set(qids)].filter(id => qById(id));
  if (!qids.length) { toast('没有找到可以练习的题目。', '🧩'); return; }
  practiceResult = null;
  quiz = {
    qids, index: 0, selected: null, checked: false, correct: false,
    hint: false, combo: 0, maxCombo: 0, xpStart: state.xp, xpEarned: 0,
    answers: [], mode: opts.mode || 'random', chapterId: opts.chapterId || '',
    title: opts.title || '随机挑战', count: qids.length, fillValue: ''
  };
  playSound(opts.mode === 'chapter' ? 'mission' : 'click');
  if (location.hash === '#practice') renderPractice();
  else location.hash = '#practice';
}

function renderPractice() {

      <aside class="practice-side">

          <ul>
            <li>先读题，圈出关键词</li>
