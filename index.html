          <div class="progress" style="margin-top:10px"><i style="width:${Math.min(100, state.learned.length / CHAPTERS.reduce((n, c) => n + c.knowledge.length, 0) * 100)}%"></i></div>
        </div>
        <div class="daily-quote"><b>提醒</b>答题时如果连续错两次，先停下来，回到知识卡或动画看看，不丢人。</div>
      </aside>
    </div>
  </div>`;

  $$('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      if (mode === 'random') startQuiz({ mode: 'random', count: 10, title: '随机 10 题挑战' });
      if (mode === 'daily') startQuiz({ mode: 'daily', count: 5, title: '每日 5 题' });
      if (mode === 'wrong') startQuiz({ mode: 'wrong', title: '错题重练' });
      if (mode === 'chapter') {
        $('#startChapterQuiz').scrollIntoView({ behavior: 'smooth', block: 'center' });
        $('#startChapterQuiz').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 420 });
      }
    });
  });
  $$('[data-pick]').forEach(btn => {
    btn.addEventListener('click', () => {
      practiceChapter = btn.dataset.pick;
      renderPractice();
    });
  });
  $('#startChapterQuiz').addEventListener('click', () => {
    const ch = chById(practiceChapter);
    startQuiz({ mode: 'chapter', chapterId: ch.id, count: Math.min(8, chapterQuestions(ch.id).length), title: `第 ${ch.num} 章 · ${ch.title}` });

}

function renderQuiz() {
  const q = qById(quiz.qids[quiz.index]);
  if (!q) { finishQuiz(); return; }
  const ch = chById(q.ch);
  const pct = Math.round((quiz.index / quiz.qids.length) * 100);
  const selected = quiz.selected;
  const optionsHTML = q.type === 'fill'
    ? `<div class="fill-zone">
        <input type="text" id="fillInput" inputmode="text" placeholder="在这里输入答案" value="${esc(quiz.fillValue || '')}" ${quiz.checked ? 'disabled' : ''} autocomplete="off">
        ${quiz.checked ? '' : '<button class="btn btn-primary" id="submitFill">确认答案</button>'}
      </div>`
    : `<div class="quiz-options">${q.options.map((opt, i) => {
      let cls = 'option';
      if (quiz.checked) {
        if (i === q.answer) cls += ' correct';
        else if (i === selected) cls += ' wrong';
        else cls += ' dim';
      } else if (i === selected) cls += ' selected';
      return `<button class="${cls}" data-option="${i}" ${quiz.checked ? 'disabled' : ''}><span class="o-key">${'ABCD'[i]}</span><span>${opt}</span></button>`;
    }).join('')}</div>`;
  const feedback = quiz.checked ? `<div class="feedback ${quiz.correct ? 'good' : 'bad'}" role="status" aria-live="polite">
    <div class="feedback-head"><span class="f-emoji">${quiz.correct ? '🌟' : '🧩'}</span><span class="f-title">${pName()}，${quiz.correct ? '答对啦！' : '差一点点，看看卡在哪一步'}</span><span class="xp-gain">${quiz.correct ? `+${quiz.lastGain || 0} XP` : '已收进错题本'}</span></div>
    <p class="feedback-answer"><b>${quiz.correct ? '答案' : '正确答案'}：</b>${answerText(q)}${q.type === 'fill' && quiz.chosenText ? `　你的答案：${esc(quiz.chosenText)}` : ''}</p>
    ${solutionPathHTML(q)}
    ${knowledgeRecapHTML(q)}
    <div class="feedback-next">
      <button class="btn btn-primary" id="nextQ">${quiz.index + 1 >= quiz.qids.length ? '查看本轮成绩 →' : '下一题 →'}</button>
      ${!quiz.correct ? '<a class="btn btn-ghost" href="#wrong">去错题本看看</a>' : ''}
    </div>
  </div>` : '';
  const hint = quiz.hint && !quiz.checked ? `<div class="hint-box"><b>提示：</b>${q.hint}</div>` : '';

  app.innerHTML = `<div class="page-wrap">
    <div class="quiz-wrap">
      <div class="quiz-top">
        <a class="back-link" href="#practice" id="quitQuiz">← 退出本轮</a>
        <div class="quiz-progress"><div class="progress"><i style="width:${pct}%"></i></div><small>${quiz.index + 1} / ${quiz.qids.length}</small></div>
        ${quiz.combo >= 2 ? `<span class="quiz-combo">🔥 连击 ×${quiz.combo}</span>` : ''}
      </div>
      <div class="quiz-card">
        <div class="quiz-meta">
          <span class="chip coral">第 ${ch.num} 章 · ${ch.title}</span>
          <span class="chip">${q.point}</span>
          <span class="chip ${q.level === 3 ? 'pink' : q.level === 2 ? 'gold' : 'teal'}">${q.level === 3 ? '挑战' : q.level === 2 ? '进阶' : '基础'}</span>
          <span class="chip">${quiz.title}</span>
        </div>
        <div class="quiz-stem">${q.stem}</div>
        ${optionsHTML}
        ${hint}
        <div class="quiz-actions">
          <div class="left">
            ${!quiz.checked ? `<button class="hint-btn" id="hintBtn">💡 ${quiz.hint ? '收起提示' : '给点提示'}</button>` : '<span class="small muted">把解析读一遍，再进入下一题。</span>'}
          </div>
          ${!quiz.checked && q.type !== 'fill' ? `<button class="btn btn-primary" id="submitChoice" ${selected === null ? 'disabled' : ''}>确认答案</button>` : ''}
        </div>
        ${feedback}
      </div>
      <div class="quiz-footnote">键盘：1–4 选择 · Enter 确认 / 下一题 · H 提示</div>
    </div>
  </div>`;

  $$('[data-option]', app).forEach(btn => {
    btn.addEventListener('click', () => {
      if (quiz.checked) return;
      quiz.selected = Number(btn.dataset.option);
      renderQuiz();
    });
  });
  const submitChoice = $('#submitChoice');
  if (submitChoice) submitChoice.addEventListener('click', submitQuizAnswer);
  const submitFill = $('#submitFill');
  if (submitFill) submitFill.addEventListener('click', submitQuizAnswer);
  const fillInput = $('#fillInput');
  if (fillInput) {
    fillInput.addEventListener('input', () => { quiz.fillValue = fillInput.value; });
    fillInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !quiz.checked) { e.preventDefault(); submitQuizAnswer(); } });
  }
  const hintBtn = $('#hintBtn');
  if (hintBtn) hintBtn.addEventListener('click', () => { quiz.hint = !quiz.hint; renderQuiz(); });
  const nextQ = $('#nextQ');
  if (nextQ) nextQ.addEventListener('click', nextQuizQuestion);
  $('#quitQuiz').addEventListener('click', e => {
    e.preventDefault();
    openModal({
      title: '要退出本轮闯关吗？',
      body: '已经答过的题会保留记录，但这轮还没有结算。下次可以从“闯关”重新开始。',
      confirmText: '退出本轮',
      danger: true,
      onConfirm: () => { quiz = null; location.hash = '#practice'; renderPractice(); }
    });
  });
  bindQuizKeyboard();
}

function bindQuizKeyboard() {
  if (quizKeyAbort) quizKeyAbort.abort();
  quizKeyAbort = new AbortController();
  const ac = quizKeyAbort;
  document.addEventListener('keydown', e => {
    if (!quiz || !location.hash.startsWith('#practice')) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (quiz.checked) {
      if (e.key === 'Enter') { e.preventDefault(); nextQuizQuestion(); }
      return;
    }
    if (/^[1-4]$/.test(e.key)) {
      const i = Number(e.key) - 1;
      const q = qById(quiz.qids[quiz.index]);
      if (q.type !== 'fill' && i < q.options.length) { quiz.selected = i; renderQuiz(); }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (quiz.selected !== null) submitQuizAnswer();
    } else if (e.key.toLowerCase() === 'h') {
      quiz.hint = !quiz.hint; renderQuiz();
    }
  }, { signal: ac.signal });
}

function submitQuizAnswer() {
  if (!quiz || quiz.checked) return;
  const q = qById(quiz.qids[quiz.index]);
  let value = quiz.selected;
  if (q.type === 'fill') {
    const input = $('#fillInput');
    value = input ? input.value.trim() : (quiz.fillValue || '').trim();
    if (!value) { toast('先写下你的答案，再确认。', '✏️'); return; }
    quiz.fillValue = value;
  } else if (value === null || value === undefined) {
    toast('先选一个答案，再确认。', '👆');
    return;
  }
  const correct = isCorrectAnswer(q, value);
  const gain = applyAnswerResult(q, correct, q.type === 'fill' ? value : q.options[value], { reason: `${chById(q.ch).title} · ${q.point}` });
  quiz.checked = true;
  quiz.correct = correct;
  quiz.chosenText = q.type === 'fill' ? value : q.options[value];
  quiz.lastGain = gain;
  if (correct) {
    quiz.combo++;
    quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo);
    state.bestCombo = Math.max(state.bestCombo, quiz.combo);
    quiz.xpEarned += gain;
    playSound('correct');
    if (quiz.combo >= 3) burstConfetti(28, innerWidth * 0.5, innerHeight * 0.28);
    if (quiz.combo >= 5) checkBadges();
  } else {
    quiz.combo = 0;
    playSound('wrong');
  }
  quiz.answers.push({ qid: q.id, correct, value: quiz.chosenText });
  saveState();
  updateTopStats();
  renderQuiz();
}

function nextQuizQuestion() {
  if (!quiz) return;
  if (quiz.index + 1 >= quiz.qids.length) { finishQuiz(); return; }
  quiz.index++;
  quiz.selected = null;
  quiz.checked = false;
  quiz.correct = false;
  quiz.hint = false;
  quiz.chosenText = '';
  quiz.fillValue = '';
  renderQuiz();
}

function finishQuiz() {
  if (!quiz) return;
  const total = quiz.qids.length;
  const correct = quiz.answers.filter(a => a.correct).length;
  const accuracy = total ? Math.round((correct / total) * 100) : 0;
  const wrongQids = quiz.answers.filter(a => !a.correct).map(a => a.qid);
  let campaign = null;
  if (quiz.mode === 'chapter' && quiz.chapterId && chById(quiz.chapterId)) {
    const prev = campaignRecord(quiz.chapterId);
    const earnedStars = starsForAccuracy(accuracy);
    const bestStars = Math.max(prev.stars, earnedStars);
    const newMedal = bestStars > prev.stars;
    const newRecord = accuracy > prev.bestAccuracy;
    state.campaign[quiz.chapterId] = {
      bestAccuracy: Math.max(prev.bestAccuracy, accuracy),
      stars: bestStars,
      attempts: (prev.attempts || 0) + 1,
      lastAt: Date.now()
    };
    campaign = {
      chId: quiz.chapterId, earnedStars, bestStars, newMedal, newRecord,
      bestAccuracy: Math.max(prev.bestAccuracy, accuracy),
      medal: medalInfo(bestStars)
    };
    campaignSelected = quiz.chapterId;
  }
  practiceResult = {
    total, correct, accuracy, wrongQids,
    qids: quiz.qids.slice(),
    xpEarned: quiz.xpEarned,
    maxCombo: quiz.maxCombo,
    campaign,
    mode: quiz.mode, chapterId: quiz.chapterId, title: quiz.title
  };
  state.quizHistory.unshift({ ts: Date.now(), total, correct, accuracy, mode: quiz.mode, title: quiz.title });
  state.quizHistory = state.quizHistory.slice(0, 20);
  addActivity(`完成「${quiz.title}」：答对 ${correct}/${total}`, 0);
  if (campaign) addActivity(`战役 M-${String(chById(campaign.chId).num).padStart(2, '0')}：获得 ${campaign.earnedStars} 星`, 0);
  if (quizKeyAbort) { quizKeyAbort.abort(); quizKeyAbort = null; }
  quiz = null;
  checkBadges();
  saveState();
  updateTopStats();
  playSound(accuracy >= 70 ? 'victory' : accuracy >= 50 ? 'mission' : 'click');
  if (accuracy >= 80) burstConfetti(110);
  if (campaign && campaign.newMedal) {
    setTimeout(() => {
      toast(`新战功：<b>${campaign.medal.name}</b>！去战役地图看看你的勋章。`, campaign.medal.icon, 4600);
      playSound('medal');
      burstConfetti(65);
    }, 900);
  }
  renderPracticeResult();
}

function renderPracticeResult() {
  const r = practiceResult;
  if (!r) { renderPractice(); return; }
  const msg = r.accuracy === 100 ? ['满分通关！', '每一道题都想明白了，这就是实力。'] :
    r.accuracy >= 80 ? ['稳稳的，接近满分！', '基础已经很牢，下一步试试把解题步骤讲出来。'] :
    r.accuracy >= 60 ? ['基础在变牢，继续！', '错题不是失败，是下一步该学什么的提示。'] :
    ['别灰心，路线图已经出现。', '先回到知识卡或动画，把卡住的那一个点弄懂，再来一次。'];
  const wrongList = r.wrongQids.map(id => qById(id)).filter(Boolean);
  app.innerHTML = `<div class="page-wrap">
    <div class="result-wrap">
      <div class="result-card">
        ${r.campaign ? '<div class="mission-stamp">MISSION<br>COMPLETE</div>' : ''}
        <div class="result-face"><img src="${avatarSrc()}" alt="${pName()}的头像"><span class="rf-emoji">${r.accuracy >= 80 ? '🏆' : r.accuracy >= 60 ? '🌱' : '🧭'}</span></div>
        <h1>${pName()}，${msg[0]}</h1>
        <p class="result-sub">${msg[1]}</p>
        <div class="result-score">

let wrongFilter = 'all';
let wrongChapterFilter = 'all';

function renderWrong() {
  const all = state.wrong;
  const counts = {
    all: all.length,
    new: all.filter(w => w.status === 'new').length,
    review: all.filter(w => w.status === 'review').length,
    mastered: all.filter(w => w.status === 'mastered').length
  };
  const list = all.filter(w => {
    if (wrongFilter !== 'all' && w.status !== wrongFilter) return false;
    if (wrongChapterFilter !== 'all' && qById(w.qid)?.ch !== wrongChapterFilter) return false;
    return true;
  }).sort((a, b) => (b.lastAt || b.createdAt) - (a.lastAt || a.createdAt));
  const todo = all.filter(w => w.status !== 'mastered').length;

  app.innerHTML = `<div class="page-wrap">
    <div class="wrong-head">
      <div>
        <div class="eyebrow">MISTAKE NOTEBOOK</div>
        <h1>${pName()}的错题藏宝图。</h1>
        <p>错题不是黑历史。每答错一道题，系统就自动生成一张错题卡；连续答对 2 次，它就会变成“已掌握”。</p>
      </div>
      <button class="btn btn-primary" id="reviewAllWrong" ${todo ? '' : 'disabled'}>开始错题重练 →</button>
    </div>

    <div class="wrong-stats">
      <div class="wrong-stat"><span style="font-size:19px">🗂️</span><div><b>${counts.all}</b><span>全部错题</span></div></div>
      <div class="wrong-stat"><span style="font-size:19px">🔴</span><div><b>${counts.new}</b><span>待复习</span></div></div>
      <div class="wrong-stat"><span style="font-size:19px">🟡</span><div><b>${counts.review}</b><span>复习中</span></div></div>
      <div class="wrong-stat"><span style="font-size:19px">🟢</span><div><b>${counts.mastered}</b><span>已掌握</span></div></div>

    <div class="wrong-toolbar">

      <select id="wrongChapterSelect" style="margin-left:auto;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0 9px;font-size:11px;color:var(--ink-soft)">
        <option value="all">全部章节</option>

      </select>
    </div>

    ${list.length ? `<div class="wrong-list">${list.map(w => {
      const q = qById(w.qid);
      if (!q) return '';
      const ch = chById(q.ch);
      return `<article class="wrong-card ${w.status === 'mastered' ? 'mastered' : ''}">
        <div class="wrong-card-head">
          <span class="chip" style="background:${ch.soft};color:${ch.color}">第 ${ch.num} 章 · ${ch.title}</span>
          <span class="chip">${q.point}</span>
          ${wrongBadge(w)}
          <span class="date">${fmtDate(w.lastAt || w.createdAt)}</span>
        </div>
        <div class="wrong-stem">${q.stem}</div>
        <div class="wrong-answers">
          <span class="wa bad">我的答案：${esc(w.lastChosen || '—')}</span>
          <span class="wa good">正确答案：${answerText(q)}</span>
        </div>
        <div class="wrong-exp"><b>解析：</b>${q.explanation}</div>
        ${knowledgeOnlyDetailsHTML(q)}

          <button class="btn btn-sm btn-soft" data-redo="${q.id}">重做这道题</button>
          <button class="btn btn-sm btn-ghost" data-del="${w.qid}">删除卡片</button>
          <span class="review-meta">重做 ${w.attempts || 1} 次 · 连续答对 ${w.correctStreak || 0}/2 ${w.status === 'mastered' ? '· 已掌握 🎉' : ''}</span>
        </div>
      </article>`;
    }).join('')}</div>` : `<div class="empty-state">
      <div class="empty-emoji">${all.length ? '🔍' : '🪹'}</div>
      <h3>${all.length ? '这个筛选下没有错题' : '错题本还是空的'}</h3>
      <p>${all.length ? '换个筛选条件，或者去继续闯关。' : '去闯关练习答几道题吧。答错的题会自动飞到这里，变成你的专属复习清单。'}</p>

      </div>
    </div>

  $$('[data-wstatus]').forEach(b => b.addEventListener('click', () => { wrongFilter = b.dataset.wstatus; renderWrong(); }));
  $('#wrongChapterSelect').addEventListener('change', e => { wrongChapterFilter = e.target.value; renderWrong(); });
  $('#reviewAllWrong').addEventListener('click', () => startQuiz({ mode: 'wrong', title: '错题重练' }));
  $$('[data-redo]').forEach(b => b.addEventListener('click', () => {
    const q = qById(b.dataset.redo);
    startQuiz({ mode: 'review', qids: [b.dataset.redo], title: `错题重做 · ${q.point}` });
  }));
  $$('[data-del]').forEach(b => b.addEventListener('click', () => {
    const q = qById(b.dataset.del);
    openModal({
      title: '删除这张错题卡？',
      body: `「${q.point}」这张卡片会被移出错题本。如果还没真正掌握，建议先重做一次。`,
      confirmText: '删除',
      danger: true,
      onConfirm: () => {
        state.wrong = state.wrong.filter(w => w.qid !== b.dataset.del);
        saveState();
        toast('已删除这张错题卡。', '🗑️');
        renderWrong();
      }
    });
  }));
}

    toast(`名字换好啦，${pName()}，继续探险吧！`, '🪪');
    refreshProfile();
  });
  $('#nicknameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('#saveNickname').click(); }
  });
  $('#changeAvatar').addEventListener('click', () => $('#avatarInput').click());
  $('#resetAvatar').addEventListener('click', () => {
    state.profile.avatar = '';
    saveState();
    updateTopStats();
    toast('已恢复默认头像。', '🖼️');
    refreshProfile();
  });
  $('#avatarInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { toast('请选择一张图片文件。', '🖼️'); return; }
    if (file.size > 10 * 1024 * 1024) { toast('图片太大了，请选择 10MB 以内的照片。', '🖼️'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const size = Math.min(img.width, img.height);
          const canvas = document.createElement('canvas');
          canvas.width = 280;
          canvas.height = 280;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFDF8';
          ctx.fillRect(0, 0, 280, 280);
          ctx.drawImage(img, (img.width - size) / 2, (img.height - size) / 2, size, size, 0, 0, 280, 280);
          state.profile.avatar = canvas.toDataURL('image/jpeg', 0.86);
          saveState();
          updateTopStats();
          toast('新头像换好啦，真帅！', '📸');
          refreshProfile();
        } catch (err) {
          toast('这张图片处理失败，换一张试试。', '🖼️');
        }
      };
      img.onerror = () => toast('图片读取失败，换一张试试。', '🖼️');
      img.src = reader.result;
    };
    reader.onerror = () => toast('图片读取失败，换一张试试。', '🖼️');
    reader.readAsDataURL(file);
    e.target.value = '';
  });
  $('#soundSwitch').addEventListener('click', e => {
    state.settings.sound = !state.settings.sound;
    saveState();
    e.currentTarget.classList.toggle('on', state.settings.sound);
    updateTopStats();
    if (state.settings.sound) playSound('click');
  });
  $('#exportData').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `数学探险岛-学习记录-${todayKey()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('学习数据已导出，可以保存到网盘备份。', '💾');
  });
  $('#importData').addEventListener('click', () => $('#importInput').click());
  $('#importInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || typeof data !== 'object' || !Array.isArray(data.learned) || !data.profile) {
          throw new Error('bad data');
        }
        openModal({
          title: '导入学习数据？',
          body: `这份备份属于「${esc(String(data.profile.nickname || '小探险家'))}」，包含 ${Number(data.xp || 0)} XP。导入后会覆盖当前设备上的学习记录（包括错题本和战役勋章），确定继续吗？`,
          confirmText: '导入并重新加载',
          onConfirm: () => {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
              location.hash = '#achievements';
              location.reload();
            } catch (err) {
              toast('导入失败：浏览器存储空间不足。', '⚠️');
            }
          }
        });
      } catch (err) {
        toast('这个文件不是有效的学习备份，请选择之前导出的 JSON 文件。', '⚠️');
      }
    };
    reader.onerror = () => toast('文件读取失败，请重试。', '⚠️');
    reader.readAsText(file);
    e.target.value = '';
  });
  $('#resetData').addEventListener('click', () => {
    openModal({
      title: '确定要清空全部学习记录吗？',
      body: 'XP、徽章、错题本、学习进度都会被删除，而且无法恢复。建议先导出备份。',
      confirmText: '确认清空',
      danger: true,
      onConfirm: () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* noop */ }
        location.hash = '#home';
        location.reload();
      }
    });
  });
}

      </div>
      <div class="timer-card">
        <div class="timer-ring" id="timerRing" style="--p:0"><div><b id="timerText">25:00</b><small>专注计时</small></div></div>
        <h3>番茄专注</h3>
        <p>只做一件事：弄懂一个知识点。</p>
        <div class="timer-controls">
          <button class="btn btn-sm btn-soft" data-min="15">15</button>
          <button class="btn btn-sm btn-soft active" data-min="25">25</button>
          <button class="btn btn-sm btn-soft" data-min="45">45</button>
          <button class="btn btn-sm btn-primary" id="timerToggle">开始专注</button>
        </div>
        <button class="hint-btn" id="timerReset" style="margin-top:8px">↺ 重置计时</button>
      </div>
    </section>

    <div class="section-title-row"><div><h2>五步自学闭环</h2><p>每一步都有具体动作，不是空口号。</p></div><span class="chip teal">每天约 30 分钟</span></div>
    <div class="steps-flow">
      ${STUDY_STEPS.map(s => `<div class="step-row">
        <span class="step-big">${s.icon}</span>
        <div><h3>${s.title}<small>STEP ${s.n}</small></h3><p>${s.desc}</p><span class="step-action">✎ ${s.action}</span></div>
        <span class="step-time">${s.time}</span>
      </div>`).join('')}
    </div>

    <div class="guide-grid">
      <div class="guide-card">
        <h2>不会时，这样问</h2>
        <p>把“这题怎么做”换成更具体的问题，别人（或 AI）才能帮到你。</p>
        <div class="prompt-list">
          <div class="prompt-item"><b>①</b> 我已经做到哪一步了：______。</div>
          <div class="prompt-item"><b>②</b> 我卡在这里：______，因为我不确定______。</div>
          <div class="prompt-item"><b>③</b> 这个条件让我想到______，但为什么不对？</div>
          <div class="prompt-item"><b>④</b> 能不能只给我一个提示，不要直接给答案？</div>
        </div>
      </div>

      <div class="guide-card">
        <h2>费曼挑战：讲给空气听</h2>
        <p>选一个今天学的概念，用不超过 100 字讲清楚。讲不顺的地方，就是还没懂的地方。</p>
        <div class="feynman-box">
          <h3>今天我要讲清楚：</h3>
          <p>例如“为什么等腰三角形的三线合一？”</p>
          <textarea id="feynmanNote" maxlength="500" placeholder="用你自己的话写下来，不要抄课本……">${esc(state.notes.feynman || '')}</textarea>
          <div class="feynman-foot"><span id="feynmanCount">${(state.notes.feynman || '').length} / 500 字</span><button class="btn btn-sm btn-primary" id="saveNote">保存笔记</button></div>
        </div>
      </div>

      <div class="guide-card">
        <h2>错题归因：找到真正的病根</h2>
        <p>错题不是“粗心”两个字能解释的。看看你属于哪一种：</p>
        <div class="mistake-types">
          <div class="mistake-type"><b>概念不清</b>公式记混、定义理解错。→ 回知识卡，用自己的话复述。</div>
          <div class="mistake-type"><b>思路卡住</b>不知道第一步做什么。→ 看例题的“第一步为什么这样想”。</div>
          <div class="mistake-type"><b>计算失误</b>符号、去括号、移项出错。→ 放慢步骤，写完检查一遍。</div>
          <div class="mistake-type"><b>审题遗漏</b>没看到“整数”“至少”等条件。→ 读题时圈关键词。</div>
        </div>
      </div>

      <div class="guide-card">
        <h2>今日自学清单</h2>
        <p>做完一项勾一项。全部勾完，就可以安心去玩了。</p>
        <div class="checklist">
          ${['读一张知识卡，并说出它解决什么问题', '看一个动画，改变一个条件并观察变化', '做 3 道基础题，不看答案', '把 1 道错题重做一遍', '用一句话总结今天学到的东西'].map((t, i) => `<label class="check-item ${state.notes.checklist[i] ? 'done' : ''}"><input type="checkbox" data-check="${i}" ${state.notes.checklist[i] ? 'checked' : ''}><span>${t}</span></label>`).join('')}
        </div>
        <div class="daily-quote" style="margin-top:14px"><b>最后提醒</b>学不会很正常，重复才是学习的真相。明天再来一次，你会比今天更顺。</div>
      </div>
    </div>
  </div>`;

  /* 番茄钟 */
  let totalSeconds = 25 * 60;
  let remain = totalSeconds;
  let running = false;
  let interval = null;
  let finished = false;
  const ring = $('#timerRing');
  const text = $('#timerText');
  const toggle = $('#timerToggle');
  const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const paint = () => {
    text.textContent = fmtTime(remain);
    ring.style.setProperty('--p', String((1 - remain / totalSeconds) * 100));
  };
  const stop = () => { if (interval) clearInterval(interval); interval = null; running = false; toggle.textContent = '继续专注'; };
  const tick = () => {
    remain--;
    if (remain <= 0) {
      remain = 0; paint(); stop(); finished = true; toggle.textContent = '完成啦';
      addXP(10, '完成一次番茄专注');
      checkBadges();
      playSound('badge'); burstConfetti(70);
      toast('专注完成！+10 XP。站起来活动一下，再继续。', '🍅', 4500);
      return;
    }
    paint();
  };
  toggle.addEventListener('click', () => {
    if (finished) { remain = totalSeconds; finished = false; paint(); toggle.textContent = '开始专注'; return; }
    if (running) { stop(); return; }
    running = true;
    toggle.textContent = '暂停';
    interval = setInterval(tick, 1000);
  });
  $('#timerReset').addEventListener('click', () => {
    if (interval) clearInterval(interval);
    interval = null; running = false; finished = false; remain = totalSeconds; paint(); toggle.textContent = '开始专注';
  });
  $$('[data-min]').forEach(b => b.addEventListener('click', () => {
    if (interval) clearInterval(interval);
    interval = null; running = false; finished = false;
    totalSeconds = Number(b.dataset.min) * 60; remain = totalSeconds;
    $$('[data-min]').forEach(x => x.classList.toggle('active', x === b));
    toggle.textContent = '开始专注';
    paint();
  }));
  paint();
  viewCleanup = () => { if (interval) clearInterval(interval); };

  /* 费曼笔记 */
  const note = $('#feynmanNote');
  const count = $('#feynmanCount');
  note.addEventListener('input', () => {
    count.textContent = `${note.value.length} / 500 字`;
  });
  $('#saveNote').addEventListener('click', () => {
    state.notes.feynman = note.value.trim();
    saveState();
    if (state.notes.feynman.length >= 10) {
      checkBadges();
      toast('笔记已保存。能用自己的话写下来，才是真的理解。', '✏️');
    } else {
      toast('再写长一点点吧，至少写出一句完整的话。', '🌱');
    }
  });

  /* 清单 */
  $$('[data-check]').forEach(cb => {
    cb.addEventListener('change', () => {
      const i = Number(cb.dataset.check);
      state.notes.checklist[i] = cb.checked;
      cb.closest('.check-item').classList.toggle('done', cb.checked);
      saveState();
      if (state.notes.checklist.every(Boolean)) {
        toast('今日清单全部完成，给自己一个赞！', '🌞');
        burstConfetti(35);
      }
    });
  });
}

/* ============================================================
   路由与初始化
   ============================================================ */
const TITLES = {
  home: '数学探险岛 · 鲁教版七年级数学',
  courses: '课程地图 · 数学探险岛',
  campaign: '战役地图 · 数学探险岛',
  lab: '动画实验室 · 数学探险岛',
  practice: '闯关练习 · 数学探险岛',
  wrong: '错题本 · 数学探险岛',
  achievements: '成长成就 · 数学探险岛',
  guide: '自学指南 · 数学探险岛'
};

function router() {
  if (viewCleanup) { try { viewCleanup(); } catch (e) { /* noop */ } viewCleanup = null; }
  window.cleanupLab?.();
  const raw = (location.hash || '#home').slice(1);
  const [path] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const view = parts[0] || 'home';
  setActiveNav(view);
  updateTopStats();
  document.title = TITLES[view] || TITLES.home;
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });

  if (view === 'home') renderHome();
  else if (view === 'courses') renderCourses();
  else if (view === 'campaign') renderCampaign();
  else if (view === 'chapter') renderChapter(parts[1] || 'c1', parts[2] || 'knowledge');
  else if (view === 'lab') renderLab(parts[1] || 'triangle');
  else if (view === 'practice') renderPractice();
  else if (view === 'wrong') renderWrong();
  else if (view === 'achievements') renderAchievements();
  else if (view === 'guide') renderGuide();
  else { location.hash = '#home'; return; }

  // 页面顶部进度与成就状态
  updateTopStats();
  setTimeout(checkBadges, 700);
}

function init() {
  // 移动端底部导航
  const mobile = document.createElement('nav');
  mobile.className = 'mobile-nav';
  mobile.setAttribute('aria-label', '移动端导航');
  mobile.innerHTML = [
    ['home', '⌂', '首页'],
    ['campaign', '⚑', '战役'],
    ['courses', '▤', '课程'],
    ['lab', '⌁', '动画'],
    ['practice', '◎', '闯关'],
    ['wrong', '✎', '错题']
  ].map(([k, i, n]) => `<a href="#${k}" data-nav="${k}"><span class="mn-ico">${i}</span>${n}</a>`).join('');
  document.body.appendChild(mobile);

  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', () => {
    state.settings.sound = !state.settings.sound;
    saveState();
    updateTopStats();
    if (state.settings.sound) playSound('click');
    toast(state.settings.sound ? '音效已开启' : '音效已关闭', state.settings.sound ? '🎵' : '🔇', 1800);
  });

  const topbar = document.getElementById('topbar');
  const onScroll = () => topbar.classList.toggle('scrolled', window.scrollY > 8);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // 处理旧版本/缺失的路由
  if (!location.hash || location.hash === '#') {
    try { history.replaceState(null, '', '#home'); } catch (e) { location.hash = '#home'; }
  }
  router();
  updateTopStats();
  setTimeout(checkBadges, 1200);
}

window.addEventListener('hashchange', router);
init();


</script>
