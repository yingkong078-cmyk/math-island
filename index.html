  width: 104px;
  height: 104px;
  margin: 0 auto 10px;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(from 210deg, #E8A31A, #EF654F, #C86DD7, #E8A31A);
  box-shadow: 0 14px 30px rgba(86, 65, 36, 0.16);
}
.result-face img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid var(--card); background: var(--card); }
.result-face .rf-emoji {
  position: absolute;
  right: -4px;
  bottom: -4px;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold);
  border: 3px solid var(--card);
  font-size: 17px;
}

/* 知识点回顾与解题路径 */
.solution-path {
  margin-top: 14px;
  padding: 13px 14px;
  border-radius: 13px;
  background: var(--paper);
  border: 1px dashed var(--line-strong);
}
.sp-head { margin-bottom: 2px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; color: var(--blue); }
.sp-step { display: flex; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
.sp-step:first-of-type { border-top: 0; padding-top: 7px; }
.sp-step > i {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-family: Georgia, serif;
  font-size: 10px;
  font-style: normal;
  font-weight: 700;
}
.sp-step b { display: block; margin-bottom: 1px; font-size: 9.5px; letter-spacing: 0.06em; color: var(--muted); }
.sp-step span { display: block; font-size: 11.5px; line-height: 1.75; color: var(--ink-soft); }
.knowledge-recap {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #FFFCF5;
  overflow: hidden;
}
.kr-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 13px;
  background: var(--blue-soft);
  border-bottom: 1px solid #D9E4FB;
  color: #274B9E;
  font-size: 10.5px;
  font-weight: 800;
}
.kr-head b { font-size: 10.5px; }
.kr-head .chip { margin-left: auto; background: rgba(255, 255, 255, 0.7); color: #274B9E; font-size: 9px; }
.kr-core { margin: 0; padding: 11px 14px; border-bottom: 1px dashed var(--line); font-size: 11.5px; line-height: 1.8; color: var(--ink-soft); }
.kr-formulas { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; }
.kr-formula { flex: 1 1 140px; padding: 7px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.kr-formula small { display: block; font-size: 8px; color: var(--muted); letter-spacing: 0.06em; }
.kr-formula code { font-family: Georgia, "Times New Roman", serif; font-size: 13px; font-weight: 700; color: var(--ink); }
.kr-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 13px; }
.kr-note { padding: 9px 10px; border-radius: 9px; font-size: 10px; line-height: 1.7; }
.kr-note b { display: block; margin-bottom: 2px; font-size: 8.5px; letter-spacing: 0.06em; }
.kr-note.tip { background: var(--teal-soft); color: #195E54; }
.kr-note.tip b { color: var(--teal); }
.kr-note.warn { background: var(--coral-soft); color: #7D3023; }
.kr-note.warn b { color: var(--coral-deep); }
.knowledge-details {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  overflow: hidden;
}
.knowledge-details summary {
  padding: 10px 12px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  list-style: none;
  user-select: none;
}
.knowledge-details summary::-webkit-details-marker { display: none; }
.knowledge-details summary::before { content: "▸ "; }
.knowledge-details[open] summary::before { content: "▾ "; }
.knowledge-details .solution-path { margin: 0 12px 12px; }
.knowledge-details .knowledge-recap { margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.feedback .knowledge-recap { background: #FFFDF8; }
.feedback .kr-head { background: rgba(76, 125, 255, 0.1); }

/* ---------- 战役模式 · 军事指挥风 ---------- */
.campaign-banner {
  position: relative;
  display: grid;
  grid-template-columns: 56px 1fr 190px auto;
  align-items: center;
  gap: 18px;
  margin-top: 26px;
  padding: 17px 22px;
  border-radius: 20px;
  background:
    radial-gradient(700px 160px at 90% 0%, rgba(217, 75, 54, 0.18), transparent 65%),
    #14201c;
  border: 1px solid #2C3D35;
  color: var(--paper);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.campaign-banner::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(112, 145, 124, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(112, 145, 124, 0.09) 1px, transparent 1px);
  background-size: 26px 26px;
  pointer-events: none;
}
.campaign-banner:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.cb-emblem {
  position: relative;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(145deg, #B53A2A, #7E241A);
  border: 1px solid #E36A55;
  color: #F6D58D;
  font-size: 23px;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2);
}
.cb-main { position: relative; min-width: 0; }
.cb-kicker { display: block; font-size: 8.5px; letter-spacing: .14em; font-weight: 800; color: #D99A86; }
.cb-main h3 { margin: 3px 0 3px; font-size: 17px; letter-spacing: -.02em; }
.cb-main p { margin: 0; font-size: 10.5px; color: rgba(251, 247, 239, .55); }
.cb-main p b { color: #F3C96B; }
.cb-progress-wrap { position: relative; }
.cb-progress { height: 7px; border-radius: 999px; background: rgba(255, 255, 255, .11); overflow: hidden; }
.cb-progress i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #D94B36, #F3C96B); transition: width .6s; }
.cb-progress-text { margin-top: 5px; font-size: 9px; color: rgba(251, 247, 239, .5); }
.cb-progress-text b { color: #F3C96B; }
.cb-go { position: relative; font-size: 11px; font-weight: 800; color: #F3C96B; white-space: nowrap; }

.campaign-page { padding-top: 18px; }
.command-hero {
  position: relative;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 20px 26px;
  padding: 28px 30px;
  border-radius: var(--radius-xl);
  background:
    radial-gradient(700px 260px at 95% 0%, rgba(217, 75, 54, 0.18), transparent 65%),
    linear-gradient(145deg, #16231F, #1C2D26);
  border: 1px solid #31443A;
  color: var(--paper);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.command-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(112, 145, 124, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(112, 145, 124, 0.08) 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
}
.command-id { position: relative; display: flex; align-items: center; gap: 18px; }
.command-avatar { width: 82px; height: 82px; flex: 0 0 auto; padding: 3px; border-radius: 50%; background: conic-gradient(from 210deg, #F3C96B, #D94B36, #8D6E3A, #F3C96B); box-shadow: 0 0 0 1px rgba(243, 201, 107, .25), 0 10px 24px rgba(0,0,0,.25); }
.command-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid #16231F; background: var(--card); }
.command-id h1 { margin: 4px 0 3px; font-size: clamp(26px, 3vw, 36px); letter-spacing: -.035em; }
.command-id p { margin: 0; font-size: 11px; color: rgba(251,247,239,.58); }
.command-hud { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hud-cell { padding: 12px 13px; border-radius: 12px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.08); }
.hud-cell small { display: block; font-size: 8.5px; letter-spacing: .08em; color: rgba(251,247,239,.48); }
.hud-cell b { display: block; margin-top: 2px; font-family: Georgia, serif; font-size: 22px; line-height: 1.2; color: #F3C96B; }
.hud-cell b span { font-size: 11px; color: rgba(251,247,239,.45); }
.command-progress { position: relative; grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
.command-progress .progress { flex: 1; background: rgba(255,255,255,.1); }
.command-progress .progress > i { background: linear-gradient(90deg, #D94B36, #F3C96B); }
.command-progress span { font-size: 9.5px; color: rgba(251,247,239,.5); white-space: nowrap; }

.campaign-layout { display: grid; grid-template-columns: 1.4fr .6fr; gap: 18px; margin-top: 18px; align-items: start; }
.campaign-map-panel { background: #101A17; border: 1px solid #2C3D35; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow-md); }
.map-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 20px 22px 10px; color: var(--paper); }
.map-head .eyebrow { color: #D99A86; }
.map-head h2 { margin: 4px 0 0; font-size: 21px; letter-spacing: -.025em; }
.map-signal { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em; color: #8ED6A6; padding: 5px 8px; border: 1px solid rgba(142,214,166,.25); border-radius: 999px; }
.map-signal i { width: 5px; height: 5px; border-radius: 50%; background: #6FE39A; box-shadow: 0 0 0 4px rgba(111,227,154,.1); animation: livePulse 2s infinite; }
.campaign-volume-tabs { display: flex; gap: 5px; padding: 0 22px 10px; overflow-x: auto; scrollbar-width: none; }
.campaign-volume-tabs::-webkit-scrollbar { display: none; }
.campaign-volume-tabs button { flex: 0 0 auto; padding: 5px 9px; border-radius: 7px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: rgba(251,247,239,.5); font-size: 9px; font-weight: 700; cursor: pointer; }
.campaign-volume-tabs button.active { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.campaign-map-scroll { overflow-x: auto; padding: 0 10px 6px; scrollbar-width: thin; }
.campaign-map-canvas { min-width: 720px; }
.campaign-map-canvas svg { width: 100%; height: auto; display: block; }
.map-watermark { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; fill: rgba(196, 212, 201, .34); }
.map-node-num { font-family: var(--mono); font-size: 14.5px; font-weight: 700; }
.map-node-title { font-family: var(--font); font-size: 12.5px; font-weight: 700; fill: #DCE8DF; }
.map-node-stars { font-family: var(--font); font-size: 10.5px; letter-spacing: .08em; }
.map-mobile-hint { display: none; padding: 0 22px 8px; font-size: 9px; color: rgba(243,201,107,.7); }
.campaign-node { cursor: pointer; outline: none; transition: filter .2s; }
.campaign-node:hover { filter: brightness(1.2) drop-shadow(0 0 7px rgba(243,201,107,.3)); }
.campaign-node:focus-visible { filter: drop-shadow(0 0 8px rgba(243,201,107,.6)); }
.campaign-node.selected { filter: drop-shadow(0 0 10px rgba(243,201,107,.55)); }
.campaign-node.selected .map-node-title { fill: #F3C96B; }
.node-pulse { transform-box: fill-box; transform-origin: center; animation: nodePulse 2.4s ease-in-out infinite; }
@keyframes nodePulse { 0%, 100% { opacity: .25; transform: scale(.92); } 50% { opacity: .7; transform: scale(1.12); } }
.map-legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 22px 16px; font-size: 9px; color: rgba(251,247,239,.45); }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { width: 7px; height: 7px; border-radius: 50%; }
.lg.gold { background: #E8A31A; } .lg.silver { background: #AEBBC8; } .lg.bronze { background: #C98552; } .lg.grey { background: #58675E; }

.campaign-briefing { position: sticky; top: 90px; align-self: start; }
.briefing-card { padding: 22px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.briefing-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mission-code { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--coral-deep); font-weight: 700; }
.briefing-card h2 { margin: 10px 0 3px; font-size: 25px; letter-spacing: -.035em; }
.briefing-tagline { margin: 0 0 14px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }
.briefing-medal { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--medal); }
.briefing-medal-icon { font-size: 27px; }
.briefing-medal small { display: block; font-size: 8.5px; color: var(--muted); letter-spacing: .06em; }
.briefing-medal b { display: block; font-size: 12px; }
.briefing-medal .star-row { margin-left: auto; }
.briefing-record { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.briefing-record > div { padding: 8px 10px; border-radius: 9px; background: var(--paper); border: 1px solid var(--line); }
.briefing-record small { display: block; font-size: 8px; color: var(--muted); }
.briefing-record b { display: block; margin-top: 1px; font-family: Georgia, serif; font-size: 17px; }
.briefing-objectives { margin-top: 13px; }
.briefing-objectives > b { font-size: 10px; letter-spacing: .06em; color: var(--muted); }
.briefing-objectives ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.briefing-objectives li { position: relative; padding-left: 15px; font-size: 10.5px; line-height: 1.6; color: var(--ink-soft); }
.briefing-objectives li::before { content: "▸"; position: absolute; left: 0; color: var(--coral); }
.briefing-actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
.briefing-actions .btn { flex: 1; }
.briefing-note { margin: 11px 0 0; font-size: 9px; color: var(--muted); line-height: 1.6; }
.star-row { display: inline-flex; gap: 1px; font-family: Georgia, serif; font-size: 16px; letter-spacing: 0; color: #E8A31A; line-height: 1; }
.star-empty { color: #D9CCB7; }

.medal-wall { margin-top: 28px; }
.medal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.medal-card { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 13px; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--medal); transition: transform .2s, box-shadow .2s; }
.medal-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.medal-card.locked { opacity: .62; filter: grayscale(.45); }
.medal-ico { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF5D6, var(--medal) 65%); color: #3B2A0A; font-size: 17px; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--medal); }
.medal-main { min-width: 0; }
.medal-main b { display: block; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.medal-main span { display: block; margin-top: 1px; font-size: 8.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.medal-card .star-row { font-size: 13px; }
.command-tip { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; padding: 13px 16px; border-radius: 13px; background: var(--gold-soft); border: 1px dashed #E8CE8A; color: #77540C; font-size: 10.5px; line-height: 1.7; }
.command-tip span { font-size: 18px; line-height: 1.2; }
.command-tip p { margin: 0; }

.mission-report { display: flex; align-items: center; gap: 12px; margin: 0 auto 18px; max-width: 560px; padding: 12px 15px; border-radius: 13px; background: #14201c; border: 1px solid #2C3D35; border-left: 4px solid var(--medal); color: var(--paper); text-align: left; }
.mr-medal { font-size: 28px; }
.mr-main { min-width: 0; }
.mr-kicker { display: block; font-family: var(--mono); font-size: 7.5px; letter-spacing: .08em; color: #D99A86; }
.mr-main b { display: block; margin-top: 2px; font-size: 12px; }
.mr-main small { display: block; margin-top: 1px; font-size: 8.5px; color: rgba(251,247,239,.55); }
.mr-stars { margin-left: auto; text-align: right; }
.mr-stars .star-row { font-size: 16px; }
.mr-stars small { display: block; font-size: 8px; color: rgba(251,247,239,.5); }

/* ---------- 家长学习报告 ---------- */
.report-page { max-width: 1120px; }
.report-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 20px 0 6px; }
.report-top h1 { margin: 9px 0 5px; font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -.04em; }
.report-top p { margin: 0; color: var(--muted); font-size: 12px; }
.report-summary { display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; margin-top: 20px; }
.report-stat { padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.report-stat span { display: block; font-size: 9px; color: var(--muted); letter-spacing: .04em; }
.report-stat b { display: block; margin: 4px 0 2px; font-family: Georgia, serif; font-size: 25px; line-height: 1; letter-spacing: -.02em; }
.report-stat b small { font-family: var(--font); font-size: 9px; color: var(--muted); font-weight: 500; }
.report-stat em { display: block; font-size: 8.5px; color: var(--muted); font-style: normal; line-height: 1.5; }
.report-panel { margin-top: 16px; padding: 20px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.report-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.report-panel-head h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
.report-panel-head p { margin: 3px 0 0; font-size: 10.5px; color: var(--muted); }
.report-chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: clamp(6px, 2vw, 18px); align-items: end; height: 175px; padding: 8px 6px 0; }
.report-day { display: flex; flex-direction: column; align-items: center; height: 100%; }
.report-day b { height: 16px; font-family: var(--mono); font-size: 9px; color: var(--muted); }
.report-bar-track { width: min(38px, 70%); flex: 1; display: flex; align-items: flex-end; background: var(--paper); border-radius: 7px 7px 3px 3px; overflow: hidden; }
.report-bar-track i { width: 100%; min-height: 3px; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--gold), #F0C56B); transition: height .5s; }
.report-day span { margin-top: 5px; font-size: 9px; color: var(--ink-soft); }
.report-day small { font-size: 8px; color: var(--muted); }
.report-columns { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; align-items: start; }
.report-table { display: grid; gap: 7px; }
.report-row { display: grid; grid-template-columns: 112px 1fr 38px; gap: 9px; align-items: center; font-size: 10px; }
.report-row .rr-name { color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-progress small { display: block; margin-top: 2px; font-size: 8px; color: var(--muted); }
.report-row > b { text-align: right; font-family: var(--mono); font-size: 10px; font-weight: 700; }
.report-row > b.low { color: var(--coral-deep); }
.report-focus-list { display: grid; gap: 8px; }
.report-focus { display: flex; align-items: center; gap: 9px; padding: 10px 11px; border-radius: 10px; background: var(--paper); }
.report-focus > div { flex: 1; min-width: 0; }
.report-focus b { display: block; font-size: 10.5px; }
.report-focus span { display: block; margin-top: 2px; font-size: 8.5px; color: var(--muted); }
.report-focus .text-link { font-size: 9px; white-space: nowrap; }
.rf-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.report-good { margin-top: 6px; padding: 9px 11px; border-radius: 9px; background: var(--teal-soft); color: #195E54; font-size: 10px; line-height: 1.7; }
.report-advice ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink-soft); font-size: 11.5px; line-height: 1.8; }
.report-note { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 9px; color: var(--muted); line-height: 1.7; }

@media print {
  body { background: #fff !important; color: #111 !important; }
  .page-atmosphere, .topbar, .site-footer, .mobile-nav, .toast-wrap, .report-top .btn-row { display: none !important; }
  .page-wrap { max-width: none; padding: 0; }
  .report-page { padding: 0; }
  .report-panel, .report-stat { box-shadow: none; break-inside: avoid; border-color: #ddd; }
  .report-summary { grid-template-columns: repeat(3, 1fr); }
  .report-columns { grid-template-columns: 1fr; }
  .report-top h1 { font-size: 28px; }
  .report-panel { margin-top: 12px; }
}

/* ---------- 云同步设置 ---------- */
.sync-layout { display: grid; grid-template-columns: 1.25fr .75fr; gap: 18px; margin-top: 24px; align-items: start; }
.sync-panel { padding: 24px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.sync-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.sync-head h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
.sync-head p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
.sync-status { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; background: var(--paper-deep); color: var(--muted); font-size: 9.5px; font-weight: 700; white-space: nowrap; }
.sync-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sync-status.online { background: var(--teal-soft); color: var(--teal); }
.sync-status.connecting { background: var(--gold-soft); color: #8A5E07; }
.sync-status.error { background: var(--coral-soft); color: var(--coral-deep); }
.sync-label { display: block; margin: 13px 0 5px; font-size: 9.5px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.sync-code-row { display: flex; gap: 8px; }
.sync-code-row input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--paper); font-family: var(--mono); font-size: 12px; outline: none; }
#syncConfig { width: 100%; min-height: 150px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--paper); font-family: var(--mono); font-size: 10px; line-height: 1.6; outline: none; }
#syncConfig:focus, .sync-code-row input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(34,33,29,.06); }
.sync-hint { margin: 5px 0 0; font-size: 9px; color: var(--muted); line-height: 1.6; }
.sync-security { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--teal-soft); color: #195E54; font-size: 9.5px; line-height: 1.7; }
.sync-steps { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.sync-steps summary { cursor: pointer; font-size: 10px; font-weight: 800; color: var(--blue); }
.sync-steps ol { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 10px; line-height: 1.7; color: var(--ink-soft); }
.sync-steps a { color: var(--blue); text-decoration: underline; }
.sync-steps pre { margin: 10px 0 0; padding: 11px; border-radius: 9px; background: #14201c; color: #BFE9DD; font-family: var(--mono); font-size: 9px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; }
.sync-steps p { margin: 8px 0 0; font-size: 9px; color: var(--muted); line-height: 1.7; }
.sync-guide { padding: 24px; border-radius: 20px; background: #14201c; color: var(--paper); border: 1px solid #2C3D35; box-shadow: var(--shadow-md); position: sticky; top: 92px; }
.sync-guide h2 { margin: 0 0 14px; font-size: 19px; letter-spacing: -.03em; }
.sync-guide ol { margin: 0; padding-left: 18px; display: grid; gap: 11px; color: rgba(251,247,239,.65); font-size: 10.5px; line-height: 1.75; }
.sync-guide li b { color: var(--gold); display: block; margin-bottom: 1px; }
.sync-guide .text-link { display: inline-block; margin-top: 16px; color: var(--gold); border-color: rgba(243,201,107,.4); font-size: 10px; }
.sync-note { margin-top: 15px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,.13); color: rgba(251,247,239,.4); font-size: 9px; line-height: 1.7; }
.sync-note code { color: rgba(243,201,107,.75); }
@media (max-width: 900px) {
  .sync-layout { grid-template-columns: 1fr; }
  .sync-guide { position: static; }
}

/* ---------- 家长密码锁 ---------- */
.parent-lock-panel { display: flex; align-items: center; gap: 14px; max-width: 760px; flex-wrap: wrap; }
.parent-lock-icon { width: 46px; height: 46px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 13px; background: var(--gold-soft); font-size: 23px; }
.parent-lock-copy { flex: 1; min-width: 190px; }
.parent-lock-copy b { display: block; font-size: 13px; }
.parent-lock-copy span { display: block; margin-top: 2px; font-size: 9.5px; color: var(--muted); line-height: 1.6; }
.parent-lock-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pin-modal { max-width: 430px; text-align: center; }
.pin-modal h3 { margin: 4px 0 6px; }
.pin-modal p { font-size: 11px; line-height: 1.75; color: var(--muted); }
.pin-icon { font-size: 34px; line-height: 1; margin-bottom: 4px; }
.pin-icon.big { font-size: 54px; }
.pin-input { width: 100%; margin-top: 9px; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--paper); font-family: var(--mono); font-size: 15px; text-align: center; letter-spacing: .18em; outline: none; }
.pin-input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(34,33,29,.06); }
.pin-error { min-height: 15px; margin-top: 5px; color: var(--coral-deep); font-size: 9.5px; }
.pin-link { display: inline-block; margin-top: 10px; border: 0; background: none; color: var(--blue); font-size: 9.5px; text-decoration: underline; cursor: pointer; }
.pin-note { margin-top: 10px !important; font-size: 8.5px !important; color: var(--muted); line-height: 1.7 !important; }
.recovery-code { margin: 12px 0 2px; padding: 15px 10px; border-radius: 11px; background: #14201c; color: var(--gold); font-family: var(--mono); font-size: clamp(18px, 5vw, 25px); font-weight: 800; letter-spacing: .12em; }
.parent-gate { display: grid; place-items: center; min-height: 66vh; }
.parent-gate-card { width: min(560px, 100%); padding: 34px 28px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-md); text-align: center; }
.parent-gate-card h1 { margin: 9px 0 8px; font-size: 29px; letter-spacing: -.03em; }
.parent-gate-card p { max-width: 390px; margin: 0 auto 18px; color: var(--muted); font-size: 11.5px; line-height: 1.8; }
.parent-gate-card .eyebrow { justify-content: center; }
.parent-gate-card .pin-note { margin-top: 16px !important; }
@media (max-width: 520px) {
  .parent-lock-panel { align-items: flex-start; }
  .parent-lock-actions { width: 100%; }
  .parent-lock-actions .btn { flex: 1 1 auto; }
  .parent-gate-card { padding: 26px 18px; }
}

/* ---------- 作业岛 ---------- */
.homework-banner { display: flex; align-items: center; gap: 13px; margin-top: 18px; padding: 15px 18px; border-radius: 16px; background: #14201c; color: var(--paper); border: 1px solid #2C3D35; box-shadow: var(--shadow-sm); transition: transform .18s, box-shadow .18s; }
.homework-banner:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.hb-icon { width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 12px; background: rgba(243,201,107,.14); font-size: 21px; }
.homework-banner div { flex: 1; min-width: 0; }
.homework-banner b { display: block; font-size: 13px; }
.homework-banner span { display: block; margin-top: 2px; font-size: 9.5px; color: rgba(251,247,239,.55); }
.homework-banner .hb-go { flex: 0 0 auto; color: var(--gold); font-size: 10px; font-weight: 800; }
.homework-layout { display: grid; grid-template-columns: 1.3fr .7fr; gap: 16px; margin-top: 22px; align-items: start; }
.homework-panel, .homework-side { min-width: 0; }
.homework-panel { padding: 22px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.homework-panel-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.homework-panel-head h2 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
.homework-panel-head p { margin: 4px 0 0; font-size: 10px; color: var(--muted); }
.homework-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.homework-form label, .homework-chapter-row label, .homework-note-label { display: block; font-size: 8.5px; font-weight: 800; letter-spacing: .06em; color: var(--muted); }
.homework-form input, .homework-form select, .homework-chapter-row select, #hwNote { width: 100%; margin-top: 5px; min-height: 40px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--paper); color: var(--ink); font-size: 11px; outline: none; }
.homework-form select, .homework-chapter-row select { cursor: pointer; }
.homework-form input:focus, .homework-form select:focus, .homework-chapter-row select:focus, #hwNote:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(34,33,29,.05); }
.homework-map-preview { display: flex; gap: 9px; align-items: center; margin-top: 13px; padding: 10px 12px; border-radius: 10px; background: var(--gold-soft); border: 1px dashed #E8CE8A; }
.hw-preview-icon { font-size: 18px; }
.homework-map-preview b { display: block; font-size: 10.5px; color: #77540C; }
.homework-map-preview span { display: block; margin-top: 1px; font-size: 8.5px; color: #8B6A2A; }
.homework-chapter-row { margin-top: 12px; }
.homework-note { margin-top: 12px; font-size: 8.5px; color: var(--muted); line-height: 1.7; }
.homework-stat-card { padding: 15px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 9px; }
.homework-stat-card > span { font-size: 9px; color: var(--muted); }
.homework-stat-card b { display: block; margin: 3px 0; font-family: Georgia, serif; font-size: 26px; line-height: 1; }
.homework-stat-card b small { font-family: var(--font); font-size: 9px; color: var(--muted); }
.homework-stat-card em { font-style: normal; font-size: 8.5px; color: var(--muted); }
.homework-recent h3 { margin: 5px 0 10px; font-size: 16px; }
.homework-recent .text-link { display: inline-block; margin-top: 9px; font-size: 9px; }
.homework-log-row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); }
.homework-log-row b { display: block; font-size: 9.5px; }
.homework-log-row span { display: block; margin-top: 1px; color: var(--muted); font-size: 8px; }

  <script>
/* ============================================================
   数学探险岛 · 动画实验室
   全部使用原生 SVG / Canvas / DOM，无外部依赖
   ============================================================ */

const SVGNS = 'http://www.w3.org/2000/svg';
const PI = Math.PI;
const TAU = Math.PI * 2;
const D2R = Math.PI / 180;

function svgEl(tag, attrs = {}, parent) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  if (parent) parent.appendChild(node);
  return node;
}

function svgText(parent, x, y, str, cls = 'svg-label', attrs = {}) {
  const t = svgEl('text', { x, y, class: cls, 'text-anchor': 'middle', ...attrs }, parent);
  t.textContent = str;
  return t;
}

function clearNode(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function fmt(v, d = 0) {
  let s = Number(v).toFixed(d);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s === '-0' ? '0' : s;
}
function angleOf(v, p) { return Math.atan2(p.y - v.y, p.x - v.x); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function norm(v) {
  const l = Math.hypot(v.x, v.y) || 1;
  return { x: v.x / l, y: v.y / l };
}
function toSvgPoint(svg, evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function setAttrs(node, attrs) {
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
}
function readoutHTML(items) {
  return items.map(it => `<div class="readout${it.accent ? ' accent' : ''}"><small>${it.label}</small><b id="${it.id}">${it.value ?? '—'}</b></div>`).join('');
}
function setRO(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}
function tagLabel(parent, x, y, text, color = '#45423A', anchor = 'start') {
  const w = Math.max(34, text.length * 6.4 + 12);
  const bx = anchor === 'end' ? x - w : x;
  svgEl('rect', {
    x: bx, y: y - 12, width: w, height: 18, rx: 6,
    fill: '#FFFDF8', stroke: '#E7DDCC', 'stroke-width': 0.8, opacity: 0.95
  }, parent);
  return svgText(parent, bx + 6, y + 1, text, 'svg-small', { 'text-anchor': 'start', fill: color });
}

/* ============================================================
   1. 三角形内角和
   ============================================================ */
function mountTriangle(canvas, controls, readouts) {
  const ac = new AbortController();
  let pts = [{ x: 340, y: 58 }, { x: 120, y: 310 }, { x: 548, y: 310 }];
  let active = -1;
  let showWedges = true;
  const svg = svgEl('svg', { viewBox: '0 0 680 500', role: 'img', 'aria-label': '可拖动的三角形内角和演示' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <button class="btn btn-sm btn-soft" id="triRandom">🎲 随机变形</button>
      <button class="btn btn-sm btn-ghost" id="triWedge">◐ 显示拼角</button>
      <span class="small muted">拖动 A、B、C 三个顶点</span>
    </div>
    <div class="lab-note"><b>试一试：</b>把三角形拉成很扁、很尖的样子，三个内角的和会变吗？</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'triA', label: '∠A', accent: true },
    { id: 'triB', label: '∠B' },
    { id: 'triC', label: '∠C' },
    { id: 'triSum', label: '三个角的和', value: '180°' }
  ]);

  const colors = ['#EF654F', '#4C7DFF', '#178F80'];
  const letters = ['A', 'B', 'C'];

  function angleAt(i) {
    const v = pts[i], p1 = pts[(i + 1) % 3], p2 = pts[(i + 2) % 3];
    const u1 = norm({ x: p1.x - v.x, y: p1.y - v.y });
    const u2 = norm({ x: p2.x - v.x, y: p2.y - v.y });
    const dot = clamp(u1.x * u2.x + u1.y * u2.y, -1, 1);
    return { ang: Math.acos(dot) / D2R, u1, u2, v };
  }
  function sectorPath(v, u1, u2, r) {
    let a1 = Math.atan2(u1.y, u1.x);
    let a2 = Math.atan2(u2.y, u2.x);
    let d = a2 - a1;
    while (d > PI) d -= TAU;
    while (d < -PI) d += TAU;
    const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
    const e = { x: v.x + r * Math.cos(a1 + d), y: v.y + r * Math.sin(a1 + d) };
    return {
      path: `M ${v.x} ${v.y} L ${s.x} ${s.y} A ${r} ${r} 0 0 ${d > 0 ? 1 : 0} ${e.x} ${e.y} Z`,
      mid: a1 + d / 2
    };
  }
  function draw() {
    clearNode(svg);
    const defs = svgEl('defs', {}, svg);
    const pat = svgEl('pattern', { id: 'triGrid', width: 28, height: 28, patternUnits: 'userSpaceOnUse' }, defs);
    svgEl('path', { d: 'M 28 0 L 0 0 0 28', fill: 'none', stroke: '#E8DFCE', 'stroke-width': 1 }, pat);
    svgEl('rect', { x: 0, y: 0, width: 680, height: 500, fill: 'url(#triGrid)', opacity: 0.6 }, svg);

    const poly = pts.map(p => `${p.x},${p.y}`).join(' ');
    svgEl('polygon', { points: poly, fill: '#FFF0EB', stroke: '#E85D4A', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, svg);

    // 顶点与角
    pts.forEach((p, i) => {
      const a = angleAt(i);
      const sec = sectorPath(p, a.u1, a.u2, 34);
      svgEl('path', { d: sec.path, fill: colors[i], opacity: 0.16 }, svg);
      svgEl('path', { d: sec.path, fill: 'none', stroke: colors[i], 'stroke-width': 1.6, opacity: 0.75 }, svg);
      const lx = p.x + Math.cos(sec.mid) * 54;
      const ly = p.y + Math.sin(sec.mid) * 54;
      svgText(svg, lx, ly + 4, `${fmt(a.ang)}°`, 'svg-label', { fill: colors[i], 'font-size': 12.5 });
      svgEl('circle', { cx: p.x, cy: p.y, r: 13, class: 'draggable', fill: colors[i], stroke: '#FFFDF8', 'stroke-width': 4, 'data-v': i }, svg);
      svgText(svg, p.x, p.y + 4, letters[i], 'svg-label', { fill: '#FFFDF8', 'font-size': 10, 'pointer-events': 'none' }, svg);
    });

    // 底部拼角
    if (showWedges) {
      const baseY = 428, cx = 340, r = 58;
      svgEl('line', { x1: cx - 120, y1: baseY, x2: cx + 120, y2: baseY, stroke: '#CFC0A9', 'stroke-width': 1.4, 'stroke-dasharray': '6 5' }, svg);
      let start = PI;
      const angles = [angleAt(0).ang, angleAt(1).ang, angleAt(2).ang];
      angles.forEach((a, i) => {
        const sweep = a * D2R;
        const end = start - sweep;
        const s = { x: cx + r * Math.cos(start), y: baseY + r * Math.sin(start) };
        const e = { x: cx + r * Math.cos(end), y: baseY + r * Math.sin(end) };
        const d = `M ${cx} ${baseY} L ${s.x} ${s.y} A ${r} ${r} 0 0 0 ${e.x} ${e.y} Z`;
        svgEl('path', { d, fill: colors[i], opacity: 0.78, stroke: '#FFFDF8', 'stroke-width': 1.2 }, svg);
        start = end;
      });
      svgEl('line', { x1: cx - 70, y1: baseY + 18, x2: cx + 70, y2: baseY + 18, stroke: '#B7AB98', 'stroke-width': 1.2 }, svg);
      svgText(svg, cx, baseY + 38, '三个角拼成一个平角 = 180°', 'svg-small', { fill: '#6E6556', 'font-size': 10.5 });
    }

    const angles = [angleAt(0).ang, angleAt(1).ang, angleAt(2).ang];
    setRO('triA', `${fmt(angles[0])}°`);
    setRO('triB', `${fmt(angles[1])}°`);
    setRO('triC', `${fmt(angles[2])}°`);
    setRO('triSum', `${fmt(angles.reduce((a, b) => a + b, 0))}°`);
  }

  function valid(p, idx) {
    if (p.x < 55 || p.x > 625 || p.y < 40 || p.y > 360) return false;
    const test = pts.map((q, i) => i === idx ? p : q);
    const area = Math.abs((test[1].x - test[0].x) * (test[2].y - test[0].y) - (test[2].x - test[0].x) * (test[1].y - test[0].y));
    return area > 9000;
  }

  svg.addEventListener('pointerdown', e => {
    const target = e.target.closest('[data-v]');
    if (!target) return;
    active = Number(target.dataset.v);
    svg.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  }, { signal: ac.signal });
  svg.addEventListener('pointermove', e => {
    if (active < 0) return;
    const p = toSvgPoint(svg, e);
    if (valid(p, active)) {
      pts[active] = { x: clamp(p.x, 55, 625), y: clamp(p.y, 40, 360) };
      draw();
    }
  }, { signal: ac.signal });
  svg.addEventListener('pointerup', () => { active = -1; }, { signal: ac.signal });
  svg.addEventListener('pointercancel', () => { active = -1; }, { signal: ac.signal });

  controls.querySelector('#triRandom').addEventListener('click', () => {
    pts = [
      { x: 250 + Math.random() * 180, y: 45 + Math.random() * 80 },
      { x: 85 + Math.random() * 130, y: 285 + Math.random() * 65 },
      { x: 460 + Math.random() * 120, y: 285 + Math.random() * 65 }
    ];
    if (!valid(pts[0], 0)) pts[0].y = 80;
    draw();
  }, { signal: ac.signal });
  controls.querySelector('#triWedge').addEventListener('click', e => {
    showWedges = !showWedges;
    e.currentTarget.textContent = showWedges ? '◐ 隐藏拼角' : '◐ 显示拼角';
    draw();
  }, { signal: ac.signal });

  draw();
  return () => ac.abort();
}

/* ============================================================
   2. 全等变换
   ============================================================ */
function mountCongruence(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 420', role: 'img', 'aria-label': '全等三角形的平移旋转翻折演示' });

  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">变换方式</span>
      <button class="btn btn-sm btn-soft" data-t="slide">➡ 平移</button>
      <button class="btn btn-sm btn-soft" data-t="rotate">↻ 旋转</button>
      <button class="btn btn-sm btn-soft" data-t="flip">⇋ 翻折</button>
      <button class="btn btn-sm btn-ghost" data-t="reset">↺ 复位</button>
    </div>
    <div class="lab-note"><b>观察：</b>不管怎么移动，图形的形状和大小都没有变，所以变换前后一定全等。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'conMode', label: '当前变换', value: '原图' },
    { id: 'conShape', label: '形状', value: '不变' },
    { id: 'conSize', label: '大小', value: '不变' },
    { id: 'conResult', label: '结论', value: '全等', accent: true }
  ]);

  const base = [{ x: 135, y: 270 }, { x: 300, y: 270 }, { x: 205, y: 145 }];
  let current = base.map(p => ({ ...p }));
  let mode = 'reset';
  let raf = 0;
  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'conDots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
  svgEl('circle', { cx: 1, cy: 1, r: 1, fill: '#DED3C1' }, pat);
  svgEl('rect', { width: 680, height: 420, fill: 'url(#conDots)', opacity: 0.7 }, svg);

  const mirror = svgEl('line', { x1: 340, y1: 30, x2: 340, y2: 390, class: 'dash-line', opacity: 0 }, svg);
  svgText(svg, 340, 24, '镜子', 'svg-small', { opacity: 0, id: 'mirrorLabel' });
  const ghost = svgEl('polygon', { points: base.map(p => `${p.x},${p.y}`).join(' '), fill: 'none', stroke: '#C9BBA4', 'stroke-width': 1.6, 'stroke-dasharray': '6 5' }, svg);
  const poly = svgEl('polygon', { fill: '#E85D4A', 'fill-opacity': 0.14, stroke: '#E85D4A', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, svg);
  const labels = [0, 1, 2].map(i => svgText(svg, 0, 0, ['A′', 'B′', 'C′'][i], 'svg-label', { fill: '#E85D4A', 'font-size': 12 }));
  const dots = [0, 1, 2].map(() => svgEl('circle', { r: 4.5, fill: '#E85D4A' }, svg));
  const origLabels = ['A', 'B', 'C'].map((s, i) => svgText(svg, base[i].x, base[i].y - 16, s, 'svg-label', { fill: '#6E6556', 'font-size': 13 }));

  svgText(svg, 210, 310, '原图', 'svg-small', { fill: '#A99A84' });
  const targetNote = svgText(svg, 520, 390, '变换后的全等图形', 'svg-small', { fill: '#C99A8E', opacity: 0 });

  function targetFor(kind) {
    const cx = 210, cy = 215;
    if (kind === 'slide') return base.map(p => ({ x: p.x + 300, y: p.y + 10 }));
    if (kind === 'rotate') {
      const a = 58 * D2R;
      return base.map(p => {
        const dx = p.x - cx, dy = p.y - cy;
        return { x: cx + dx * Math.cos(a) - dy * Math.sin(a) + 300, y: cy + dx * Math.sin(a) + dy * Math.cos(a) + 0 };
      });
    }
    if (kind === 'flip') return base.map(p => ({ x: 680 - p.x, y: p.y + 10 }));
    return base.map(p => ({ ...p }));
  }

  function render() {
    poly.setAttribute('points', current.map(p => `${p.x},${p.y}`).join(' '));
    current.forEach((p, i) => {
      labels[i].setAttribute('x', p.x);
      labels[i].setAttribute('y', p.y - 14);
      labels[i].setAttribute('opacity', mode === 'reset' ? 0 : 1);
      dots[i].setAttribute('cx', p.x);
      dots[i].setAttribute('cy', p.y);
    });
    targetNote.setAttribute('opacity', mode === 'reset' ? 0 : 1);
  }

  function animateTo(kind) {
    cancelAnimationFrame(raf);
    const from = current.map(p => ({ ...p }));
    const to = targetFor(kind);
    const t0 = performance.now();
    mode = kind;
    const names = { slide: '平移', rotate: '旋转', flip: '翻折', reset: '原图' };
    setRO('conMode', names[kind]);
    setRO('conResult', kind === 'reset' ? '原图' : '全等');
    mirror.setAttribute('opacity', kind === 'flip' ? 0.9 : 0);
    svg.querySelector('#mirrorLabel')?.setAttribute('opacity', kind === 'flip' ? 1 : 0);
    function step(now) {
      const t = clamp((now - t0) / 720, 0, 1);
      const e = 1 - Math.pow(1 - t, 3);
      current = from.map((p, i) => ({ x: p.x + (to[i].x - p.x) * e, y: p.y + (to[i].y - p.y) * e }));
      render();
      if (t < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  controls.addEventListener('click', e => {
    const btn = e.target.closest('[data-t]');
    if (btn) animateTo(btn.dataset.t);
  }, { signal: ac.signal });

  render();
  return () => { ac.abort(); cancelAnimationFrame(raf); };
}

  const wingL = svgEl('g', {}, svg);

  const innerPathD = 'M0,-2 C-24,-44 -66,-52 -83,-24 C-94,-5 -76,22 -45,27 C-24,30 -9,16 0,4 Z';
  const wl = svgEl('path', { d: wingPathD, fill: '#C86DD7', opacity: 0.55, stroke: '#A64CB5', 'stroke-width': 1.5 }, wingL);
  const wl2 = svgEl('path', { d: innerPathD, fill: '#EABFF2', opacity: 0.8 }, wingL);
  const wr = svgEl('path', { d: wingPathD, fill: '#C86DD7', opacity: 0.55, stroke: '#A64CB5', 'stroke-width': 1.5 }, wingR);
  const wr2 = svgEl('path', { d: innerPathD, fill: '#EABFF2', opacity: 0.8 }, wingR);
  svgEl('ellipse', { cx: 0, cy: 8, rx: 8, ry: 42, fill: '#7C4A87' }, body);

  svgEl('path', { d: 'M-6,-44 C-16,-58 -24,-58 -28,-54 M6,-44 C16,-58 24,-58 28,-54', fill: 'none', stroke: '#7C4A87', 'stroke-width': 2, 'stroke-linecap': 'round' }, body);
  svgEl('circle', { cx: -3, cy: -38, r: 1.5, fill: '#F8E8FB' }, body);
  svgEl('circle', { cx: 3, cy: -38, r: 1.5, fill: '#F8E8FB' }, body);

  const ppLine = svgEl('line', { stroke: '#178F80', 'stroke-width': 1.8, 'stroke-dasharray': '5 4' }, svg);
  const pLineA = svgEl('line', { stroke: '#E39A1C', 'stroke-width': 1.4, 'stroke-dasharray': '4 4' }, svg);
  const pLineB = svgEl('line', { stroke: '#E39A1C', 'stroke-width': 1.4, 'stroke-dasharray': '4 4' }, svg);
  const pDot = svgEl('circle', { r: 7, fill: '#178F80', stroke: '#FFFDF8', 'stroke-width': 3 }, svg);
  const ppDot = svgEl('circle', { r: 7, fill: '#EF654F', stroke: '#FFFDF8', 'stroke-width': 3 }, svg);

  const ppLab = svgText(svg, 0, 0, 'P′', 'svg-label', { fill: '#B23B28' });
  const foldLine = svgEl('line', { stroke: '#8B63D9', 'stroke-width': 2, 'stroke-dasharray': '3 3', opacity: 0 }, svg);
  let foldT = 0;
  let foldRaf = 0;

  function applyFold() {
    const sx = -1 + 2 * foldT;
    wingR.setAttribute('transform', `translate(${axis} 215) scale(${sx} 1)`);
    wingR.setAttribute('opacity', 1 - 0.65 * foldT);
    foldLine.setAttribute('opacity', foldT * 0.8);
    const px = axis - 96, ppx = 2 * axis - px;
    const cx = ppx + (px - ppx) * foldT;
    ppDot.setAttribute('cx', cx);
    ppLab.setAttribute('x', cx);
    ppLab.setAttribute('opacity', 1 - foldT * 0.6);
    pLineB.setAttribute('x2', cx);
    ppLine.setAttribute('x2', cx);
  }

  function draw() {
    axisLine.setAttribute('x1', axis);
    axisLine.setAttribute('x2', axis);
    axisLabel.setAttribute('x', axis);
    axisLabel.textContent = `x = ${axis}`;
    setRO('symAxisVal', String(axis));
    wingL.setAttribute('transform', `translate(${axis} 215)`);
    body.setAttribute('transform', `translate(${axis} 215)`);
    const py = 155;
    const px = axis - 96;
    const ppx = 2 * axis - px;
    pDot.setAttribute('cx', px); pDot.setAttribute('cy', py);
    ppDot.setAttribute('cx', ppx); ppDot.setAttribute('cy', py);
    pLab.setAttribute('x', px); pLab.setAttribute('y', py - 14);
    ppLab.setAttribute('x', ppx); ppLab.setAttribute('y', py - 14);
    ppLine.setAttribute('x1', px); ppLine.setAttribute('y1', py);
    ppLine.setAttribute('x2', ppx); ppLine.setAttribute('y2', py);
    pLineA.setAttribute('x1', px); pLineA.setAttribute('y1', py);
    pLineA.setAttribute('x2', axis); pLineA.setAttribute('y2', py);
    pLineB.setAttribute('x1', axis); pLineB.setAttribute('y1', py);
    pLineB.setAttribute('x2', ppx); pLineB.setAttribute('y2', py);
    const d = axis - px;
    setRO('symP', `${d} px`);
    setRO('symPp', `${ppx - axis} px`);
    foldLine.setAttribute('x1', axis); foldLine.setAttribute('x2', axis);
    foldLine.setAttribute('y1', 70); foldLine.setAttribute('y2', 360);
    applyFold();
  }

  controls.querySelector('#symAxis').addEventListener('input', e => {
    axis = Number(e.target.value);
    controls.querySelector('#symAxisOut').textContent = axis;
    folded = false;
    foldT = 0;
    cancelAnimationFrame(foldRaf);
    controls.querySelector('#symFold').textContent = '◫ 对折检验';
    draw();
  }, { signal: ac.signal });
  controls.querySelector('#symFold').addEventListener('click', e => {
    folded = !folded;
    cancelAnimationFrame(foldRaf);
    const from = foldT, to = folded ? 1 : 0;
    const t0 = performance.now();
    e.currentTarget.textContent = folded ? '◫ 展开图形' : '◫ 对折检验';
    function step(now) {
      const t = clamp((now - t0) / 650, 0, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      foldT = from + (to - from) * ease;
      applyFold();
      if (t < 1) foldRaf = requestAnimationFrame(step);
    }
    foldRaf = requestAnimationFrame(step);
  }, { signal: ac.signal });
  controls.querySelector('#symReset').addEventListener('click', () => {
    axis = 340; folded = false; foldT = 0;
    cancelAnimationFrame(foldRaf);
    controls.querySelector('#symAxis').value = 340;
    controls.querySelector('#symAxisOut').textContent = 340;
    controls.querySelector('#symFold').textContent = '◫ 对折检验';
    draw();
  }, { signal: ac.signal });

  draw();
  return () => { ac.abort(); cancelAnimationFrame(foldRaf); };
}

/* ============================================================
   4. 等腰三角形三线合一
   ============================================================ */
function mountIsosceles(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 460', role: 'img', 'aria-label': '等腰三角形三线合一演示' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">顶点高度</span>
      <div class="range-wrap"><input type="range" id="isoH" min="120" max="300" value="220" step="1"><output id="isoHOut">220</output></div>
    </div>
    <div class="control-row">
      <button class="btn btn-sm btn-soft" id="isoShow">✦ 显示三线</button>
      <button class="btn btn-sm btn-ghost" id="isoReset">↺ 复位</button>
      <span class="small muted">也可以拖动顶点 A</span>
    </div>
    <div class="lab-note"><b>三线合一：</b>顶角平分线、底边中线、底边高其实是同一条线。等腰三角形是轴对称图形。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'isoAB', label: '腰 AB = AC' },
    { id: 'isoB', label: '底角 ∠B' },
    { id: 'isoC', label: '底角 ∠C' },
    { id: 'isoTop', label: '顶角 ∠A', accent: true }
  ]);

  let h = 220;
  let showLines = true;
  const B = { x: 165, y: 365 }, C = { x: 515, y: 365 };
  let A = { x: 340, y: B.y - h };

  function draw() {
    clearNode(svg);
    const defs = svgEl('defs', {}, svg);
    const pat = svgEl('pattern', { id: 'isoGrid', width: 28, height: 28, patternUnits: 'userSpaceOnUse' }, defs);
    svgEl('path', { d: 'M 28 0 L 0 0 0 28', fill: 'none', stroke: '#E8DFCE', 'stroke-width': 1 }, pat);
    svgEl('rect', { width: 680, height: 460, fill: 'url(#isoGrid)', opacity: 0.5 }, svg);

    const M = { x: (B.x + C.x) / 2, y: B.y };
    svgEl('polygon', { points: `${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`, fill: '#FBF3EE', stroke: '#8A5A44', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, svg);
    svgEl('line', { x1: A.x, y1: A.y, x2: M.x, y2: M.y, stroke: '#8A5A44', 'stroke-width': 1.4, 'stroke-dasharray': '6 5', opacity: 0.6 }, svg);

    if (showLines) {
      const demo = svgEl('g', {}, svg);
      svgEl('line', { x1: A.x, y1: A.y, x2: M.x, y2: M.y, stroke: '#178F80', 'stroke-width': 5, opacity: 0.28, 'stroke-linecap': 'round' }, demo);
      svgEl('line', { x1: A.x, y1: A.y, x2: M.x, y2: M.y, stroke: '#E39A1C', 'stroke-width': 2, opacity: 0.8 }, demo);
      svgEl('line', { x1: A.x, y1: A.y, x2: M.x, y2: M.y, stroke: '#8B63D9', 'stroke-width': 1.2 }, demo);
      svgText(svg, A.x + 10, A.y + 48, '角平分线', 'svg-small', { 'text-anchor': 'start', fill: '#8B63D9' });
      svgText(svg, A.x + 10, A.y + 66, '中线', 'svg-small', { 'text-anchor': 'start', fill: '#E39A1C' });
      svgText(svg, A.x + 10, A.y + 84, '高', 'svg-small', { 'text-anchor': 'start', fill: '#178F80' });
    }

    // 直角符号
    svgEl('path', { d: `M ${M.x - 12} ${M.y} L ${M.x - 12} ${M.y - 12} L ${M.x} ${M.y - 12}`, fill: 'none', stroke: '#8A5A44', 'stroke-width': 1.4 }, svg);

    svgEl('circle', { cx: A.x, cy: A.y, r: 12, class: 'draggable', fill: '#8A5A44', stroke: '#FFFDF8', 'stroke-width': 4 }, svg);
    svgText(svg, A.x, A.y + 4, 'A', 'svg-label', { fill: '#fff', 'font-size': 10, 'pointer-events': 'none' }, svg);
    svgEl('circle', { cx: B.x, cy: B.y, r: 6, fill: '#8A5A44', stroke: '#FFFDF8', 'stroke-width': 3 }, svg);
    svgEl('circle', { cx: C.x, cy: C.y, r: 6, fill: '#8A5A44', stroke: '#FFFDF8', 'stroke-width': 3 }, svg);
    svgText(svg, B.x - 4, B.y + 22, 'B', 'svg-label', { fill: '#8A5A44' });
    svgText(svg, C.x + 4, C.y + 22, 'C', 'svg-label', { fill: '#8A5A44' });
    svgText(svg, M.x, M.y + 22, 'D', 'svg-label', { fill: '#8A5A44' });

    // 等长标记
    const mAB = mid(A, B), mAC = mid(A, C);
    svgText(svg, mAB.x - 16, mAB.y, '|', 'svg-label', { fill: '#178F80', 'font-size': 15 });
    svgText(svg, mAC.x + 16, mAC.y, '|', 'svg-label', { fill: '#178F80', 'font-size': 15 });

    const ab = dist(A, B), ac = dist(A, C);
    const angB = Math.acos(((B.x - A.x) * (C.x - A.x) + (B.y - A.y) * (C.y - A.y)) / (ab * ac)) / D2R;
    const angB2 = Math.acos(((A.x - B.x) * (C.x - B.x) + (A.y - B.y) * (C.y - B.y)) / (dist(B, A) * dist(B, C))) / D2R;
    const angC2 = Math.acos(((A.x - C.x) * (B.x - C.x) + (A.y - C.y) * (B.y - C.y)) / (dist(C, A) * dist(C, B))) / D2R;
    setRO('isoAB', `${fmt(ab / 28, 1)} / ${fmt(ac / 28, 1)}`);
    setRO('isoB', `${fmt(angB2, 1)}°`);
    setRO('isoC', `${fmt(angC2, 1)}°`);
    setRO('isoTop', `${fmt(angB, 1)}°`);
  }

  function setHeight(newH) {
    h = clamp(newH, 120, 300);
    A = { x: 340, y: B.y - h };
    controls.querySelector('#isoH').value = h;
    controls.querySelector('#isoHOut').textContent = Math.round(h);
    draw();
  }

  controls.querySelector('#isoH').addEventListener('input', e => setHeight(Number(e.target.value)), { signal: ac.signal });
  controls.querySelector('#isoShow').addEventListener('click', e => {
    showLines = !showLines;
    e.currentTarget.textContent = showLines ? '✦ 隐藏三线' : '✦ 显示三线';
    draw();
  }, { signal: ac.signal });
  controls.querySelector('#isoReset').addEventListener('click', () => { showLines = true; setHeight(220); }, { signal: ac.signal });

  let dragging = false;
  svg.addEventListener('pointerdown', e => {
    if (e.target.closest('.draggable')) { dragging = true; svg.setPointerCapture?.(e.pointerId); }
  }, { signal: ac.signal });
  svg.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = toSvgPoint(svg, e);
    setHeight(B.y - p.y);
  }, { signal: ac.signal });
  svg.addEventListener('pointerup', () => { dragging = false; }, { signal: ac.signal });

  draw();
  return () => ac.abort();
}

    <div class="control-row">
      <span class="control-label">直角边 a</span>
      <div class="range-wrap"><input type="range" id="pythA" min="2" max="5" value="3" step="0.5"><output id="pythAOut">3</output></div>
      <span class="control-label">直角边 b</span>
      <div class="range-wrap"><input type="range" id="pythB" min="2" max="5" value="4" step="0.5"><output id="pythBOut">4</output></div>
    </div>
    <div class="area-bars">
      <div class="area-bar"><span>a²</span><div class="track"><i id="pythBarA"></i></div><b id="pythBarAText">9</b></div>
      <div class="area-bar"><span>b²</span><div class="track"><i id="pythBarB" class="teal"></i></div><b id="pythBarBText">16</b></div>
      <div class="area-bar"><span>c²</span><div class="track"><i id="pythBarC" class="gold"></i></div><b id="pythBarCText">25</b></div>
    </div>
    <div class="lab-note"><b>面积法：</b>两个小正方形的面积之和，恰好等于斜边上的大正方形面积。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'pyA2', label: 'a²' },
    { id: 'pyB2', label: 'b²' },
    { id: 'pySum', label: 'a² + b²' },
    { id: 'pyC2', label: 'c²', accent: true }
  ]);

  let a = 3, b = 4;
  const s = 29, C = { x: 250, y: 345 };

  function draw() {
    clearNode(svg);
    const defs = svgEl('defs', {}, svg);
    const pat = svgEl('pattern', { id: 'pyGrid', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
    svgEl('path', { d: 'M 26 0 L 0 0 0 26', fill: 'none', stroke: '#E8DFCE', 'stroke-width': 1 }, pat);
    svgEl('rect', { width: 680, height: 520, fill: 'url(#pyGrid)', opacity: 0.55 }, svg);

    const B = { x: C.x + a * s, y: C.y };
    const A = { x: C.x, y: C.y - b * s };
    const c = Math.hypot(a, b);
    const off = { x: b * s, y: -a * s };

    const sqA = [C, B, { x: B.x, y: B.y + a * s }, { x: C.x, y: C.y + a * s }];
    const sqB = [C, A, { x: A.x - b * s, y: A.y }, { x: C.x - b * s, y: C.y }];
    const sqC = [A, B, { x: B.x + off.x, y: B.y + off.y }, { x: A.x + off.x, y: A.y + off.y }];

    svgEl('polygon', { points: sqC.map(p => `${p.x},${p.y}`).join(' '), fill: '#E8A31A', 'fill-opacity': 0.22, stroke: '#D28C08', 'stroke-width': 2 }, svg);
    svgEl('polygon', { points: sqA.map(p => `${p.x},${p.y}`).join(' '), fill: '#EF654F', 'fill-opacity': 0.2, stroke: '#E85D4A', 'stroke-width': 2 }, svg);
    svgEl('polygon', { points: sqB.map(p => `${p.x},${p.y}`).join(' '), fill: '#178F80', 'fill-opacity': 0.2, stroke: '#178F80', 'stroke-width': 2 }, svg);
    svgEl('polygon', { points: `${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`, fill: '#FFFDF8', stroke: '#22211D', 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, svg);

    svgEl('path', { d: `M ${C.x + 14} ${C.y} L ${C.x + 14} ${C.y - 14} L ${C.x} ${C.y - 14}`, fill: 'none', stroke: '#22211D', 'stroke-width': 1.5 }, svg);

    const hm = mid(A, B);
    svgText(svg, (C.x + B.x) / 2, C.y - 10, 'a', 'svg-label', { fill: '#B23B28', 'font-size': 13 });
    svgText(svg, C.x + 11, (C.y + A.y) / 2, 'b', 'svg-label', { fill: '#0D6A5D', 'font-size': 13 });
    svgText(svg, hm.x - 13, hm.y + 5, 'c', 'svg-label', { fill: '#8A5E07', 'font-size': 13 });

    const cA = { x: (sqA[0].x + sqA[2].x) / 2, y: (sqA[0].y + sqA[2].y) / 2 };
    const cB = { x: (sqB[0].x + sqB[2].x) / 2, y: (sqB[0].y + sqB[2].y) / 2 };
    const cC = { x: (sqC[0].x + sqC[2].x) / 2, y: (sqC[0].y + sqC[2].y) / 2 };
    svgText(svg, cA.x, cA.y + 5, `a² = ${fmt(a * a, 1)}`, 'svg-math', { fill: '#B23B28', 'font-size': 15 });
    svgText(svg, cB.x, cB.y + 5, `b² = ${fmt(b * b, 1)}`, 'svg-math', { fill: '#0D6A5D', 'font-size': 15 });
    svgText(svg, cC.x, cC.y + 5, `c² = ${fmt(c * c, 1)}`, 'svg-math', { fill: '#8A5E07', 'font-size': 15 });

    svgText(svg, 60, 40, 'a² + b² = c²', 'svg-math', { 'text-anchor': 'start', 'font-size': 20, fill: '#22211D' });
    svgText(svg, 60, 60, '拖动滑杆，面积关系始终成立', 'svg-small', { 'text-anchor': 'start', fill: '#8B8274' });

    setRO('pyA2', fmt(a * a, 1));
    setRO('pyB2', fmt(b * b, 1));
    setRO('pySum', fmt(a * a + b * b, 1));
    setRO('pyC2', fmt(c * c, 1));

    const total = a * a + b * b;
    controls.querySelector('#pythBarA').style.width = `${(a * a / total) * 100}%`;
    controls.querySelector('#pythBarB').style.width = `${(b * b / total) * 100}%`;
    controls.querySelector('#pythBarC').style.width = '100%';
    controls.querySelector('#pythBarAText').textContent = fmt(a * a, 1);
    controls.querySelector('#pythBarBText').textContent = fmt(b * b, 1);
    controls.querySelector('#pythBarCText').textContent = fmt(total, 1);
    controls.querySelector('#pythAOut').textContent = fmt(a, 1);
    controls.querySelector('#pythBOut').textContent = fmt(b, 1);
  }

  controls.querySelector('#pythA').addEventListener('input', e => { a = Number(e.target.value); draw(); }, { signal: ac.signal });
  controls.querySelector('#pythB').addEventListener('input', e => { b = Number(e.target.value); draw(); }, { signal: ac.signal });
  draw();
  return () => ac.abort();
}

/* ============================================================
   6. √2 与数轴
   ============================================================ */
function mountIrrational(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 340', role: 'img', 'aria-label': '单位正方形对角线旋转到数轴' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <button class="btn btn-sm btn-coral" id="irrGo">↻ 旋转对角线</button>
      <button class="btn btn-sm btn-ghost" id="irrReset">↺ 复位</button>
      <span class="small muted">把单位正方形的对角线“转”到数轴上</span>
    </div>
    <div class="lab-note"><b>关键：</b>旋转不改变长度，所以数轴上这段长度就是 √2。1² + 1² = 2，所以对角线 = √2。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'irrSide', label: '正方形边长', value: '1' },
    { id: 'irrDiag', label: '对角线²', value: '2' },
    { id: 'irrValue', label: '对角线 ≈', value: '1.414', accent: true },
    { id: 'irrWhere', label: '落在数轴', value: '1 与 2 之间' }
  ]);

  const ox = 90, oy = 275, u = 160;
  const top = { x: ox, y: oy - u };
  const right = { x: ox + u, y: oy };
  const end = { x: ox + u * Math.SQRT2, y: oy };
  let raf = 0;

  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'irrDots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
  svgEl('circle', { cx: 1, cy: 1, r: 1, fill: '#E6DACA' }, pat);
  svgEl('rect', { width: 680, height: 340, fill: 'url(#irrDots)', opacity: 0.55 }, svg);

  svgEl('line', { x1: 52, y1: oy, x2: 640, y2: oy, class: 'axis-line' }, svg);
  svgEl('path', { d: `M 640 ${oy} l -10 -4 l 0 8 Z`, fill: '#22211D' }, svg);
  for (let k = 0; k <= 3.5; k += 0.5) {
    const x = ox + k * u;
    if (x > 636) continue;
    const major = Math.abs(k - Math.round(k)) < 0.01;
    svgEl('line', { x1: x, y1: oy - (major ? 7 : 4), x2: x, y2: oy + (major ? 7 : 4), stroke: '#22211D', 'stroke-width': major ? 1.4 : 1 }, svg);
    if (major) svgText(svg, x, oy + 24, String(k), 'svg-small', { fill: '#6E6556' });
  }
  svgText(svg, 636, oy + 40, '数轴', 'svg-small', { fill: '#8B8274', 'text-anchor': 'end' });
  svgEl('line', { x1: ox, y1: oy, x2: ox, y2: oy - u, stroke: '#4C7DFF', 'stroke-width': 2 }, svg);
  svgEl('line', { x1: ox, y1: oy - u, x2: ox + u, y2: oy - u, stroke: '#4C7DFF', 'stroke-width': 2 }, svg);
  svgEl('line', { x1: ox + u, y1: oy - u, x2: ox + u, y2: oy, stroke: '#4C7DFF', 'stroke-width': 2 }, svg);
  svgEl('rect', { x: ox + 10, y: oy - 24, width: 14, height: 14, fill: 'none', stroke: '#4C7DFF', 'stroke-width': 1.2 }, svg);
  svgText(svg, ox + u / 2, oy + 24, '1', 'svg-label', { fill: '#4C7DFF' });
  svgText(svg, ox - 14, oy - u / 2, '1', 'svg-label', { fill: '#4C7DFF' });


  const arc = svgEl('path', { d: `M ${right.x} ${top.y} A ${u * Math.SQRT2} ${u * Math.SQRT2} 0 0 1 ${end.x} ${end.y}`, fill: 'none', stroke: '#E8A31A', 'stroke-width': 2, 'stroke-dasharray': '6 5' }, svg);
  const diag = svgEl('line', { x1: ox, y1: oy, x2: right.x, y2: top.y, stroke: '#EF654F', 'stroke-width': 3, 'stroke-linecap': 'round' }, svg);
  const dot = svgEl('circle', { cx: right.x, cy: top.y, r: 6, fill: '#EF654F', stroke: '#FFFDF8', 'stroke-width': 2 }, svg);
  const marker = svgEl('circle', { cx: end.x, cy: end.y, r: 7, fill: '#FFFDF8', stroke: '#E8A31A', 'stroke-width': 2.5, opacity: 0 }, svg);
  const sqrtLabel = svgText(svg, end.x, oy - 22, '√2', 'svg-math', { fill: '#8A5E07', opacity: 0 });
  const diagLabel = svgText(svg, 0, 0, '对角线 √2', 'svg-label', { fill: '#B23B28', opacity: 1 });
  svgText(svg, 500, 72, '1² + 1² = 2', 'svg-math', { 'font-size': 20, 'text-anchor': 'start', fill: '#22211D' });
  svgText(svg, 500, 92, '对角线 = √2', 'svg-small', { 'text-anchor': 'start', fill: '#8B8274' });

  function render(p) {
    const angle = (-45 + 45 * p) * D2R;
    const r = u * Math.SQRT2;
    const x = ox + r * Math.cos(angle);
    const y = oy + r * Math.sin(angle);
    diag.setAttribute('x2', x);
    diag.setAttribute('y2', y);
    dot.setAttribute('cx', x);
    dot.setAttribute('cy', y);
    const lx = ox + (x - ox) * 0.58;
    const ly = oy + (y - oy) * 0.58;
    diagLabel.setAttribute('x', lx + 28);
    diagLabel.setAttribute('y', ly - 10);
    marker.setAttribute('opacity', p > 0.98 ? 1 : 0);
    sqrtLabel.setAttribute('opacity', p > 0.98 ? 1 : 0);
    dot.setAttribute('fill', p > 0.98 ? '#E8A31A' : '#EF654F');
  }

  function run() {
    cancelAnimationFrame(raf);
    const t0 = performance.now();
    function step(now) {
      const t = clamp((now - t0) / 1000, 0, 1);
      render(t);
      if (t < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  controls.querySelector('#irrGo').addEventListener('click', run, { signal: ac.signal });
  controls.querySelector('#irrReset').addEventListener('click', () => {
    cancelAnimationFrame(raf);
    render(0);
    marker.setAttribute('opacity', 0);
    sqrtLabel.setAttribute('opacity', 0);
  }, { signal: ac.signal });
  render(0);
  return () => { ac.abort(); cancelAnimationFrame(raf); };
}

/* ============================================================
   7. 平面直角坐标系
   ============================================================ */
function mountCoordinate(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 560 560', role: 'img', 'aria-label': '可点击的平面直角坐标系' });
  svg.style.touchAction = 'none';
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">对称变换</span>
      <button class="btn btn-sm btn-soft" data-r="x">关于 x 轴</button>
      <button class="btn btn-sm btn-soft" data-r="y">关于 y 轴</button>
      <button class="btn btn-sm btn-soft" data-r="o">关于原点</button>
      <button class="btn btn-sm btn-ghost" data-r="reset">↺ 复位</button>
    </div>
    <div class="lab-note"><b>操作：</b>点击网格或拖动圆点，观察坐标、象限和到坐标轴的距离怎样变化。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'coPoint', label: '点 P 坐标', value: '(2, 3)', accent: true },
    { id: 'coQuad', label: '所在位置', value: '第一象限' },
    { id: 'coDX', label: '到 x 轴距离', value: '3' },
    { id: 'coDY', label: '到 y 轴距离', value: '2' }
  ]);

  const O = 280, step = 44;
  const X = x => O + x * step;
  const Y = y => O - y * step;
  let state = { x: 2, y: 3 };
  let cur = { ...state };
  let raf = 0;

  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'coGrid', width: step, height: step, patternUnits: 'userSpaceOnUse', x: O, y: O }, defs);
  svgEl('path', { d: `M ${step} 0 L 0 0 0 ${step}`, fill: 'none', stroke: '#E3D8C7', 'stroke-width': 1 }, pat);
  svgEl('rect', { x: 0, y: 0, width: 560, height: 560, fill: 'url(#coGrid)' }, svg);

  for (let i = -5; i <= 5; i++) {
    if (i === 0) continue;
    svgEl('line', { x1: X(i), y1: 18, x2: X(i), y2: 542, stroke: '#E8DFCE', 'stroke-width': 1 }, svg);
    svgEl('line', { x1: 18, y1: Y(i), x2: 542, y2: Y(i), stroke: '#E8DFCE', 'stroke-width': 1 }, svg);
    svgText(svg, X(i), O + 17, String(i), 'svg-small', { fill: '#9A8F7F' });
    svgText(svg, O - 12, Y(i) + 3, String(i), 'svg-small', { fill: '#9A8F7F', 'text-anchor': 'end' });
  }
  svgEl('line', { x1: 22, y1: O, x2: 538, y2: O, class: 'axis-line' }, svg);
  svgEl('line', { x1: O, y1: 22, x2: O, y2: 538, class: 'axis-line' }, svg);
  svgEl('path', { d: `M 538 ${O} l -9 -4 l 0 8 Z`, fill: '#22211D' }, svg);
  svgEl('path', { d: `M ${O} 22 l -4 9 l 8 0 Z`, fill: '#22211D' }, svg);
  svgText(svg, 532, O - 10, 'x', 'svg-label', { 'text-anchor': 'end' });
  svgText(svg, O + 10, 34, 'y', 'svg-label', { 'text-anchor': 'start' });
  svgText(svg, O - 14, O + 18, 'O', 'svg-small', { 'text-anchor': 'end' });
  svgText(svg, 485, 70, 'Ⅰ', 'svg-math', { fill: '#DCCDB6', 'font-size': 26 });
  svgText(svg, 65, 70, 'Ⅱ', 'svg-math', { fill: '#DCCDB6', 'font-size': 26 });
  svgText(svg, 65, 500, 'Ⅲ', 'svg-math', { fill: '#DCCDB6', 'font-size': 26 });
  svgText(svg, 485, 500, 'Ⅳ', 'svg-math', { fill: '#DCCDB6', 'font-size': 26 });

  const dyn = svgEl('g', {}, svg);

  function quadrant(x, y) {
    if (x === 0 && y === 0) return '原点';
    if (x === 0) return 'y 轴上';
    if (y === 0) return 'x 轴上';
    if (x > 0 && y > 0) return '第一象限';
    if (x < 0 && y > 0) return '第二象限';
    if (x < 0 && y < 0) return '第三象限';
    return '第四象限';
  }

  function render() {
    clearNode(dyn);
    const px = X(cur.x), py = Y(cur.y);
    svgEl('line', { x1: px, y1: O, x2: px, y2: py, stroke: '#EF654F', 'stroke-width': 1.4, 'stroke-dasharray': '5 4' }, dyn);
    svgEl('line', { x1: O, y1: py, x2: px, y2: py, stroke: '#EF654F', 'stroke-width': 1.4, 'stroke-dasharray': '5 4' }, dyn);
    svgEl('circle', { cx: px, cy: py, r: 9, fill: '#EF654F', stroke: '#FFFDF8', 'stroke-width': 4 }, dyn);
    svgEl('circle', { cx: px, cy: py, r: 18, fill: 'none', stroke: '#EF654F', opacity: 0.22 }, dyn);
    const label = `(${fmt(cur.x, 1)}, ${fmt(cur.y, 1)})`;
    const lx = clamp(px + 18, 45, 500), ly = clamp(py - 18, 32, 535);
    const w = label.length * 8.5 + 18;
    svgEl('rect', { x: lx - 4, y: ly - 15, width: w, height: 24, rx: 7, fill: '#FFFDF8', stroke: '#E7DDCC' }, dyn);
    svgText(dyn, lx + 5, ly + 2, label, 'svg-label', { 'text-anchor': 'start', 'font-size': 11.5, fill: '#B23B28' });
    setRO('coPoint', label);
    setRO('coQuad', quadrant(cur.x, cur.y));
    setRO('coDX', String(Math.abs(cur.y)));
    setRO('coDY', String(Math.abs(cur.x)));
  }

  function snap(p) {
    return { x: clamp(Math.round((p.x - O) / step), -5, 5), y: clamp(Math.round((O - p.y) / step), -5, 5) };
  }
  function animateTo(target) {
    cancelAnimationFrame(raf);
    const from = { ...cur };
    const t0 = performance.now();
    function step(now) {
      const t = clamp((now - t0) / 420, 0, 1);
      const e = 1 - Math.pow(1 - t, 3);
      cur = { x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e };
      render();
      if (t < 1) raf = requestAnimationFrame(step);
      else cur = { ...target };
    }
    raf = requestAnimationFrame(step);
  }

  let drag = false;
  svg.addEventListener('pointerdown', e => {
    drag = true;
    const p = snap(toSvgPoint(svg, e));
    state = p;
    animateTo(p);
    svg.setPointerCapture?.(e.pointerId);
  }, { signal: ac.signal });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = snap(toSvgPoint(svg, e));
    if (p.x !== state.x || p.y !== state.y) { state = p; animateTo(p); }
  }, { signal: ac.signal });
  svg.addEventListener('pointerup', () => { drag = false; }, { signal: ac.signal });

  controls.addEventListener('click', e => {
    const b = e.target.closest('[data-r]');
    if (!b) return;
    const r = b.dataset.r;
    if (r === 'reset') { state = { x: 2, y: 3 }; animateTo(state); return; }
    if (r === 'x') state = { x: state.x, y: -state.y };
    if (r === 'y') state = { x: -state.x, y: state.y };
    if (r === 'o') state = { x: -state.x, y: -state.y };
    animateTo(state);
  }, { signal: ac.signal });

  render();
  return () => { ac.abort(); cancelAnimationFrame(raf); };
}
