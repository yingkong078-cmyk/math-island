  <style>
/* ============================================================
   数学探险岛 · 视觉系统
   温暖纸张底色 + 珊瑚橙 / 松石绿 / 阳光黄
   ============================================================ */

:root {
  --paper: #FBF7EF;
  --paper-deep: #F3EBDD;
  --card: #FFFDF8;
  --card-solid: #FFFFFF;
  --ink: #22211D;
  --ink-soft: #45423A;
  --muted: #777267;
  --line: #E7DDCC;
  --line-strong: #D9CCB7;
  --coral: #EF654F;
  --coral-deep: #D94B36;
  --coral-soft: #FFE9E3;
  --teal: #178F80;
  --teal-soft: #E2F4EF;
  --gold: #E8A31A;
  --gold-soft: #FFF3D5;
  --blue: #4C7DFF;
  --blue-soft: #EAF0FF;
  --purple: #8B63D9;
  --purple-soft: #F1EAFF;
  --pink: #E0567C;
  --pink-soft: #FFE9EF;
  --green: #4B9B5F;
  --green-soft: #E8F6E9;
  --red: #D94B36;
  --shadow-sm: 0 2px 0 rgba(34, 33, 29, 0.04), 0 8px 24px rgba(86, 65, 36, 0.06);
  --shadow-md: 0 4px 0 rgba(34, 33, 29, 0.04), 0 18px 44px rgba(86, 65, 36, 0.1);
  --shadow-lg: 0 6px 0 rgba(34, 33, 29, 0.04), 0 30px 70px rgba(86, 65, 36, 0.14);
  --radius-sm: 12px;
  --radius: 20px;
  --radius-lg: 28px;
  --radius-xl: 36px;
  --maxw: 1240px;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body.is-locked { overflow: hidden; }

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; }

::selection { background: var(--gold-soft); color: var(--ink); }

:focus-visible {
  outline: 3px solid rgba(76, 125, 255, 0.55);
  outline-offset: 3px;
  border-radius: 6px;
}

/* ---------- 背景 ---------- */
.page-atmosphere {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(255, 216, 188, 0.55), transparent 60%),
    radial-gradient(900px 600px at -10% 20%, rgba(201, 235, 226, 0.55), transparent 55%),
    radial-gradient(800px 500px at 55% 110%, rgba(255, 238, 191, 0.5), transparent 60%),
    var(--paper);
}
.page-atmosphere::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image: radial-gradient(rgba(90, 73, 48, 0.16) 0.7px, transparent 0.7px);
  background-size: 22px 22px;
  mask-image: linear-gradient(to bottom, black, transparent 80%);
}
.atmo-dot {
  position: absolute;
  border-radius: 50%;
  filter: blur(1px);
  opacity: 0.7;
}
.d1 { width: 14px; height: 14px; background: var(--coral); top: 17%; left: 6%; }
.d2 { width: 9px; height: 9px; background: var(--teal); top: 64%; left: 4%; }
.d3 { width: 18px; height: 18px; background: var(--gold); top: 32%; right: 5%; }
.atmo-squiggle {
  position: absolute;
  font-family: var(--mono);
  color: rgba(74, 63, 44, 0.2);
  font-weight: 700;
  user-select: none;
}
.s1 { top: 72%; left: 8%; font-size: 42px; transform: rotate(-18deg); }
.s2 { top: 12%; right: 12%; font-size: 34px; transform: rotate(14deg); }
.s3 { top: 48%; right: 3%; font-size: 28px; transform: rotate(-12deg); }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 24px;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 14px 28px;
  background: rgba(251, 247, 239, 0.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
}
.topbar.scrolled {
  border-color: rgba(217, 204, 183, 0.65);
  box-shadow: 0 10px 30px rgba(86, 65, 36, 0.05);
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 0 0 auto;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 15px;
  background: var(--ink);
  color: var(--paper);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 29px;
  font-weight: 700;
  line-height: 1;
  box-shadow: inset 0 -3px 0 rgba(255, 255, 255, 0.12);
  transform: rotate(-3deg);
  transition: transform 0.3s;
}
.brand:hover .brand-mark { transform: rotate(5deg) scale(1.04); }
.brand-mark.small { width: 38px; height: 38px; font-size: 24px; border-radius: 12px; }
.brand-word { display: flex; flex-direction: column; line-height: 1.2; }
.brand-word strong { font-size: 16px; letter-spacing: 0.02em; }
.brand-word small { font-size: 10.5px; color: var(--muted); letter-spacing: 0.1em; margin-top: 3px; }

.main-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex: 1 1 auto;
}
.main-nav a {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 13px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-soft);
  white-space: nowrap;
  transition: background 0.2s, color 0.2s, transform 0.2s;
}
.main-nav a:hover { background: rgba(255, 253, 248, 0.9); color: var(--ink); transform: translateY(-1px); }
.main-nav a.active { background: var(--ink); color: var(--paper); box-shadow: 0 4px 12px rgba(34, 33, 29, 0.16); }
.nav-ico { font-size: 14px; opacity: 0.8; }

.top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--card);
  color: var(--ink-soft);
  font-weight: 700;
  transition: transform 0.2s, background 0.2s;
}
.icon-btn:hover { transform: rotate(-8deg); background: var(--gold-soft); }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  font-size: 12.5px;
  color: var(--muted);
  transition: transform 0.2s, box-shadow 0.2s;
}
.pill:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.pill b { font-size: 14px; color: var(--ink); }
.pill small { font-size: 10px; }
.pill-xp { background: var(--gold-soft); border-color: #F1D99A; }
.pill-streak { background: var(--coral-soft); border-color: #F6C9BE; }

/* ---------- 通用布局 ---------- */
#app { min-height: 70vh; }
.page-wrap {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 28px 28px 80px;
  animation: pageIn 0.45s ease both;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.section { margin-top: 54px; }
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 22px;
}
.section-head h2 {
  margin: 0;
  font-size: clamp(23px, 2.4vw, 32px);
  line-height: 1.25;
  letter-spacing: -0.03em;
}
.section-head p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.section-link {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 700; color: var(--ink-soft);
  border-bottom: 2px solid var(--line-strong);
  padding-bottom: 3px; white-space: nowrap;
  transition: gap 0.2s, border-color 0.2s;
}
.section-link:hover { gap: 11px; border-color: var(--coral); }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.eyebrow::before {
  content: "";
  width: 18px; height: 2px;
  background: var(--coral);
  border-radius: 2px;
}
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.hr { height: 1px; background: var(--line); border: 0; margin: 24px 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: var(--card);
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
  transition: transform 0.18s, box-shadow 0.18s, background 0.18s, border-color 0.18s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: var(--ink);
  color: var(--paper);
  box-shadow: 0 5px 0 rgba(34, 33, 29, 0.12);
}
.btn-primary:hover { background: #11110F; box-shadow: 0 7px 0 rgba(34, 33, 29, 0.12); }
.btn-coral {
  background: var(--coral);
  color: #fff;
  box-shadow: 0 5px 0 rgba(217, 75, 54, 0.22);
}
.btn-coral:hover { background: var(--coral-deep); }
.btn-teal { background: var(--teal); color: #fff; }
.btn-soft { background: var(--paper-deep); border-color: var(--line); }
.btn-ghost { background: transparent; border-color: var(--line-strong); }
.btn-lg { min-height: 52px; padding: 14px 24px; font-size: 15.5px; border-radius: 16px; }
.btn-sm { min-height: 36px; padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

.text-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-soft);
  border-bottom: 1.5px solid var(--line-strong);
  transition: color 0.2s, border-color 0.2s;
}
.text-link:hover { color: var(--coral-deep); border-color: var(--coral); }

/* ---------- 通用卡片 ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: 24px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--paper-deep);
  color: var(--ink-soft);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.chip.coral { background: var(--coral-soft); color: #A23626; }
.chip.teal { background: var(--teal-soft); color: #0D6A5D; }
.chip.gold { background: var(--gold-soft); color: #8A5E07; }
.chip.blue { background: var(--blue-soft); color: #2A51B8; }
.chip.purple { background: var(--purple-soft); color: #5B35A8; }
.chip.pink { background: var(--pink-soft); color: #9C2E50; }

.progress {
  height: 8px;
  background: rgba(34, 33, 29, 0.08);
  border-radius: 999px;
  overflow: hidden;
}
.progress > i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: var(--teal);
  transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.progress.thin { height: 5px; }

/* ---------- 首页 Hero ---------- */
.hero {
  position: relative;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  align-items: center;
  gap: 40px;
  min-height: 520px;
  padding: 34px 0 20px;
}
.hero-copy { position: relative; z-index: 2; }
.hero h1 {
  margin: 18px 0 18px;
  font-size: clamp(42px, 5.4vw, 72px);
  line-height: 1.06;
  letter-spacing: -0.055em;
  font-weight: 900;
}
.hero h1 .highlight {
  position: relative;
  display: inline-block;
  color: var(--coral-deep);
  white-space: nowrap;
}
.hero h1 .highlight::after {
  content: "";
  position: absolute;
  left: -2%;
  right: -2%;
  bottom: 0.05em;
  height: 0.22em;
  background: var(--gold);
  border-radius: 999px;
  z-index: -1;
  transform: rotate(-1.3deg);
  opacity: 0.75;
}
.hero-lead {
  max-width: 540px;
  margin: 0 0 24px;
  font-size: 16px;
  line-height: 1.85;
  color: var(--ink-soft);
}
.hero-lead b { color: var(--ink); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 20px;
  margin-top: 28px;
  color: var(--muted);
  font-size: 12px;
}
.hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
.hero-meta b { color: var(--ink); }
.hero-art {
  position: relative;
  min-height: 430px;
  display: grid;
  place-items: center;
}
.hero-blob {
  position: absolute;
  width: min(420px, 88%);
  aspect-ratio: 1;
  border-radius: 47% 53% 56% 44% / 52% 44% 56% 48%;
  background: linear-gradient(145deg, #FFE1C7, #FFD1B8 45%, #F7BFA8);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45), 0 40px 80px rgba(190, 110, 70, 0.18);
  animation: blobMorph 12s ease-in-out infinite;
}
@keyframes blobMorph {
  0%, 100% { border-radius: 47% 53% 56% 44% / 52% 44% 56% 48%; transform: rotate(0deg) scale(1); }
  33% { border-radius: 55% 45% 44% 56% / 45% 57% 43% 55%; transform: rotate(3deg) scale(1.02); }
  66% { border-radius: 42% 58% 60% 40% / 58% 40% 60% 42%; transform: rotate(-3deg) scale(0.99); }
}
.orbit {
  position: absolute;
  width: min(500px, 100%);
  aspect-ratio: 1;
  border: 1.5px dashed rgba(77, 62, 40, 0.18);
  border-radius: 50%;
  animation: spin 38s linear infinite;
}
.orbit::before {
  content: "π";
  position: absolute;
  top: 2%;
  left: 22%;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--gold);
  color: var(--ink);
  font-family: Georgia, serif;
  font-weight: 700;
  font-size: 20px;
  transform: rotate(-20deg);
  box-shadow: 0 4px 12px rgba(138, 94, 7, 0.2);
}
.orbit::after {
  content: "△";
  position: absolute;
  bottom: 8%;
  right: 4%;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--teal);
  color: #fff;
  font-size: 15px;
  box-shadow: 0 4px 12px rgba(23, 143, 128, 0.25);
}
@keyframes spin { to { transform: rotate(360deg); } }
.mascot-wrap {
  position: relative;
  z-index: 3;
  width: min(310px, 72%);
  animation: mascotBob 4.8s ease-in-out infinite;
  filter: drop-shadow(0 22px 22px rgba(90, 55, 30, 0.18));
}
@keyframes mascotBob {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-12px) rotate(1deg); }
}
.formula-float {
  position: absolute;
  z-index: 4;
  padding: 10px 14px;
  border: 1.5px solid rgba(34, 33, 29, 0.1);
  border-radius: 14px;
  background: rgba(255, 253, 248, 0.94);
  box-shadow: var(--shadow-md);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
  backdrop-filter: blur(8px);
}
.formula-float small { display: block; font-family: var(--font); font-size: 9.5px; color: var(--muted); font-weight: 600; margin-top: 2px; letter-spacing: 0.06em; }
.ff1 { top: 6%; left: 0; animation: floatA 6s ease-in-out infinite; transform: rotate(-4deg); }
.ff2 { right: -2%; top: 28%; animation: floatA 7s 0.8s ease-in-out infinite; transform: rotate(3deg); }
.ff3 { bottom: 9%; left: 2%; animation: floatA 6.5s 1.6s ease-in-out infinite; transform: rotate(2deg); }
@keyframes floatA {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -9px; }
}

/* ---------- 首页数据条 ---------- */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 26px;
}
.stat-box {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 16px 18px;
  background: rgba(255, 253, 248, 0.78);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.stat-ico {
  width: 42px; height: 42px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 13px;
  background: var(--paper-deep);
  font-size: 19px;
}
.stat-box:nth-child(1) .stat-ico { background: var(--gold-soft); }
.stat-box:nth-child(2) .stat-ico { background: var(--coral-soft); }
.stat-box:nth-child(3) .stat-ico { background: var(--teal-soft); }
.stat-box:nth-child(4) .stat-ico { background: var(--purple-soft); }
.stat-box b { display: block; font-size: 20px; line-height: 1.1; letter-spacing: -0.02em; }
.stat-box span { font-size: 11px; color: var(--muted); }

/* ---------- 首页双栏 ---------- */
.home-split {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 20px;
  margin-top: 26px;
}
.mission-card {
  position: relative;
  overflow: hidden;
  padding: 26px;
  border-radius: var(--radius-lg);
  background: var(--ink);
  color: var(--paper);
  box-shadow: var(--shadow-lg);
}
.mission-card::before {
  content: "";
  position: absolute;
  width: 260px; height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232, 163, 26, 0.35), transparent 65%);
  right: -90px; top: -100px;
}
.mission-card::after {
  content: "";
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  right: 30px; bottom: -120px;
}
.mission-head { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; z-index: 1; }
.mission-chest-strip {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0 8px;
  padding: 8px 10px;
  border: 1px dashed rgba(255, 255, 255, 0.16);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  color: rgba(251, 247, 239, 0.6);
  text-align: left;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.mission-chest-strip .mcs-icon { font-size: 18px; line-height: 1; flex: 0 0 auto; }
.mission-chest-strip b { font-size: 10px; color: var(--paper); flex: 0 0 auto; }
.mission-chest-strip em { flex: 1; min-width: 0; font-size: 8.5px; font-style: normal; color: rgba(251, 247, 239, 0.45); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mission-chest-strip i { flex: 0 0 auto; font-size: 8.5px; font-style: normal; color: rgba(251, 247, 239, 0.4); }
.mission-chest-strip.ready { background: rgba(232, 163, 26, 0.14); border-color: rgba(232, 163, 26, 0.5); }
.mission-chest-strip.ready .mcs-icon { animation: chestShake 2.2s ease-in-out infinite; }
.mission-chest-strip.ready b { color: var(--gold); }
.mission-chest-strip.ready i { color: var(--gold); }
.mission-chest-strip.opened { background: rgba(23, 143, 128, 0.12); border-color: rgba(23, 143, 128, 0.35); }
.mission-chest-strip.opened b, .mission-chest-strip.opened i { color: var(--teal); }
.mission-chest-strip:hover { background: rgba(232, 163, 26, 0.16); }
.mission-head h3 { margin: 6px 0 3px; font-size: 22px; letter-spacing: -0.02em; }
.mission-head p { margin: 0; color: rgba(251, 247, 239, 0.62); font-size: 12px; }
.mission-ring {
  --p: 0;
  width: 76px; height: 76px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255, 255, 255, 0.13) 0);
  display: grid; place-items: center;
  position: relative;
}
.mission-ring::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--ink); }
.mission-ring b { position: relative; font-size: 17px; }
.mission-ring small { position: relative; display: block; font-size: 8px; color: rgba(251, 247, 239, 0.55); text-align: center; margin-top: -2px; }
.mission-list { position: relative; z-index: 1; margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.mission-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 13px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: background 0.2s;
}
.mission-item.done { background: rgba(232, 163, 26, 0.12); border-color: rgba(232, 163, 26, 0.28); }
.mission-check {
  width: 22px; height: 22px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  font-size: 11px;
  color: transparent;
}
.mission-item.done .mission-check { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.mission-item div { min-width: 0; }
.mission-item b { display: block; font-size: 12.5px; font-weight: 600; }
.mission-item span { font-size: 10.5px; color: rgba(251, 247, 239, 0.5); }
.mission-item .mission-xp { margin-left: auto; font-size: 10px; color: var(--gold); font-weight: 700; white-space: nowrap; }

.continue-card {
  display: flex;
  flex-direction: column;
  padding: 26px;
  border-radius: var(--radius-lg);
  background: linear-gradient(160deg, #FFFDF8, #FFF8EA);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.continue-label { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); }
.continue-label .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px rgba(23, 143, 128, 0.12); animation: livePulse 2s infinite; }
@keyframes livePulse { 50% { box-shadow: 0 0 0 7px rgba(23, 143, 128, 0.03); } }
.continue-chapter { display: flex; align-items: center; gap: 14px; margin: 20px 0 14px; }
.continue-icon {
  width: 58px; height: 58px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 17px;
  background: var(--soft, var(--coral-soft));
  color: var(--accent, var(--coral));
  font-size: 25px;
  font-family: Georgia, serif;
  font-weight: 700;
}
.continue-chapter h3 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
.continue-chapter p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.continue-card .progress { margin: 4px 0 8px; }
.continue-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-bottom: 18px; }
.continue-card .btn { margin-top: auto; }
.daily-quote {
  position: relative;
  margin-top: 14px;
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--gold-soft);
  border: 1px dashed #E8CE8A;
  font-size: 12px;
  color: #7A5509;
  line-height: 1.7;
}
.daily-quote b { display: block; font-size: 10px; letter-spacing: 0.1em; margin-bottom: 3px; color: #A87910; }

/* ---------- 章节卡 ---------- */
.volume-row { margin-top: 18px; }
.volume-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink-soft);
}
.volume-title .v-badge {
  display: inline-grid;
  place-items: center;
  padding: 3px 9px;
  border-radius: 7px;
  background: var(--ink);
  color: var(--paper);
  font-size: 10px;
  letter-spacing: 0.08em;
}
.volume-title .line { flex: 1; height: 1px; background: var(--line); }
.chapter-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.chapter-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 192px;
  padding: 20px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s;
}
.chapter-card::before {
  content: "";
  position: absolute;
  width: 110px; height: 110px;
  border-radius: 50%;
  right: -38px; top: -40px;
  background: var(--soft);
  opacity: 0.8;
  transition: transform 0.3s;
}
.chapter-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--tint); }
.chapter-card:hover::before { transform: scale(1.25); }
.chapter-card-top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chapter-num {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.chapter-icon {
  position: relative;
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--soft);
  color: var(--accent);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 21px;
  font-weight: 700;
}
.chapter-card h3 { position: relative; margin: 16px 0 4px; font-size: 19px; letter-spacing: -0.02em; }
.chapter-card .chapter-tag { position: relative; font-size: 11px; color: var(--muted); min-height: 34px; }
.chapter-card-foot { position: relative; margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 14px; }
.chapter-card-foot .progress { flex: 1; }
.chapter-card-foot span { font-size: 10px; color: var(--muted); white-space: nowrap; }
.chapter-card .go-arrow {
  position: absolute;
  right: 18px; bottom: 18px;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--soft);
  color: var(--accent);
  font-size: 13px;
  transition: transform 0.22s, background 0.22s;
}
.chapter-card:hover .go-arrow { transform: translateX(4px); background: var(--accent); color: #fff; }

/* ---------- 首页底部学习法 ---------- */
.method-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 20px;
}
.method-mini {
  padding: 18px;
  border-radius: 16px;
  background: rgba(255, 253, 248, 0.7);
  border: 1px solid var(--line);
}
.method-mini b { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.method-mini span { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); line-height: 1.65; }
.method-mini i {
  width: 24px; height: 24px;
  display: inline-grid; place-items: center;
  border-radius: 8px;
  background: var(--gold-soft);
  color: #8A5E07;
  font-style: normal;
  font-size: 10px;
  font-weight: 800;
}

/* ---------- 课程地图页 ---------- */
.page-heading { padding: 22px 0 6px; }
.page-heading h1 { margin: 10px 0 8px; font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.045em; line-height: 1.15; }
.page-heading p { margin: 0; max-width: 680px; color: var(--muted); font-size: 14.5px; }
.course-tools {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 24px 0 6px;
}
.search-box {
  position: relative;
  flex: 1 1 280px;
  max-width: 420px;
}
.search-box input {
  width: 100%;
  height: 46px;
  padding: 0 44px 0 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box input:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(34, 33, 29, 0.06); }
.search-box .s-ico { position: absolute; right: 15px; top: 50%; translate: 0 -50%; color: var(--muted); font-size: 15px; }
.filter-tabs { display: inline-flex; flex-wrap: wrap; padding: 4px; gap: 3px; border-radius: 12px; background: var(--paper-deep); border: 1px solid var(--line); }
.filter-tabs button {
  border: 0;
  background: transparent;
  padding: 7px 14px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  transition: background 0.2s, color 0.2s;
}
.filter-tabs button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.course-stats { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.course-list { display: grid; gap: 12px; margin-top: 22px; }
.course-row {
  display: grid;
  grid-template-columns: 70px 1.2fr 1fr 130px;
  align-items: center;
  gap: 18px;
  padding: 16px 20px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.course-row:hover { transform: translateX(4px); box-shadow: var(--shadow-sm); border-color: var(--tint); }
.course-row-icon {
  width: 54px; height: 54px;
  display: grid; place-items: center;
  border-radius: 15px;
  background: var(--soft);
  color: var(--accent);
  font-family: Georgia, serif;
  font-size: 24px;
  font-weight: 700;
}
.course-row-main h3 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
.course-row-main h3 small { font-family: var(--font); font-size: 10px; color: var(--muted); font-weight: 600; margin-left: 8px; letter-spacing: 0.05em; }
.course-row-main p { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }
.course-row-sections { display: flex; flex-wrap: wrap; gap: 5px; }
.course-row-sections span {
  padding: 3px 7px;
  border-radius: 6px;
  background: var(--paper);
  color: var(--muted);
  font-size: 9.5px;
}
.course-row-progress { display: flex; flex-direction: column; gap: 5px; }
.course-row-progress small { font-size: 9.5px; color: var(--muted); display: flex; justify-content: space-between; }
.search-empty { padding: 60px 20px; text-align: center; color: var(--muted); }

/* ---------- 章节页 ---------- */
.chapter-hero {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.3fr 0.7fr;
  gap: 30px;
  align-items: center;
  padding: 38px;
  border-radius: var(--radius-xl);
  background: var(--soft);
  border: 1px solid var(--tint);
  box-shadow: var(--shadow-sm);
}
.chapter-hero::before {
  content: attr(data-glyph);
  position: absolute;
  right: 26%;
  top: -38px;
  font-family: Georgia, serif;
  font-size: 240px;
  font-weight: 700;
  line-height: 1;
  color: var(--accent);
  opacity: 0.07;
  pointer-events: none;
}
.chapter-hero h1 { margin: 12px 0 8px; font-size: clamp(34px, 4.2vw, 52px); line-height: 1.1; letter-spacing: -0.05em; }
.chapter-hero h1 .ch-num { font-family: Georgia, serif; color: var(--accent); font-size: 0.55em; letter-spacing: 0; vertical-align: 0.22em; margin-right: 4px; }
.chapter-hero .tagline { margin: 0 0 14px; font-size: 16px; color: var(--ink-soft); font-weight: 600; }
.chapter-hero .intro { max-width: 620px; margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.85; }
.chapter-hero .big-q {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  padding: 12px 15px;
  border-radius: 13px;
  background: rgba(255, 253, 248, 0.66);
  border: 1px dashed var(--tint);
  font-size: 12px;
  color: var(--ink-soft);
}
.chapter-hero .big-q b { color: var(--accent); white-space: nowrap; }
.chapter-hero-side { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.chapter-ring {
  --p: 0;
  width: 142px; height: 142px;
  border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), rgba(255, 255, 255, 0.6) 0);
  display: grid; place-items: center;
  position: relative;
  box-shadow: 0 14px 34px rgba(90, 65, 30, 0.12);
}
.chapter-ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--soft); }
.chapter-ring div { position: relative; text-align: center; }
.chapter-ring b { display: block; font-size: 30px; line-height: 1; letter-spacing: -0.04em; }
.chapter-ring small { display: block; margin-top: 4px; font-size: 9px; color: var(--muted); letter-spacing: 0.1em; }
.chapter-hero-side .side-note { font-size: 10.5px; color: var(--muted); text-align: center; }
.chapter-hero-side .side-note b { color: var(--ink-soft); }

.chapter-tabs {
  display: flex;
  gap: 4px;
  margin: 20px 0 24px;
  padding: 5px;
  border-radius: 15px;
  background: var(--paper-deep);
  border: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.chapter-tabs::-webkit-scrollbar { display: none; }
.chapter-tabs a {
  flex: 1;
  min-width: max-content;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  transition: background 0.2s, color 0.2s, box-shadow 0.2s;
}
.chapter-tabs a:hover { color: var(--ink); }
.chapter-tabs a.active { background: var(--card); color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.05); }
.chapter-tabs a .tab-num { font-size: 9px; opacity: 0.6; }

.goal-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 22px;
  scrollbar-width: thin;
}
.goal-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 11px;
  color: var(--ink-soft);
}
.goal-chip i { color: var(--teal); font-style: normal; font-weight: 800; }

.chapter-layout { display: grid; grid-template-columns: 1fr 300px; gap: 22px; align-items: start; }
.chapter-main { min-width: 0; }
.chapter-side { position: sticky; top: 92px; display: grid; gap: 14px; }
.side-card { padding: 20px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.side-card h4 { margin: 0 0 12px; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.side-route { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; counter-reset: step; }
.side-route li { display: flex; gap: 10px; padding: 8px 0; font-size: 11.5px; color: var(--muted); border-bottom: 1px dashed var(--line); }
.side-route li:last-child { border-bottom: 0; }
.side-route li::before {
  counter-increment: step;
  content: counter(step);
  width: 20px; height: 20px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--paper-deep);
  color: var(--ink-soft);
  font-size: 9px;
  font-weight: 800;
}
.side-route li.done { color: var(--teal); }
.side-route li.done::before { background: var(--teal-soft); color: var(--teal); content: "✓"; }
.side-card .progress { margin-top: 6px; }
.side-stat { display: flex; align-items: baseline; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
.side-stat b { color: var(--ink); font-size: 14px; }

/* 知识卡 */
.anim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .anim-grid { grid-template-columns: 1fr; } }
.k-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.k-toolbar h2 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
.k-toolbar p { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }
.k-list { display: grid; gap: 12px; }
.k-card {
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--card);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.k-card:hover { border-color: var(--line-strong); }
.k-card.learned { border-color: #BFE2D7; background: linear-gradient(180deg, #FFFDF8, #FBFEFC); }
.k-head {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 18px;
  border: 0;
  background: transparent;
  text-align: left;
}
.k-index {
  width: 36px; height: 36px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 11px;
  background: var(--paper-deep);
  color: var(--ink-soft);
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: 700;
}
.k-card.learned .k-index { background: var(--teal-soft); color: var(--teal); }
.k-head-main { min-width: 0; flex: 1; }
.k-head-main h3 { margin: 0; font-size: 15.5px; letter-spacing: -0.01em; }
.k-head-main p { margin: 2px 0 0; font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
.k-status { font-size: 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.k-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.k-card.learned .k-status .dot { background: var(--teal); }
.k-chevron { font-size: 13px; color: var(--muted); transition: transform 0.25s; }
.k-card.open .k-chevron { transform: rotate(180deg); }
.k-body { display: none; padding: 0 18px 20px 68px; }
.k-card.open .k-body { display: block; animation: fadeSlide 0.28s ease both; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
.k-core {
  padding: 13px 15px;
  border-left: 3px solid var(--accent, var(--coral));
  background: var(--soft, var(--coral-soft));
  border-radius: 0 10px 10px 0;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.8;
}
.k-points { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.k-points li { position: relative; padding-left: 20px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.75; }
.k-points li::before { content: "◆"; position: absolute; left: 2px; top: 1px; color: var(--accent, var(--coral)); font-size: 8px; }
.formula-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.formula-box {
  flex: 1 1 180px;
  padding: 11px 14px;
  border-radius: 11px;
  background: #F8F4EA;
  border: 1px solid var(--line);
}
.formula-box small { display: block; font-size: 9px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 2px; }
.formula-box code {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;
  color: var(--ink);
  font-weight: 700;
  letter-spacing: 0.01em;
}
.k-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.note-box { padding: 10px 12px; border-radius: 10px; font-size: 11.5px; line-height: 1.7; }
.note-box b { display: block; font-size: 9.5px; letter-spacing: 0.08em; margin-bottom: 3px; }
.note-tip { background: var(--teal-soft); color: #195E54; }
.note-tip b { color: var(--teal); }
.note-warn { background: var(--coral-soft); color: #7D3023; }
.note-warn b { color: var(--coral-deep); }
.k-why {
  margin-top: 10px;
  padding: 10px 13px;
  border-radius: 10px;
  background: var(--blue-soft);
  color: #274B9E;
  font-size: 11.5px;
  line-height: 1.75;
}
.k-why b { color: var(--blue); }
.k-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.learn-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: transparent;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  transition: all 0.2s;
}
.learn-btn:hover { border-color: var(--teal); color: var(--teal); }
.learn-btn.on { background: var(--teal); border-color: var(--teal); color: #fff; }

/* 例题页 */
.example-card {
  padding: 26px;
  border-radius: var(--radius-lg);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.example-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.example-top h2 { margin: 4px 0 0; font-size: 23px; letter-spacing: -0.02em; }
.example-problem {
  margin: 20px 0 16px;
  padding: 18px 20px;
  border-radius: 14px;
  background: var(--paper);
  border: 1px dashed var(--line-strong);
  font-size: 14px;
  line-height: 1.9;
}
.example-figure {
  max-width: 520px;
  margin: 0 auto 18px;
  padding: 12px;
  border-radius: 14px;
  background: #F8F4EA;
  border: 1px solid var(--line);
}
.example-figure svg { width: 100%; height: auto; }
.example-hint {
  display: flex;
  gap: 9px;
  padding: 12px 15px;
  border-radius: 11px;
  background: var(--gold-soft);
  color: #77540C;
  font-size: 12px;
}
.example-hint b { flex: 0 0 auto; }
.steps { margin: 20px 0 0; display: grid; gap: 0; }
.step {
  position: relative;
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 14px;
  padding-bottom: 22px;
}
.step:last-child { padding-bottom: 0; }
.step::before {
  content: "";
  position: absolute;
  left: 19px; top: 34px; bottom: 0;
  width: 1.5px;
  background: var(--line);
}
.step:last-child::before { display: none; }
.step-n {
  position: relative;
  z-index: 1;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--paper-deep);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: 700;
}
.step h4 { margin: 8px 0 4px; font-size: 13px; }
.step p { margin: 0; font-size: 12.5px; color: var(--ink-soft); line-height: 1.85; }
.example-answer {
  display: flex;
  gap: 12px;
  margin-top: 22px;
  padding: 16px 18px;
  border-radius: 13px;
  background: var(--teal-soft);
  color: #145A50;
}
.example-answer b { flex: 0 0 auto; font-size: 12px; }
.example-answer p { margin: 0; font-size: 13px; line-height: 1.8; }
.example-method {
  margin-top: 12px;
  padding: 12px 16px;
  border-radius: 11px;
  background: var(--blue-soft);
  color: #274B9E;
  font-size: 11.5px;
}
.example-method b { color: var(--blue); }
.example-cta { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

/* ---------- 动画实验室 ---------- */
.lab-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding: 18px 0 4px;
}
.lab-hero h1 { margin: 8px 0 8px; font-size: clamp(32px, 4vw, 46px); letter-spacing: -0.045em; }
.lab-hero p { margin: 0; max-width: 620px; color: var(--muted); font-size: 13.5px; }
.lab-layout { display: grid; grid-template-columns: 310px 1fr; gap: 20px; margin-top: 24px; align-items: start; }
.lab-menu { display: grid; gap: 8px; }
.lab-menu .menu-title { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); padding: 4px 4px 6px; }
.lab-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.lab-item:hover { background: var(--card); border-color: var(--line); transform: translateX(2px); }
.lab-item.active { background: var(--card); border-color: var(--line); box-shadow: var(--shadow-sm); }
.lab-item-icon {
  width: 38px; height: 38px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 11px;
  background: var(--soft);
  color: var(--accent);
  font-family: Georgia, serif;
  font-weight: 700;
  font-size: 16px;
}
.lab-item-main { min-width: 0; }
.lab-item-main b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab-item-main span { display: block; font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.lab-item .seen-dot { width: 6px; height: 6px; margin-left: auto; border-radius: 50%; background: var(--teal); flex: 0 0 auto; }

.lab-stage {
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
}
.lab-stage-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 26px 0;
}
.lab-stage-head h2 { margin: 4px 0 3px; font-size: 23px; letter-spacing: -0.025em; }
.lab-stage-head p { margin: 0; font-size: 12px; color: var(--muted); }
.lab-stage-head .chip { flex: 0 0 auto; }
.lab-canvas {
  position: relative;
  margin: 14px 18px 0;
  border-radius: 18px;
  background:
    radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.9), transparent 50%),
    #F8F4EA;
  border: 1px solid var(--line);
  overflow: hidden;
  min-height: 360px;
}
.lab-canvas > svg { width: 100%; height: auto; display: block; }
.lab-controls { padding: 16px 26px 22px; }
.control-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.control-row:last-child { margin-bottom: 0; }
.control-label { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 76px; }
.range-wrap { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; }
.range-wrap output {
  min-width: 48px;
  padding: 3px 7px;
  border-radius: 7px;
  background: var(--paper-deep);
  font-family: var(--mono);
  font-size: 11px;
  text-align: center;
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 5px;
  border-radius: 999px;
  background: var(--line-strong);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--card);
  box-shadow: 0 2px 6px rgba(0,0,0,.22);
  cursor: grab;
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--card);
  box-shadow: 0 2px 6px rgba(0,0,0,.22);
  cursor: grab;
}
.lab-note {
  display: flex;
  gap: 9px;
  margin-top: 12px;
  padding: 11px 13px;
  border-radius: 10px;
  background: var(--blue-soft);
  color: #274B9E;
  font-size: 11px;
  line-height: 1.7;
}
.lab-note b { flex: 0 0 auto; }
.lab-question {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 16px 26px;
  background: var(--paper);
  border-top: 1px solid var(--line);
}
.lab-question p { margin: 0; font-size: 11.5px; color: var(--muted); }
.lab-question p b { color: var(--ink); display: block; font-size: 9.5px; letter-spacing: 0.08em; margin-bottom: 2px; }
.lab-readouts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 26px 16px; }
.readout {
  flex: 1 1 90px;
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--paper);
  border: 1px solid var(--line);
}
.readout small { display: block; font-size: 8.5px; color: var(--muted); letter-spacing: 0.06em; }
.readout b { display: block; font-family: Georgia, serif; font-size: 17px; line-height: 1.3; }
.readout.accent b { color: var(--accent, var(--coral)); }

.btn-soft.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

/* 勾股定理面积条 */
.area-bars { display: grid; gap: 7px; margin: 6px 0 10px; }
.area-bar { display: grid; grid-template-columns: 26px 1fr 42px; align-items: center; gap: 8px; }
.area-bar > span { font-family: Georgia, serif; font-size: 11px; font-weight: 700; color: var(--muted); }
.area-bar > b { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); text-align: right; }
.area-bar .track { height: 12px; border-radius: 999px; background: var(--paper-deep); overflow: hidden; }
.area-bar .track i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--coral); transition: width .35s ease; }
.area-bar .track i.teal { background: var(--teal); }
.area-bar .track i.gold { background: var(--gold); }

/* 不等式变号魔术 */
.magic-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 11px 13px;
  border-radius: 12px;
  background: var(--gold-soft);
  border: 1px dashed #E8CE8A;
}
.magic-label { font-size: 10px; font-weight: 800; color: #8A5E07; letter-spacing: 0.06em; }
.magic-eq { font-family: Georgia, serif; font-size: 16px; font-weight: 700; color: #6E4A06; min-width: 100px; }
.magic-note { font-size: 10px; color: #8A5E07; margin-left: auto; }

/* SVG 交互通用 */
.draggable { cursor: grab; touch-action: none; }
.draggable:active { cursor: grabbing; }
.svg-label { font-family: var(--font); font-size: 12px; fill: var(--ink); font-weight: 700; }
.svg-small { font-family: var(--font); font-size: 9.5px; fill: var(--muted); }
.svg-math { font-family: Georgia, serif; font-size: 15px; fill: var(--ink); font-weight: 700; }
.svg-node { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.svg-node.accent { fill: var(--coral); stroke: var(--card); }
.grid-line { stroke: #DED3C1; stroke-width: 1; }
.grid-line.major { stroke: #CFC0A9; stroke-width: 1.2; }
.axis-line { stroke: var(--ink); stroke-width: 1.6; }
.dash-line { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 5; }
.solid-fill { opacity: 0.18; }

/* 概率实验 */
.prob-layout { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 16px; padding: 18px 22px 8px; }
.coin-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
.coin {
  width: 120px; height: 120px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #FFE7A6, #E8A31A 60%, #B97A08);
  border: 5px solid #FFF4D4;
  box-shadow: 0 14px 30px rgba(180, 120, 20, 0.3), inset 0 -6px 0 rgba(143, 94, 5, 0.3);
  color: #7A4E00;
  font-family: Georgia, serif;
  font-weight: 700;
  font-size: 38px;
  transition: transform 0.16s;
  user-select: none;
}
.coin.flipping { animation: coinFlip 0.5s ease; }
@keyframes coinFlip {
  0% { transform: rotateY(0) scale(1); }
  45% { transform: rotateY(540deg) scale(0.9); }
  100% { transform: rotateY(720deg) scale(1); }
}
.coin-caption { margin-top: 14px; font-size: 11px; color: var(--muted); text-align: center; }
.prob-bars { display: grid; gap: 12px; align-content: center; }
.prob-bar { display: grid; gap: 5px; }
.prob-bar-head { display: flex; justify-content: space-between; font-size: 11px; }
.prob-bar-head b { font-family: var(--mono); }
.bar-track { height: 26px; border-radius: 9px; background: var(--paper-deep); overflow: hidden; position: relative; }
.bar-fill { height: 100%; width: 0; border-radius: 9px; background: var(--gold); transition: width 0.35s ease; }
.bar-fill.tail { background: var(--teal); }
.prob-summary { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 22px 0; }
.prob-summary .readout { flex: 1 1 100px; }

/* ---------- 闯关练习 ---------- */
.practice-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; padding: 18px 0 4px; }
.practice-head h1 { margin: 8px 0; font-size: clamp(32px, 4vw, 46px); letter-spacing: -0.045em; }
.practice-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 600px; }
.practice-modes { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; margin-top: 24px; align-items: start; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 20px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--card);
  text-align: left;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.mode-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
.mode-card .m-ico {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--soft, var(--coral-soft));
  color: var(--accent, var(--coral));
  font-size: 20px;
}
.mode-card b { font-size: 15px; }
.mode-card span { font-size: 11px; color: var(--muted); line-height: 1.55; }
.mode-card small { margin-top: 4px; font-size: 9.5px; color: var(--accent, var(--coral)); font-weight: 700; letter-spacing: 0.04em; }
.chapter-picker { margin-top: 20px; }
.chapter-picker h3 { margin: 0 0 10px; font-size: 13px; }
.picker-grid { display: flex; flex-wrap: wrap; gap: 7px; }
.picker-chip {
  padding: 7px 11px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--card);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-soft);
  transition: all 0.18s;
}
.picker-chip:hover { border-color: var(--accent); color: var(--accent); }
.picker-chip.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.practice-side { display: grid; gap: 14px; }
.practice-tip { padding: 22px; border-radius: var(--radius); background: var(--ink); color: var(--paper); position: relative; overflow: hidden; }
.practice-tip::after { content: "?"; position: absolute; right: 14px; bottom: -26px; font-family: Georgia, serif; font-size: 120px; color: rgba(255,255,255,.06); }
.practice-tip h3 { margin: 0 0 8px; font-size: 16px; }
.practice-tip p { margin: 0; font-size: 11.5px; color: rgba(251,247,239,.65); line-height: 1.8; }
.practice-tip ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 11px; }
.practice-tip li { display: flex; gap: 7px; color: rgba(251,247,239,.8); }
.practice-tip li::before { content: "→"; color: var(--gold); }

/* 答题界面 */
.quiz-wrap { max-width: 900px; margin: 0 auto; }
.quiz-top {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 18px 0 14px;
}
.quiz-top .back-link { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.quiz-top .back-link:hover { color: var(--ink); }
.quiz-progress { flex: 1; display: flex; align-items: center; gap: 10px; }
.quiz-progress .progress { flex: 1; }
.quiz-progress small { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.quiz-combo {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 9px; border-radius: 999px;
  background: var(--gold-soft); color: #8A5E07;
  font-size: 10px; font-weight: 800;
}
.quiz-card {
  padding: 30px;
  border-radius: var(--radius-lg);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  animation: quizIn 0.3s ease both;
}
@keyframes quizIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
.quiz-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
.quiz-stem { font-size: 19px; line-height: 1.75; font-weight: 650; letter-spacing: -0.01em; }
.q-figure { margin: 13px 0 16px; padding: 10px 12px 8px; border-radius: 13px; background: #fff; border: 1px solid var(--line); }
.q-figure svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
.q-figure figcaption { margin-top: 5px; color: var(--muted); font-size: 8.5px; line-height: 1.6; text-align: center; }
.wrong-card .q-figure { margin-top: 9px; padding: 7px; }
.wrong-card .q-figure figcaption { font-size: 8px; }
@media (max-width: 520px) {
  .q-figure { padding: 7px; margin: 10px 0 12px; }
  .q-figure figcaption { font-size: 8px; }
}
.quiz-options { display: grid; gap: 9px; margin-top: 22px; }
.option {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  text-align: left;
  font-size: 14px;
  line-height: 1.5;
  transition: border-color 0.16s, background 0.16s, transform 0.16s, box-shadow 0.16s;
}
.option:hover:not(:disabled) { border-color: var(--ink-soft); transform: translateX(3px); box-shadow: var(--shadow-sm); }
.option .o-key {
  width: 27px; height: 27px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 8px;
  background: var(--paper-deep);
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--muted);
  transition: background 0.16s, color 0.16s;
}
.option.selected { border-color: var(--ink); background: #FFFBEF; }
.option.selected .o-key { background: var(--ink); color: var(--paper); }
.option.correct { border-color: var(--green); background: var(--green-soft); }
.option.correct .o-key { background: var(--green); color: #fff; }
.option.wrong { border-color: var(--red); background: #FFF0ED; }
.option.wrong .o-key { background: var(--red); color: #fff; }
.option:disabled { cursor: default; }
.option.dim { opacity: 0.55; }
.fill-zone { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.fill-zone input {
  flex: 1 1 220px;
  height: 50px;
  padding: 0 16px;
  border: 1.5px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  font-size: 17px;
  font-family: var(--mono);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.fill-zone input:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(34,33,29,.06); }
.fill-zone input.correct { border-color: var(--green); background: var(--green-soft); }
.fill-zone input.wrong { border-color: var(--red); background: #FFF0ED; }
.quiz-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.quiz-actions .left { display: flex; gap: 8px; }
.hint-btn { background: transparent; border: 0; font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; padding: 8px 0; }
.hint-btn:hover { color: var(--ink); }
.hint-box {
  margin-top: 16px;
  padding: 12px 15px;
  border-radius: 11px;
  background: var(--gold-soft);
  color: #77540C;
  font-size: 12px;
  animation: fadeSlide 0.25s ease both;
}
.feedback {
  margin-top: 20px;
  padding: 19px 20px;
  border-radius: 15px;
  border: 1px solid;
  animation: feedbackIn 0.35s ease both;
}
@keyframes feedbackIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.feedback.good { background: var(--green-soft); border-color: #C5E5C9; }
.feedback.bad { background: #FFF3F0; border-color: #F3CEC6; }
.feedback-head { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 800; }
.feedback.good .feedback-head { color: #2D6E3B; }
.feedback.bad .feedback-head { color: #9D392A; }
.feedback-head .f-emoji { font-size: 22px; }
.feedback-head .f-title { flex: 1; min-width: 0; }
.feedback-head .xp-gain { margin-left: auto; font-size: 11px; color: var(--green); background: rgba(75,155,95,.12); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.feedback.bad .xp-gain { color: #9D392A; background: rgba(217,75,54,.1); }
.feedback-answer { margin: 11px 0 0; font-size: 12.5px; line-height: 1.8; color: var(--ink-soft); }
.feedback-answer b { color: var(--ink); }
.feedback-exp { margin: 8px 0 0; font-size: 12px; line-height: 1.8; color: var(--ink-soft); }
.feedback-exp b { color: var(--ink); }
.feedback-next { margin-top: 14px; display: flex; gap: 9px; flex-wrap: wrap; }
.quiz-footnote { margin-top: 12px; text-align: center; font-size: 10.5px; color: var(--muted); }

/* 结果页 */
.result-wrap { max-width: 820px; margin: 20px auto; }
.result-card {
  position: relative;
  overflow: hidden;
  padding: 38px;
  border-radius: var(--radius-xl);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  text-align: center;
}
.result-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 180px;
  background: radial-gradient(ellipse at 50% 0%, var(--soft), transparent 70%);
  pointer-events: none;
}
.result-emoji { position: relative; font-size: 64px; line-height: 1; animation: popIn 0.5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes popIn { from { transform: scale(0.4) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
.result-card h1 { position: relative; margin: 14px 0 6px; font-size: 32px; letter-spacing: -0.035em; }
.result-card .result-sub { position: relative; margin: 0; color: var(--muted); font-size: 13px; }
.result-score { position: relative; display: flex; justify-content: center; gap: 20px; margin: 26px 0 22px; flex-wrap: wrap; }
.result-metric { min-width: 110px; padding: 14px 18px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.result-metric b { display: block; font-family: Georgia, serif; font-size: 28px; line-height: 1.1; }
.result-metric span { font-size: 9.5px; color: var(--muted); letter-spacing: 0.06em; }
.result-review {
  position: relative;
  margin: 20px auto 0;
  max-width: 560px;
  text-align: left;
  padding: 16px;
  border-radius: 13px;
  background: var(--paper);
  border: 1px dashed var(--line-strong);
  font-size: 11.5px;
  color: var(--muted);
}
.result-review b { color: var(--ink); }
.result-actions { position: relative; display: flex; justify-content: center; gap: 10px; margin-top: 24px; flex-wrap: wrap; }

/* ---------- 错题本 ---------- */
.wrong-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 18px 0 4px; }
.wrong-head h1 { margin: 8px 0; font-size: clamp(32px, 4vw, 46px); letter-spacing: -0.045em; }
.wrong-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 560px; }
.wrong-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px 0 16px; }
.wrong-stat { padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.wrong-stat b { font-size: 22px; line-height: 1; }
.wrong-stat span { font-size: 10px; color: var(--muted); display: block; }
.wrong-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.wrong-filters { display: flex; gap: 5px; flex-wrap: wrap; }
.wf-btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: 10.5px; color: var(--muted); }
.wf-btn.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.wrong-list { display: grid; gap: 12px; }
.wrong-card {
  padding: 20px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-left: 4px solid var(--red);
}
.wrong-card.mastered { border-left-color: var(--teal); opacity: 0.82; }
.wrong-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
.wrong-card-head .date { margin-left: auto; font-size: 9.5px; color: var(--muted); }
.wrong-stem { font-size: 14px; line-height: 1.75; font-weight: 600; }
.wrong-answers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.wa { padding: 6px 10px; border-radius: 8px; font-size: 11px; }
.wa.bad { background: #FFF0ED; color: #9D392A; }
.wa.good { background: var(--green-soft); color: #2D6E3B; }
.wrong-exp { margin-top: 10px; padding: 11px 13px; border-radius: 9px; background: var(--paper); font-size: 11.5px; line-height: 1.75; color: var(--ink-soft); }
.wrong-card-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.wrong-card-foot .review-meta { margin-left: auto; font-size: 9.5px; color: var(--muted); }
.empty-state {
  padding: 64px 24px;
  border-radius: var(--radius-lg);
  border: 1.5px dashed var(--line-strong);
  background: rgba(255, 253, 248, 0.6);
  text-align: center;
}
.empty-emoji { font-size: 54px; line-height: 1; margin-bottom: 12px; }
.empty-state h3 { margin: 0 0 6px; font-size: 19px; }
.empty-state p { margin: 0 auto 18px; max-width: 420px; color: var(--muted); font-size: 12px; line-height: 1.8; }

/* ---------- 成长成就 ---------- */
.ach-hero {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 24px;
  padding: 30px;
  border-radius: var(--radius-xl);
  background: linear-gradient(145deg, #23221E, #35322B);
  color: var(--paper);
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.ach-hero::before {
  content: "";
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,163,26,.3), transparent 62%);
  right: -120px; top: -180px;
}
.ach-level { display: flex; align-items: center; gap: 18px; position: relative; }
.ach-level-icon {
  width: 82px; height: 82px;
  flex: 0 0 auto;
  border-radius: 24px;
  display: grid; place-items: center;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  font-size: 38px;
}
.ach-level h1 { margin: 4px 0 3px; font-size: 30px; letter-spacing: -0.03em; }
.ach-level p { margin: 0; color: rgba(251,247,239,.55); font-size: 11.5px; }
.ach-xp { position: relative; margin-top: 24px; }
.ach-xp-head { display: flex; justify-content: space-between; font-size: 10.5px; color: rgba(251,247,239,.55); margin-bottom: 7px; }
.ach-xp-head b { color: var(--gold); }
.ach-hero .progress { background: rgba(255,255,255,.12); }
.ach-hero .progress > i { background: linear-gradient(90deg, var(--gold), #FFD97A); }
.ach-hero-side { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.ach-hero-side .ach-stat { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,.12); font-size: 11px; }
.ach-hero-side .ach-stat:last-child { border-bottom: 0; }
.ach-hero-side .ach-stat span { color: rgba(251,247,239,.55); }
.ach-hero-side .ach-stat b { color: var(--paper); font-size: 13px; }
.level-track { display: flex; gap: 6px; margin-top: 18px; }
.level-dot {
  flex: 1;
  height: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  position: relative;
}
.level-dot.on { background: var(--gold); }
.section-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 32px 0 16px; }
.section-title-row h2 { margin: 0; font-size: 23px; letter-spacing: -0.03em; }
.section-title-row p { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); }
.badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.badge-card {
  position: relative;
  padding: 18px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  text-align: center;
  transition: transform 0.2s, box-shadow 0.2s;
}
.badge-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.badge-card.locked { opacity: 0.52; filter: grayscale(0.5); }
.badge-card.unlocked { border-color: #EED9A9; background: linear-gradient(160deg, #FFFDF8, #FFF8E6); }
.badge-ico { font-size: 34px; line-height: 1; margin-bottom: 8px; }
.badge-card b { display: block; font-size: 12.5px; }
.badge-card span { display: block; margin-top: 3px; font-size: 9.5px; color: var(--muted); line-height: 1.5; }
.badge-card .badge-check {
  position: absolute; top: 9px; right: 9px;
  width: 18px; height: 18px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--teal);
  color: #fff;
  font-size: 9px;
}
.ach-lower { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 26px; align-items: start; }
.ach-panel { padding: 22px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
.ach-panel h3 { margin: 0 0 14px; font-size: 14px; }
.chapter-mastery-list { display: grid; gap: 9px; }
.mastery-row { display: grid; grid-template-columns: 122px 1fr 40px; align-items: center; gap: 10px; font-size: 10.5px; }
.mastery-row span:first-child { color: var(--ink-soft); line-height: 1.4; }
.mastery-row small { text-align: right; color: var(--muted); font-family: var(--mono); font-size: 9px; }
.activity-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.activity-list li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--paper); font-size: 10.5px; color: var(--muted); }
.activity-list li b { color: var(--ink-soft); font-weight: 600; }
.activity-list .a-time { margin-left: auto; font-size: 8.5px; white-space: nowrap; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 11.5px; }
.settings-row:last-child { border-bottom: 0; }
.switch { width: 42px; height: 24px; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; transition: background .2s; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.switch.on { background: var(--teal); }
.switch.on::after { transform: translateX(18px); }
.danger-btn { border: 1px solid #EFC3BB; background: #FFF7F5; color: #9D392A; padding: 7px 12px; border-radius: 8px; font-size: 10.5px; font-weight: 700; }
.danger-btn:hover { background: #FFECE8; }

/* ---------- 自学指南 ---------- */
.guide-hero {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 30px;
  align-items: center;
  padding: 32px 34px;
  border-radius: var(--radius-xl);
  background: var(--blue-soft);
  border: 1px solid #CFDDFB;
}
.guide-hero h1 { margin: 10px 0 10px; font-size: clamp(30px, 3.7vw, 44px); letter-spacing: -0.04em; line-height: 1.18; }
.guide-hero p { margin: 0; color: var(--ink-soft); font-size: 13px; line-height: 1.85; max-width: 620px; }
.timer-card { padding: 20px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-md); text-align: center; }
.timer-ring {
  --p: 0;
  width: 156px; height: 156px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: conic-gradient(var(--blue) calc(var(--p) * 1%), var(--paper-deep) 0);
  display: grid; place-items: center;
  position: relative;
}
.timer-ring::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--card); }
.timer-ring div { position: relative; }
.timer-ring b { display: block; font-family: var(--mono); font-size: 28px; letter-spacing: -0.04em; }
.timer-ring small { font-size: 9px; color: var(--muted); }
.timer-card h3 { margin: 0 0 4px; font-size: 13px; }
.timer-card p { margin: 0 0 12px; font-size: 10px; color: var(--muted); }
.timer-controls { display: flex; justify-content: center; gap: 7px; }
.timer-controls .btn { min-height: 36px; padding: 7px 13px; font-size: 11px; }
.steps-flow { display: grid; gap: 10px; margin-top: 22px; }
.step-row {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  gap: 16px;
  align-items: start;
  padding: 18px 20px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  transition: border-color .2s, box-shadow .2s;
}
.step-row:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
.step-big {
  width: 50px; height: 50px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--paper-deep);
  font-size: 22px;
}
.step-row h3 { margin: 1px 0 4px; font-size: 17px; }
.step-row h3 small { font-size: 9.5px; color: var(--muted); font-weight: 600; margin-left: 8px; }
.step-row p { margin: 0; font-size: 12px; color: var(--ink-soft); line-height: 1.75; }
.step-row .step-action { margin-top: 7px; font-size: 11px; color: var(--blue); background: var(--blue-soft); padding: 6px 9px; border-radius: 7px; display: inline-block; }
.step-row .step-time { font-size: 9.5px; color: var(--muted); white-space: nowrap; padding-top: 5px; }
.guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; align-items: start; }
.guide-card { padding: 24px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
.guide-card h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.025em; }
.guide-card > p { margin: 0 0 14px; font-size: 11.5px; color: var(--muted); }
.prompt-list { display: grid; gap: 7px; }
.prompt-item { padding: 10px 12px; border-radius: 9px; background: var(--paper); font-size: 11.5px; color: var(--ink-soft); line-height: 1.7; }
.prompt-item b { color: var(--coral-deep); }
.feynman-box { border-radius: 14px; background: var(--gold-soft); padding: 15px; border: 1px dashed #E8CE8A; }
.feynman-box h3 { margin: 0 0 6px; font-size: 13px; color: #7A5509; }
.feynman-box p { margin: 0 0 9px; font-size: 10.5px; color: #8E6714; line-height: 1.7; }
.feynman-box textarea { width: 100%; min-height: 110px; resize: vertical; padding: 10px 12px; border-radius: 9px; border: 1px solid #E6CA85; background: #FFFDF7; font-size: 12px; line-height: 1.7; outline: none; }
.feynman-box textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,163,26,.14); }
.feynman-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
.feynman-foot span { font-size: 9px; color: #9A7117; }
.checklist { display: grid; gap: 6px; }
.check-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 11.5px; color: var(--ink-soft); }
.check-item:last-child { border-bottom: 0; }
.check-item input { width: 16px; height: 16px; accent-color: var(--teal); margin-top: 2px; flex: 0 0 auto; }
.check-item.done span { text-decoration: line-through; color: var(--muted); }
.mistake-types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mistake-type { padding: 11px; border-radius: 10px; background: var(--paper); font-size: 10.5px; line-height: 1.6; }
.mistake-type b { display: block; color: var(--coral-deep); margin-bottom: 2px; }

/* ---------- 页脚 / Toast / Modal ---------- */
.site-footer { margin-top: 40px; border-top: 1px solid var(--line); background: rgba(243, 235, 221, 0.6); }
.footer-inner { max-width: var(--maxw); margin: 0 auto; padding: 34px 28px 30px; display: grid; grid-template-columns: 1fr auto; gap: 22px 40px; align-items: start; }
.footer-brand { display: flex; gap: 12px; align-items: center; }
.footer-brand strong { display: block; font-size: 13px; }
.footer-brand p { margin: 2px 0 0; font-size: 10.5px; color: var(--muted); }
.footer-links { display: flex; gap: 16px; flex-wrap: wrap; padding-top: 8px; }
.footer-links a { font-size: 11px; color: var(--muted); }
.footer-links a:hover { color: var(--ink); }
.footer-note { grid-column: 1 / -1; margin: 0; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 9.5px; color: var(--muted); }

.toast-wrap { position: fixed; z-index: 200; left: 50%; bottom: 28px; translate: -50% 0; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: 13px;
  background: var(--ink);
  color: var(--paper);
  box-shadow: var(--shadow-lg);
  font-size: 12px;
  line-height: 1.5;
  animation: toastIn 0.32s cubic-bezier(.2,1.2,.4,1) both;
  pointer-events: auto;
}
.toast.out { animation: toastOut 0.28s ease both; }
.toast .t-emoji { font-size: 18px; }
.toast b { color: var(--gold); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px) scale(.98); } }

#confettiCanvas { position: fixed; inset: 0; z-index: 300; pointer-events: none; width: 100%; height: 100%; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(34, 33, 29, 0.45);
  backdrop-filter: blur(5px);
  animation: fadeIn .2s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(430px, 100%);
  padding: 26px;
  border-radius: 22px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  animation: modalIn .28s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
.modal h3 { margin: 0 0 7px; font-size: 19px; letter-spacing: -0.02em; }
.modal p { margin: 0 0 18px; font-size: 12px; color: var(--muted); line-height: 1.75; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- 小探险家头像与档案 ---------- */
.top-avatar {
  position: relative;
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  padding: 2px;
  border-radius: 50%;
  background: conic-gradient(from 210deg, #E8A31A, #EF654F, #C86DD7, #E8A31A);
  box-shadow: 0 0 0 1px rgba(34, 33, 29, 0.08), 0 5px 12px rgba(86, 65, 36, 0.14);
  transition: transform 0.22s, box-shadow 0.22s;
}
.top-avatar:hover { transform: rotate(-5deg) scale(1.06); box-shadow: 0 0 0 1px rgba(34, 33, 29, 0.08), 0 8px 18px rgba(86, 65, 36, 0.2); }
.top-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid var(--card); background: var(--card); }
.top-avatar .ta-star {
  position: absolute;
  right: -3px;
  bottom: -2px;
  width: 15px;
  height: 15px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold);
  color: var(--ink);
  font-size: 8px;
  border: 1.5px solid var(--card);
}
.hero-id { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 15px; }
.hero-avatar {
  width: 58px;
  height: 58px;
  flex: 0 0 auto;
  padding: 3px;
  border-radius: 50%;
  background: conic-gradient(from 210deg, #E8A31A, #EF654F, #C86DD7, #E8A31A);
  box-shadow: 0 8px 20px rgba(160, 100, 50, 0.18);
  transform: rotate(-3deg);
}
.hero-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2.5px solid var(--card); background: var(--card); }
.hero-id-copy b { display: block; font-size: 16px; line-height: 1.2; letter-spacing: -0.01em; }
.hero-id-copy small { display: block; margin-top: 2px; font-size: 10.5px; color: var(--muted); }
.hero-id-tag {
  margin-left: 2px;
  padding: 5px 9px;
  border-radius: 999px;
  background: var(--gold-soft);
  border: 1px solid #EED9A9;
  color: #8A5E07;
  font-size: 9.5px;
  font-weight: 800;
  white-space: nowrap;
}
.mission-complete {
  position: relative;
  z-index: 1;
  margin-top: 14px;
  padding: 9px 11px;
  border-radius: 10px;
  background: rgba(232, 163, 26, 0.15);
  border: 1px dashed rgba(232, 163, 26, 0.45);
  color: var(--gold);
  font-size: 10.5px;
  text-align: center;
}
.reward-chest {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.055);
  border: 1px dashed rgba(255, 255, 255, 0.16);
  transition: background 0.2s, border-color 0.2s;
}
.reward-chest.ready {
  background: rgba(232, 163, 26, 0.14);
  border-color: rgba(232, 163, 26, 0.5);
  box-shadow: 0 0 0 3px rgba(232, 163, 26, 0.05);
}
.reward-chest.ready .chest-icon { animation: chestShake 2.2s ease-in-out infinite; }
.reward-chest.opened { background: rgba(23, 143, 128, 0.13); border-color: rgba(23, 143, 128, 0.35); }
@keyframes chestShake {
  0%, 80%, 100% { transform: rotate(0) scale(1); }
  84% { transform: rotate(-7deg) scale(1.08); }
  88% { transform: rotate(7deg) scale(1.08); }
  92% { transform: rotate(-4deg) scale(1.04); }
}
.chest-icon { font-size: 24px; line-height: 1; flex: 0 0 auto; }
.chest-copy { min-width: 0; flex: 1; }
.chest-copy b { display: block; font-size: 11.5px; color: var(--paper); }
.chest-copy span { display: block; margin-top: 1px; font-size: 9.5px; color: rgba(251,247,239,.5); }
.chest-btn {
  flex: 0 0 auto;
  padding: 7px 10px;
  border: 0;
  border-radius: 8px;
  background: var(--gold);
  color: var(--ink);
  font-size: 9.5px;
  font-weight: 800;
  cursor: pointer;
}
.chest-btn[disabled] { background: rgba(255,255,255,.1); color: rgba(251,247,239,.35); cursor: not-allowed; }
.chest-tag { flex: 0 0 auto; padding: 4px 7px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-size: 8.5px; font-weight: 800; }
.ach-avatar {
  position: relative;
  width: 92px;
  height: 92px;
  flex: 0 0 auto;
  padding: 3px;
  border-radius: 27px;
  background: linear-gradient(145deg, #E8A31A, #EF654F);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
}
.ach-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 23px; border: 2px solid #23221E; background: var(--card); }
.ach-avatar i {
  position: absolute;
  right: -7px;
  bottom: -7px;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid #23221E;
  font-style: normal;
  font-size: 16px;
}
.profile-editor {
  display: flex;
  align-items: center;
  gap: 20px;
  max-width: 760px;
  padding: 20px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.pe-avatar { width: 92px; height: 92px; flex: 0 0 auto; padding: 3px; border-radius: 50%; background: conic-gradient(from 210deg, #E8A31A, #EF654F, #C86DD7, #E8A31A); box-shadow: var(--shadow-sm); }
.pe-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid var(--card); background: var(--card); }
.pe-main { flex: 1; min-width: 0; }
.pe-label { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
.pe-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.nickname-input { height: 36px; width: min(180px, 100%); padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--paper); font-size: 13px; outline: none; }
.nickname-input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(34, 33, 29, 0.06); }
.pe-hint { margin: 7px 0 0; font-size: 10px; color: var(--muted); }
.mission-stamp {
  position: absolute;
  top: 18px;
  right: 22px;
  padding: 4px 7px;
  border: 2px solid #B53A2A;
  border-radius: 4px;
  color: #B53A2A;
  font-family: var(--mono);
  font-size: 8.5px;
  line-height: 1.3;
  font-weight: 800;
  letter-spacing: .12em;
  text-align: center;
  transform: rotate(4deg);
  opacity: .75;
}
.result-face {
  position: relative;
