  font-weight: 700;
  color: var(--muted);
  transition: background 0.2s, color 0.2s, box-shadow 0.2s;
}
.chapter-tabs a:hover { color: var(--ink); }
.chapter-tabs a.active { background: var(--card); color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.05); }
.chapter-tabs a .tab-num { font-size: 9px; opacity: 0.6; }

.goal-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 22px;
  scrollbar-width: thin;
}
.goal-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 11px;
  color: var(--ink-soft);
}
.goal-chip i { color: var(--teal); font-style: normal; font-weight: 800; }

.chapter-layout { display: grid; grid-template-columns: 1fr 300px; gap: 22px; align-items: start; }
.chapter-main { min-width: 0; }
.chapter-side { position: sticky; top: 92px; display: grid; gap: 14px; }
.side-card { padding: 20px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.side-card h4 { margin: 0 0 12px; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.side-route { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; counter-reset: step; }
.side-route li { display: flex; gap: 10px; padding: 8px 0; font-size: 11.5px; color: var(--muted); border-bottom: 1px dashed var(--line); }
.side-route li:last-child { border-bottom: 0; }
.side-route li::before {
  counter-increment: step;
  content: counter(step);
  width: 20px; height: 20px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--paper-deep);
  color: var(--ink-soft);
  font-size: 9px;
  font-weight: 800;
}
.side-route li.done { color: var(--teal); }
.side-route li.done::before { background: var(--teal-soft); color: var(--teal); content: "✓"; }
.side-card .progress { margin-top: 6px; }
.side-stat { display: flex; align-items: baseline; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
.side-stat b { color: var(--ink); font-size: 14px; }

/* 知识卡 */
.anim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .anim-grid { grid-template-columns: 1fr; } }
.k-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.k-toolbar h2 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
.k-toolbar p { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }
.k-list { display: grid; gap: 12px; }
.k-card {
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--card);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.k-card:hover { border-color: var(--line-strong); }
.k-card.learned { border-color: #BFE2D7; background: linear-gradient(180deg, #FFFDF8, #FBFEFC); }
.k-head {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 18px;
  border: 0;
  background: transparent;
  text-align: left;
}
.k-index {
  width: 36px; height: 36px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 11px;
  background: var(--paper-deep);
  color: var(--ink-soft);
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: 700;
}
.k-card.learned .k-index { background: var(--teal-soft); color: var(--teal); }
.k-head-main { min-width: 0; flex: 1; }
.k-head-main h3 { margin: 0; font-size: 15.5px; letter-spacing: -0.01em; }
.k-head-main p { margin: 2px 0 0; font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
.k-status { font-size: 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.k-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.k-card.learned .k-status .dot { background: var(--teal); }
.k-chevron { font-size: 13px; color: var(--muted); transition: transform 0.25s; }
.k-card.open .k-chevron { transform: rotate(180deg); }
.k-body { display: none; padding: 0 18px 20px 68px; }
.k-card.open .k-body { display: block; animation: fadeSlide 0.28s ease both; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
.k-core {
  padding: 13px 15px;
  border-left: 3px solid var(--accent, var(--coral));
  background: var(--soft, var(--coral-soft));
  border-radius: 0 10px 10px 0;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.8;
}
.k-points { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.k-points li { position: relative; padding-left: 20px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.75; }
.k-points li::before { content: "◆"; position: absolute; left: 2px; top: 1px; color: var(--accent, var(--coral)); font-size: 8px; }
.formula-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.formula-box {
  flex: 1 1 180px;
  padding: 11px 14px;
  border-radius: 11px;
  background: #F8F4EA;
  border: 1px solid var(--line);
}
.formula-box small { display: block; font-size: 9px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 2px; }
.formula-box code {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;
  color: var(--ink);
  font-weight: 700;
  letter-spacing: 0.01em;
}
.k-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.note-box { padding: 10px 12px; border-radius: 10px; font-size: 11.5px; line-height: 1.7; }
.note-box b { display: block; font-size: 9.5px; letter-spacing: 0.08em; margin-bottom: 3px; }
.note-tip { background: var(--teal-soft); color: #195E54; }
.note-tip b { color: var(--teal); }
.note-warn { background: var(--coral-soft); color: #7D3023; }
.note-warn b { color: var(--coral-deep); }
.k-why {
  margin-top: 10px;
  padding: 10px 13px;
  border-radius: 10px;
  background: var(--blue-soft);
  color: #274B9E;
  font-size: 11.5px;
  line-height: 1.75;
}
.k-why b { color: var(--blue); }
.k-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.learn-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: transparent;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  transition: all 0.2s;
}
.learn-btn:hover { border-color: var(--teal); color: var(--teal); }
.learn-btn.on { background: var(--teal); border-color: var(--teal); color: #fff; }

/* 例题页 */
.example-card {
  padding: 26px;
  border-radius: var(--radius-lg);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.example-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.example-top h2 { margin: 4px 0 0; font-size: 23px; letter-spacing: -0.02em; }
.example-problem {
  margin: 20px 0 16px;
  padding: 18px 20px;
  border-radius: 14px;
  background: var(--paper);
  border: 1px dashed var(--line-strong);
  font-size: 14px;
  line-height: 1.9;
}
.example-figure {
  max-width: 520px;
  margin: 0 auto 18px;
  padding: 12px;
  border-radius: 14px;
  background: #F8F4EA;
  border: 1px solid var(--line);
}
.example-figure svg { width: 100%; height: auto; }
.example-hint {
  display: flex;
  gap: 9px;
  padding: 12px 15px;
  border-radius: 11px;
  background: var(--gold-soft);
  color: #77540C;
  font-size: 12px;
}
.example-hint b { flex: 0 0 auto; }
.steps { margin: 20px 0 0; display: grid; gap: 0; }
.step {
  position: relative;
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 14px;
  padding-bottom: 22px;
}
.step:last-child { padding-bottom: 0; }
.step::before {
  content: "";
  position: absolute;
  left: 19px; top: 34px; bottom: 0;
  width: 1.5px;
  background: var(--line);
}
.step:last-child::before { display: none; }
.step-n {
  position: relative;
  z-index: 1;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--paper-deep);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: 700;
}
.step h4 { margin: 8px 0 4px; font-size: 13px; }
.step p { margin: 0; font-size: 12.5px; color: var(--ink-soft); line-height: 1.85; }
.example-answer {
  display: flex;
  gap: 12px;
  margin-top: 22px;
  padding: 16px 18px;
  border-radius: 13px;
  background: var(--teal-soft);
  color: #145A50;
}
.example-answer b { flex: 0 0 auto; font-size: 12px; }
.example-answer p { margin: 0; font-size: 13px; line-height: 1.8; }
.example-method {
  margin-top: 12px;
  padding: 12px 16px;
  border-radius: 11px;
  background: var(--blue-soft);
  color: #274B9E;
  font-size: 11.5px;
}
.example-method b { color: var(--blue); }
.example-cta { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

/* ---------- 动画实验室 ---------- */
.lab-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding: 18px 0 4px;
}
.lab-hero h1 { margin: 8px 0 8px; font-size: clamp(32px, 4vw, 46px); letter-spacing: -0.045em; }
.lab-hero p { margin: 0; max-width: 620px; color: var(--muted); font-size: 13.5px; }
.lab-layout { display: grid; grid-template-columns: 310px 1fr; gap: 20px; margin-top: 24px; align-items: start; }
.lab-menu { display: grid; gap: 8px; }
.lab-menu .menu-title { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); padding: 4px 4px 6px; }
.lab-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.lab-item:hover { background: var(--card); border-color: var(--line); transform: translateX(2px); }
.lab-item.active { background: var(--card); border-color: var(--line); box-shadow: var(--shadow-sm); }
.lab-item-icon {
  width: 38px; height: 38px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 11px;
  background: var(--soft);
  color: var(--accent);
  font-family: Georgia, serif;
  font-weight: 700;
  font-size: 16px;
}
.lab-item-main { min-width: 0; }
.lab-item-main b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab-item-main span { display: block; font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.lab-item .seen-dot { width: 6px; height: 6px; margin-left: auto; border-radius: 50%; background: var(--teal); flex: 0 0 auto; }

.lab-stage {
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
}
.lab-stage-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 26px 0;
}
.lab-stage-head h2 { margin: 4px 0 3px; font-size: 23px; letter-spacing: -0.025em; }
.lab-stage-head p { margin: 0; font-size: 12px; color: var(--muted); }
.lab-stage-head .chip { flex: 0 0 auto; }
.lab-canvas {
  position: relative;
  margin: 14px 18px 0;
  border-radius: 18px;
  background:
    radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.9), transparent 50%),
    #F8F4EA;
  border: 1px solid var(--line);
  overflow: hidden;
  min-height: 360px;
}
.lab-canvas > svg { width: 100%; height: auto; display: block; }
.lab-controls { padding: 16px 26px 22px; }
.control-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.control-row:last-child { margin-bottom: 0; }
.control-label { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 76px; }
.range-wrap { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; }
.range-wrap output {
  min-width: 48px;
  padding: 3px 7px;
  border-radius: 7px;
  background: var(--paper-deep);
  font-family: var(--mono);
  font-size: 11px;
  text-align: center;
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 5px;
  border-radius: 999px;
  background: var(--line-strong);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--card);
  box-shadow: 0 2px 6px rgba(0,0,0,.22);
  cursor: grab;
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--card);
  box-shadow: 0 2px 6px rgba(0,0,0,.22);
  cursor: grab;
}
.lab-note {
  display: flex;
  gap: 9px;
  margin-top: 12px;
  padding: 11px 13px;
  border-radius: 10px;
  background: var(--blue-soft);
  color: #274B9E;
  font-size: 11px;
  line-height: 1.7;
}
.lab-note b { flex: 0 0 auto; }
.lab-question {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 16px 26px;
  background: var(--paper);
  border-top: 1px solid var(--line);
}
.lab-question p { margin: 0; font-size: 11.5px; color: var(--muted); }
.lab-question p b { color: var(--ink); display: block; font-size: 9.5px; letter-spacing: 0.08em; margin-bottom: 2px; }
.lab-readouts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 26px 16px; }
.readout {
  flex: 1 1 90px;
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--paper);
  border: 1px solid var(--line);
}
.readout small { display: block; font-size: 8.5px; color: var(--muted); letter-spacing: 0.06em; }
.readout b { display: block; font-family: Georgia, serif; font-size: 17px; line-height: 1.3; }
.readout.accent b { color: var(--accent, var(--coral)); }

.btn-soft.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

/* 勾股定理面积条 */
.area-bars { display: grid; gap: 7px; margin: 6px 0 10px; }
.area-bar { display: grid; grid-template-columns: 26px 1fr 42px; align-items: center; gap: 8px; }
.area-bar > span { font-family: Georgia, serif; font-size: 11px; font-weight: 700; color: var(--muted); }
.area-bar > b { font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); text-align: right; }
.area-bar .track { height: 12px; border-radius: 999px; background: var(--paper-deep); overflow: hidden; }
.area-bar .track i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--coral); transition: width .35s ease; }
.area-bar .track i.teal { background: var(--teal); }
.area-bar .track i.gold { background: var(--gold); }

/* 不等式变号魔术 */
.magic-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 11px 13px;
  border-radius: 12px;
  background: var(--gold-soft);
  border: 1px dashed #E8CE8A;
}
.magic-label { font-size: 10px; font-weight: 800; color: #8A5E07; letter-spacing: 0.06em; }
.magic-eq { font-family: Georgia, serif; font-size: 16px; font-weight: 700; color: #6E4A06; min-width: 100px; }
.magic-note { font-size: 10px; color: #8A5E07; margin-left: auto; }

/* SVG 交互通用 */
.draggable { cursor: grab; touch-action: none; }
.draggable:active { cursor: grabbing; }
.svg-label { font-family: var(--font); font-size: 12px; fill: var(--ink); font-weight: 700; }
.svg-small { font-family: var(--font); font-size: 9.5px; fill: var(--muted); }
.svg-math { font-family: Georgia, serif; font-size: 15px; fill: var(--ink); font-weight: 700; }
.svg-node { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.svg-node.accent { fill: var(--coral); stroke: var(--card); }
.grid-line { stroke: #DED3C1; stroke-width: 1; }
.grid-line.major { stroke: #CFC0A9; stroke-width: 1.2; }
.axis-line { stroke: var(--ink); stroke-width: 1.6; }
.dash-line { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 5; }
.solid-fill { opacity: 0.18; }

/* 概率实验 */
.prob-layout { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 16px; padding: 18px 22px 8px; }
.coin-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
.coin {
  width: 120px; height: 120px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #FFE7A6, #E8A31A 60%, #B97A08);
  border: 5px solid #FFF4D4;
  box-shadow: 0 14px 30px rgba(180, 120, 20, 0.3), inset 0 -6px 0 rgba(143, 94, 5, 0.3);
  color: #7A4E00;
  font-family: Georgia, serif;
  font-weight: 700;
  font-size: 38px;
  transition: transform 0.16s;
  user-select: none;
}
.coin.flipping { animation: coinFlip 0.5s ease; }
@keyframes coinFlip {
  0% { transform: rotateY(0) scale(1); }
  45% { transform: rotateY(540deg) scale(0.9); }
  100% { transform: rotateY(720deg) scale(1); }
}
.coin-caption { margin-top: 14px; font-size: 11px; color: var(--muted); text-align: center; }
.prob-bars { display: grid; gap: 12px; align-content: center; }
.prob-bar { display: grid; gap: 5px; }
.prob-bar-head { display: flex; justify-content: space-between; font-size: 11px; }
.prob-bar-head b { font-family: var(--mono); }
.bar-track { height: 26px; border-radius: 9px; background: var(--paper-deep); overflow: hidden; position: relative; }
.bar-fill { height: 100%; width: 0; border-radius: 9px; background: var(--gold); transition: width 0.35s ease; }
.bar-fill.tail { background: var(--teal); }
.prob-summary { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 22px 0; }
.prob-summary .readout { flex: 1 1 100px; }

/* ---------- 闯关练习 ---------- */
.practice-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; padding: 18px 0 4px; }
.practice-head h1 { margin: 8px 0; font-size: clamp(32px, 4vw, 46px); letter-spacing: -0.045em; }
.practice-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 600px; }
.practice-modes { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; margin-top: 24px; align-items: start; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 20px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--card);
  text-align: left;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.mode-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
.mode-card .m-ico {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--soft, var(--coral-soft));
  color: var(--accent, var(--coral));
  font-size: 20px;
}
.mode-card b { font-size: 15px; }
.mode-card span { font-size: 11px; color: var(--muted); line-height: 1.55; }
.mode-card small { margin-top: 4px; font-size: 9.5px; color: var(--accent, var(--coral)); font-weight: 700; letter-spacing: 0.04em; }
.chapter-picker { margin-top: 20px; }
.chapter-picker h3 { margin: 0 0 10px; font-size: 13px; }
.picker-grid { display: flex; flex-wrap: wrap; gap: 7px; }
.picker-chip {
  padding: 7px 11px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--card);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-soft);
  transition: all 0.18s;
}
.picker-chip:hover { border-color: var(--accent); color: var(--accent); }
.picker-chip.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.practice-side { display: grid; gap: 14px; }
.practice-tip { padding: 22px; border-radius: var(--radius); background: var(--ink); color: var(--paper); position: relative; overflow: hidden; }
.practice-tip::after { content: "?"; position: absolute; right: 14px; bottom: -26px; font-family: Georgia, serif; font-size: 120px; color: rgba(255,255,255,.06); }
.practice-tip h3 { margin: 0 0 8px; font-size: 16px; }
.practice-tip p { margin: 0; font-size: 11.5px; color: rgba(251,247,239,.65); line-height: 1.8; }
.practice-tip ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 11px; }
.practice-tip li { display: flex; gap: 7px; color: rgba(251,247,239,.8); }
.practice-tip li::before { content: "→"; color: var(--gold); }

/* 答题界面 */
.quiz-wrap { max-width: 900px; margin: 0 auto; }
.quiz-top {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 18px 0 14px;
}
.quiz-top .back-link { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.quiz-top .back-link:hover { color: var(--ink); }
.quiz-progress { flex: 1; display: flex; align-items: center; gap: 10px; }
.quiz-progress .progress { flex: 1; }
.quiz-progress small { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.quiz-combo {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 9px; border-radius: 999px;
  background: var(--gold-soft); color: #8A5E07;
  font-size: 10px; font-weight: 800;
}
.quiz-card {
  padding: 30px;
  border-radius: var(--radius-lg);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  animation: quizIn 0.3s ease both;
}
@keyframes quizIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
.quiz-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
.quiz-stem { font-size: 19px; line-height: 1.75; font-weight: 650; letter-spacing: -0.01em; }
.quiz-options { display: grid; gap: 9px; margin-top: 22px; }
.option {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  text-align: left;
  font-size: 14px;
  line-height: 1.5;
  transition: border-color 0.16s, background 0.16s, transform 0.16s, box-shadow 0.16s;
}
.option:hover:not(:disabled) { border-color: var(--ink-soft); transform: translateX(3px); box-shadow: var(--shadow-sm); }
.option .o-key {
  width: 27px; height: 27px;
  flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 8px;
  background: var(--paper-deep);
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--muted);
  transition: background 0.16s, color 0.16s;
}
.option.selected { border-color: var(--ink); background: #FFFBEF; }
.option.selected .o-key { background: var(--ink); color: var(--paper); }
.option.correct { border-color: var(--green); background: var(--green-soft); }
.option.correct .o-key { background: var(--green); color: #fff; }
.option.wrong { border-color: var(--red); background: #FFF0ED; }
.option.wrong .o-key { background: var(--red); color: #fff; }
.option:disabled { cursor: default; }
.option.dim { opacity: 0.55; }
.fill-zone { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.fill-zone input {
  flex: 1 1 220px;
  height: 50px;
  padding: 0 16px;
  border: 1.5px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  font-size: 17px;
  font-family: var(--mono);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.fill-zone input:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(34,33,29,.06); }
.fill-zone input.correct { border-color: var(--green); background: var(--green-soft); }
.fill-zone input.wrong { border-color: var(--red); background: #FFF0ED; }
.quiz-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.quiz-actions .left { display: flex; gap: 8px; }
.hint-btn { background: transparent; border: 0; font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; padding: 8px 0; }
.hint-btn:hover { color: var(--ink); }
.hint-box {
  margin-top: 16px;
  padding: 12px 15px;
  border-radius: 11px;
  background: var(--gold-soft);
  color: #77540C;
  font-size: 12px;
  animation: fadeSlide 0.25s ease both;
}
.feedback {
  margin-top: 20px;
  padding: 19px 20px;
  border-radius: 15px;
  border: 1px solid;
  animation: feedbackIn 0.35s ease both;
}
@keyframes feedbackIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.feedback.good { background: var(--green-soft); border-color: #C5E5C9; }
.feedback.bad { background: #FFF3F0; border-color: #F3CEC6; }
.feedback-head { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 800; }
.feedback.good .feedback-head { color: #2D6E3B; }
.feedback.bad .feedback-head { color: #9D392A; }
.feedback-head .f-emoji { font-size: 22px; }
.feedback-head .f-title { flex: 1; min-width: 0; }
.feedback-head .xp-gain { margin-left: auto; font-size: 11px; color: var(--green); background: rgba(75,155,95,.12); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.feedback.bad .xp-gain { color: #9D392A; background: rgba(217,75,54,.1); }
.feedback-answer { margin: 11px 0 0; font-size: 12.5px; line-height: 1.8; color: var(--ink-soft); }
.feedback-answer b { color: var(--ink); }
.feedback-exp { margin: 8px 0 0; font-size: 12px; line-height: 1.8; color: var(--ink-soft); }
.feedback-exp b { color: var(--ink); }
.feedback-next { margin-top: 14px; display: flex; gap: 9px; flex-wrap: wrap; }
.quiz-footnote { margin-top: 12px; text-align: center; font-size: 10.5px; color: var(--muted); }

/* 结果页 */
.result-wrap { max-width: 820px; margin: 20px auto; }
.result-card {
  position: relative;
  overflow: hidden;
  padding: 38px;
  border-radius: var(--radius-xl);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  text-align: center;
}
.result-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 180px;
  background: radial-gradient(ellipse at 50% 0%, var(--soft), transparent 70%);
  pointer-events: none;
}
.result-emoji { position: relative; font-size: 64px; line-height: 1; animation: popIn 0.5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes popIn { from { transform: scale(0.4) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
.result-card h1 { position: relative; margin: 14px 0 6px; font-size: 32px; letter-spacing: -0.035em; }
.result-card .result-sub { position: relative; margin: 0; color: var(--muted); font-size: 13px; }
.result-score { position: relative; display: flex; justify-content: center; gap: 20px; margin: 26px 0 22px; flex-wrap: wrap; }
.result-metric { min-width: 110px; padding: 14px 18px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.result-metric b { display: block; font-family: Georgia, serif; font-size: 28px; line-height: 1.1; }
.result-metric span { font-size: 9.5px; color: var(--muted); letter-spacing: 0.06em; }
.result-review {
  position: relative;
  margin: 20px auto 0;
  max-width: 560px;
  text-align: left;
  padding: 16px;
  border-radius: 13px;
  background: var(--paper);
  border: 1px dashed var(--line-strong);
  font-size: 11.5px;
  color: var(--muted);
}
.result-review b { color: var(--ink); }
.result-actions { position: relative; display: flex; justify-content: center; gap: 10px; margin-top: 24px; flex-wrap: wrap; }

/* ---------- 错题本 ---------- */
.wrong-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 18px 0 4px; }
.wrong-head h1 { margin: 8px 0; font-size: clamp(32px, 4vw, 46px); letter-spacing: -0.045em; }
.wrong-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 560px; }
.wrong-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px 0 16px; }
.wrong-stat { padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.wrong-stat b { font-size: 22px; line-height: 1; }
.wrong-stat span { font-size: 10px; color: var(--muted); display: block; }
.wrong-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.wrong-filters { display: flex; gap: 5px; flex-wrap: wrap; }
.wf-btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: 10.5px; color: var(--muted); }
.wf-btn.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.wrong-list { display: grid; gap: 12px; }
.wrong-card {
  padding: 20px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-left: 4px solid var(--red);
}
.wrong-card.mastered { border-left-color: var(--teal); opacity: 0.82; }
.wrong-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
.wrong-card-head .date { margin-left: auto; font-size: 9.5px; color: var(--muted); }
.wrong-stem { font-size: 14px; line-height: 1.75; font-weight: 600; }
.wrong-answers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.wa { padding: 6px 10px; border-radius: 8px; font-size: 11px; }
.wa.bad { background: #FFF0ED; color: #9D392A; }
.wa.good { background: var(--green-soft); color: #2D6E3B; }
.wrong-exp { margin-top: 10px; padding: 11px 13px; border-radius: 9px; background: var(--paper); font-size: 11.5px; line-height: 1.75; color: var(--ink-soft); }
.wrong-card-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.wrong-card-foot .review-meta { margin-left: auto; font-size: 9.5px; color: var(--muted); }
.empty-state {
  padding: 64px 24px;
  border-radius: var(--radius-lg);
  border: 1.5px dashed var(--line-strong);
  background: rgba(255, 253, 248, 0.6);
  text-align: center;
}
.empty-emoji { font-size: 54px; line-height: 1; margin-bottom: 12px; }
.empty-state h3 { margin: 0 0 6px; font-size: 19px; }
.empty-state p { margin: 0 auto 18px; max-width: 420px; color: var(--muted); font-size: 12px; line-height: 1.8; }

/* ---------- 成长成就 ---------- */
.ach-hero {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 24px;
  padding: 30px;
  border-radius: var(--radius-xl);
  background: linear-gradient(145deg, #23221E, #35322B);
  color: var(--paper);
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.ach-hero::before {
  content: "";
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,163,26,.3), transparent 62%);
  right: -120px; top: -180px;
}
.ach-level { display: flex; align-items: center; gap: 18px; position: relative; }
.ach-level-icon {
  width: 82px; height: 82px;
  flex: 0 0 auto;
  border-radius: 24px;
  display: grid; place-items: center;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  font-size: 38px;
}
.ach-level h1 { margin: 4px 0 3px; font-size: 30px; letter-spacing: -0.03em; }
.ach-level p { margin: 0; color: rgba(251,247,239,.55); font-size: 11.5px; }
.ach-xp { position: relative; margin-top: 24px; }
.ach-xp-head { display: flex; justify-content: space-between; font-size: 10.5px; color: rgba(251,247,239,.55); margin-bottom: 7px; }
.ach-xp-head b { color: var(--gold); }
.ach-hero .progress { background: rgba(255,255,255,.12); }
.ach-hero .progress > i { background: linear-gradient(90deg, var(--gold), #FFD97A); }
.ach-hero-side { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.ach-hero-side .ach-stat { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,.12); font-size: 11px; }
.ach-hero-side .ach-stat:last-child { border-bottom: 0; }
.ach-hero-side .ach-stat span { color: rgba(251,247,239,.55); }
.ach-hero-side .ach-stat b { color: var(--paper); font-size: 13px; }
.level-track { display: flex; gap: 6px; margin-top: 18px; }
.level-dot {
  flex: 1;
  height: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  position: relative;
}
.level-dot.on { background: var(--gold); }
.section-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 32px 0 16px; }
.section-title-row h2 { margin: 0; font-size: 23px; letter-spacing: -0.03em; }
.section-title-row p { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); }
.badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.badge-card {
  position: relative;
  padding: 18px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  text-align: center;
  transition: transform 0.2s, box-shadow 0.2s;
}
.badge-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.badge-card.locked { opacity: 0.52; filter: grayscale(0.5); }
.badge-card.unlocked { border-color: #EED9A9; background: linear-gradient(160deg, #FFFDF8, #FFF8E6); }
.badge-ico { font-size: 34px; line-height: 1; margin-bottom: 8px; }
.badge-card b { display: block; font-size: 12.5px; }
.badge-card span { display: block; margin-top: 3px; font-size: 9.5px; color: var(--muted); line-height: 1.5; }
.badge-card .badge-check {
  position: absolute; top: 9px; right: 9px;
  width: 18px; height: 18px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--teal);
  color: #fff;
  font-size: 9px;
}
.ach-lower { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 26px; align-items: start; }
.ach-panel { padding: 22px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
.ach-panel h3 { margin: 0 0 14px; font-size: 14px; }
.chapter-mastery-list { display: grid; gap: 9px; }
.mastery-row { display: grid; grid-template-columns: 122px 1fr 40px; align-items: center; gap: 10px; font-size: 10.5px; }
.mastery-row span:first-child { color: var(--ink-soft); line-height: 1.4; }
.mastery-row small { text-align: right; color: var(--muted); font-family: var(--mono); font-size: 9px; }
.activity-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.activity-list li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--paper); font-size: 10.5px; color: var(--muted); }
.activity-list li b { color: var(--ink-soft); font-weight: 600; }
.activity-list .a-time { margin-left: auto; font-size: 8.5px; white-space: nowrap; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 11.5px; }
.settings-row:last-child { border-bottom: 0; }
.switch { width: 42px; height: 24px; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; transition: background .2s; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.switch.on { background: var(--teal); }
.switch.on::after { transform: translateX(18px); }
.danger-btn { border: 1px solid #EFC3BB; background: #FFF7F5; color: #9D392A; padding: 7px 12px; border-radius: 8px; font-size: 10.5px; font-weight: 700; }
.danger-btn:hover { background: #FFECE8; }

/* ---------- 自学指南 ---------- */
.guide-hero {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 30px;
  align-items: center;
  padding: 32px 34px;
  border-radius: var(--radius-xl);
  background: var(--blue-soft);
  border: 1px solid #CFDDFB;
}
.guide-hero h1 { margin: 10px 0 10px; font-size: clamp(30px, 3.7vw, 44px); letter-spacing: -0.04em; line-height: 1.18; }
.guide-hero p { margin: 0; color: var(--ink-soft); font-size: 13px; line-height: 1.85; max-width: 620px; }
.timer-card { padding: 20px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-md); text-align: center; }
.timer-ring {
  --p: 0;
  width: 156px; height: 156px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: conic-gradient(var(--blue) calc(var(--p) * 1%), var(--paper-deep) 0);
  display: grid; place-items: center;
  position: relative;
}
.timer-ring::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--card); }
.timer-ring div { position: relative; }
.timer-ring b { display: block; font-family: var(--mono); font-size: 28px; letter-spacing: -0.04em; }
.timer-ring small { font-size: 9px; color: var(--muted); }
.timer-card h3 { margin: 0 0 4px; font-size: 13px; }
.timer-card p { margin: 0 0 12px; font-size: 10px; color: var(--muted); }
.timer-controls { display: flex; justify-content: center; gap: 7px; }
.timer-controls .btn { min-height: 36px; padding: 7px 13px; font-size: 11px; }
.steps-flow { display: grid; gap: 10px; margin-top: 22px; }
.step-row {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  gap: 16px;
  align-items: start;
  padding: 18px 20px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  transition: border-color .2s, box-shadow .2s;
}
.step-row:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
.step-big {
  width: 50px; height: 50px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--paper-deep);
  font-size: 22px;
}
.step-row h3 { margin: 1px 0 4px; font-size: 17px; }
.step-row h3 small { font-size: 9.5px; color: var(--muted); font-weight: 600; margin-left: 8px; }
.step-row p { margin: 0; font-size: 12px; color: var(--ink-soft); line-height: 1.75; }
.step-row .step-action { margin-top: 7px; font-size: 11px; color: var(--blue); background: var(--blue-soft); padding: 6px 9px; border-radius: 7px; display: inline-block; }
.step-row .step-time { font-size: 9.5px; color: var(--muted); white-space: nowrap; padding-top: 5px; }
.guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; align-items: start; }
.guide-card { padding: 24px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
.guide-card h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.025em; }
.guide-card > p { margin: 0 0 14px; font-size: 11.5px; color: var(--muted); }
.prompt-list { display: grid; gap: 7px; }
.prompt-item { padding: 10px 12px; border-radius: 9px; background: var(--paper); font-size: 11.5px; color: var(--ink-soft); line-height: 1.7; }
.prompt-item b { color: var(--coral-deep); }
.feynman-box { border-radius: 14px; background: var(--gold-soft); padding: 15px; border: 1px dashed #E8CE8A; }
.feynman-box h3 { margin: 0 0 6px; font-size: 13px; color: #7A5509; }
.feynman-box p { margin: 0 0 9px; font-size: 10.5px; color: #8E6714; line-height: 1.7; }
.feynman-box textarea { width: 100%; min-height: 110px; resize: vertical; padding: 10px 12px; border-radius: 9px; border: 1px solid #E6CA85; background: #FFFDF7; font-size: 12px; line-height: 1.7; outline: none; }
.feynman-box textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,163,26,.14); }
.feynman-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
.feynman-foot span { font-size: 9px; color: #9A7117; }
.checklist { display: grid; gap: 6px; }
.check-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 11.5px; color: var(--ink-soft); }
.check-item:last-child { border-bottom: 0; }
.check-item input { width: 16px; height: 16px; accent-color: var(--teal); margin-top: 2px; flex: 0 0 auto; }
.check-item.done span { text-decoration: line-through; color: var(--muted); }
.mistake-types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mistake-type { padding: 11px; border-radius: 10px; background: var(--paper); font-size: 10.5px; line-height: 1.6; }
.mistake-type b { display: block; color: var(--coral-deep); margin-bottom: 2px; }

/* ---------- 页脚 / Toast / Modal ---------- */
.site-footer { margin-top: 40px; border-top: 1px solid var(--line); background: rgba(243, 235, 221, 0.6); }
.footer-inner { max-width: var(--maxw); margin: 0 auto; padding: 34px 28px 30px; display: grid; grid-template-columns: 1fr auto; gap: 22px 40px; align-items: start; }
.footer-brand { display: flex; gap: 12px; align-items: center; }
.footer-brand strong { display: block; font-size: 13px; }
.footer-brand p { margin: 2px 0 0; font-size: 10.5px; color: var(--muted); }
.footer-links { display: flex; gap: 16px; flex-wrap: wrap; padding-top: 8px; }
.footer-links a { font-size: 11px; color: var(--muted); }
.footer-links a:hover { color: var(--ink); }
.footer-note { grid-column: 1 / -1; margin: 0; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 9.5px; color: var(--muted); }

.toast-wrap { position: fixed; z-index: 200; left: 50%; bottom: 28px; translate: -50% 0; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: 13px;
  background: var(--ink);
  color: var(--paper);
  box-shadow: var(--shadow-lg);
  font-size: 12px;
  line-height: 1.5;
  animation: toastIn 0.32s cubic-bezier(.2,1.2,.4,1) both;
  pointer-events: auto;
}
.toast.out { animation: toastOut 0.28s ease both; }
.toast .t-emoji { font-size: 18px; }
.toast b { color: var(--gold); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px) scale(.98); } }

#confettiCanvas { position: fixed; inset: 0; z-index: 300; pointer-events: none; width: 100%; height: 100%; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(34, 33, 29, 0.45);
  backdrop-filter: blur(5px);
  animation: fadeIn .2s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(430px, 100%);
  padding: 26px;
  border-radius: 22px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  animation: modalIn .28s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
.modal h3 { margin: 0 0 7px; font-size: 19px; letter-spacing: -0.02em; }
.modal p { margin: 0 0 18px; font-size: 12px; color: var(--muted); line-height: 1.75; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- 小探险家头像与档案 ---------- */
.top-avatar {
  position: relative;
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  padding: 2px;
  border-radius: 50%;
  background: conic-gradient(from 210deg, #E8A31A, #EF654F, #C86DD7, #E8A31A);
  box-shadow: 0 0 0 1px rgba(34, 33, 29, 0.08), 0 5px 12px rgba(86, 65, 36, 0.14);
  transition: transform 0.22s, box-shadow 0.22s;
}
.top-avatar:hover { transform: rotate(-5deg) scale(1.06); box-shadow: 0 0 0 1px rgba(34, 33, 29, 0.08), 0 8px 18px rgba(86, 65, 36, 0.2); }
.top-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid var(--card); background: var(--card); }
.top-avatar .ta-star {
  position: absolute;
  right: -3px;
  bottom: -2px;
  width: 15px;
  height: 15px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold);
  color: var(--ink);
  font-size: 8px;
  border: 1.5px solid var(--card);
}
.hero-id { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 15px; }
.hero-avatar {
  width: 58px;
  height: 58px;
  flex: 0 0 auto;
  padding: 3px;
  border-radius: 50%;
  background: conic-gradient(from 210deg, #E8A31A, #EF654F, #C86DD7, #E8A31A);
  box-shadow: 0 8px 20px rgba(160, 100, 50, 0.18);
  transform: rotate(-3deg);
}
.hero-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2.5px solid var(--card); background: var(--card); }
.hero-id-copy b { display: block; font-size: 16px; line-height: 1.2; letter-spacing: -0.01em; }
.hero-id-copy small { display: block; margin-top: 2px; font-size: 10.5px; color: var(--muted); }
.hero-id-tag {
  margin-left: 2px;
  padding: 5px 9px;
  border-radius: 999px;
  background: var(--gold-soft);
  border: 1px solid #EED9A9;
  color: #8A5E07;
  font-size: 9.5px;
  font-weight: 800;
  white-space: nowrap;
}
.mission-complete {
  position: relative;
  z-index: 1;
  margin-top: 14px;
  padding: 9px 11px;
  border-radius: 10px;
  background: rgba(232, 163, 26, 0.15);
  border: 1px dashed rgba(232, 163, 26, 0.45);
  color: var(--gold);
  font-size: 10.5px;
  text-align: center;
}
.ach-avatar {
  position: relative;
  width: 92px;
  height: 92px;
  flex: 0 0 auto;
  padding: 3px;
  border-radius: 27px;
  background: linear-gradient(145deg, #E8A31A, #EF654F);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
}
.ach-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 23px; border: 2px solid #23221E; background: var(--card); }
.ach-avatar i {
  position: absolute;
  right: -7px;
  bottom: -7px;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid #23221E;
  font-style: normal;
  font-size: 16px;
}
.profile-editor {
  display: flex;
  align-items: center;
  gap: 20px;
  max-width: 760px;
  padding: 20px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.pe-avatar { width: 92px; height: 92px; flex: 0 0 auto; padding: 3px; border-radius: 50%; background: conic-gradient(from 210deg, #E8A31A, #EF654F, #C86DD7, #E8A31A); box-shadow: var(--shadow-sm); }
.pe-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid var(--card); background: var(--card); }
.pe-main { flex: 1; min-width: 0; }
.pe-label { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
.pe-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.nickname-input { height: 36px; width: min(180px, 100%); padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--paper); font-size: 13px; outline: none; }
.nickname-input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(34, 33, 29, 0.06); }
.pe-hint { margin: 7px 0 0; font-size: 10px; color: var(--muted); }
.mission-stamp {
  position: absolute;
  top: 18px;
  right: 22px;
  padding: 4px 7px;
  border: 2px solid #B53A2A;
  border-radius: 4px;
  color: #B53A2A;
  font-family: var(--mono);
  font-size: 8.5px;
  line-height: 1.3;
  font-weight: 800;
  letter-spacing: .12em;
  text-align: center;
  transform: rotate(4deg);
  opacity: .75;
}
.result-face {
  position: relative;
  width: 104px;
  height: 104px;
  margin: 0 auto 10px;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(from 210deg, #E8A31A, #EF654F, #C86DD7, #E8A31A);
  box-shadow: 0 14px 30px rgba(86, 65, 36, 0.16);
}
.result-face img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid var(--card); background: var(--card); }
.result-face .rf-emoji {
  position: absolute;
  right: -4px;
  bottom: -4px;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold);
  border: 3px solid var(--card);
  font-size: 17px;
}

/* 知识点回顾与解题路径 */
.solution-path {
  margin-top: 14px;
  padding: 13px 14px;
  border-radius: 13px;
  background: var(--paper);
  border: 1px dashed var(--line-strong);
}
.sp-head { margin-bottom: 2px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; color: var(--blue); }
.sp-step { display: flex; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
.sp-step:first-of-type { border-top: 0; padding-top: 7px; }
.sp-step > i {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-family: Georgia, serif;
  font-size: 10px;
  font-style: normal;
  font-weight: 700;
}
.sp-step b { display: block; margin-bottom: 1px; font-size: 9.5px; letter-spacing: 0.06em; color: var(--muted); }
.sp-step span { display: block; font-size: 11.5px; line-height: 1.75; color: var(--ink-soft); }
.knowledge-recap {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #FFFCF5;
  overflow: hidden;
}
.kr-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 13px;
  background: var(--blue-soft);
  border-bottom: 1px solid #D9E4FB;
  color: #274B9E;
  font-size: 10.5px;
  font-weight: 800;
}
.kr-head b { font-size: 10.5px; }
.kr-head .chip { margin-left: auto; background: rgba(255, 255, 255, 0.7); color: #274B9E; font-size: 9px; }
.kr-core { margin: 0; padding: 11px 14px; border-bottom: 1px dashed var(--line); font-size: 11.5px; line-height: 1.8; color: var(--ink-soft); }
.kr-formulas { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; }
.kr-formula { flex: 1 1 140px; padding: 7px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.kr-formula small { display: block; font-size: 8px; color: var(--muted); letter-spacing: 0.06em; }
.kr-formula code { font-family: Georgia, "Times New Roman", serif; font-size: 13px; font-weight: 700; color: var(--ink); }
.kr-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 13px; }
.kr-note { padding: 9px 10px; border-radius: 9px; font-size: 10px; line-height: 1.7; }
.kr-note b { display: block; margin-bottom: 2px; font-size: 8.5px; letter-spacing: 0.06em; }
.kr-note.tip { background: var(--teal-soft); color: #195E54; }
.kr-note.tip b { color: var(--teal); }
.kr-note.warn { background: var(--coral-soft); color: #7D3023; }
.kr-note.warn b { color: var(--coral-deep); }
.knowledge-details {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  overflow: hidden;
}
.knowledge-details summary {
  padding: 10px 12px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  list-style: none;
  user-select: none;
}
.knowledge-details summary::-webkit-details-marker { display: none; }
.knowledge-details summary::before { content: "▸ "; }
.knowledge-details[open] summary::before { content: "▾ "; }
.knowledge-details .solution-path { margin: 0 12px 12px; }
.knowledge-details .knowledge-recap { margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.feedback .knowledge-recap { background: #FFFDF8; }
.feedback .kr-head { background: rgba(76, 125, 255, 0.1); }

/* ---------- 战役模式 · 军事指挥风 ---------- */
.campaign-banner {
  position: relative;
  display: grid;
  grid-template-columns: 56px 1fr 190px auto;
  align-items: center;
  gap: 18px;
  margin-top: 26px;
  padding: 17px 22px;
  border-radius: 20px;
  background:
    radial-gradient(700px 160px at 90% 0%, rgba(217, 75, 54, 0.18), transparent 65%),
    #14201c;
  border: 1px solid #2C3D35;
  color: var(--paper);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.campaign-banner::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(112, 145, 124, 0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(112, 145, 124, 0.09) 1px, transparent 1px);
  background-size: 26px 26px;
  pointer-events: none;
}
.campaign-banner:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.cb-emblem {
  position: relative;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(145deg, #B53A2A, #7E241A);
  border: 1px solid #E36A55;
  color: #F6D58D;
  font-size: 23px;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2);
}
.cb-main { position: relative; min-width: 0; }
.cb-kicker { display: block; font-size: 8.5px; letter-spacing: .14em; font-weight: 800; color: #D99A86; }
.cb-main h3 { margin: 3px 0 3px; font-size: 17px; letter-spacing: -.02em; }
.cb-main p { margin: 0; font-size: 10.5px; color: rgba(251, 247, 239, .55); }
.cb-main p b { color: #F3C96B; }
.cb-progress-wrap { position: relative; }
.cb-progress { height: 7px; border-radius: 999px; background: rgba(255, 255, 255, .11); overflow: hidden; }
.cb-progress i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #D94B36, #F3C96B); transition: width .6s; }
.cb-progress-text { margin-top: 5px; font-size: 9px; color: rgba(251, 247, 239, .5); }
.cb-progress-text b { color: #F3C96B; }
.cb-go { position: relative; font-size: 11px; font-weight: 800; color: #F3C96B; white-space: nowrap; }

.campaign-page { padding-top: 18px; }
.command-hero {
  position: relative;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 20px 26px;
  padding: 28px 30px;
  border-radius: var(--radius-xl);
  background:
    radial-gradient(700px 260px at 95% 0%, rgba(217, 75, 54, 0.18), transparent 65%),
    linear-gradient(145deg, #16231F, #1C2D26);
  border: 1px solid #31443A;
  color: var(--paper);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.command-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(112, 145, 124, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(112, 145, 124, 0.08) 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
}
.command-id { position: relative; display: flex; align-items: center; gap: 18px; }
.command-avatar { width: 82px; height: 82px; flex: 0 0 auto; padding: 3px; border-radius: 50%; background: conic-gradient(from 210deg, #F3C96B, #D94B36, #8D6E3A, #F3C96B); box-shadow: 0 0 0 1px rgba(243, 201, 107, .25), 0 10px 24px rgba(0,0,0,.25); }
.command-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid #16231F; background: var(--card); }
.command-id h1 { margin: 4px 0 3px; font-size: clamp(26px, 3vw, 36px); letter-spacing: -.035em; }
.command-id p { margin: 0; font-size: 11px; color: rgba(251,247,239,.58); }
.command-hud { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hud-cell { padding: 12px 13px; border-radius: 12px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.08); }
.hud-cell small { display: block; font-size: 8.5px; letter-spacing: .08em; color: rgba(251,247,239,.48); }
.hud-cell b { display: block; margin-top: 2px; font-family: Georgia, serif; font-size: 22px; line-height: 1.2; color: #F3C96B; }
.hud-cell b span { font-size: 11px; color: rgba(251,247,239,.45); }
.command-progress { position: relative; grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
.command-progress .progress { flex: 1; background: rgba(255,255,255,.1); }
.command-progress .progress > i { background: linear-gradient(90deg, #D94B36, #F3C96B); }
.command-progress span { font-size: 9.5px; color: rgba(251,247,239,.5); white-space: nowrap; }

.campaign-layout { display: grid; grid-template-columns: 1.4fr .6fr; gap: 18px; margin-top: 18px; align-items: start; }
.campaign-map-panel { background: #101A17; border: 1px solid #2C3D35; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow-md); }
.map-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 20px 22px 10px; color: var(--paper); }
.map-head .eyebrow { color: #D99A86; }
.map-head h2 { margin: 4px 0 0; font-size: 21px; letter-spacing: -.025em; }
.map-signal { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em; color: #8ED6A6; padding: 5px 8px; border: 1px solid rgba(142,214,166,.25); border-radius: 999px; }
.map-signal i { width: 5px; height: 5px; border-radius: 50%; background: #6FE39A; box-shadow: 0 0 0 4px rgba(111,227,154,.1); animation: livePulse 2s infinite; }
.campaign-map-scroll { overflow-x: auto; padding: 0 10px 6px; scrollbar-width: thin; }
.campaign-map-canvas { min-width: 720px; }
.campaign-map-canvas svg { width: 100%; height: auto; display: block; }
.map-watermark { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; fill: rgba(196, 212, 201, .34); }
.map-node-num { font-family: var(--mono); font-size: 14.5px; font-weight: 700; }
.map-node-title { font-family: var(--font); font-size: 12.5px; font-weight: 700; fill: #DCE8DF; }
.map-node-stars { font-family: var(--font); font-size: 10.5px; letter-spacing: .08em; }
.map-mobile-hint { display: none; padding: 0 22px 8px; font-size: 9px; color: rgba(243,201,107,.7); }
.campaign-node { cursor: pointer; outline: none; transition: filter .2s; }
.campaign-node:hover { filter: brightness(1.2) drop-shadow(0 0 7px rgba(243,201,107,.3)); }
.campaign-node:focus-visible { filter: drop-shadow(0 0 8px rgba(243,201,107,.6)); }
.campaign-node.selected { filter: drop-shadow(0 0 10px rgba(243,201,107,.55)); }
.campaign-node.selected .map-node-title { fill: #F3C96B; }
.node-pulse { transform-box: fill-box; transform-origin: center; animation: nodePulse 2.4s ease-in-out infinite; }
@keyframes nodePulse { 0%, 100% { opacity: .25; transform: scale(.92); } 50% { opacity: .7; transform: scale(1.12); } }
.map-legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 22px 16px; font-size: 9px; color: rgba(251,247,239,.45); }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { width: 7px; height: 7px; border-radius: 50%; }
.lg.gold { background: #E8A31A; } .lg.silver { background: #AEBBC8; } .lg.bronze { background: #C98552; } .lg.grey { background: #58675E; }

.campaign-briefing { position: sticky; top: 90px; align-self: start; }
.briefing-card { padding: 22px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.briefing-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mission-code { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--coral-deep); font-weight: 700; }
.briefing-card h2 { margin: 10px 0 3px; font-size: 25px; letter-spacing: -.035em; }
.briefing-tagline { margin: 0 0 14px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }
.briefing-medal { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--medal); }
.briefing-medal-icon { font-size: 27px; }
.briefing-medal small { display: block; font-size: 8.5px; color: var(--muted); letter-spacing: .06em; }
.briefing-medal b { display: block; font-size: 12px; }
.briefing-medal .star-row { margin-left: auto; }
.briefing-record { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.briefing-record > div { padding: 8px 10px; border-radius: 9px; background: var(--paper); border: 1px solid var(--line); }
.briefing-record small { display: block; font-size: 8px; color: var(--muted); }
.briefing-record b { display: block; margin-top: 1px; font-family: Georgia, serif; font-size: 17px; }
.briefing-objectives { margin-top: 13px; }
.briefing-objectives > b { font-size: 10px; letter-spacing: .06em; color: var(--muted); }
.briefing-objectives ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.briefing-objectives li { position: relative; padding-left: 15px; font-size: 10.5px; line-height: 1.6; color: var(--ink-soft); }
.briefing-objectives li::before { content: "▸"; position: absolute; left: 0; color: var(--coral); }
.briefing-actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
.briefing-actions .btn { flex: 1; }
.briefing-note { margin: 11px 0 0; font-size: 9px; color: var(--muted); line-height: 1.6; }
.star-row { display: inline-flex; gap: 1px; font-family: Georgia, serif; font-size: 16px; letter-spacing: 0; color: #E8A31A; line-height: 1; }
.star-empty { color: #D9CCB7; }

.medal-wall { margin-top: 28px; }
.medal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.medal-card { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 13px; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--medal); transition: transform .2s, box-shadow .2s; }
.medal-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.medal-card.locked { opacity: .62; filter: grayscale(.45); }
.medal-ico { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF5D6, var(--medal) 65%); color: #3B2A0A; font-size: 17px; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--medal); }
.medal-main { min-width: 0; }
.medal-main b { display: block; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.medal-main span { display: block; margin-top: 1px; font-size: 8.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.medal-card .star-row { font-size: 13px; }
.command-tip { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; padding: 13px 16px; border-radius: 13px; background: var(--gold-soft); border: 1px dashed #E8CE8A; color: #77540C; font-size: 10.5px; line-height: 1.7; }
.command-tip span { font-size: 18px; line-height: 1.2; }
.command-tip p { margin: 0; }

.mission-report { display: flex; align-items: center; gap: 12px; margin: 0 auto 18px; max-width: 560px; padding: 12px 15px; border-radius: 13px; background: #14201c; border: 1px solid #2C3D35; border-left: 4px solid var(--medal); color: var(--paper); text-align: left; }
.mr-medal { font-size: 28px; }
.mr-main { min-width: 0; }
.mr-kicker { display: block; font-family: var(--mono); font-size: 7.5px; letter-spacing: .08em; color: #D99A86; }
.mr-main b { display: block; margin-top: 2px; font-size: 12px; }
.mr-main small { display: block; margin-top: 1px; font-size: 8.5px; color: rgba(251,247,239,.55); }
.mr-stars { margin-left: auto; text-align: right; }
.mr-stars .star-row { font-size: 16px; }
.mr-stars small { display: block; font-size: 8px; color: rgba(251,247,239,.5); }

  <script>
/* ============================================================
   数学探险岛 · 动画实验室
   全部使用原生 SVG / Canvas / DOM，无外部依赖
   ============================================================ */

const SVGNS = 'http://www.w3.org/2000/svg';
const PI = Math.PI;
const TAU = Math.PI * 2;
const D2R = Math.PI / 180;

function svgEl(tag, attrs = {}, parent) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  if (parent) parent.appendChild(node);
  return node;
}

function svgText(parent, x, y, str, cls = 'svg-label', attrs = {}) {
  const t = svgEl('text', { x, y, class: cls, 'text-anchor': 'middle', ...attrs }, parent);
  t.textContent = str;
  return t;
}

function clearNode(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function fmt(v, d = 0) {
  let s = Number(v).toFixed(d);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s === '-0' ? '0' : s;
}
function angleOf(v, p) { return Math.atan2(p.y - v.y, p.x - v.x); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function norm(v) {
  const l = Math.hypot(v.x, v.y) || 1;
  return { x: v.x / l, y: v.y / l };
}
function toSvgPoint(svg, evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function setAttrs(node, attrs) {
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
}
function readoutHTML(items) {
  return items.map(it => `<div class="readout${it.accent ? ' accent' : ''}"><small>${it.label}</small><b id="${it.id}">${it.value ?? '—'}</b></div>`).join('');
}
function setRO(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}
function tagLabel(parent, x, y, text, color = '#45423A', anchor = 'start') {
  const w = Math.max(34, text.length * 6.4 + 12);
  const bx = anchor === 'end' ? x - w : x;
  svgEl('rect', {
    x: bx, y: y - 12, width: w, height: 18, rx: 6,
    fill: '#FFFDF8', stroke: '#E7DDCC', 'stroke-width': 0.8, opacity: 0.95
  }, parent);
  return svgText(parent, bx + 6, y + 1, text, 'svg-small', { 'text-anchor': 'start', fill: color });
}

/* ============================================================
   1. 三角形内角和
   ============================================================ */
function mountTriangle(canvas, controls, readouts) {
  const ac = new AbortController();
  let pts = [{ x: 340, y: 58 }, { x: 120, y: 310 }, { x: 548, y: 310 }];
  let active = -1;
  let showWedges = true;
  const svg = svgEl('svg', { viewBox: '0 0 680 500', role: 'img', 'aria-label': '可拖动的三角形内角和演示' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <button class="btn btn-sm btn-soft" id="triRandom">🎲 随机变形</button>
      <button class="btn btn-sm btn-ghost" id="triWedge">◐ 显示拼角</button>
      <span class="small muted">拖动 A、B、C 三个顶点</span>
    </div>
    <div class="lab-note"><b>试一试：</b>把三角形拉成很扁、很尖的样子，三个内角的和会变吗？</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'triA', label: '∠A', accent: true },
    { id: 'triB', label: '∠B' },
    { id: 'triC', label: '∠C' },
    { id: 'triSum', label: '三个角的和', value: '180°' }
  ]);

  const colors = ['#EF654F', '#4C7DFF', '#178F80'];
  const letters = ['A', 'B', 'C'];

  function angleAt(i) {
    const v = pts[i], p1 = pts[(i + 1) % 3], p2 = pts[(i + 2) % 3];
    const u1 = norm({ x: p1.x - v.x, y: p1.y - v.y });
    const u2 = norm({ x: p2.x - v.x, y: p2.y - v.y });
    const dot = clamp(u1.x * u2.x + u1.y * u2.y, -1, 1);
    return { ang: Math.acos(dot) / D2R, u1, u2, v };
  }
  function sectorPath(v, u1, u2, r) {
    let a1 = Math.atan2(u1.y, u1.x);
    let a2 = Math.atan2(u2.y, u2.x);
    let d = a2 - a1;
    while (d > PI) d -= TAU;
    while (d < -PI) d += TAU;
    const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
    const e = { x: v.x + r * Math.cos(a1 + d), y: v.y + r * Math.sin(a1 + d) };
    return {
      path: `M ${v.x} ${v.y} L ${s.x} ${s.y} A ${r} ${r} 0 0 ${d > 0 ? 1 : 0} ${e.x} ${e.y} Z`,
      mid: a1 + d / 2
    };
  }
  function draw() {
    clearNode(svg);
    const defs = svgEl('defs', {}, svg);
    const pat = svgEl('pattern', { id: 'triGrid', width: 28, height: 28, patternUnits: 'userSpaceOnUse' }, defs);
    svgEl('path', { d: 'M 28 0 L 0 0 0 28', fill: 'none', stroke: '#E8DFCE', 'stroke-width': 1 }, pat);
    svgEl('rect', { x: 0, y: 0, width: 680, height: 500, fill: 'url(#triGrid)', opacity: 0.6 }, svg);

    const poly = pts.map(p => `${p.x},${p.y}`).join(' ');
    svgEl('polygon', { points: poly, fill: '#FFF0EB', stroke: '#E85D4A', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, svg);

    // 顶点与角
    pts.forEach((p, i) => {
      const a = angleAt(i);
      const sec = sectorPath(p, a.u1, a.u2, 34);
      svgEl('path', { d: sec.path, fill: colors[i], opacity: 0.16 }, svg);
      svgEl('path', { d: sec.path, fill: 'none', stroke: colors[i], 'stroke-width': 1.6, opacity: 0.75 }, svg);
      const lx = p.x + Math.cos(sec.mid) * 54;
      const ly = p.y + Math.sin(sec.mid) * 54;
      svgText(svg, lx, ly + 4, `${fmt(a.ang)}°`, 'svg-label', { fill: colors[i], 'font-size': 12.5 });
      svgEl('circle', { cx: p.x, cy: p.y, r: 13, class: 'draggable', fill: colors[i], stroke: '#FFFDF8', 'stroke-width': 4, 'data-v': i }, svg);
      svgText(svg, p.x, p.y + 4, letters[i], 'svg-label', { fill: '#FFFDF8', 'font-size': 10, 'pointer-events': 'none' }, svg);
    });

    // 底部拼角
    if (showWedges) {
      const baseY = 428, cx = 340, r = 58;
      svgEl('line', { x1: cx - 120, y1: baseY, x2: cx + 120, y2: baseY, stroke: '#CFC0A9', 'stroke-width': 1.4, 'stroke-dasharray': '6 5' }, svg);
      let start = PI;
      const angles = [angleAt(0).ang, angleAt(1).ang, angleAt(2).ang];
      angles.forEach((a, i) => {
        const sweep = a * D2R;
        const end = start - sweep;
        const s = { x: cx + r * Math.cos(start), y: baseY + r * Math.sin(start) };
        const e = { x: cx + r * Math.cos(end), y: baseY + r * Math.sin(end) };
        const d = `M ${cx} ${baseY} L ${s.x} ${s.y} A ${r} ${r} 0 0 0 ${e.x} ${e.y} Z`;
        svgEl('path', { d, fill: colors[i], opacity: 0.78, stroke: '#FFFDF8', 'stroke-width': 1.2 }, svg);
        start = end;
      });
      svgEl('line', { x1: cx - 70, y1: baseY + 18, x2: cx + 70, y2: baseY + 18, stroke: '#B7AB98', 'stroke-width': 1.2 }, svg);
      svgText(svg, cx, baseY + 38, '三个角拼成一个平角 = 180°', 'svg-small', { fill: '#6E6556', 'font-size': 10.5 });
    }

    const angles = [angleAt(0).ang, angleAt(1).ang, angleAt(2).ang];
    setRO('triA', `${fmt(angles[0])}°`);
    setRO('triB', `${fmt(angles[1])}°`);
    setRO('triC', `${fmt(angles[2])}°`);
    setRO('triSum', `${fmt(angles.reduce((a, b) => a + b, 0))}°`);
  }

  function valid(p, idx) {
    if (p.x < 55 || p.x > 625 || p.y < 40 || p.y > 360) return false;
    const test = pts.map((q, i) => i === idx ? p : q);
    const area = Math.abs((test[1].x - test[0].x) * (test[2].y - test[0].y) - (test[2].x - test[0].x) * (test[1].y - test[0].y));
    return area > 9000;
  }

  svg.addEventListener('pointerdown', e => {
    const target = e.target.closest('[data-v]');
    if (!target) return;
    active = Number(target.dataset.v);
    svg.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  }, { signal: ac.signal });
  svg.addEventListener('pointermove', e => {
    if (active < 0) return;
    const p = toSvgPoint(svg, e);
    if (valid(p, active)) {
      pts[active] = { x: clamp(p.x, 55, 625), y: clamp(p.y, 40, 360) };
      draw();
    }
  }, { signal: ac.signal });
  svg.addEventListener('pointerup', () => { active = -1; }, { signal: ac.signal });
  svg.addEventListener('pointercancel', () => { active = -1; }, { signal: ac.signal });

  controls.querySelector('#triRandom').addEventListener('click', () => {
    pts = [
      { x: 250 + Math.random() * 180, y: 45 + Math.random() * 80 },
      { x: 85 + Math.random() * 130, y: 285 + Math.random() * 65 },
      { x: 460 + Math.random() * 120, y: 285 + Math.random() * 65 }
    ];
    if (!valid(pts[0], 0)) pts[0].y = 80;
    draw();
  }, { signal: ac.signal });
  controls.querySelector('#triWedge').addEventListener('click', e => {
    showWedges = !showWedges;
    e.currentTarget.textContent = showWedges ? '◐ 隐藏拼角' : '◐ 显示拼角';
    draw();
  }, { signal: ac.signal });

  draw();
  return () => ac.abort();
}

/* ============================================================
   2. 全等变换
   ============================================================ */
function mountCongruence(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 420', role: 'img', 'aria-label': '全等三角形的平移旋转翻折演示' });
  canvas.appendChild(svg);
  controls.innerHTML = `
    <div class="control-row">
      <span class="control-label">变换方式</span>
      <button class="btn btn-sm btn-soft" data-t="slide">➡ 平移</button>
      <button class="btn btn-sm btn-soft" data-t="rotate">↻ 旋转</button>
      <button class="btn btn-sm btn-soft" data-t="flip">⇋ 翻折</button>
      <button class="btn btn-sm btn-ghost" data-t="reset">↺ 复位</button>
    </div>
    <div class="lab-note"><b>观察：</b>不管怎么移动，图形的形状和大小都没有变，所以变换前后一定全等。</div>`;
  readouts.innerHTML = readoutHTML([
    { id: 'conMode', label: '当前变换', value: '原图' },
    { id: 'conShape', label: '形状', value: '不变' },
    { id: 'conSize', label: '大小', value: '不变' },
    { id: 'conResult', label: '结论', value: '全等', accent: true }
  ]);

  const base = [{ x: 135, y: 270 }, { x: 300, y: 270 }, { x: 205, y: 145 }];
  let current = base.map(p => ({ ...p }));
  let mode = 'reset';
  let raf = 0;
  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id: 'conDots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
  svgEl('circle', { cx: 1, cy: 1, r: 1, fill: '#DED3C1' }, pat);
  svgEl('rect', { width: 680, height: 420, fill: 'url(#conDots)', opacity: 0.7 }, svg);

  const mirror = svgEl('line', { x1: 340, y1: 30, x2: 340, y2: 390, class: 'dash-line', opacity: 0 }, svg);
  svgText(svg, 340, 24, '镜子', 'svg-small', { opacity: 0, id: 'mirrorLabel' });
  const ghost = svgEl('polygon', { points: base.map(p => `${p.x},${p.y}`).join(' '), fill: 'none', stroke: '#C9BBA4', 'stroke-width': 1.6, 'stroke-dasharray': '6 5' }, svg);
  const poly = svgEl('polygon', { fill: '#E85D4A', 'fill-opacity': 0.14, stroke: '#E85D4A', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, svg);
  const labels = [0, 1, 2].map(i => svgText(svg, 0, 0, ['A′', 'B′', 'C′'][i], 'svg-label', { fill: '#E85D4A', 'font-size': 12 }));
  const dots = [0, 1, 2].map(() => svgEl('circle', { r: 4.5, fill: '#E85D4A' }, svg));
  const origLabels = ['A', 'B', 'C'].map((s, i) => svgText(svg, base[i].x, base[i].y - 16, s, 'svg-label', { fill: '#6E6556', 'font-size': 13 }));

  svgText(svg, 210, 310, '原图', 'svg-small', { fill: '#A99A84' });
  const targetNote = svgText(svg, 520, 390, '变换后的全等图形', 'svg-small', { fill: '#C99A8E', opacity: 0 });

  function targetFor(kind) {
    const cx = 210, cy = 215;
    if (kind === 'slide') return base.map(p => ({ x: p.x + 300, y: p.y + 10 }));
    if (kind === 'rotate') {
      const a = 58 * D2R;
      return base.map(p => {
        const dx = p.x - cx, dy = p.y - cy;
        return { x: cx + dx * Math.cos(a) - dy * Math.sin(a) + 300, y: cy + dx * Math.sin(a) + dy * Math.cos(a) + 0 };
      });
    }
    if (kind === 'flip') return base.map(p => ({ x: 680 - p.x, y: p.y + 10 }));
    return base.map(p => ({ ...p }));
  }

  function render() {
    poly.setAttribute('points', current.map(p => `${p.x},${p.y}`).join(' '));
    current.forEach((p, i) => {
      labels[i].setAttribute('x', p.x);
      labels[i].setAttribute('y', p.y - 14);
      labels[i].setAttribute('opacity', mode === 'reset' ? 0 : 1);
      dots[i].setAttribute('cx', p.x);
      dots[i].setAttribute('cy', p.y);
    });
    targetNote.setAttribute('opacity', mode === 'reset' ? 0 : 1);
  }

  function animateTo(kind) {
    cancelAnimationFrame(raf);
    const from = current.map(p => ({ ...p }));
    const to = targetFor(kind);
    const t0 = performance.now();
    mode = kind;
    const names = { slide: '平移', rotate: '旋转', flip: '翻折', reset: '原图' };
    setRO('conMode', names[kind]);
    setRO('conResult', kind === 'reset' ? '原图' : '全等');
    mirror.setAttribute('opacity', kind === 'flip' ? 0.9 : 0);
    svg.querySelector('#mirrorLabel')?.setAttribute('opacity', kind === 'flip' ? 1 : 0);
    function step(now) {
      const t = clamp((now - t0) / 720, 0, 1);
      const e = 1 - Math.pow(1 - t, 3);
      current = from.map((p, i) => ({ x: p.x + (to[i].x - p.x) * e, y: p.y + (to[i].y - p.y) * e }));
      render();
      if (t < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  controls.addEventListener('click', e => {
    const btn = e.target.closest('[data-t]');
    if (btn) animateTo(btn.dataset.t);
  }, { signal: ac.signal });

  render();
  return () => { ac.abort(); cancelAnimationFrame(raf); };
}

  const wl = svgEl('path', { d: wingPathD, fill: '#C86DD7', opacity: 0.55, stroke: '#A64CB5', 'stroke-width': 1.5 }, wingL);
  const wl2 = svgEl('path', { d: innerPathD, fill: '#EABFF2', opacity: 0.8 }, wingL);

  svgEl('circle', { cx: -3, cy: -38, r: 1.5, fill: '#F8E8FB' }, body);
  svgEl('circle', { cx: 3, cy: -38, r: 1.5, fill: '#F8E8FB' }, body);

  const ppLine = svgEl('line', { stroke: '#178F80', 'stroke-width': 1.8, 'stroke-dasharray': '5 4' }, svg);
  const pLineA = svgEl('line', { stroke: '#E39A1C', 'stroke-width': 1.4, 'stroke-dasharray': '4 4' }, svg);

  let foldT = 0;
  let foldRaf = 0;

  function applyFold() {
    const sx = -1 + 2 * foldT;
    wingR.setAttribute('transform', `translate(${axis} 215) scale(${sx} 1)`);
    wingR.setAttribute('opacity', 1 - 0.65 * foldT);
    foldLine.setAttribute('opacity', foldT * 0.8);
    const px = axis - 96, ppx = 2 * axis - px;
    const cx = ppx + (px - ppx) * foldT;
    ppDot.setAttribute('cx', cx);
    ppLab.setAttribute('x', cx);
    ppLab.setAttribute('opacity', 1 - foldT * 0.6);
    pLineB.setAttribute('x2', cx);
    ppLine.setAttribute('x2', cx);
  }

  function draw() {
    axisLine.setAttribute('x1', axis);
    axisLine.setAttribute('x2', axis);
    axisLabel.setAttribute('x', axis);
    axisLabel.textContent = `x = ${axis}`;
    setRO('symAxisVal', String(axis));
    wingL.setAttribute('transform', `translate(${axis} 215)`);
    body.setAttribute('transform', `translate(${axis} 215)`);
    const py = 155;
    const px = axis - 96;
    const ppx = 2 * axis - px;

    ppDot.setAttribute('cx', ppx); ppDot.setAttribute('cy', py);
    pLab.setAttribute('x', px); pLab.setAttribute('y', py - 14);
    ppLab.setAttribute('x', ppx); ppLab.setAttribute('y', py - 14);

    ppLine.setAttribute('x2', ppx); ppLine.setAttribute('y2', py);
    pLineA.setAttribute('x1', px); pLineA.setAttribute('y1', py);
    pLineA.setAttribute('x2', axis); pLineA.setAttribute('y2', py);
    pLineB.setAttribute('x1', axis); pLineB.setAttribute('y1', py);
    pLineB.setAttribute('x2', ppx); pLineB.setAttribute('y2', py);
    const d = axis - px;
    setRO('symP', `${d} px`);
    setRO('symPp', `${ppx - axis} px`);
    foldLine.setAttribute('x1', axis); foldLine.setAttribute('x2', axis);
    foldLine.setAttribute('y1', 70); foldLine.setAttribute('y2', 360);
    applyFold();
  }

  controls.querySelector('#symAxis').addEventListener('input', e => {
    axis = Number(e.target.value);
    controls.querySelector('#symAxisOut').textContent = axis;
    folded = false;
    foldT = 0;
    cancelAnimationFrame(foldRaf);
    controls.querySelector('#symFold').textContent = '◫ 对折检验';
    draw();
  }, { signal: ac.signal });
  controls.querySelector('#symFold').addEventListener('click', e => {
    folded = !folded;
    cancelAnimationFrame(foldRaf);
    const from = foldT, to = folded ? 1 : 0;
    const t0 = performance.now();
    e.currentTarget.textContent = folded ? '◫ 展开图形' : '◫ 对折检验';
    function step(now) {
      const t = clamp((now - t0) / 650, 0, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      foldT = from + (to - from) * ease;
      applyFold();
      if (t < 1) foldRaf = requestAnimationFrame(step);
    }
    foldRaf = requestAnimationFrame(step);
  }, { signal: ac.signal });
  controls.querySelector('#symReset').addEventListener('click', () => {
    axis = 340; folded = false; foldT = 0;
    cancelAnimationFrame(foldRaf);
    controls.querySelector('#symAxis').value = 340;
    controls.querySelector('#symAxisOut').textContent = 340;
    controls.querySelector('#symFold').textContent = '◫ 对折检验';
    draw();
  }, { signal: ac.signal });

  draw();
  return () => { ac.abort(); cancelAnimationFrame(foldRaf); };
}

/* ============================================================

function mountIsosceles(canvas, controls, readouts) {
  const ac = new AbortController();
  const svg = svgEl('svg', { viewBox: '0 0 680 460', role: 'img', 'aria-label': '等腰三角形三线合一演示' });
  canvas.appendChild(svg);
  controls.innerHTML = `
