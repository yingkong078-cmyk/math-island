function mergeProgress(local, remote) {
  const r = remote || {};
  const out = { ...local };
  const maxNum = (a, b) => Math.max(Number(a || 0), Number(b || 0));
  const union = (a, b) => [...new Set([...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])])];
  out.xp = maxNum(local.xp, r.xp);
  out.streak = maxNum(local.streak, r.streak);
  out.lastActiveDate = [local.lastActiveDate, r.lastActiveDate].filter(Boolean).sort().pop() || '';
  out.learned = union(local.learned, r.learned);
  out.explored = union(local.explored, r.explored);
  out.examplesRead = union(local.examplesRead, r.examplesRead);
  out.badges = union(local.badges, r.badges);
  out.wrongCreated = maxNum(local.wrongCreated, r.wrongCreated);
  out.masteredCount = maxNum(local.masteredCount, r.masteredCount);
  out.bestCombo = maxNum(local.bestCombo, r.bestCombo);
  out.honorStars = maxNum(local.honorStars, r.honorStars);
  const hwMap = { ...((local.homework && local.homework.map) || {}), ...((r.homework && r.homework.map) || {}) };
  const hwLog = new Map();
  [...((local.homework && local.homework.log) || []), ...((r.homework && r.homework.log) || [])].forEach(item => {
    if (!item) return;
    const key = item.id || `${item.date}-${item.volumeId}-${item.page}-${item.question}`;
    if (!hwLog.has(key)) hwLog.set(key, item);
  });
  out.homework = { map: hwMap, log: [...hwLog.values()].sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))).slice(0, 200) };

  const answered = { ...(local.answered || {}) };
  Object.entries(r.answered || {}).forEach(([qid, rec]) => {
    const prev = answered[qid];
    if (!prev) { answered[qid] = rec; return; }
    answered[qid] = {
      attempts: maxNum(prev.attempts, rec.attempts),
      correct: maxNum(prev.correct, rec.correct),
      lastAt: Math.max(Number(prev.lastAt || 0), Number(rec.lastAt || 0))
    };
  });
  out.answered = answered;

  const wrongMap = new Map();
  const rank = { new: 1, review: 2, mastered: 3 };
  [...(local.wrong || []), ...(r.wrong || [])].forEach(w => {
    if (!w || !w.qid) return;
    const prev = wrongMap.get(w.qid);
    if (!prev) { wrongMap.set(w.qid, { ...w }); return; }
    const latest = Number(w.lastAt || 0) >= Number(prev.lastAt || 0) ? w : prev;
    wrongMap.set(w.qid, {
      ...latest,
      qid: w.qid,
      createdAt: Math.min(Number(prev.createdAt || Date.now()), Number(w.createdAt || Date.now())),
      attempts: maxNum(prev.attempts, w.attempts),
      correctStreak: maxNum(prev.correctStreak, w.correctStreak),
      status: (rank[w.status] || 0) >= (rank[prev.status] || 0) ? w.status : prev.status,
      lastChosen: latest.lastChosen || prev.lastChosen || w.lastChosen || ''
    });
  });
  out.wrong = [...wrongMap.values()];

  const campaign = { ...(local.campaign || {}) };
  Object.entries(r.campaign || {}).forEach(([chId, rec]) => {
    const prev = campaign[chId];
    if (!prev) { campaign[chId] = rec; return; }
    campaign[chId] = {
      bestAccuracy: maxNum(prev.bestAccuracy, rec.bestAccuracy),
      stars: maxNum(prev.stars, rec.stars),
      attempts: maxNum(prev.attempts, rec.attempts),
      lastAt: Math.max(Number(prev.lastAt || 0), Number(rec.lastAt || 0))
    };
  });
  out.campaign = campaign;

  const log = { ...(local.dailyLog || {}) };
  Object.entries(r.dailyLog || {}).forEach(([date, d]) => {
    const prev = log[date] || {};
    log[date] = {
      xp: maxNum(prev.xp, d.xp),
      correct: maxNum(prev.correct, d.correct),
      attempts: maxNum(prev.attempts, d.attempts),
      learned: maxNum(prev.learned, d.learned),
      reviewed: maxNum(prev.reviewed, d.reviewed),
      focusMinutes: maxNum(prev.focusMinutes, d.focusMinutes)
    };
  });
  out.dailyLog = log;

  const ld = local.daily || {};
  const rd = r.daily || {};
  if (rd.date && (!ld.date || rd.date > ld.date)) {
    out.daily = { ...ld, ...rd, goal: ld.goal || rd.goal || 30 };
  } else if (ld.date && rd.date === ld.date) {
    out.daily = {
      ...ld,
      xp: maxNum(ld.xp, rd.xp),
      correct: maxNum(ld.correct, rd.correct),
      attempts: maxNum(ld.attempts, rd.attempts),
      learned: maxNum(ld.learned, rd.learned),
      reviewed: maxNum(ld.reviewed, rd.reviewed),
      focusMinutes: maxNum(ld.focusMinutes, rd.focusMinutes),
      qid: ld.qid || rd.qid,
      qChecked: !!(ld.qChecked || rd.qChecked),
      qChosen: ld.qChecked ? ld.qChosen : rd.qChosen,
      chestClaimed: !!(ld.chestClaimed || rd.chestClaimed)
    };
  }
  return out;
}

function applyCloudProgress(merged) {
  const keep = {
    profile: state.profile,
    settings: state.settings,
    notes: state.notes,
    activity: state.activity,
    quizHistory: state.quizHistory
  };
  state = { ...merged, ...keep };
  ensureDay();
  saveState();
  updateTopStats();
  const view = (location.hash || '#home').slice(1).split('/')[0].split('?')[0];
  if (['home', 'campaign', 'wrong', 'achievements', 'report'].includes(view)) {
    setTimeout(() => router(), 80);
  }
}

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[data-sync-src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.dataset.syncSrc = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('脚本加载失败'));
    document.head.appendChild(s);
  });
}

function syncStatusLabel() {
  if (syncRuntime.status === 'online') return `已连接 · ${syncRuntime.lastSync ? new Date(syncRuntime.lastSync).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '等待同步'}`;
  if (syncRuntime.status === 'connecting') return '正在连接…';
  if (syncRuntime.status === 'error') return `连接失败：${syncRuntime.error || '请检查配置'}`;
  return '未连接';
}

function updateSyncUI() {
  const el = document.getElementById('syncStatus');
  if (el) {
    el.textContent = syncStatusLabel();
    el.className = `sync-status ${syncRuntime.status}`;
  }
  const dot = document.getElementById('syncDot');
  if (dot) dot.className = `sync-dot ${syncRuntime.status}`;
}

function parseSyncConfig(raw) {
  let text = String(raw || '').trim();
  text = text.replace(/^const\s+firebaseConfig\s*=\s*/i, '').replace(/^var\s+firebaseConfig\s*=\s*/i, '').replace(/^let\s+firebaseConfig\s*=\s*/i, '').replace(/;\s*$/, '');
  try {
    const parsed = JSON.parse(text);
    if (parsed && typeof parsed === 'object') return parsed;
  } catch (e) { /* 继续尝试从 Firebase 的 JS 片段中提取 */ }
  const out = {};
  ['apiKey', 'authDomain', 'projectId', 'appId'].forEach(key => {
    const m = text.match(new RegExp(key + '\\s*:\\s*["\']([^"\']+)["\']', 'i'));
    if (m) out[key] = m[1];
  });
  if (out.apiKey && out.authDomain && out.projectId && out.appId) return out;
  throw new Error('无法识别 Firebase 配置');
}

async function connectSync(silent = false) {
  if (syncRuntime.connecting) return;
  const codeInput = document.getElementById('syncCode');
  const configInput = document.getElementById('syncConfig');
  const code = (codeInput ? codeInput.value.trim() : syncPrefs.code).toLowerCase().replace(/[^a-z0-9_-]/g, '');
  let config = syncPrefs.config;
  if (configInput && configInput.value.trim()) {
    try { config = parseSyncConfig(configInput.value.trim()); } catch (e) { syncRuntime.status = 'error'; syncRuntime.error = 'Firebase 配置格式不对'; updateSyncUI(); if (!silent) toast('无法识别 Firebase 配置，请粘贴 firebaseConfig 对象或 JSON。', '⚠️'); return; }
  }
  if (!config || !config.apiKey || !config.authDomain || !config.projectId || !config.appId) {
    syncRuntime.status = 'error'; syncRuntime.error = '缺少 Firebase 配置';
    updateSyncUI();
    if (!silent) toast('请先粘贴完整的 Firebase Web 配置。', '⚠️');
    return;
  }
  if (code.length < 6) {
    syncRuntime.status = 'error'; syncRuntime.error = '同步码至少 6 位';
    updateSyncUI();
    if (!silent) toast('家庭同步码至少 6 位，三台设备要填同一个。', '🔑');
    return;
  }
  syncPrefs = { ...syncPrefs, config, code, enabled: true };
  saveSyncPrefs();
  syncRuntime.status = 'connecting';
  syncRuntime.connecting = true;
  syncRuntime.error = '';
  updateSyncUI();
  try {
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js');
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js');
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js');
    if (!window.firebase) throw new Error('Firebase 未加载');
    if (syncRuntime.unsub) { try { syncRuntime.unsub(); } catch (e) { /* noop */ } syncRuntime.unsub = null; }
    if (syncRuntime.app) { try { await syncRuntime.app.delete(); } catch (e) { /* noop */ } syncRuntime.app = null; }
    const app = firebase.initializeApp(config, 'math-island-sync');
    syncRuntime.app = app;
    const auth = firebase.auth(app);
    await auth.signInAnonymously();
    const db = firebase.firestore(app);
    const ref = db.collection('families').doc(code);
    if (syncRuntime.unsub) { try { syncRuntime.unsub(); } catch (e) { /* noop */ } }
    syncRuntime.ref = ref;
    syncRuntime.auth = auth;
    syncRuntime.unsub = ref.onSnapshot(snap => {
      if (!snap.exists) return;
      const data = snap.data();
      if (!data || !data.progress) return;
      const merged = mergeProgress(state, data.progress);
      if (JSON.stringify(cloudPayload(merged)) !== JSON.stringify(data.progress)) {
        syncRuntime.lastPushed = '';
        applyCloudProgress(merged);
        scheduleSyncPush();
      }
      syncRuntime.lastSync = Date.now();
      syncRuntime.status = 'online';
      updateSyncUI();
    }, err => {
      syncRuntime.status = 'error';
      syncRuntime.error = err.message || '同步监听失败';
      updateSyncUI();
    });
    const snap = await ref.get();
    if (!snap.exists) {
      await ref.set({ progress: cloudPayload(state), updatedAt: Date.now(), clientId: syncPrefs.clientId });
    } else {
      const remote = snap.data();
      if (remote && remote.progress) {
        const merged = mergeProgress(state, remote.progress);
        if (JSON.stringify(cloudPayload(merged)) !== JSON.stringify(remote.progress)) {
          applyCloudProgress(merged);
        }
      }
    }
    syncRuntime.status = 'online';
    syncRuntime.lastSync = Date.now();
    syncRuntime.lastPushed = JSON.stringify(cloudPayload(state));
    updateSyncUI();
    if (!silent) toast('云同步已连接。三台设备填同一个同步码即可共享进度。', '☁️', 4200);
  } catch (e) {
    syncRuntime.status = 'error';
    syncRuntime.error = e.message || '连接失败';
    updateSyncUI();
    if (!silent) toast(`云同步连接失败：${syncRuntime.error}`, '⚠️', 4500);
  } finally {
    syncRuntime.connecting = false;
  }
}

function disconnectSync(notify = true) {
  if (syncRuntime.unsub) { try { syncRuntime.unsub(); } catch (e) { /* noop */ } }
  syncRuntime.unsub = null;
  syncRuntime.ref = null;
  if (syncRuntime.auth) { try { syncRuntime.auth.signOut(); } catch (e) { /* noop */ } }
  syncRuntime.auth = null;
  syncRuntime.status = 'offline';
  syncPrefs.enabled = false;
  saveSyncPrefs();
  updateSyncUI();
  if (notify) toast('云同步已断开。本机进度仍然保留。', '☁️');
}

async function pushSync() {
  if (syncRuntime.status !== 'online' || !syncRuntime.ref) return;
  const payload = cloudPayload(state);
  const json = JSON.stringify(payload);
  if (json === syncRuntime.lastPushed) return;
  try {
    await syncRuntime.ref.set({ progress: payload, updatedAt: Date.now(), clientId: syncPrefs.clientId });
    syncRuntime.lastPushed = json;
    syncRuntime.lastSync = Date.now();
    syncRuntime.status = 'online';
    updateSyncUI();
  } catch (e) {
    syncRuntime.status = 'error';
    syncRuntime.error = e.message || '写入失败';
    updateSyncUI();
  }
}

function scheduleSyncPush() {
  if (!syncPrefs.enabled) return;
  clearTimeout(syncRuntime.pushTimer);
  syncRuntime.pushTimer = setTimeout(pushSync, 1200);
}

function initSync() {
  window.addEventListener('mathisland:saved', () => {
    if (syncRuntime.status === 'online') scheduleSyncPush();
  });
  if (syncPrefs.enabled && syncPrefs.config && syncPrefs.code) {
    setTimeout(() => connectSync(true), 700);
  }
}

/* ============================================================
   家长密码锁
   ============================================================ */
let parentUnlockedUntil = 0;
let pinFailCount = 0;
let pinBlockedUntil = 0;

function isParentLocked() {
  return !!(state.parentLock && state.parentLock.enabled && Date.now() > parentUnlockedUntil);
}

async function hashSecret(text, salt) {
  const raw = `${salt}:${text}`;
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* file:// 等环境可能没有 SubtleCrypto */ }
  let h = 2166136261;
  for (let i = 0; i < raw.length; i++) {
    h ^= raw.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return 'fnv1a_' + (h >>> 0).toString(16);
}

function randomToken(length = 12) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  try {
    const arr = new Uint32Array(length);
    crypto.getRandomValues(arr);
    for (let i = 0; i < length; i++) out += chars[arr[i] % chars.length];
  } catch (e) {
    for (let i = 0; i < length; i++) out += chars[Math.floor(Math.random() * chars.length)];
  }
  return out;
}

function recoveryDisplay(code) {
  const s = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  return s.replace(/(.{4})(?=.)/g, '$1-');
}

function normalizeRecovery(code) {
  return String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function pinModalClose() {
  const root = document.getElementById('modalRoot');
  root.innerHTML = '';
  document.body.classList.remove('is-locked');
  modalAbort?.abort();
  modalAbort = null;
}

function openPinDialog({ mode = 'verify', title = '家长验证', desc = '', onSuccess }) {
  if (pinBlockedUntil > Date.now()) {
    toast(`尝试次数过多，请 ${Math.ceil((pinBlockedUntil - Date.now()) / 1000)} 秒后再试。`, '🔐');
    return;
  }
  const isRecover = mode === 'recover';
  const root = document.getElementById('modalRoot');
  modalAbort?.abort();
  modalAbort = new AbortController();
  root.innerHTML = `<div class="modal-backdrop" data-close>
    <div class="modal pin-modal" role="dialog" aria-modal="true">
      <div class="pin-icon">${isRecover ? '🆘' : '🔐'}</div>
      <h3>${title}</h3>
      <p>${desc}</p>
      <input class="pin-input" id="pinInput" type="password" inputmode="numeric" autocomplete="off"
        placeholder="${isRecover ? '输入恢复码' : '输入家长密码'}" maxlength="24" />
      <div class="pin-error" id="pinError"></div>
      <div class="modal-actions">
        <button class="btn btn-sm btn-ghost" data-cancel>取消</button>
        <button class="btn btn-sm btn-primary" data-ok>${isRecover ? '验证恢复码' : '解锁'}</button>
      </div>
      <button class="pin-link" id="pinSwitch" type="button">${isRecover ? '← 返回密码解锁' : '忘记密码？使用恢复码'}</button>
    </div>
  </div>`;
  document.body.classList.add('is-locked');
  const close = pinModalClose;
  const error = root.querySelector('#pinError');
  const input = root.querySelector('#pinInput');
  const submit = async () => {
    if (pinBlockedUntil > Date.now()) {
      error.textContent = `尝试次数过多，请 ${Math.ceil((pinBlockedUntil - Date.now()) / 1000)} 秒后再试。`;
      return;
    }
    const value = input.value.trim();
    if (!value) { error.textContent = isRecover ? '请输入恢复码。' : '请输入家长密码。'; return; }
    if (isRecover) {
      const h = await hashSecret(normalizeRecovery(value), state.parentLock.salt || '');
      if (h !== state.parentLock.recoveryHash) { error.textContent = '恢复码不正确。'; return; }
      pinFailCount = 0;
      close();
      onSuccess?.();
      return;
    }
    const h = await hashSecret(value, state.parentLock.salt || '');
    if (h !== state.parentLock.pinHash) {
      pinFailCount++;
      if (pinFailCount >= 5) {
        pinBlockedUntil = Date.now() + 30000;
        pinFailCount = 0;
        error.textContent = '连续输错 5 次，请 30 秒后再试。';
      } else {
        error.textContent = `密码不正确，还可以尝试 ${5 - pinFailCount} 次。`;
      }
      input.select();
      return;
    }
    pinFailCount = 0;
    parentUnlockedUntil = Date.now() + 10 * 60 * 1000;
    close();
    onSuccess?.();
  };
  root.querySelector('[data-ok]').addEventListener('click', submit, { signal: modalAbort.signal });
  root.querySelector('[data-cancel]').addEventListener('click', close, { signal: modalAbort.signal });
  root.querySelector('.modal-backdrop').addEventListener('click', e => {
    if (e.target.hasAttribute('data-close')) close();
  }, { signal: modalAbort.signal });
  root.querySelector('#pinSwitch').addEventListener('click', () => {
    close();
    openPinDialog({ mode: isRecover ? 'verify' : 'recover', title: isRecover ? '家长验证' : '使用恢复码', desc: isRecover ? '输入家长密码。' : '输入设置密码时保存的恢复码。', onSuccess });
  }, { signal: modalAbort.signal });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }, { signal: modalAbort.signal });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); }, { signal: modalAbort.signal });
  setTimeout(() => input.focus(), 30);
}

async function saveParentLock(pin) {
  const salt = randomToken(16);
  const recovery = randomToken(12);
  const pinHash = await hashSecret(pin, salt);
  const recoveryHash = await hashSecret(normalizeRecovery(recovery), salt);
  state.parentLock = { enabled: true, pinHash, salt, recoveryHash };
  parentUnlockedUntil = Date.now() + 10 * 60 * 1000;
  saveState();
  return recovery;
}

function openPinSetup({ fromRecovery = false } = {}) {
  const root = document.getElementById('modalRoot');
  modalAbort?.abort();
  modalAbort = new AbortController();

/* ============================================================
   小π老师：题目旁的本地提示助手 + DeepSeek 跳转
   ============================================================ */
let helperContext = null;
let helperAbort = null;

function helperContextData() {
  const ctx = helperContext || {};
  const q = ctx.qid ? qById(ctx.qid) : null;
  const ch = q ? chById(q.ch) : (ctx.chId ? chById(ctx.chId) : null);
  return { q, ch };
}

function helperDeepSeekPrompt() {
  const { q, ch } = helperContextData();
  const parts = [];
  if (ch) parts.push(`我在学鲁教版初中数学「${ch.volume}·${ch.title}」。`);
  if (q) {
    parts.push(`【题目】${q.stem}`);
    if (q.options && q.options.length) parts.push(`【选项】${q.options.map((o, i) => `${'ABCD'[i]}. ${o}`).join('；')}`);
    if (q.type === 'fill' && quiz && quiz.fillValue) parts.push(`【我填的】${quiz.fillValue}`);
    if (q.type !== 'fill' && quiz && quiz.selected !== null && quiz.selected !== undefined) parts.push(`【我选的】${'ABCD'[quiz.selected] || ''}`);
    if (q.hint) parts.push(`【我卡住的地方】我看了提示还是不太明白，请先给我一个思路，不要直接给答案。`);
  } else if (ch) {
    parts.push(`【我想问】这一章有哪些最容易混淆的概念？请用初中生听得懂的话讲一讲。`);
  }
  return parts.join('\n');
}

function helperKnowledgeText(q, ch) {
  const k = q ? knowledgeForQuestion(q) : (ch && ch.knowledge[0]);
  if (!k) return '这一题的知识点暂时没有找到，可以把题目再读一遍，圈出已知条件和要求的量。';
  const formulas = (k.formulas || []).map(f => `${f.label}：${f.expr}`).join('；');
  return `这题对应「${k.title}」。\n${k.core}${formulas ? `\n公式：${formulas}` : ''}${k.tip ? `\n小窍门：${k.tip}` : ''}`;
}

function helperAnswerText(kind, q) {
  if (!q) return '你先告诉我卡在哪一步，我陪你一起拆。';
  if (kind === 'hint') return q.hint || '先把题目里的已知条件圈出来，再问自己：要求的量和哪个公式有关？';
  if (kind === 'why') {
    const canSeeAnswer = quiz && quiz.checked;
    return helperKnowledgeText(q, null) + (canSeeAnswer && q.explanation ? `\n这道题的解析里也提到：${q.explanation}` : '\n先按这个知识点想一想，答完题后再看完整解析。');
  }
  if (kind === 'knowledge') return helperKnowledgeText(q, null);
  if (kind === 'rephrase') return `换个说法：${q.hint || '先找题目中的等量关系或图形性质。'}\n再试一次，不用急着算完，先把第一步写出来。`;
  if (kind === 'stuck') return `那我们只做第一步：${q.hint || '把题目读一遍，标出已知和未知。'}\n做完这一步就停下来，告诉我你卡在哪里，我再陪你走下一步。`;
  if (kind === 'answer') {
    if (!quiz || !quiz.checked) return '先不直接给答案。你先选一个最有把握的，或者告诉我你排除了哪几个选项，我帮你缩小范围。';
    return `这题的答案是：${answerText(q)}\n解析：${q.explanation || '看上面的解题路径。'}`;
  }
  return q.hint || '先说说你卡在哪一步，我好帮你。';
}

function helperClose() {
  const root = document.getElementById('modalRoot');
  root.innerHTML = '';
  document.body.classList.remove('is-locked');
  helperAbort?.abort();
  helperAbort = null;
}

function openHelper(context) {
  helperContext = context || {};
  const { q, ch } = helperContextData();
  const root = document.getElementById('modalRoot');
  helperAbort?.abort();
  helperAbort = new AbortController();
  root.innerHTML = `<div class="modal-backdrop" data-close>
    <div class="helper-modal" role="dialog" aria-modal="true" aria-label="小π老师学习助手">
      <div class="helper-head">
        <div class="helper-avatar">π</div>
        <div><b>小π老师</b><span>${q ? `正在看：${q.point}` : ch ? `正在看：${ch.title}` : '陪你一起想'}</span></div>
        <button class="helper-close" id="helperClose" aria-label="关闭">×</button>
      </div>
      <div class="helper-chat" id="helperChat"></div>
      <div class="helper-suggest" id="helperSuggest">
        <button data-helper-kind="hint">再提示一点</button>
        <button data-helper-kind="why">这一步为什么</button>
        <button data-helper-kind="knowledge">看知识点</button>
        <button data-helper-kind="rephrase">换个说法</button>
        <button data-helper-kind="stuck">我还是不懂</button>
      </div>
      <div class="helper-input-row">
        <input id="helperInput" type="text" maxlength="160" placeholder="把不懂的地方写给我，比如：为什么这一步要移项？" autocomplete="off">
        <button class="helper-send" id="helperSend" aria-label="发送">↑</button>
      </div>
      <div class="helper-foot">
        <button class="helper-deepseek" id="helperDeepSeek">🐋 去问 DeepSeek</button>
        <span>会复制题目，不会自动发送；DeepSeek 网页版免费，需登录。</span>
      </div>
    </div>
  </div>`;
  document.body.classList.add('is-locked');
  const chat = root.querySelector('#helperChat');
  const input = root.querySelector('#helperInput');
  const push = (who, text) => {
    const div = document.createElement('div');
    div.className = `helper-msg ${who}`;
    if (who === 'pi') {
      const av = document.createElement('span');
      av.className = 'helper-mini';
      av.textContent = 'π';
      div.appendChild(av);
    }
    const bubble = document.createElement('div');
    bubble.className = 'helper-bubble';
    bubble.textContent = text;
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  };
  const respond = (kind, typed = '') => {
    if (typed) push('me', typed);
    let kindToUse = kind;
    if (!kindToUse && typed) {
      if (/答案|结果|选什么/.test(typed)) kindToUse = 'answer';
      else if (/为什么|原因|原理/.test(typed)) kindToUse = 'why';
      else if (/步骤|怎么做|怎么算|下手/.test(typed)) kindToUse = 'stuck';
      else if (/知识点|公式|概念/.test(typed)) kindToUse = 'knowledge';
      else if (/不懂|不会|难|卡/.test(typed)) kindToUse = 'stuck';
      else kindToUse = 'hint';
    }
    if (!kindToUse) kindToUse = 'hint';
    if (!q && ch) {
      const k = ch.knowledge[0];
      const base = k ? `这一章先抓住「${k.title}」。\n${k.core}${k.tip ? `\n小窍门：${k.tip}` : ''}` : `先看「${ch.title}」的知识卡。`;
      const text = kindToUse === 'stuck'
        ? `我们只做第一步：先读「${k?.title || ch.title}」的第一段，找出“它是什么”。读完告诉我你最有感觉的一句话。`
        : kindToUse === 'rephrase'
          ? `换个说法：${k?.core || '先弄懂概念，再去做题。'}`
          : base + (kindToUse === 'why' && k?.why ? `\n为什么：${k.why}` : '');
      push('pi', text);
      return;
    }
    push('pi', helperAnswerText(kindToUse, q));
  };
  push('pi', q
    ? `嗨，我是小π。这道题考的是「${q.point}」。先别急着要答案，你卡在哪一步？`
    : `嗨，我是小π。${ch ? `我们在「${ch.title}」这一章。` : ''}你可以问我知识点、思路或某一步为什么。`);
  root.querySelector('#helperClose').addEventListener('click', helperClose, { signal: helperAbort.signal });
  root.querySelector('.modal-backdrop').addEventListener('click', e => { if (e.target.hasAttribute('data-close')) helperClose(); }, { signal: helperAbort.signal });
  root.querySelectorAll('[data-helper-kind]').forEach(btn => {
    btn.addEventListener('click', () => respond(btn.dataset.helperKind), { signal: helperAbort.signal });
  });
  const send = () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    respond('', text);
  };
  root.querySelector('#helperSend').addEventListener('click', send, { signal: helperAbort.signal });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } }, { signal: helperAbort.signal });
  root.querySelector('#helperDeepSeek').addEventListener('click', () => {
    const prompt = helperDeepSeekPrompt();
    const win = window.open('https://chat.deepseek.com/', '_blank');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(prompt).then(() => toast('题目已复制，去 DeepSeek 粘贴提问吧。', '🐋', 4200)).catch(() => window.prompt('复制这段题目去 DeepSeek：', prompt));
      } else {
        window.prompt('复制这段题目去 DeepSeek：', prompt);
      }
    } catch (e) { window.prompt('复制这段题目去 DeepSeek：', prompt); }
    if (!win) toast('浏览器拦截了新标签页，请允许弹窗后再试。', '🐋');
  }, { signal: helperAbort.signal });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') helperClose(); }, { signal: helperAbort.signal });
  setTimeout(() => input.focus(), 40);
}

function homeworkKey(volumeId, source, page) {
  return `${source}|${volumeId}|${page}`;
}

function homeworkLookup(volumeId, source, page) {
  const id = state.homework.map[homeworkKey(volumeId, source, page)];
  if (id) return chById(id);
  if (source === 'textbook' && typeof homeworkPageRange === 'function') {
    const range = homeworkPageRange(volumeId, page);
    if (range) return chById(range.chapterId);
  }
  return null;
}

function homeworkVolumeOptions(selected) {
  return VOLUMES.map(v => `<option value="${v.id}" ${v.id === selected ? 'selected' : ''}>${v.title}</option>`).join('');

  const preview = $('#hwPreview');
  const refresh = () => {
    const v = volume.value;
    const s = source.value;
    const p = page.value.trim();
    const known = p ? homeworkLookup(v, s, p) : null;
    const mapped = p ? state.homework.map[homeworkKey(v, s, p)] : null;
    chapter.innerHTML = homeworkChapterOptions(v, known ? known.id : chapter.value);
    if (known) {
      preview.innerHTML = `<span class="hw-preview-icon">✅</span><div><b>已关联：${esc(known.volume)} · 第 ${known.num} 章 ${esc(known.title)}</b><span>${mapped ? '这一页以前记录过，可以直接开始。' : '按课本页码自动关联，可以直接开始。'}</span></div>`;
      chapter.value = known.id;
    } else if (p) {
      preview.innerHTML = `<span class="hw-preview-icon">🧭</span><div><b>这一页还没有收录</b><span>请在下面选一次对应章节，开始后会自动记住。</span></div>`;
    } else {
      preview.innerHTML = `<span class="hw-preview-icon">📍</span><div><b>还没有选择页码</b><span>输入页码后，我会帮你找对应章节。</span></div>`;
    }
  };
  volume.addEventListener('change', refresh);
  source.addEventListener('change', refresh);
  page.addEventListener('input', refresh);
  $('#hwStart').addEventListener('click', () => {
    const v = volume.value;
    const s = source.value;
    const p = Number(page.value);
    const q = $('#hwQuestion').value.trim();
    const ch = chapter.value;
    if (!p || p < 1) { toast('先填一下课本页码。', '📄'); page.focus(); return; }
    if (!q) { toast('再填一下题号，例如“第3题”。', '✏️'); $('#hwQuestion').focus(); return; }
    if (!ch) { toast('请选择对应章节。', '📚'); return; }
    const chapterObj = chById(ch);
    const key = homeworkKey(v, s, p);
    state.homework.map[key] = ch;
    state.homework.lastVolume = v;
    saveState();
    homeworkSession = {
      volumeId: v, volumeName: (VOLUMES.find(x => x.id === v) || {}).title || v,
      source: s, sourceName: (HOMEWORK_SOURCES.find(x => x.id === s) || {}).name || s,
      page: p, question: q, chapterId: ch, chapterTitle: chapterObj ? `第 ${chapterObj.num} 章 ${chapterObj.title}` : '',
      startedAt: Date.now(), uncertain: false, note: ''
    };
    renderHomework();
  });
}

function renderHomeworkSession() {
  const s = homeworkSession;
  const ch = chById(s.chapterId);
  if (!ch) { homeworkSession = null; renderHomework(); return; }
  app.innerHTML = `<div class="page-wrap homework-page">
    <div class="homework-session-top">
      <a class="back-link" href="#homework" id="hwQuit">← 返回作业岛</a>

    </div>
    <div class="homework-session-card">
      <div class="homework-session-id">
        <span class="hw-book">📖</span>
        <div><div class="eyebrow">${esc(s.volumeName)} · ${esc(s.sourceName)}</div><h1>P${s.page} · ${esc(s.question)}</h1><p>${esc(s.chapterTitle)}</p></div>
      </div>
      <div class="homework-session-actions">
        <a class="btn btn-sm btn-ghost" href="#chapter/${ch.id}/knowledge">看知识卡</a>

        <button class="btn btn-sm btn-ghost" id="hwAskPi" type="button">🐣 问小π</button>

      </div>
      <label class="homework-note-label" for="hwNote">作业里卡住的地方（可选）</label>
      <textarea id="hwNote" rows="3" placeholder="例如：第(2)问不知道怎么设未知数">${esc(s.note || '')}</textarea>
      <div class="homework-session-footer">
        <button class="btn btn-sm ${s.uncertain ? 'btn-coral' : 'btn-ghost'}" id="hwUncertain">${s.uncertain ? '✓ 已标记不确定' : '标记不确定'}</button>
        <button class="btn btn-sm btn-primary" id="hwFinish">完成作业，领取作业星 →</button>
        <button class="btn btn-sm btn-ghost" id="hwDiscard">放弃这次</button>
      </div>
    </div>
    <div class="homework-tip">📌 作业岛只给提示和知识卡，不直接给答案。先自己写，再问小π。</div>
  </div>`;
  const tick = () => {
    const el = $('#hwTimer');
    if (!el) return;
    const sec = Math.max(0, Math.floor((Date.now() - s.startedAt) / 1000));
    el.textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  };
  clearInterval(homeworkTimer);
  tick();
  homeworkTimer = setInterval(tick, 1000);
  $('#hwAskPi').addEventListener('click', () => openHelper({ type: 'chapter', chId: ch.id }));
  $('#hwUncertain').addEventListener('click', () => {
    s.uncertain = !s.uncertain;
    renderHomework();
  });
  $('#hwFinish').addEventListener('click', () => {
    s.note = $('#hwNote').value.trim();
    const minutes = Math.max(1, Math.round((Date.now() - s.startedAt) / 60000));
    const item = {
      id: `hw-${Date.now()}`,
      date: todayKey(),
      volumeId: s.volumeId, volumeName: s.volumeName,
      source: s.source, sourceName: s.sourceName,
      page: s.page, question: s.question,
      chapterId: s.chapterId, chapterTitle: s.chapterTitle,
      minutes, uncertain: s.uncertain, note: s.note
    };
    state.homework.log.unshift(item);
    state.homework.log = state.homework.log.slice(0, 200);
    addXP(10, '完成一次作业');
    checkBadges();
    saveState();
    homeworkSession = null;
    clearInterval(homeworkTimer);
    playSound('victory');
    burstConfetti(70);
    toast(`作业完成！+10 XP，记录 ${homeworkMinutesLabel(minutes)}。`, '📚', 4200);
    renderHomework();
  });
  $('#hwDiscard').addEventListener('click', () => {
    openModal({
      title: '放弃这次作业记录？',
      body: '这次计时和填写的内容不会保存，已经记住的页码关系仍然保留。',
      confirmText: '放弃',
      danger: true,
      onConfirm: () => { homeworkSession = null; clearInterval(homeworkTimer); renderHomework(); }
    });
  });
  $('#hwQuit').addEventListener('click', e => {
    e.preventDefault();
    location.hash = '#homework';
    renderHomework();
  });
}

function filterCourseRows() {
  let count = 0;
  $$('.course-row').forEach(row => {

  });

}

    const nr = node.getBoundingClientRect();
    const sr = scroll.getBoundingClientRect();
    const target = scroll.scrollLeft + (nr.left - sr.left) - scroll.clientWidth / 2 + nr.width / 2;
    scroll.scrollLeft = Math.max(0, target);
  });
  updateTopStats();
}

function bindKnowledgeTab(ch) {
  const openSet = openCardSets[ch.id];
  $$('[data-khead]', app).forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.khead;
      if (openSet.has(id)) openSet.delete(id); else openSet.add(id);
      const card = btn.closest('.k-card');
      card.classList.toggle('open', openSet.has(id));
      btn.setAttribute('aria-expanded', openSet.has(id));
      if (openSet.has(id) && state.daily.learned < 1) {
        state.daily.learned = 1;
        addActivity('打开知识卡开始学习', 0);
        saveState();
      }
    });
  });
  $$('[data-learn]', app).forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.learn;
      const learned = state.learned.includes(id);
      if (learned) {
        state.learned = state.learned.filter(x => x !== id);
        saveState();
        toast('已取消“读懂”标记，可以再复习一次。', '↩️');
      } else {
        state.learned.push(id);
        state.daily.learned++;
        addXP(5, '读懂一张知识卡');
        playSound('correct');
        toast('读懂一张知识卡，+5 XP。继续！', '📖');
        checkBadges();
      }
      const y = scrollY;
      renderChapter(ch.id, 'knowledge');
      scrollTo(0, y);
      updateTopStats();
    });
  });
  const toggleAll = $('#kToggleAll');
  if (toggleAll) {
    const allOpen = ch.knowledge.every(k => openSet.has(k.id));
    toggleAll.textContent = allOpen ? '收起全部' : '展开全部';
    toggleAll.addEventListener('click', () => {
      if (allOpen) openSet.clear(); else ch.knowledge.forEach(k => openSet.add(k.id));
      const y = scrollY;
      renderChapter(ch.id, 'knowledge');
      scrollTo(0, y);
    });
  }
  const kAskPi = $('#kAskPi');
  if (kAskPi) kAskPi.addEventListener('click', () => openHelper({ type: 'chapter', chId: ch.id }));
}

function startQuiz(opts) {
  let qids = opts.qids ? opts.qids.slice() : [];
  if (!qids.length) {
    if (opts.mode === 'chapter') qids = shuffle(chapterQuestions(opts.chapterId).map(q => q.id)).slice(0, opts.count || 8);
    else if (opts.mode === 'wrong') {
      qids = state.wrong.filter(w => w.status !== 'mastered').map(w => w.qid);
      if (!qids.length) {
        toast('暂时没有待复习的错题。先去闯关，错题会自己找上门。', '🪹');
        return;
      }
      qids = shuffle([...new Set(qids)]);
    } else qids = shuffle(QUESTIONS.map(q => q.id)).slice(0, opts.count || 10);
  }
  qids = [...new Set(qids)].filter(id => qById(id));
  if (!qids.length) { toast('没有找到可以练习的题目。', '🧩'); return; }
  practiceResult = null;
  quiz = {
    qids, index: 0, selected: null, checked: false, correct: false,
    hint: false, combo: 0, maxCombo: 0, xpStart: state.xp, xpEarned: 0,
    answers: [], mode: opts.mode || 'random', chapterId: opts.chapterId || '',
    title: opts.title || '随机挑战', count: qids.length, fillValue: ''
  };
  playSound(opts.mode === 'chapter' ? 'mission' : 'click');
  if (location.hash === '#practice') renderPractice();
  else location.hash = '#practice';
}

function renderQuiz() {
  const q = qById(quiz.qids[quiz.index]);
  if (!q) { finishQuiz(); return; }
  const ch = chById(q.ch);
  const pct = Math.round((quiz.index / quiz.qids.length) * 100);
  const selected = quiz.selected;
  const optionsHTML = q.type === 'fill'
    ? `<div class="fill-zone">
        <input type="text" id="fillInput" inputmode="text" placeholder="在这里输入答案" value="${esc(quiz.fillValue || '')}" ${quiz.checked ? 'disabled' : ''} autocomplete="off">
        ${quiz.checked ? '' : '<button class="btn btn-primary" id="submitFill">确认答案</button>'}
      </div>`
    : `<div class="quiz-options">${q.options.map((opt, i) => {
      let cls = 'option';
      if (quiz.checked) {
        if (i === q.answer) cls += ' correct';
        else if (i === selected) cls += ' wrong';
        else cls += ' dim';
      } else if (i === selected) cls += ' selected';
      return `<button class="${cls}" data-option="${i}" ${quiz.checked ? 'disabled' : ''}><span class="o-key">${'ABCD'[i]}</span><span>${opt}</span></button>`;
    }).join('')}</div>`;
  const feedback = quiz.checked ? `<div class="feedback ${quiz.correct ? 'good' : 'bad'}" role="status" aria-live="polite">
    <div class="feedback-head"><span class="f-emoji">${quiz.correct ? '🌟' : '🧩'}</span><span class="f-title">${pName()}，${quiz.correct ? '答对啦！' : '差一点点，看看卡在哪一步'}</span><span class="xp-gain">${quiz.correct ? `+${quiz.lastGain || 0} XP` : '已收进错题本'}</span></div>
    <p class="feedback-answer"><b>${quiz.correct ? '答案' : '正确答案'}：</b>${answerText(q)}${q.type === 'fill' && quiz.chosenText ? `　你的答案：${esc(quiz.chosenText)}` : ''}</p>
    ${solutionPathHTML(q)}
    ${knowledgeRecapHTML(q)}
    <div class="feedback-next">
      <button class="btn btn-primary" id="nextQ">${quiz.index + 1 >= quiz.qids.length ? '查看本轮成绩 →' : '下一题 →'}</button>
      <button class="btn btn-ghost" id="speakFeedback" type="button">🔊 听鼓励</button>
      <button class="btn btn-ghost helper-inline" id="askPiFeedback" type="button">🐣 问小π</button>
      ${!quiz.correct ? '<a class="btn btn-ghost" href="#wrong">去错题本看看</a>' : ''}
    </div>
  </div>` : '';
  const hint = quiz.hint && !quiz.checked ? `<div class="hint-box"><b>提示：</b>${q.hint}</div>` : '';

  app.innerHTML = `<div class="page-wrap">
    <div class="quiz-wrap">
      <div class="quiz-top">
        <a class="back-link" href="#practice" id="quitQuiz">← 退出本轮</a>
        <div class="quiz-progress"><div class="progress"><i style="width:${pct}%"></i></div><small>${quiz.index + 1} / ${quiz.qids.length}</small></div>
        ${quiz.combo >= 2 ? `<span class="quiz-combo">🔥 连击 ×${quiz.combo}</span>` : ''}
      </div>
      <div class="quiz-card">
        <div class="quiz-meta">
          <span class="chip coral">第 ${ch.num} 章 · ${ch.title}</span>
          <span class="chip">${q.point}</span>
          <span class="chip ${q.level === 3 ? 'pink' : q.level === 2 ? 'gold' : 'teal'}">${q.level === 3 ? '挑战' : q.level === 2 ? '进阶' : '基础'}</span>
          <span class="chip">${quiz.title}</span>
        </div>
        <div class="quiz-stem">${q.stem}</div>
        ${questionFigureHTML(q)}
        ${optionsHTML}
        ${hint}
        <div class="quiz-actions">
          <div class="left">
            ${!quiz.checked ? `<button class="hint-btn" id="hintBtn">💡 ${quiz.hint ? '收起提示' : '给点提示'}</button>` : '<span class="small muted">把解析读一遍，再进入下一题。</span>'}
            <button class="hint-btn helper-inline" id="askPi" type="button">🐣 问小π</button>
          </div>
          ${!quiz.checked && q.type !== 'fill' ? `<button class="btn btn-primary" id="submitChoice" ${selected === null ? 'disabled' : ''}>确认答案</button>` : ''}
        </div>
        ${feedback}
      </div>
      <div class="quiz-footnote">键盘：1–4 选择 · Enter 确认 / 下一题 · H 提示</div>
    </div>
  </div>`;

  $$('[data-option]', app).forEach(btn => {
    btn.addEventListener('click', () => {
      if (quiz.checked) return;
      quiz.selected = Number(btn.dataset.option);
      renderQuiz();
    });
  });
  const submitChoice = $('#submitChoice');
  if (submitChoice) submitChoice.addEventListener('click', submitQuizAnswer);
  const submitFill = $('#submitFill');
  if (submitFill) submitFill.addEventListener('click', submitQuizAnswer);
  const fillInput = $('#fillInput');
  if (fillInput) {
    fillInput.addEventListener('input', () => { quiz.fillValue = fillInput.value; });
    fillInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !quiz.checked) { e.preventDefault(); submitQuizAnswer(); } });
  }
  const hintBtn = $('#hintBtn');
  if (hintBtn) hintBtn.addEventListener('click', () => { quiz.hint = !quiz.hint; renderQuiz(); });
  const askPi = $('#askPi');
  if (askPi) askPi.addEventListener('click', () => openHelper({ type: 'quiz', qid: q.id }));
  const askPiFeedback = $('#askPiFeedback');
  if (askPiFeedback) askPiFeedback.addEventListener('click', () => openHelper({ type: 'quiz', qid: q.id }));
  const nextQ = $('#nextQ');
  if (nextQ) nextQ.addEventListener('click', nextQuizQuestion);
  const speakFeedback = $('#speakFeedback');
  if (speakFeedback) speakFeedback.addEventListener('click', () => {
    voiceEncourage(quiz.correct ? 'correct' : 'wrong');
  });
  $('#quitQuiz').addEventListener('click', e => {
    e.preventDefault();
    openModal({
      title: '要退出本轮闯关吗？',
      body: '已经答过的题会保留记录，但这轮还没有结算。下次可以从“闯关”重新开始。',
      confirmText: '退出本轮',
      danger: true,
      onConfirm: () => { quiz = null; location.hash = '#practice'; renderPractice(); }
    });
  });
  bindQuizKeyboard();
}

function bindQuizKeyboard() {
  if (quizKeyAbort) quizKeyAbort.abort();
  quizKeyAbort = new AbortController();
  const ac = quizKeyAbort;
  document.addEventListener('keydown', e => {
    if (!quiz || !location.hash.startsWith('#practice')) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (quiz.checked) {
      if (e.key === 'Enter') { e.preventDefault(); nextQuizQuestion(); }
      return;
    }
    if (/^[1-4]$/.test(e.key)) {
      const i = Number(e.key) - 1;
      const q = qById(quiz.qids[quiz.index]);
      if (q.type !== 'fill' && i < q.options.length) { quiz.selected = i; renderQuiz(); }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (quiz.selected !== null) submitQuizAnswer();
    } else if (e.key.toLowerCase() === 'h') {
      quiz.hint = !quiz.hint; renderQuiz();
    }
  }, { signal: ac.signal });
}

function submitQuizAnswer() {
  if (!quiz || quiz.checked) return;
  const q = qById(quiz.qids[quiz.index]);
  let value = quiz.selected;
  if (q.type === 'fill') {
    const input = $('#fillInput');
    value = input ? input.value.trim() : (quiz.fillValue || '').trim();
    if (!value) { toast('先写下你的答案，再确认。', '✏️'); return; }
    quiz.fillValue = value;
  } else if (value === null || value === undefined) {
    toast('先选一个答案，再确认。', '👆');
    return;
  }
  const correct = isCorrectAnswer(q, value);
  const gain = applyAnswerResult(q, correct, q.type === 'fill' ? value : q.options[value], { reason: `${chById(q.ch).title} · ${q.point}` });
  quiz.checked = true;
  quiz.correct = correct;
  quiz.chosenText = q.type === 'fill' ? value : q.options[value];
  quiz.lastGain = gain;
  if (correct) {
    quiz.combo++;
    quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo);
    state.bestCombo = Math.max(state.bestCombo, quiz.combo);
    quiz.xpEarned += gain;
    playSound('correct');
    if (quiz.combo >= 3) burstConfetti(28, innerWidth * 0.5, innerHeight * 0.28);
    if (quiz.combo >= 5) checkBadges();
  } else {
    quiz.combo = 0;
    playSound('wrong');
  }
  quiz.answers.push({ qid: q.id, correct, value: quiz.chosenText });
  saveState();
  updateTopStats();
  renderQuiz();
}

function nextQuizQuestion() {
  if (!quiz) return;
  if (quiz.index + 1 >= quiz.qids.length) { finishQuiz(); return; }
  quiz.index++;
  quiz.selected = null;
  quiz.checked = false;
  quiz.correct = false;
  quiz.hint = false;
  quiz.chosenText = '';
  quiz.fillValue = '';
  renderQuiz();
}

function finishQuiz() {
  if (!quiz) return;
  const total = quiz.qids.length;
  const correct = quiz.answers.filter(a => a.correct).length;
  const accuracy = total ? Math.round((correct / total) * 100) : 0;
  const wrongQids = quiz.answers.filter(a => !a.correct).map(a => a.qid);
  let campaign = null;
  if (quiz.mode === 'chapter' && quiz.chapterId && chById(quiz.chapterId)) {
    const prev = campaignRecord(quiz.chapterId);
    const earnedStars = starsForAccuracy(accuracy);
    const bestStars = Math.max(prev.stars, earnedStars);
    const newMedal = bestStars > prev.stars;
    const newRecord = accuracy > prev.bestAccuracy;
    state.campaign[quiz.chapterId] = {
      bestAccuracy: Math.max(prev.bestAccuracy, accuracy),
      stars: bestStars,
      attempts: (prev.attempts || 0) + 1,
      lastAt: Date.now()
    };
    campaign = {
      chId: quiz.chapterId, earnedStars, bestStars, newMedal, newRecord,
      bestAccuracy: Math.max(prev.bestAccuracy, accuracy),
      medal: medalInfo(bestStars)
    };
    campaignSelected = quiz.chapterId;
  }
  practiceResult = {
    total, correct, accuracy, wrongQids,
    qids: quiz.qids.slice(),
    xpEarned: quiz.xpEarned,
    maxCombo: quiz.maxCombo,
    campaign,
    mode: quiz.mode, chapterId: quiz.chapterId, title: quiz.title
  };
  state.quizHistory.unshift({ ts: Date.now(), total, correct, accuracy, mode: quiz.mode, title: quiz.title });
  state.quizHistory = state.quizHistory.slice(0, 20);
  addActivity(`完成「${quiz.title}」：答对 ${correct}/${total}`, 0);
  if (campaign) addActivity(`战役 M-${String(chById(campaign.chId).num).padStart(2, '0')}：获得 ${campaign.earnedStars} 星`, 0);
  if (quizKeyAbort) { quizKeyAbort.abort(); quizKeyAbort = null; }
  quiz = null;
  checkBadges();
  saveState();
  updateTopStats();
  playSound(accuracy >= 70 ? 'victory' : accuracy >= 50 ? 'mission' : 'click');
  setTimeout(() => voiceEncourage('result', { correct, accuracy }), 650);
  if (accuracy >= 80) burstConfetti(110);
  if (campaign && campaign.newMedal) {
    setTimeout(() => {
      toast(`新战功：<b>${campaign.medal.name}</b>！去战役地图看看你的勋章。`, campaign.medal.icon, 4600);
      playSound('medal');
      burstConfetti(65);
    }, 900);
  }
  renderPracticeResult();
}

        </div>` : ''}
        ${wrongList.length ? `<div class="result-review"><b>这轮需要回看的题：</b>${wrongList.map(q => `<div style="margin-top:6px">· 第 ${chById(q.ch).num} 章「${q.point}」</div>`).join('')}</div>` : '<div class="result-review" style="text-align:center"><b>没有错题，漂亮！</b> 可以试试更高难度的随机挑战。</div>'}

        </div>
      </div>
      <div class="card card-pad" style="margin-top:14px">
        <div class="eyebrow">ONE MORE THING</div>
        <p style="margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.8">关掉页面前，试着用一句话说出这轮最容易错的知识点。能说出来，才是真的会了。</p>
      </div>
    </div>
  </div>`;
  $('#againQuiz').addEventListener('click', () => {
    practiceResult = null;
    if (r.mode === 'chapter') startQuiz({ mode: 'chapter', chapterId: r.chapterId, count: Math.min(8, chapterQuestions(r.chapterId).length), title: r.title });
    else if (r.mode === 'wrong') startQuiz({ mode: 'wrong', title: '错题重练' });
    else if (r.mode === 'review') startQuiz({ mode: 'review', qids: r.qids, title: r.title });
    else startQuiz({ mode: r.mode, count: r.total, title: r.title });
  });
  $('#practiceMenu').addEventListener('click', () => { practiceResult = null; renderPractice(); });

      </div>

  $$('[data-wstatus]').forEach(b => b.addEventListener('click', () => { wrongFilter = b.dataset.wstatus; renderWrong(); }));
  $('#wrongChapterSelect').addEventListener('change', e => { wrongChapterFilter = e.target.value; renderWrong(); });
  $('#reviewAllWrong').addEventListener('click', () => startQuiz({ mode: 'wrong', title: '错题重练' }));

function recentDateKeys(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    out.push(todayKey(d));
  }
  return out;
}

function weekdayCN(dateKey) {
  const d = new Date(dateKey + 'T12:00:00');
  return '日一二三四五六'[d.getDay()];
}

function renderReport() {
  const days = recentDateKeys(7);
  const dayData = days.map(date => {
    const d = state.dailyLog[date] || {};
    return {
      date,
      label: `${Number(date.slice(5, 7))}/${Number(date.slice(8, 10))}`,
      weekday: weekdayCN(date),
      xp: Number(d.xp || 0),
      correct: Number(d.correct || 0),
      attempts: Number(d.attempts || 0),
      learned: Number(d.learned || 0),
      reviewed: Number(d.reviewed || 0),
      focusMinutes: Number(d.focusMinutes || 0)
    };
  });
  const totals = dayData.reduce((a, d) => {
    a.xp += d.xp; a.correct += d.correct; a.attempts += d.attempts;
    a.learned += d.learned; a.reviewed += d.reviewed; a.focusMinutes += d.focusMinutes;
    return a;
  }, { xp: 0, correct: 0, attempts: 0, learned: 0, reviewed: 0, focusMinutes: 0 });
  const studyDays = dayData.filter(d => d.xp || d.attempts || d.learned || d.reviewed || d.focusMinutes).length;
  const weekAttempts = Math.max(totals.attempts, totals.correct);
  const weekAccuracy = weekAttempts ? Math.round(totals.correct / weekAttempts * 100) : null;
  const maxXp = Math.max(20, ...dayData.map(d => d.xp));
  const cp = campaignTotals();
  const os = overallStats();
  const weak = CHAPTERS.map(ch => ({ ch, st: chapterStats(ch) }))
    .filter(x => x.st.attempts >= 2)
    .sort((a, b) => (a.st.accuracy ?? 100) - (b.st.accuracy ?? 100) || a.st.progress - b.st.progress)
    .slice(0, 4);
  const strong = CHAPTERS.map(ch => ({ ch, st: chapterStats(ch) }))
    .filter(x => x.st.accuracy !== null && x.st.accuracy >= 75 && x.st.attempts >= 2)
    .sort((a, b) => b.st.accuracy - a.st.accuracy)
    .slice(0, 3);
  const pendingWrong = state.wrong.filter(w => w.status !== 'mastered').length;
  const hwWeek = (state.homework.log || []).filter(h => days.includes(h.date));
  const hwMinutes = hwWeek.reduce((n, h) => n + Number(h.minutes || 0), 0);
  const hwUncertain = hwWeek.filter(h => h.uncertain).length;
  const suggestions = [];
  if (studyDays < 3) suggestions.push('本周学习天数偏少，建议固定一个 20～30 分钟的“数学时间”，比一次学很久更容易坚持。');
  if (weak.length && weak[0].st.accuracy !== null && weak[0].st.accuracy < 75) suggestions.push(`第 ${weak[0].ch.num} 章「${weak[0].ch.title}」正确率 ${weak[0].st.accuracy}%，建议先回看知识卡，再做 3～5 道基础题。`);
  if (pendingWrong > 0) suggestions.push(`错题本还有 ${pendingWrong} 道待复习题。每天重做 1～2 道，连续答对 2 次就会变成“已掌握”。`);
  if (cp.stars < 11) suggestions.push('可以让孩子用“战役地图”选择薄弱章节挑战，星级只记录最好成绩，不会因为一次失误扣星。');
  if (!suggestions.length) suggestions.push('本周状态很稳。保持每天阅读一张知识卡、做几道题、复盘一道错题的节奏即可。');
  const weekRange = `${days[0].slice(5).replace('-', '/')} – ${days[days.length - 1].slice(5).replace('-', '/')}`;

  app.innerHTML = `<div class="page-wrap report-page">
    <div class="report-top">
      <div>
        <div class="eyebrow">PARENT REPORT · 家长学习报告</div>
        <h1>${pName()}的本周学习报告</h1>
        <p>${weekRange} · 数据来自本机学习记录${state.settings.voice ? ' · 语音鼓励已开启' : ''}</p>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="printReport">🖨 打印 / 保存 PDF</button>
        <a class="btn btn-ghost" href="#achievements">返回成长档案</a>
      </div>
    </div>

    <section class="report-summary">
      <div class="report-stat"><span>本周学习</span><b>${studyDays}<small> 天</small></b><em>${studyDays >= 5 ? '习惯很好' : studyDays >= 3 ? '继续保持' : '需要加一点频率'}</em></div>
      <div class="report-stat"><span>本周答题</span><b>${weekAttempts}<small> 次</small></b><em>答对 ${totals.correct} 次</em></div>
      <div class="report-stat"><span>本周正确率</span><b>${weekAccuracy === null ? '—' : weekAccuracy + '%'}</b><em>${weekAccuracy === null ? '本周还没有答题' : weekAccuracy >= 80 ? '基础较稳' : '建议回看错题'}</em></div>
      <div class="report-stat"><span>本周获得</span><b>${totals.xp}<small> XP</small></b><em>荣誉星 ${state.honorStars || 0} 颗</em></div>
      <div class="report-stat"><span>专注时间</span><b>${totals.focusMinutes}<small> 分钟</small></b><em>读完 ${totals.learned} 张知识卡</em></div>
      <div class="report-stat"><span>战役星章</span><b>${cp.stars}<small> / ${cp.max}</small></b><em>已攻克 ${cp.cleared} / ${CHAPTERS.length} 章</em></div>
    </section>

    <section class="report-panel">
      <div class="report-panel-head"><div><h2>本周学习节奏</h2><p>柱子的高度代表当天获得的 XP。</p></div><span class="chip">最近 7 天</span></div>
      <div class="report-chart">
        ${dayData.map(d => `<div class="report-day">
          <b>${d.xp}</b>
          <div class="report-bar-track"><i style="height:${Math.max(4, Math.round(d.xp / maxXp * 100))}%"></i></div>
          <span>${d.label}</span><small>周${d.weekday}</small>
        </div>`).join('')}
      </div>
    </section>

    <div class="report-columns">
      <section class="report-panel">
        <div class="report-panel-head"><div><h2>章节掌握情况</h2><p>正确率低于 75% 的章节会排在前面。</p></div><span class="chip">${weak.length ? '需要关注' : '暂无足够数据'}</span></div>
        <div class="report-table">
          ${CHAPTERS.map(ch => {
            const st = chapterStats(ch);
            const acc = st.accuracy;
            return `<div class="report-row">
              <span class="rr-name">${ch.num}. ${ch.title}</span>
              <div class="rr-progress"><div class="progress thin"><i style="width:${st.progress}%;background:${ch.color}"></i></div><small>${st.learned}/${st.totalK} 卡 · ${st.correctUnique}/${st.totalQ} 题</small></div>
              <b class="${acc !== null && acc < 60 ? 'low' : ''}">${acc === null ? '—' : acc + '%'}</b>
            </div>`;
          }).join('')}
        </div>
      </section>

      <section class="report-panel">
        <div class="report-panel-head"><div><h2>需要关注</h2><p>不是批评，是下一步的方向。</p></div><span class="chip coral">${pendingWrong} 道待复习</span></div>
        <div class="report-focus-list">
          ${weak.length ? weak.map(({ ch, st }) => `<div class="report-focus">
            <span class="rf-dot" style="background:${ch.color}"></span>
            <div><b>第 ${ch.num} 章 · ${ch.title}</b><span>正确率 ${st.accuracy}% · 已答 ${st.attempts} 次 · 进度 ${st.progress}%</span></div>
            <a class="text-link" href="#chapter/${ch.id}/knowledge">去复习</a>
          </div>`).join('') : '<p class="small muted">答题次数还不够，先完成几轮闯关，报告会更准确。</p>'}
          ${strong.length ? `<div class="report-good">本周较稳：${strong.map(x => `第 ${x.ch.num} 章 ${x.ch.title}（${x.st.accuracy}%）`).join('；')}。</div>` : ''}
        </div>
      </section>
    </div>

    <section class="report-panel">
      <div class="report-panel-head"><div><h2>作业记录</h2><p>本周从作业岛登记的作业，不记录具体答案。</p></div><span class="chip gold">${hwWeek.length} 次 · ${homeworkMinutesLabel(hwMinutes)}</span></div>
      <div class="homework-report-summary">
        <div><b>${hwWeek.length}</b><span>本周作业次数</span></div>
        <div><b>${hwMinutes}</b><span>作业分钟</span></div>
        <div><b>${hwUncertain}</b><span>标记不确定</span></div>
      </div>
      ${hwWeek.length ? `<div class="homework-report-list">${hwWeek.slice(0, 6).map(h => `<div class="homework-report-row">
        <span>${esc(h.date || '')}</span>
        <b>${esc(h.volumeName || '')} · P${h.page} · ${esc(h.question || '')}</b>
        <em>${esc(h.chapterTitle || '')}</em>
        <small>${homeworkMinutesLabel(h.minutes)}${h.uncertain ? ' · 不确定' : ''}</small>
      </div>`).join('')}</div>` : '<p class="small muted">本周还没有作业记录。可以在首页点“登记作业”开始。</p>'}
    </section>

    <section class="report-panel report-advice">
      <div class="report-panel-head"><div><h2>给家长的建议</h2><p>少问“考了多少分”，多问“今天弄懂了什么”。</p></div></div>
      <ol>${suggestions.map(s => `<li>${s}</li>`).join('')}</ol>
      <div class="report-note">报告只统计本机浏览器里的学习记录；三台设备如开启云同步，会在同步后合并进度。打印时只保留报告内容。</div>
    </section>
  </div>`;

  $('#printReport').addEventListener('click', () => window.print());
  updateTopStats();
}

        ${state.activity.length ? `<ul class="activity-list">${state.activity.slice(0, 8).map(a => `<li><span>${a.xp > 0 ? '⚡' : '·'}</span><b>${a.text}</b><span class="a-time">${fmtDate(a.ts)}</span></li>`).join('')}</ul>` : '<p class="small muted">还没有记录。去读一张知识卡或答一道题，这里就会热闹起来。</p>'}
      </div>
    </div>

    <div class="section-title-row"><div><h2>我的探险家档案</h2><p>换个喜欢的头像和昵称，让这座岛更像你自己的。</p></div></div>
    <div class="profile-editor">
      <div class="pe-avatar"><img src="${avatarSrc()}" alt="${pName()}的头像"></div>
      <div class="pe-main">
        <label class="pe-label" for="nicknameInput">我的昵称</label>
        <div class="pe-row">
          <input class="nickname-input" id="nicknameInput" maxlength="8" value="${esc(profileName())}" aria-label="我的昵称">
          <button class="btn btn-sm btn-primary" id="saveNickname">保存昵称</button>
        </div>
        <div class="pe-row">
          <button class="btn btn-sm btn-soft" id="changeAvatar">📷 更换头像</button>
          <button class="btn btn-sm btn-ghost" id="resetAvatar">恢复默认头像</button>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>
        <p class="pe-hint">头像和昵称只保存在本机浏览器，不会上传到任何地方。</p>
      </div>
    </div>

    ${parentControlHTML()}

    <div class="section-title-row"><div><h2>设置与数据</h2><p>学习记录保存在本机浏览器里，不会上传。</p></div></div>
    <div class="ach-panel" style="max-width:680px">
      <div class="settings-row"><span>答题音效</span><button class="switch ${state.settings.sound ? 'on' : ''}" id="soundSwitch" aria-label="音效开关"></button></div>
      <div class="settings-row"><span>语音鼓励</span><div style="display:flex;gap:8px;align-items:center"><button class="btn btn-sm btn-ghost" id="voiceTest">听一句</button><button class="switch ${state.settings.voice ? 'on' : ''}" id="voiceSwitch" aria-label="语音鼓励开关"></button></div></div>
      <div class="settings-row"><span>学习数据</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm btn-ghost" id="exportData">导出备份</button><button class="btn btn-sm btn-ghost" id="importData">导入备份</button><input type="file" id="importInput" accept="application/json,.json" hidden></div></div>
      <div class="settings-row"><span>重新开始</span><button class="danger-btn" id="resetData">清空全部记录</button></div>
    </div>
    <p class="small muted" style="margin-top:14px">小提示：换设备或清理浏览器数据会丢失记录。可以用“导出学习数据”备份一份。</p>
  </div>`;

  const refreshProfile = () => {
    const y = scrollY;
    renderAchievements();
    scrollTo(0, y);
  };
  $('#saveNickname').addEventListener('click', () => {
    const v = $('#nicknameInput').value.trim().slice(0, 8);
    state.profile.nickname = v || '小帅哥';
    saveState();
    updateTopStats();
    toast(`名字换好啦，${pName()}，继续探险吧！`, '🪪');
    refreshProfile();
  });
  $('#nicknameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('#saveNickname').click(); }
  });
  $('#changeAvatar').addEventListener('click', () => $('#avatarInput').click());
  $('#resetAvatar').addEventListener('click', () => {
    state.profile.avatar = '';
    saveState();
    updateTopStats();
    toast('已恢复默认头像。', '🖼️');
    refreshProfile();
  });
  $('#avatarInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { toast('请选择一张图片文件。', '🖼️'); return; }
    if (file.size > 10 * 1024 * 1024) { toast('图片太大了，请选择 10MB 以内的照片。', '🖼️'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const size = Math.min(img.width, img.height);
          const canvas = document.createElement('canvas');
          canvas.width = 280;
          canvas.height = 280;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFDF8';
          ctx.fillRect(0, 0, 280, 280);
          ctx.drawImage(img, (img.width - size) / 2, (img.height - size) / 2, size, size, 0, 0, 280, 280);
          state.profile.avatar = canvas.toDataURL('image/jpeg', 0.86);
          saveState();
          updateTopStats();
          toast('新头像换好啦，真帅！', '📸');
          refreshProfile();
        } catch (err) {
          toast('这张图片处理失败，换一张试试。', '🖼️');
        }
      };
      img.onerror = () => toast('图片读取失败，换一张试试。', '🖼️');
      img.src = reader.result;
    };
    reader.onerror = () => toast('图片读取失败，换一张试试。', '🖼️');
    reader.readAsDataURL(file);
    e.target.value = '';
  });
  const setParentPin = $('#setParentPin');
  if (setParentPin) setParentPin.addEventListener('click', () => openPinSetup());
  const lockNow = $('#lockParentNow');
  if (lockNow) lockNow.addEventListener('click', () => {
    parentUnlockedUntil = 0;
    toast('家长区已重新锁定。', '🔐');
    renderAchievements();
  });
  const disableLock = $('#disableParentLock');
  if (disableLock) disableLock.addEventListener('click', () => requireParentAuth(() => {
    state.parentLock = { enabled: false, pinHash: '', salt: '', recoveryHash: '' };
    parentUnlockedUntil = 0;
    saveState();
    toast('家长密码锁已关闭。', '🔓');
    renderAchievements();
  }));
  const resetPin = $('#resetParentPin');
  if (resetPin) resetPin.addEventListener('click', () => openPinDialog({
    mode: 'recover',
    title: '重置家长密码',
    desc: '输入恢复码后可以设置新密码。',
    onSuccess: () => openPinSetup({ fromRecovery: true })
  }));

  $('#soundSwitch').addEventListener('click', e => {
    state.settings.sound = !state.settings.sound;
    saveState();
    e.currentTarget.classList.toggle('on', state.settings.sound);
    updateTopStats();
    if (state.settings.sound) playSound('click');
  });
  $('#voiceSwitch').addEventListener('click', e => {
    state.settings.voice = !state.settings.voice;
    saveState();
    e.currentTarget.classList.toggle('on', state.settings.voice);
    if (state.settings.voice) {
      speak(`${profileName()}，语音鼓励已开启，我们一起加油！`, true);
      toast('语音鼓励已开启。', '🔊');
    } else {
      try { window.speechSynthesis.cancel(); } catch (err) { /* noop */ }
      toast('语音鼓励已关闭。', '🔇');
    }
  });
  $('#voiceTest').addEventListener('click', () => {
    if (!state.settings.voice) { toast('先打开语音鼓励开关。', '🔊'); return; }
    speak(`${profileName()}，你今天已经很努力了，继续向前！`, true);
  });
  $('#exportData').addEventListener('click', () => requireParentAuth(() => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `数学探险岛-学习记录-${todayKey()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('学习数据已导出，可以保存到网盘备份。', '💾');
  }));
  $('#importData').addEventListener('click', () => requireParentAuth(() => $('#importInput').click()));
  $('#importInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || typeof data !== 'object' || !Array.isArray(data.learned) || !data.profile) {
          throw new Error('bad data');
        }
        openModal({
          title: '导入学习数据？',
          body: `这份备份属于「${esc(String(data.profile.nickname || '小探险家'))}」，包含 ${Number(data.xp || 0)} XP。导入后会覆盖当前设备上的学习记录（包括错题本和战役勋章），确定继续吗？`,
          confirmText: '导入并重新加载',
          onConfirm: () => {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
              location.hash = '#achievements';
              location.reload();
            } catch (err) {
              toast('导入失败：浏览器存储空间不足。', '⚠️');
            }
          }
        });
      } catch (err) {
        toast('这个文件不是有效的学习备份，请选择之前导出的 JSON 文件。', '⚠️');
      }
    };
    reader.onerror = () => toast('文件读取失败，请重试。', '⚠️');
    reader.readAsText(file);
    e.target.value = '';
  });
  $('#resetData').addEventListener('click', () => requireParentAuth(() => {
    openModal({
      title: '确定要清空全部学习记录吗？',
      body: 'XP、徽章、错题本、学习进度都会被删除，而且无法恢复。建议先导出备份。',
      confirmText: '确认清空',
      danger: true,
      onConfirm: () => {
        disconnectSync(false);
        try {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(SYNC_KEY);
        } catch (e) { /* noop */ }
        location.hash = '#home';
        location.reload();
      }
    });
  }));
}

function renderGuide() {
  app.innerHTML = `<div class="page-wrap">
    <section class="guide-hero">
      <div>
        <div class="eyebrow">SELF-STUDY GUIDE</div>
        <h1>不会自学？<br>照着这五步走。</h1>
        <p>自学不是“自己看书”，而是“自己提出问题、自己找依据、自己检查”。下面这套流程，每天 30 分钟，坚持两周就会看到变化。</p>
        <div class="hero-actions" style="margin-top:18px">
          <a class="btn btn-primary" href="#chapter/${recommendChapter().id}/knowledge">从一张知识卡开始 →</a>
          <a class="btn btn-ghost" href="#practice">直接做题</a>
        </div>
      </div>
      <div class="timer-card">
        <div class="timer-ring" id="timerRing" style="--p:0"><div><b id="timerText">25:00</b><small>专注计时</small></div></div>
        <h3>番茄专注</h3>
        <p>只做一件事：弄懂一个知识点。</p>
        <div class="timer-controls">
          <button class="btn btn-sm btn-soft" data-min="15">15</button>
          <button class="btn btn-sm btn-soft active" data-min="25">25</button>
          <button class="btn btn-sm btn-soft" data-min="45">45</button>
          <button class="btn btn-sm btn-primary" id="timerToggle">开始专注</button>
        </div>
        <button class="hint-btn" id="timerReset" style="margin-top:8px">↺ 重置计时</button>
      </div>
    </section>

    <div class="section-title-row"><div><h2>五步自学闭环</h2><p>每一步都有具体动作，不是空口号。</p></div><span class="chip teal">每天约 30 分钟</span></div>
    <div class="steps-flow">
      ${STUDY_STEPS.map(s => `<div class="step-row">
        <span class="step-big">${s.icon}</span>
        <div><h3>${s.title}<small>STEP ${s.n}</small></h3><p>${s.desc}</p><span class="step-action">✎ ${s.action}</span></div>
        <span class="step-time">${s.time}</span>
      </div>`).join('')}
    </div>

    <div class="guide-grid">
      <div class="guide-card">
        <h2>不会时，这样问</h2>
        <p>把“这题怎么做”换成更具体的问题，别人（或 AI）才能帮到你。</p>
        <div class="prompt-list">
          <div class="prompt-item"><b>①</b> 我已经做到哪一步了：______。</div>
          <div class="prompt-item"><b>②</b> 我卡在这里：______，因为我不确定______。</div>
          <div class="prompt-item"><b>③</b> 这个条件让我想到______，但为什么不对？</div>
          <div class="prompt-item"><b>④</b> 能不能只给我一个提示，不要直接给答案？</div>
        </div>
      </div>

      <div class="guide-card">
        <h2>费曼挑战：讲给空气听</h2>
        <p>选一个今天学的概念，用不超过 100 字讲清楚。讲不顺的地方，就是还没懂的地方。</p>
        <div class="feynman-box">
          <h3>今天我要讲清楚：</h3>
          <p>例如“为什么等腰三角形的三线合一？”</p>
          <textarea id="feynmanNote" maxlength="500" placeholder="用你自己的话写下来，不要抄课本……">${esc(state.notes.feynman || '')}</textarea>
          <div class="feynman-foot"><span id="feynmanCount">${(state.notes.feynman || '').length} / 500 字</span><button class="btn btn-sm btn-primary" id="saveNote">保存笔记</button></div>
        </div>
      </div>

      <div class="guide-card">
        <h2>错题归因：找到真正的病根</h2>
        <p>错题不是“粗心”两个字能解释的。看看你属于哪一种：</p>
        <div class="mistake-types">
          <div class="mistake-type"><b>概念不清</b>公式记混、定义理解错。→ 回知识卡，用自己的话复述。</div>
          <div class="mistake-type"><b>思路卡住</b>不知道第一步做什么。→ 看例题的“第一步为什么这样想”。</div>
          <div class="mistake-type"><b>计算失误</b>符号、去括号、移项出错。→ 放慢步骤，写完检查一遍。</div>
          <div class="mistake-type"><b>审题遗漏</b>没看到“整数”“至少”等条件。→ 读题时圈关键词。</div>
        </div>
      </div>

      <div class="guide-card">
        <h2>今日自学清单</h2>
        <p>做完一项勾一项。全部勾完，就可以安心去玩了。</p>
        <div class="checklist">
          ${['读一张知识卡，并说出它解决什么问题', '看一个动画，改变一个条件并观察变化', '做 3 道基础题，不看答案', '把 1 道错题重做一遍', '用一句话总结今天学到的东西'].map((t, i) => `<label class="check-item ${state.notes.checklist[i] ? 'done' : ''}"><input type="checkbox" data-check="${i}" ${state.notes.checklist[i] ? 'checked' : ''}><span>${t}</span></label>`).join('')}
        </div>
        <div class="daily-quote" style="margin-top:14px"><b>最后提醒</b>学不会很正常，重复才是学习的真相。明天再来一次，你会比今天更顺。</div>
      </div>
    </div>
  </div>`;

  /* 番茄钟 */
  let totalSeconds = 25 * 60;
  let remain = totalSeconds;
  let running = false;
  let interval = null;
  let finished = false;
  const ring = $('#timerRing');
  const text = $('#timerText');
  const toggle = $('#timerToggle');
  const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const paint = () => {
    text.textContent = fmtTime(remain);
    ring.style.setProperty('--p', String((1 - remain / totalSeconds) * 100));
  };
  const stop = () => { if (interval) clearInterval(interval); interval = null; running = false; toggle.textContent = '继续专注'; };
  const tick = () => {
    remain--;
    if (remain <= 0) {
      remain = 0; paint(); stop(); finished = true; toggle.textContent = '完成啦';
      state.daily.focusMinutes = Number(state.daily.focusMinutes || 0) + Math.round(totalSeconds / 60);
      addXP(10, '完成一次番茄专注');
      checkBadges();
      playSound('badge'); voiceEncourage('correct'); burstConfetti(70);
      toast('专注完成！+10 XP。站起来活动一下，再继续。', '🍅', 4500);
      return;
    }
    paint();
  };
  toggle.addEventListener('click', () => {
    if (finished) { remain = totalSeconds; finished = false; paint(); toggle.textContent = '开始专注'; return; }
    if (running) { stop(); return; }
    running = true;
    toggle.textContent = '暂停';
    interval = setInterval(tick, 1000);
  });
  $('#timerReset').addEventListener('click', () => {
    if (interval) clearInterval(interval);
    interval = null; running = false; finished = false; remain = totalSeconds; paint(); toggle.textContent = '开始专注';
  });
  $$('[data-min]').forEach(b => b.addEventListener('click', () => {
    if (interval) clearInterval(interval);
    interval = null; running = false; finished = false;
    totalSeconds = Number(b.dataset.min) * 60; remain = totalSeconds;
    $$('[data-min]').forEach(x => x.classList.toggle('active', x === b));
    toggle.textContent = '开始专注';
    paint();
  }));
  paint();
  viewCleanup = () => { if (interval) clearInterval(interval); };

  /* 费曼笔记 */
  const note = $('#feynmanNote');
  const count = $('#feynmanCount');
  note.addEventListener('input', () => {
    count.textContent = `${note.value.length} / 500 字`;
  });
  $('#saveNote').addEventListener('click', () => {
    state.notes.feynman = note.value.trim();
    saveState();
    if (state.notes.feynman.length >= 10) {
      checkBadges();
      toast('笔记已保存。能用自己的话写下来，才是真的理解。', '✏️');
    } else {
      toast('再写长一点点吧，至少写出一句完整的话。', '🌱');
    }
  });

  /* 清单 */
  $$('[data-check]').forEach(cb => {
    cb.addEventListener('change', () => {
      const i = Number(cb.dataset.check);
      state.notes.checklist[i] = cb.checked;
      cb.closest('.check-item').classList.toggle('done', cb.checked);
      saveState();
      if (state.notes.checklist.every(Boolean)) {
        toast('今日清单全部完成，给自己一个赞！', '🌞');
        burstConfetti(35);
      }
    });
  });
}

const TITLES = {
  home: '数学探险岛 · 鲁教版初中数学',
  courses: '课程地图 · 数学探险岛',
  campaign: '战役地图 · 数学探险岛',
  lab: '动画实验室 · 数学探险岛',
  practice: '闯关练习 · 数学探险岛',
  homework: '作业岛 · 数学探险岛',
  wrong: '错题本 · 数学探险岛',
  achievements: '成长成就 · 数学探险岛',
  report: '家长学习报告 · 数学探险岛',
  sync: '云同步设置 · 数学探险岛',
  guide: '自学指南 · 数学探险岛'
};

function router() {
  if (viewCleanup) { try { viewCleanup(); } catch (e) { /* noop */ } viewCleanup = null; }
  window.cleanupLab?.();
  const raw = (location.hash || '#home').slice(1);
  const [path] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const view = parts[0] || 'home';
  setActiveNav(view);
  updateTopStats();
  document.title = TITLES[view] || TITLES.home;
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });

  if (view === 'home') renderHome();
  else if (view === 'courses') renderCourses();
  else if (view === 'campaign') renderCampaign();
  else if (view === 'chapter') renderChapter(parts[1] || 'c1', parts[2] || 'knowledge');
  else if (view === 'lab') renderLab(parts[1] || 'triangle');
  else if (view === 'practice') renderPractice();
  else if (view === 'homework') renderHomework();
  else if (view === 'wrong') renderWrong();
  else if (view === 'achievements') renderAchievements();
  else if (view === 'report') { if (isParentLocked()) renderParentGate('#report'); else renderReport(); }
  else if (view === 'sync') { if (isParentLocked()) renderParentGate('#sync'); else renderSync(); }
  else if (view === 'guide') renderGuide();
  else { location.hash = '#home'; return; }

  // 页面顶部进度与成就状态
  updateTopStats();
  setTimeout(checkBadges, 700);
}

function init() {
  // 移动端底部导航
  const mobile = document.createElement('nav');
  mobile.className = 'mobile-nav';
  mobile.setAttribute('aria-label', '移动端导航');
  mobile.innerHTML = [
    ['home', '⌂', '首页'],
    ['campaign', '⚑', '战役'],
    ['courses', '▤', '课程'],
    ['lab', '⌁', '动画'],
    ['practice', '◎', '闯关'],
    ['wrong', '✎', '错题'],
    ['achievements', '♛', '成长']
  ].map(([k, i, n]) => `<a href="#${k}" data-nav="${k}"><span class="mn-ico">${i}</span>${n}</a>`).join('');
  document.body.appendChild(mobile);

  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', () => {
    state.settings.sound = !state.settings.sound;
    saveState();
    updateTopStats();
    if (state.settings.sound) playSound('click');
    toast(state.settings.sound ? '音效已开启' : '音效已关闭', state.settings.sound ? '🎵' : '🔇', 1800);
  });

  const topbar = document.getElementById('topbar');
  const onScroll = () => topbar.classList.toggle('scrolled', window.scrollY > 8);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // 处理旧版本/缺失的路由
  if (!location.hash || location.hash === '#') {
    try { history.replaceState(null, '', '#home'); } catch (e) { location.hash = '#home'; }
  }
  router();
  updateTopStats();
  initSync();
  setTimeout(checkBadges, 1200);
}
